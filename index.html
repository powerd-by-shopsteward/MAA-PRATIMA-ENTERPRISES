  <style>
  /* ══════════════════════════════════════════════════════════════

  /* ─── TRANSITIONS ─────────────────────────────────────────── */

/* ══════════════════════════════════════════════════════════════
   BLOCK 2b — REDUCED EFFECTS MODE OVERRIDES
   Applied via <html data-reduce-effects="true"> — set by JS.
   Only re-declares tokens that would trigger heavy GPU work.
   ══════════════════════════════════════════════════════════════ */
html[data-reduce-effects="true"]{
  --glass:              #FFFFFF;
  --glass-strong:       #FFFFFF;
  --glass-border:       var(--border);

  --shadow-paper:       0 0 0 1px var(--border);
  --shadow-paper-hover: 0 0 0 1px var(--border-strong);
  --shadow-paper-press: 0 0 0 1px var(--border);
  --shadow-modal:       0 0 0 1px var(--border-strong);
  --shadow-toast:       0 0 0 1px var(--border-strong);
  --shadow-kpi:         0 0 0 1px var(--border);
  --shadow-inset-paper: none;

  --paper-grain:        none;
  --paper-grain-size:   0 0;

  --rule-line:          transparent;
  --rule-line-margin:   transparent;

  --dur-fast:           0ms;
  --dur:                0ms;
  --dur-slow:           0ms;
  --ease:               linear;
  --ease-paper:         linear;
}

   END BLOCK 2
   ══════════════════════════════════════════════════════════════ */
 /* ══════════════════════════════════════════════════════════════
   BLOCK 3 — BASE RESET & GLOBAL STYLES
   Notebook-page body, warm paper background, form-control reset,
   scrollbar, focus rings, selection, reduced-motion safety.
   ══════════════════════════════════════════════════════════════ */

/* ─── UNIVERSAL RESET ─────────────────────────────────────── */
*,
*::before,
*::after{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ─── HTML / BODY ─────────────────────────────────────────── */
html{
  height: 100%;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body{
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font);
  font-size: var(--fs-base);
  font-weight: var(--fw-normal);
  line-height: var(--lh-normal);
  color: var(--ink);
  background-color: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* ─── NOTEBOOK PAGE BACKGROUND ────────────────────────────────
   Layered gradients:
   1. Red margin line on the left (very faint)
   2. Horizontal blue-ish ruled lines every --rule-height
   3. Fine paper-grain noise on top
   4. Flat cream base
   background-attachment: fixed so lines don't scroll.
   ─────────────────────────────────────────────────────────── */
body::before{
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;

  background-image:
    linear-gradient(
      to right,
      transparent 0,
      transparent 62px,
      var(--rule-line-margin) 62px,
      var(--rule-line-margin) 63px,
      transparent 63px,
      transparent 100%
    ),
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--rule-height) - 1px),
      var(--rule-line) calc(var(--rule-height) - 1px),
      var(--rule-line) var(--rule-height)
    ),
    var(--paper-grain);

  background-size:
    100% 100%,
    100% var(--rule-height),
    var(--paper-grain-size);

  background-position:
    0 0,
    0 var(--rule-offset),
    var(--paper-grain-pos);

  opacity: 1;
  transition: opacity var(--dur) var(--ease);
}

/* Kill notebook bg + grain in reduced-effects mode */
html[data-reduce-effects="true"] body::before{
  background-image: none;
  opacity: 0;
}

/* ─── MEDIA : responsive reset ────────────────────────────── */
img,
picture,
video,
canvas,
svg{
  display: block;
  max-width: 100%;
  height: auto;
}

/* ─── FORM CONTROLS : inherit font + color ────────────────── */
button,
input,
select,
textarea,
optgroup{
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}

button{
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  text-align: inherit;
  -webkit-appearance: none;
  appearance: none;
}

button:disabled{
  cursor: not-allowed;
}

input,
textarea,
select{
  background: transparent;
  border: none;
  outline: none;
}

input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button{
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"]{
  -moz-appearance: textfield;
  appearance: textfield;
}

textarea{
  resize: vertical;
}

select{
  cursor: pointer;
}

/* ─── LINKS ───────────────────────────────────────────────── */
a{
  color: var(--primary-hover);
  text-decoration: none;
  transition: color var(--dur-fast) var(--ease);
}

a:hover{
  color: var(--primary-active);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}

a:focus-visible{
  outline: 2px solid var(--primary-ring);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

/* ─── HEADINGS ────────────────────────────────────────────── */
h1, h2, h3, h4, h5, h6{
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
  color: var(--ink);
}

/* ─── LISTS ───────────────────────────────────────────────── */
ul, ol{
  list-style: none;
}

/* ─── TABLES ──────────────────────────────────────────────── */
table{
  border-collapse: collapse;
  border-spacing: 0;
  width: 100%;
}

/* ─── SELECTION ───────────────────────────────────────────── */
::selection{
  background: var(--primary-tint);
  color: var(--ink);
}

::-moz-selection{
  background: var(--primary-tint);
  color: var(--ink);
}

/* ─── FOCUS RING : single source of truth ─────────────────── */
:focus-visible{
  outline: 2px solid var(--primary-ring);
  outline-offset: 2px;
}

/* Inputs with .input class get a softer inset focus in later blocks */
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  outline: none;
}

/* ─── SCROLLBAR ───────────────────────────────────────────── */
::-webkit-scrollbar{
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track{
  background: var(--bg-deep);
}

::-webkit-scrollbar-thumb{
  background: var(--border-ink);
  border-radius: var(--r-pill);
  border: 2px solid var(--bg-deep);
}

::-webkit-scrollbar-thumb:hover{
  background: var(--primary);
}

::-webkit-scrollbar-thumb:active{
  background: var(--primary-hover);
}

::-webkit-scrollbar-corner{
  background: var(--bg-deep);
}

/* Firefox */
*{
  scrollbar-width: thin;
  scrollbar-color: var(--border-ink) var(--bg-deep);
}

/* ─── HIDDEN / UTILITY ────────────────────────────────────── */
[hidden]{
  display: none !important;
}

.sr-only{
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

/* ─── REDUCED MOTION (OS level) ──────────────────────────── */
@media (prefers-reduced-motion: reduce){
  html{
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after{
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ─── REDUCED-EFFECTS MODE (in-app toggle) ──────────────────
   Kill heavy GPU work: backdrop-filter, box-shadow, transforms.
   Component blocks will still draw, just flat.
   ─────────────────────────────────────────────────────────── */
html[data-reduce-effects="true"] *{
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

html[data-reduce-effects="true"] .t-lift,
html[data-reduce-effects="true"] .t-hover-lift:hover{
  transform: none !important;
}

/* ─── TEXT RENDERING POLISH ───────────────────────────────── */
strong, b{
  font-weight: var(--fw-semibold);
  color: var(--ink);
}

small{
  font-size: var(--fs-xs);
  color: var(--ink-3);
}

code,
kbd,
samp,
pre{
  font-family: var(--font-mono);
  font-size: 0.92em;
}

kbd{
  padding: 2px 6px;
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: var(--r-xs);
  font-size: var(--fs-2xs);
  color: var(--ink-2);
  font-weight: var(--fw-medium);
}

/* ─── PRINT FOUNDATION (full styles in Block 11) ─────────── */
@media print{
  body{
    background: #fff !important;
  }
  body::before{
    display: none !important;
  }
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 3
   ══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   BLOCK 4 — GLASS PANELS, LAYOUT SHELL & SURFACES
   Sidebar + topbar glass, paper cards, KPI tiles, page header,
   empty states, loading state. Shell for every page.
   ══════════════════════════════════════════════════════════════ */

/* ─── LAYOUT SHELL ────────────────────────────────────────── */
.layout{
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  z-index: 1;
}

.main-wrap{
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ─── SIDEBAR : frosted cream glass ──────────────────────── */
.sidebar{
  width: var(--sidebar-w);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  padding: var(--sp-5) var(--sp-4);

  background: var(--glass);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-right: 1px solid var(--glass-border);

  transition: transform var(--dur-slow) var(--ease);
  z-index: var(--z-sidebar);
}

/* ─── BRAND BLOCK ─────────────────────────────────────────── */
.brand{
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-2) var(--sp-3) var(--sp-7);
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--sp-6);
}

.brand-logo{
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  background: var(--primary);
  color: var(--on-primary);
  border-radius: var(--r-paper-sm);
  box-shadow: var(--shadow-paper);
  overflow: hidden;
}

.brand-logo img{
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: inherit;
}

.brand-text{
  font-size: var(--fs-md);
  font-weight: var(--fw-bold);
  color: var(--ink);
  line-height: 1.15;
  letter-spacing: var(--ls-tight);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.brand-text small{
  display: block;
  font-size: var(--fs-2xs);
  color: var(--primary-hover);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-wider);
  text-transform: uppercase;
  margin-top: 2px;
}

/* ─── TOPBAR : frosted glass with honey underline ────────── */
.topbar{
  height: var(--topbar-h);
  position: sticky;
  top: 0;
  z-index: var(--z-topbar);
  display: flex;
  align-items: center;
  gap: var(--sp-5);
  padding: 0 var(--page-pad-x);

  background: var(--glass);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: 0 1px 0 var(--primary-glow);
}

.topbar-title{
  font-size: var(--fs-lg);
  font-weight: var(--fw-semibold);
  color: var(--ink);
  letter-spacing: var(--ls-tight);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.topbar-search{
  flex: 1;
  max-width: 340px;
  position: relative;
}

.topbar-search::before{
  content: '🔍';
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: var(--fs-sm);
  opacity: 0.55;
  pointer-events: none;
  z-index: 2;
}

.topbar-search .input{
  padding-left: 34px;
  background: var(--card-alt);
  border-color: var(--border);
}

.topbar-search .input:focus{
  background: var(--card);
}

/* ─── MAIN CONTENT AREA ───────────────────────────────────── */
.main{
  flex: 1;
  padding: var(--page-pad-y) var(--page-pad-x);
  max-width: var(--content-max);
  width: 100%;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* ─── PAGE HEADER ─────────────────────────────────────────── */
.page-head{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: var(--sp-4);
  margin-bottom: var(--sp-7);
}

.page-head h1{
  font-size: var(--fs-2xl);
  font-weight: var(--fw-bold);
  color: var(--ink);
  letter-spacing: var(--ls-tight);
  margin-bottom: 4px;
  line-height: 1.15;
}

.page-head p{
  color: var(--ink-3);
  font-size: var(--fs-base);
  margin: 0;
}

.page-actions{
  display: flex;
  gap: var(--sp-3);
  flex-wrap: wrap;
  align-items: center;
}

/* ─── CARD : paper surface ───────────────────────────────── */
.card{
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-6);
  box-shadow: var(--shadow-paper);
  transition:
    box-shadow var(--dur) var(--ease),
    transform var(--dur) var(--ease),
    border-color var(--dur) var(--ease);
}

.card:hover{
  box-shadow: var(--shadow-paper-hover);
  border-color: var(--border-strong);
}

/* Optional paper-grain texture overlay for premium cards */
.card.paper-texture::after{
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background-image: var(--paper-grain);
  background-size: var(--paper-grain-size);
  background-position: var(--paper-grain-pos);
  opacity: 0.7;
  mix-blend-mode: multiply;
}

html[data-reduce-effects="true"] .card.paper-texture::after{
  display: none;
}

.card-title{
  font-size: var(--fs-md);
  font-weight: var(--fw-semibold);
  color: var(--ink);
  margin-bottom: var(--sp-5);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-3);
  letter-spacing: var(--ls-tight);
}

.card-title small{
  font-weight: var(--fw-normal);
  color: var(--ink-3);
  font-size: var(--fs-xs);
}

/* ─── KPI TILE ────────────────────────────────────────────── */
.kpi{
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 3px solid var(--primary);
  border-radius: var(--r-lg);
  padding: var(--sp-5) var(--sp-6);
  box-shadow: var(--shadow-kpi);
  transition:
    box-shadow var(--dur) var(--ease),
    transform var(--dur) var(--ease);
  overflow: hidden;
}

.kpi:hover{
  box-shadow: var(--shadow-paper-hover);
  transform: translateY(-2px);
}

html[data-reduce-effects="true"] .kpi:hover{
  transform: none;
}

.kpi-head{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--sp-4);
  gap: var(--sp-3);
}

.kpi-label{
  font-size: var(--fs-xs);
  color: var(--ink-3);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
}

.kpi-icon{
  width: 34px;
  height: 34px;
  border-radius: var(--r-paper-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  background: var(--primary-soft);
  color: var(--primary-hover);
  box-shadow: var(--shadow-inset-paper);
}

.kpi-value{
  font-size: var(--fs-3xl);
  font-weight: var(--fw-bold);
  color: var(--ink);
  letter-spacing: var(--ls-tight);
  line-height: 1.05;
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}

.kpi-trend{
  font-size: var(--fs-xs);
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-weight: var(--fw-medium);
}

.trend-up{
  color: var(--green);
  font-weight: var(--fw-semibold);
}

.trend-down{
  color: var(--red);
  font-weight: var(--fw-semibold);
}

/* ─── MINI STAT (compact metric tile) ────────────────────── */
.mini-stat{
  background: var(--card-alt);
  padding: var(--sp-4) var(--sp-5);
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  transition: background var(--dur-fast) var(--ease);
}

.mini-stat:hover{
  background: var(--primary-soft);
}

.mini-stat .lbl{
  font-size: var(--fs-2xs);
  color: var(--ink-3);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
}

.mini-stat .val{
  font-weight: var(--fw-bold);
  color: var(--ink);
  margin-top: 4px;
  font-size: var(--fs-lg);
  letter-spacing: var(--ls-tight);
  font-variant-numeric: tabular-nums;
}

/* ─── GRID HELPERS ────────────────────────────────────────── */
.grid-2{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--sp-5);
}

.grid-3{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--sp-5);
}

.grid-4{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: var(--sp-5);
}

/* ─── EMPTY STATE ─────────────────────────────────────────── */
.empty{
  text-align: center;
  padding: 60px var(--sp-7);
  color: var(--ink-2);
}

.empty-icon{
  font-size: 52px;
  opacity: 0.35;
  margin-bottom: var(--sp-4);
  line-height: 1;
}

.empty h3{
  font-size: var(--fs-lg);
  color: var(--ink);
  font-weight: var(--fw-semibold);
  margin-bottom: var(--sp-2);
}

.empty p{
  font-size: var(--fs-base);
  color: var(--ink-3);
  margin-bottom: var(--sp-5);
}

/* ─── LOADING ─────────────────────────────────────────────── */
.loading{
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: var(--sp-5);
  color: var(--ink-2);
  font-weight: var(--fw-medium);
}

.spinner{
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin{
  to{ transform: rotate(360deg); }
}

html[data-reduce-effects="true"] .spinner{
  animation-duration: 1.6s;
}

/* ─── MOBILE BACKDROP FOR SIDEBAR ────────────────────────── */
.sidebar-backdrop{
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(31, 41, 55, 0.35);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 24;
  transition: opacity var(--dur) var(--ease);
}

.sidebar-backdrop.show{
  display: block;
}

html[data-reduce-effects="true"] .sidebar-backdrop{
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  background: rgba(31, 41, 55, 0.5);
}

/* ─── MOBILE HEADER ──────────────────────────────────────── */
.mobile-header{
  display: none;
  padding: var(--sp-4) var(--sp-6);
  background: var(--glass);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--glass-border);
  position: sticky;
  top: 0;
  z-index: var(--z-topbar);
  align-items: center;
  gap: var(--sp-4);
  box-shadow: 0 1px 0 var(--primary-glow);
}

.hamburger{
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 18px;
  width: 38px;
  height: 38px;
  border-radius: var(--r-paper-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink);
  box-shadow: var(--shadow-paper);
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}

.hamburger:hover{
  box-shadow: var(--shadow-paper-hover);
  transform: translateY(-1px);
}

.hamburger:active{
  box-shadow: var(--shadow-paper-press);
  transform: translateY(0);
}

.mobile-brand{
  flex: 1;
  font-weight: var(--fw-semibold);
  font-size: var(--fs-base);
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 4b — SHELL RESPONSIVE (quick pass; full pass in Block 9)
   ══════════════════════════════════════════════════════════════ */
@media (max-width: 900px){
  .sidebar{
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-105%);
    width: var(--sidebar-w-mobile);
    box-shadow: var(--shadow-modal);
  }

  .sidebar.open{
    transform: translateX(0);
  }

  .mobile-header{
    display: flex;
  }

  .topbar{
    display: none;
  }

  .main{
    padding: var(--sp-5) var(--sp-4) 90px;
  }

  .page-head{
    margin-bottom: var(--sp-5);
  }

  .page-head h1{
    font-size: var(--fs-xl);
  }

  .grid-2,
  .grid-3{
    grid-template-columns: 1fr;
  }

  .grid-4{
    grid-template-columns: repeat(2, 1fr);
  }

  .card{
    padding: var(--sp-5);
  }

  .kpi-value{
    font-size: var(--fs-2xl);
  }
}

@media (max-width: 480px){
  .grid-4{
    grid-template-columns: 1fr;
  }

  .kpi-value{
    font-size: var(--fs-xl);
  }

  .page-head h1{
    font-size: var(--fs-lg);
  }
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 4
   ══════════════════════════════════════════════════════════════ */
    /* ══════════════════════════════════════════════════════════════
   BLOCK 5 — BUTTONS, CHIPS & PAPER TABS
   Cut-paper button system + sticky-note chips + category tabs.
   Every button in the app uses these classes.
   ══════════════════════════════════════════════════════════════ */

/* ─── BUTTON BASE : cut-paper slip ───────────────────────── */
.btn{
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 8px 15px;
  font-size: var(--fs-base);
  font-weight: var(--fw-medium);
  line-height: 1.2;
  letter-spacing: var(--ls-tight);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
  border-radius: var(--r-paper);
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow-paper);
  transition:
    transform var(--dur-fast) var(--ease-paper),
    box-shadow var(--dur-fast) var(--ease),
    background var(--dur-fast) var(--ease),
    border-color var(--dur-fast) var(--ease),
    color var(--dur-fast) var(--ease);
  text-decoration: none;
}

.btn:hover{
  transform: translateY(-1px);
  box-shadow: var(--shadow-paper-hover);
  text-decoration: none;
}

.btn:active{
  transform: translateY(1px);
  box-shadow: var(--shadow-paper-press);
}

.btn:focus-visible{
  outline: 2px solid var(--primary-ring);
  outline-offset: 2px;
}

.btn:disabled,
.btn[disabled]{
  opacity: 0.55;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: var(--shadow-paper) !important;
}

html[data-reduce-effects="true"] .btn:hover,
html[data-reduce-effects="true"] .btn:active{
  transform: none;
}

/* ─── PRIMARY : honey sticky-note ────────────────────────── */
.btn-primary{
  background: var(--primary);
  color: var(--on-primary);
  border-color: var(--primary-hover);
  box-shadow:
    0 1px 0 rgba(0,0,0,0.04),
    0 2px 6px rgba(199,154,40,0.25),
    inset 0 1px 0 rgba(255,255,255,0.28);
}

.btn-primary:hover{
  background: var(--primary-hover);
  box-shadow:
    0 2px 0 rgba(0,0,0,0.04),
    0 6px 14px rgba(199,154,40,0.32),
    inset 0 1px 0 rgba(255,255,255,0.32);
}

.btn-primary:active{
  background: var(--primary-active);
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,0.12),
    inset 0 1px 0 rgba(255,255,255,0.15);
}

/* ─── GHOST : white paper slip ───────────────────────────── */
.btn-ghost{
  background: var(--card);
  color: var(--ink-soft);
  border-color: var(--border-strong);
  box-shadow:
    0 1px 0 rgba(31,41,55,0.03),
    0 1px 2px rgba(31,41,55,0.04);
}

.btn-ghost:hover{
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary-active);
}

.btn-ghost:active{
  background: var(--primary-tint);
}

/* ─── DANGER : pink paper slip ───────────────────────────── */
.btn-danger{
  background: var(--card);
  color: var(--red);
  border-color: var(--red-border);
  box-shadow:
    0 1px 0 rgba(185,28,28,0.03),
    0 1px 2px rgba(185,28,28,0.05);
}

.btn-danger:hover{
  background: var(--red-bg);
  border-color: var(--red);
  color: var(--red);
}

.btn-danger:active{
  background: var(--red-bg);
  box-shadow: inset 0 2px 3px rgba(185,28,28,0.12);
}

/* ─── SUCCESS : green paper slip ─────────────────────────── */
.btn-success{
  background: var(--green);
  color: #FFFFFF;
  border-color: #0F6E31;
  box-shadow:
    0 1px 0 rgba(0,0,0,0.04),
    0 2px 6px rgba(21,128,61,0.25),
    inset 0 1px 0 rgba(255,255,255,0.18);
}

.btn-success:hover{
  background: #126B32;
  box-shadow:
    0 2px 0 rgba(0,0,0,0.04),
    0 6px 14px rgba(21,128,61,0.32),
    inset 0 1px 0 rgba(255,255,255,0.22);
}

.btn-success:active{
  background: #0F6E31;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.12);
}

/* ─── LINK BUTTON (text-only) ────────────────────────────── */
.btn-link{
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  padding: 4px 6px;
  color: var(--primary-hover);
  font-weight: var(--fw-medium);
}

.btn-link:hover{
  background: var(--primary-soft);
  color: var(--primary-active);
  transform: none;
  box-shadow: none;
}

.btn-link:active{
  background: var(--primary-tint);
  box-shadow: none;
}

/* ─── SIZE VARIANTS ──────────────────────────────────────── */
.btn-sm{
  padding: 5px 10px;
  font-size: var(--fs-xs);
  border-radius: var(--r-paper-sm);
  gap: var(--sp-1);
}

.btn-lg{
  padding: 11px 22px;
  font-size: var(--fs-md);
  font-weight: var(--fw-semibold);
}

.btn-icon{
  padding: 0;
  width: 34px;
  height: 34px;
  border-radius: var(--r-paper-sm);
  font-size: 15px;
}

.btn-icon.btn-sm{
  width: 28px;
  height: 28px;
  font-size: 12px;
}

/* ─── BUTTON GROUP (segmented tabs) ──────────────────────── */
.btn-group{
  display: inline-flex;
  gap: 0;
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 3px;
  box-shadow: var(--shadow-inset-paper);
}

.btn-group .btn{
  border-radius: var(--r-sm);
  box-shadow: none;
  background: transparent;
  border-color: transparent;
  padding: 6px 12px;
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  color: var(--ink-2);
  transform: none;
}

.btn-group .btn:hover{
  background: var(--primary-soft);
  color: var(--primary-active);
  transform: none;
  box-shadow: none;
}

.btn-group .btn.active,
.btn-group .btn.btn-primary{
  background: var(--primary);
  color: var(--on-primary);
  box-shadow:
    0 1px 0 rgba(0,0,0,0.04),
    0 1px 3px rgba(199,154,40,0.25);
}

.btn-group .btn.active:hover,
.btn-group .btn.btn-primary:hover{
  background: var(--primary-hover);
}

/* ─── FLOATING ACTION (mobile) ───────────────────────────── */
.btn-fab{
  position: fixed;
  right: 20px;
  bottom: 84px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  padding: 0;
  font-size: 22px;
  background: var(--primary);
  color: var(--on-primary);
  border: 1px solid var(--primary-hover);
  box-shadow:
    0 4px 12px rgba(199,154,40,0.35),
    0 2px 4px rgba(31,41,55,0.10);
  z-index: 40;
  display: none;
}

.btn-fab:hover{
  transform: translateY(-2px);
  box-shadow:
    0 8px 20px rgba(199,154,40,0.40),
    0 3px 6px rgba(31,41,55,0.12);
}

@media (max-width: 900px){
  .btn-fab{
    display: inline-flex;
  }
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 5b — CHIPS : sticky-note tabs
   ══════════════════════════════════════════════════════════════ */

.chip{
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  font-size: var(--fs-2xs);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-wide);
  border-radius: var(--r-paper-sm);
  border: 1px solid transparent;
  line-height: 1.4;
  white-space: nowrap;
  background: var(--cat-other-bg);
  color: var(--cat-other);
  border-color: var(--border);
  box-shadow: var(--shadow-inset-paper);
  transition: transform var(--dur-fast) var(--ease);
}

.chip:hover{
  transform: translateY(-1px);
}

html[data-reduce-effects="true"] .chip:hover{
  transform: none;
}

/* ─── CHIP COLOR VARIANTS ────────────────────────────────── */
.chip-green{
  background: var(--green-bg);
  color: var(--green);
  border-color: var(--green-border);
}

.chip-red{
  background: var(--red-bg);
  color: var(--red);
  border-color: var(--red-border);
}

.chip-amber{
  background: var(--amber-bg);
  color: var(--amber);
  border-color: var(--amber-border);
}

.chip-blue{
  background: var(--blue-bg);
  color: var(--blue);
  border-color: var(--blue-border);
}

.chip-pink{
  background: var(--pink-bg);
  color: var(--pink);
  border-color: var(--pink-border);
}

.chip-purple{
  background: var(--purple-bg);
  color: var(--purple);
  border-color: var(--purple-border);
}

.chip-teal{
  background: var(--teal-bg);
  color: var(--teal);
  border-color: var(--teal-border);
}

.chip-gray{
  background: var(--cat-other-bg);
  color: var(--cat-other);
  border-color: var(--border);
}

.chip-primary{
  background: var(--primary-soft);
  color: var(--primary-hover);
  border-color: var(--primary-tint);
}

/* ─── CHIP TINY (in tables) ──────────────────────────────── */
.chip-xs{
  padding: 1px 6px;
  font-size: 9px;
  letter-spacing: var(--ls-wide);
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 5c — CATEGORY CHIP COLORS
   Applied via data-category attribute (case-insensitive match
   done in JS, which sets the correct class).
   ══════════════════════════════════════════════════════════════ */

.chip-cat-writing{
  background: var(--cat-writing-bg);
  color: var(--cat-writing);
  border-color: var(--cat-writing-bg);
}

.chip-cat-pencils{
  background: var(--cat-pencils-bg);
  color: var(--cat-pencils);
  border-color: var(--cat-pencils-bg);
}

.chip-cat-notebooks{
  background: var(--cat-notebooks-bg);
  color: var(--cat-notebooks);
  border-color: var(--cat-notebooks-bg);
}

.chip-cat-books{
  background: var(--cat-books-bg);
  color: var(--cat-books);
  border-color: var(--cat-books-bg);
}

.chip-cat-art{
  background: var(--cat-art-bg);
  color: var(--cat-art);
  border-color: var(--cat-art-bg);
}

.chip-cat-geometry{
  background: var(--cat-geometry-bg);
  color: var(--cat-geometry);
  border-color: var(--cat-geometry-bg);
}

.chip-cat-paper{
  background: var(--cat-paper-bg);
  color: var(--cat-paper);
  border-color: var(--cat-paper-bg);
}

.chip-cat-files{
  background: var(--cat-files-bg);
  color: var(--cat-files);
  border-color: var(--cat-files-bg);
}

.chip-cat-office{
  background: var(--cat-office-bg);
  color: var(--cat-office);
  border-color: var(--cat-office-bg);
}

.chip-cat-other{
  background: var(--cat-other-bg);
  color: var(--cat-other);
  border-color: var(--cat-other-bg);
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 5d — STATUS DOT (inline indicator)
   ══════════════════════════════════════════════════════════════ */

.dot{
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cat-other);
  flex-shrink: 0;
}

.dot-green{ background: var(--green); }
.dot-red{ background: var(--red); }
.dot-amber{ background: var(--amber); }
.dot-blue{ background: var(--blue); }

.dot-pulse{
  animation: dotPulse 1.6s ease-in-out infinite;
}

@keyframes dotPulse{
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

html[data-reduce-effects="true"] .dot-pulse{
  animation: none;
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 5e — BADGE (count indicator on icons)
   ══════════════════════════════════════════════════════════════ */

.badge{
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--r-pill);
  background: var(--red);
  color: #FFFFFF;
  font-size: 9px;
  font-weight: var(--fw-bold);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  box-shadow: 0 0 0 2px var(--card);
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 5
   ══════════════════════════════════════════════════════════════ */
 /* ══════════════════════════════════════════════════════════════
   BLOCK 6 — TABLES, FORMS & INPUTS
   Data tables with sticky headers + sortable cols; form inputs,
   labels, field hints, custom selects, textareas; date & time
   pickers; search-select shell.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   6a — TABLES
   ══════════════════════════════════════════════════════════════ */

.tbl-wrap{
  overflow-x: auto;
  overflow-y: visible;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--card);
  -webkit-overflow-scrolling: touch;
}

table{
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: var(--fs-base);
  color: var(--ink);
}

/* ─── HEADER ──────────────────────────────────────────────── */
thead th{
  position: sticky;
  top: 0;
  z-index: 2;
  text-align: left;
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--card-alt);
  padding: 11px var(--sp-4);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

thead th:first-child{
  border-top-left-radius: var(--r-md);
}

thead th:last-child{
  border-top-right-radius: var(--r-md);
}

/* ─── SORTABLE HEADER CHEVRON ────────────────────────────── */
.th-sortable{
  cursor: pointer;
  user-select: none;
  transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}

.th-sortable:hover{
  color: var(--primary-hover);
  background: var(--primary-soft);
}

.th-sortable::after{
  content: '⇅';
  margin-left: 6px;
  font-size: 10px;
  opacity: 0.4;
  transition: opacity var(--dur-fast) var(--ease);
}

.th-sortable:hover::after{
  opacity: 0.75;
}

.th-sortable[data-sort="asc"]::after{
  content: '▲';
  opacity: 1;
  color: var(--primary);
}

.th-sortable[data-sort="desc"]::after{
  content: '▼';
  opacity: 1;
  color: var(--primary);
}

/* ─── BODY CELLS ─────────────────────────────────────────── */
tbody td{
  padding: 11px var(--sp-4);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--ink);
}

tbody tr:last-child td{
  border-bottom: 0;
}

tbody tr{
  transition: background var(--dur-fast) var(--ease);
}

tbody tr:hover td{
  background: var(--primary-soft);
}

/* Selectable rows (bulk actions) */
tbody tr.selected td{
  background: var(--primary-tint);
}

tbody tr.selected:hover td{
  background: var(--primary-tint);
}

/* ─── NUMERIC COLUMNS (align right, tabular) ─────────────── */
.td-num,
th.td-num{
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ─── BULK SELECT CELL ───────────────────────────────────── */
.td-check{
  width: 40px;
  text-align: center;
  padding-left: var(--sp-3);
  padding-right: var(--sp-3);
}

/* ─── ACTIONS CELL (right-aligned button strip) ──────────── */
.td-actions{
  text-align: right;
  white-space: nowrap;
}

.td-actions .btn{
  margin-left: 4px;
}

/* ─── TABLE EMPTY / LOADING ROW ─────────────────────────── */
.td-empty{
  text-align: center;
  padding: 40px var(--sp-5) !important;
  color: var(--ink-3);
  font-size: var(--fs-base);
}

/* ─── COMPACT DENSITY (toggle from topbar) ───────────────── */
table.compact thead th{
  padding: 8px var(--sp-3);
}

table.compact tbody td{
  padding: 7px var(--sp-3);
}

/* ─── RESPONSIVE : stack cells on mobile (opt-in) ────────── */
@media (max-width: 640px){
  .tbl-wrap.responsive thead{
    display: none;
  }

  .tbl-wrap.responsive tbody tr{
    display: block;
    padding: var(--sp-4);
    border-bottom: 1px solid var(--border);
  }

  .tbl-wrap.responsive tbody td{
    display: flex;
    justify-content: space-between;
    gap: var(--sp-4);
    padding: 4px 0;
    border: 0;
    text-align: left !important;
  }

  .tbl-wrap.responsive tbody td::before{
    content: attr(data-label);
    font-size: var(--fs-xs);
    font-weight: var(--fw-semibold);
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: var(--ls-wide);
    flex-shrink: 0;
  }
}

/* ══════════════════════════════════════════════════════════════
   6b — FORMS & LABELS
   ══════════════════════════════════════════════════════════════ */

.label{
  display: block;
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  color: var(--ink-soft);
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.label .req{
  color: var(--red);
  margin-left: 2px;
}

.field-hint{
  font-size: var(--fs-xs);
  color: var(--ink-3);
  margin-top: 5px;
  line-height: 1.5;
}

.field-error{
  font-size: var(--fs-xs);
  color: var(--red);
  margin-top: 5px;
  font-weight: var(--fw-medium);
}

/* ─── FORM ROW (label + input + hint stacked) ────────────── */
.field{
  display: flex;
  flex-direction: column;
  gap: 0;
}

.field + .field{
  margin-top: var(--sp-4);
}

/* ══════════════════════════════════════════════════════════════
   6c — INPUTS : paper-textured fields
   ══════════════════════════════════════════════════════════════ */

.input,
select.input,
textarea.input{
  width: 100%;
  padding: 9px 12px;
  font-size: var(--fs-base);
  font-weight: var(--fw-medium);
  line-height: 1.4;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  outline: none;
  transition:
    border-color var(--dur-fast) var(--ease),
    box-shadow var(--dur-fast) var(--ease),
    background var(--dur-fast) var(--ease);
  box-shadow: var(--shadow-inset-paper);
  appearance: none;
  -webkit-appearance: none;
}

.input::placeholder{
  color: var(--ink-4);
  font-weight: var(--fw-normal);
}

.input:hover:not(:disabled):not(:focus){
  border-color: var(--border-ink);
}

.input:focus,
select.input:focus,
textarea.input:focus{
  border-color: var(--primary);
  background: var(--card);
  box-shadow:
    0 0 0 3px var(--primary-glow),
    inset 0 1px 0 rgba(255,255,255,0.6);
}

.input:disabled,
.input[readonly]{
  background: var(--card-alt);
  color: var(--ink-3);
  cursor: not-allowed;
  border-color: var(--border);
}

.input.error{
  border-color: var(--red);
  box-shadow:
    0 0 0 3px rgba(185,28,28,0.12),
    inset 0 1px 0 rgba(255,255,255,0.6);
}

/* ─── TEXTAREA ───────────────────────────────────────────── */
textarea.input{
  resize: vertical;
  min-height: 72px;
  line-height: 1.5;
  font-family: var(--font);
}

/* ─── SELECT : custom chevron ────────────────────────────── */
select.input{
  padding-right: 32px;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
    linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position:
    calc(100% - 16px) 50%,
    calc(100% - 11px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
}

select.input:hover{
  background-color: var(--primary-soft);
}

select.input:focus{
  background-color: var(--card);
}

/* Kill default select arrow in IE/Edge */
select.input::-ms-expand{
  display: none;
}

/* ─── DATE / TIME ICONS : honey tint ────────────────────── */
input[type="date"].input,
input[type="time"].input{
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}

input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{
  cursor: pointer;
  opacity: 0.6;
  filter: sepia(0.4) hue-rotate(10deg);
  transition: opacity var(--dur-fast) var(--ease);
}

input[type="date"]::-webkit-calendar-picker-indicator:hover,
input[type="time"]::-webkit-calendar-picker-indicator:hover{
  opacity: 1;
}

/* ─── NUMBER INPUT : no spinners, tabular ───────────────── */
input[type="number"].input{
  font-variant-numeric: tabular-nums;
}

/* ─── CHECKBOX / RADIO : honey accent ───────────────────── */
input[type="checkbox"],
input[type="radio"]{
  width: 16px;
  height: 16px;
  accent-color: var(--primary);
  cursor: pointer;
  vertical-align: middle;
  margin: 0;
}

input[type="checkbox"]:focus-visible,
input[type="radio"]:focus-visible{
  outline: 2px solid var(--primary-ring);
  outline-offset: 2px;
}

/* ─── FORM ROW HELPERS ───────────────────────────────────── */
.form-row{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--sp-4);
}

.form-row-2{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-4);
}

.form-row-3{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-4);
}

.form-actions{
  display: flex;
  gap: var(--sp-3);
  justify-content: flex-end;
  margin-top: var(--sp-5);
  flex-wrap: wrap;
}

@media (max-width: 640px){
  .form-row-2,
  .form-row-3{
    grid-template-columns: 1fr;
  }
}

/* ══════════════════════════════════════════════════════════════
   6d — SEARCH-SELECT SHELL
   Full behavior is wired in JS (Block 16). This is only styling.
   ══════════════════════════════════════════════════════════════ */

.searchselect{
  position: relative;
  width: 100%;
}

.searchselect .ss-input{
  padding-right: 34px;
}

.searchselect .ss-input.has-value{
  background: var(--primary-soft);
  border-color: var(--primary-tint);
}

.searchselect .ss-clear{
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-3);
  font-size: 14px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}

.searchselect .ss-clear:hover{
  background: var(--red-bg);
  color: var(--red);
}

.ss-dropdown{
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 300px;
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-modal);
  z-index: var(--z-dropdown);
  display: none;
  padding: 4px;
}

.ss-dropdown.open{
  display: block;
}

.ss-item{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-4);
  padding: 9px 11px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}

.ss-item:hover,
.ss-item.active{
  background: var(--primary-soft);
}

.ss-item.active{
  box-shadow: inset 0 0 0 1px var(--primary-tint);
}

.ss-item .sname{
  font-weight: var(--fw-semibold);
  font-size: var(--fs-base);
  color: var(--ink);
}

.ss-item .ssub{
  font-size: var(--fs-xs);
  color: var(--ink-3);
  margin-top: 2px;
}

.ss-item .smeta{
  text-align: right;
  font-size: var(--fs-xs);
  flex-shrink: 0;
  color: var(--ink-3);
}

.ss-item .smeta .due{
  color: var(--red);
  font-weight: var(--fw-semibold);
}

.ss-empty{
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--ink-3);
  font-size: var(--fs-base);
}

.ss-add{
  padding: 11px var(--sp-4);
  margin-top: 4px;
  text-align: center;
  cursor: pointer;
  color: var(--primary-hover);
  font-weight: var(--fw-semibold);
  font-size: var(--fs-base);
  border-top: 1px dashed var(--border-strong);
  border-radius: var(--r-sm);
  transition: background var(--dur-fast) var(--ease);
}

.ss-add:hover{
  background: var(--primary-soft);
  color: var(--primary-active);
}

/* ══════════════════════════════════════════════════════════════
   6e — FILTER / SEARCH BAR (used on list pages)
   ══════════════════════════════════════════════════════════════ */

.filter-bar{
  display: flex;
  gap: var(--sp-4);
  flex-wrap: wrap;
  align-items: flex-end;
  padding: var(--sp-5);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-paper);
  margin-bottom: var(--sp-5);
}

.filter-bar > *{
  min-width: 0;
}

.filter-bar .grow-2{ flex: 2 1 220px; }
.filter-bar .grow-1{ flex: 1 1 150px; }
.filter-bar .no-grow{ flex: 0 0 auto; }

.filter-bar .filter-end{
  align-self: flex-end;
}

/* ══════════════════════════════════════════════════════════════
   6f — INLINE TABLE INPUTS (invoice line items, restock forms)
   ══════════════════════════════════════════════════════════════ */

.input-inline{
  padding: 6px 8px;
  font-size: var(--fs-sm);
  border-radius: var(--r-sm);
  border: 1px solid var(--border-strong);
  background: var(--card);
  width: 100%;
  font-variant-numeric: tabular-nums;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}

.input-inline:focus{
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-glow);
  outline: none;
}

.input-inline.qty{
  width: 76px;
  text-align: right;
}

.input-inline.price{
  width: 100px;
  text-align: right;
}

.input-inline.unit{
  width: auto;
  min-width: 120px;
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 6
   ══════════════════════════════════════════════════════════════ */
    /* ══════════════════════════════════════════════════════════════
   BLOCK 7 — MODAL, TOAST, LOADER & CALCULATOR
   Frosted-glass overlay, paper-flick modal, toast notes,
   floating calculator widget.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   7a — MODAL OVERLAY & CARD
   ══════════════════════════════════════════════════════════════ */

.modal-overlay{
  position: fixed;
  inset: 0;
  background: rgba(31, 41, 55, 0.42);
  backdrop-filter: blur(6px) saturate(120%);
  -webkit-backdrop-filter: blur(6px) saturate(120%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-6);
  z-index: var(--z-modal);
  animation: overlayFade var(--dur) var(--ease);
}

html[data-reduce-effects="true"] .modal-overlay{
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  background: rgba(31, 41, 55, 0.55);
  animation: none;
}

@keyframes overlayFade{
  from{ opacity: 0; }
  to{ opacity: 1; }
}

.modal{
  position: relative;
  width: 100%;
  max-width: 660px;
  max-height: 90vh;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  padding: var(--sp-7);
  box-shadow: var(--shadow-modal);

  /* honey glow strip under the card */
  background-image:
    linear-gradient(to bottom, var(--primary-soft) 0, transparent 4px);
  background-repeat: no-repeat;
  background-size: 100% 100%;

  animation: modalFlick var(--dur-slow) var(--ease-paper);
}

html[data-reduce-effects="true"] .modal{
  animation: none;
  background-image: none;
}

@keyframes modalFlick{
  from{
    opacity: 0;
    transform: translateY(10px) scale(0.97);
  }
  to{
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ─── MODAL HEADER / TITLE ────────────────────────────────── */
.modal h2{
  font-size: var(--fs-lg);
  font-weight: var(--fw-bold);
  color: var(--ink);
  letter-spacing: var(--ls-tight);
  margin-bottom: var(--sp-2);
}

.modal .modal-sub{
  font-size: var(--fs-sm);
  color: var(--ink-3);
  margin-bottom: var(--sp-6);
}

/* ─── MODAL CLOSE (top-right X) ───────────────────────────── */
.modal-close{
  position: absolute;
  top: 14px;
  right: 14px;
  width: 30px;
  height: 30px;
  padding: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--ink-3);
  border: 0;
  font-size: 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}

.modal-close:hover{
  background: var(--red-bg);
  color: var(--red);
}

/* ─── MODAL BODY (scroll area when long) ──────────────────── */
.modal-body{
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}

/* ─── SMOOTH SIZE TRANSITION (when content grows/shrinks) ── */
.modal.t-resize{
  transition:
    width var(--dur-slow) var(--ease),
    height var(--dur-slow) var(--ease);
  will-change: height;
}

html[data-reduce-effects="true"] .modal.t-resize{
  transition: none;
}

/* ─── SCROLLBAR INSIDE MODAL ─────────────────────────────── */
.modal::-webkit-scrollbar{
  width: 8px;
}

.modal::-webkit-scrollbar-thumb{
  background: var(--border-ink);
  border-radius: var(--r-pill);
  border: 2px solid var(--card);
}

.modal::-webkit-scrollbar-track{
  background: transparent;
}

/* ─── MOBILE MODAL ────────────────────────────────────────── */
@media (max-width: 640px){
  .modal-overlay{
    align-items: flex-start;
    padding: var(--sp-3);
  }

  .modal{
    max-width: 100%;
    max-height: 94vh;
    padding: var(--sp-5);
    margin: var(--sp-3) 0;
    border-radius: var(--r-md);
  }

  .modal-body{
    gap: var(--sp-4);
  }
}

/* ══════════════════════════════════════════════════════════════
   7b — TOAST : paper notes
   ══════════════════════════════════════════════════════════════ */

#toast-root{
  position: fixed;
  bottom: var(--sp-7);
  right: var(--sp-7);
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  pointer-events: none;
  max-width: 340px;
}

.toast{
  pointer-events: auto;
  position: relative;
  padding: 12px 16px 12px 18px;
  font-size: var(--fs-base);
  font-weight: var(--fw-medium);
  color: #FFFFFF;
  background: var(--ink);
  border-radius: var(--r-paper-sm);
  box-shadow: var(--shadow-toast);
  animation: toastSlide var(--dur) var(--ease);
  line-height: 1.4;
  word-break: break-word;
}

/* Small "tape" strip at the top — sells the paper-note illusion */
.toast::before{
  content: '';
  position: absolute;
  top: -4px;
  left: 20px;
  width: 40px;
  height: 8px;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 2px;
  transform: rotate(-2deg);
  pointer-events: none;
}

.toast-success{
  background: var(--green);
}

.toast-error{
  background: var(--red);
}

.toast-info{
  background: var(--primary);
  color: var(--on-primary);
}

.toast-info::before{
  background: rgba(0, 0, 0, 0.12);
}

html[data-reduce-effects="true"] .toast,
html[data-reduce-effects="true"] .toast::before{
  animation: none;
}

@keyframes toastSlide{
  from{
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }
  to{
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (max-width: 640px){
  #toast-root{
    left: var(--sp-4);
    right: var(--sp-4);
    bottom: var(--sp-4);
    max-width: none;
  }
}

/* ══════════════════════════════════════════════════════════════
   7c — CALCULATOR : floating sticky-note
   ══════════════════════════════════════════════════════════════ */

.calc{
  position: fixed;
  bottom: var(--sp-7);
  right: var(--sp-7);
  width: 288px;
  padding: var(--sp-4);
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-modal);
  z-index: var(--z-calc);
  animation: modalFlick var(--dur-slow) var(--ease-paper);
}

html[data-reduce-effects="true"] .calc{
  animation: none;
}

.calc-head{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--sp-3);
  font-size: var(--fs-sm);
  font-weight: var(--fw-semibold);
  color: var(--ink);
}

.calc-display{
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: var(--sp-4);
  text-align: right;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: var(--fw-semibold);
  color: var(--ink);
  margin-bottom: var(--sp-3);
  overflow-x: auto;
  white-space: nowrap;
  box-shadow: var(--shadow-inset-paper);
  font-variant-numeric: tabular-nums;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}

.calc-display::-webkit-scrollbar{
  height: 4px;
}

.calc-keys{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.calc-keys button{
  padding: 12px 0;
  font-size: var(--fs-md);
  font-weight: var(--fw-semibold);
  color: var(--ink);
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition:
    background var(--dur-fast) var(--ease),
    transform var(--dur-fast) var(--ease-paper),
    box-shadow var(--dur-fast) var(--ease);
  box-shadow: 0 1px 0 rgba(31,41,55,0.03);
  font-variant-numeric: tabular-nums;
}

.calc-keys button:hover{
  background: var(--primary-soft);
  border-color: var(--primary-tint);
  transform: translateY(-1px);
}

.calc-keys button:active{
  transform: translateY(1px);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
}

.calc-keys button.op{
  background: var(--primary);
  color: var(--on-primary);
  border-color: var(--primary-hover);
}

.calc-keys button.op:hover{
  background: var(--primary-hover);
}

.calc-keys button.op:active{
  background: var(--primary-active);
}

html[data-reduce-effects="true"] .calc-keys button:hover,
html[data-reduce-effects="true"] .calc-keys button:active{
  transform: none;
}

@media (max-width: 480px){
  .calc{
    left: var(--sp-4);
    right: var(--sp-4);
    bottom: var(--sp-4);
    width: auto;
  }
}

/* ══════════════════════════════════════════════════════════════
   7d — CONFIRM DIALOG (custom, replaces window.confirm) ────
   Used when we want a paper-styled confirm instead of native.
   Native confirm() still works in fallback paths.
   ══════════════════════════════════════════════════════════════ */

.confirm-box{
  max-width: 420px;
}

.confirm-box h2{
  color: var(--red);
  margin-bottom: var(--sp-4);
}

.confirm-box p{
  font-size: var(--fs-base);
  color: var(--ink-soft);
  line-height: 1.6;
  white-space: pre-line;
  margin-bottom: var(--sp-6);
}

/* ══════════════════════════════════════════════════════════════
   7e — INLINE LOADING BAR (page-level, top of content)
   ══════════════════════════════════════════════════════════════ */

.loadbar{
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  width: 0;
  background: linear-gradient(90deg, var(--primary), var(--primary-hover));
  z-index: 9999;
  transition: width var(--dur-slow) var(--ease), opacity var(--dur) var(--ease);
  box-shadow: 0 0 8px var(--primary-glow);
  opacity: 0;
}

.loadbar.active{
  opacity: 1;
}

/* ══════════════════════════════════════════════════════════════
   7f — SKELETON PLACEHOLDER (used while data loads)
   ══════════════════════════════════════════════════════════════ */

.skel{
  display: block;
  background: linear-gradient(
    90deg,
    var(--card-alt) 0%,
    var(--primary-soft) 50%,
    var(--card-alt) 100%
  );
  background-size: 200% 100%;
  border-radius: var(--r-sm);
  height: 14px;
  animation: skelShimmer 1.4s ease-in-out infinite;
}

.skel.skel-title{
  height: 20px;
  width: 40%;
  margin-bottom: var(--sp-4);
}

.skel.skel-line{
  margin-bottom: var(--sp-3);
}

html[data-reduce-effects="true"] .skel{
  animation: none;
  background: var(--card-alt);
}

@keyframes skelShimmer{
  0%{ background-position: 200% 0; }
  100%{ background-position: -200% 0; }
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 7
   ══════════════════════════════════════════════════════════════ */
   /* ══════════════════════════════════════════════════════════════
   BLOCK 8 — NAVIGATION, MOBILE NAV BAR, COMMAND PALETTE
   & TOPBAR EXTRAS
   Sidebar nav groups + links, sidebar footer actions, mobile
   bottom nav, Ctrl+K palette, topbar utility chips.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   8a — SIDEBAR NAV GROUPS & LINKS
   ══════════════════════════════════════════════════════════════ */

.nav-group{
  margin-bottom: var(--sp-4);
}

.nav-group:last-child{
  margin-bottom: 0;
}

.nav-group-title{
  font-size: var(--fs-2xs);
  font-weight: var(--fw-bold);
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: var(--ls-wider);
  padding: var(--sp-3) var(--sp-3) var(--sp-2);
  user-select: none;
}

.nav{
  display: flex;
  flex-direction: column;
  gap: 1px;
}

/* ─── NAV LINK : honey left-bar accent ──────────────────── */
.nav a{
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 8px 12px;
  border-radius: var(--r-sm);
  color: var(--ink-soft);
  font-size: var(--fs-base);
  font-weight: var(--fw-medium);
  text-decoration: none;
  transition:
    background var(--dur-fast) var(--ease),
    color var(--dur-fast) var(--ease);
  overflow: hidden;
}

/* honey left-bar (grows from 0 → 3px on hover/active) */
.nav a::before{
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 6px;
  width: 0;
  background: var(--primary);
  border-radius: 0 var(--r-xs) var(--r-xs) 0;
  transition: width var(--dur) var(--ease);
}

.nav a:hover{
  background: var(--primary-soft);
  color: var(--ink);
  text-decoration: none;
}

.nav a:hover::before{
  width: 2px;
}

.nav a.active{
  background: var(--primary-soft);
  color: var(--primary-active);
  font-weight: var(--fw-semibold);
}

.nav a.active::before{
  width: 3px;
}

.nav a:focus-visible{
  outline: 2px solid var(--primary-ring);
  outline-offset: 2px;
}

/* ─── NAV ICON ──────────────────────────────────────────── */
.nav a .icon{
  font-size: 15px;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
  line-height: 1;
  filter: saturate(0.9);
}

.nav a.active .icon{
  filter: saturate(1.15);
}

/* ─── NAV BADGE (count pill on the right of a link) ────── */
.nav a .nav-count{
  margin-left: auto;
  font-size: var(--fs-2xs);
  font-weight: var(--fw-bold);
  padding: 1px 7px;
  border-radius: var(--r-pill);
  background: var(--red-bg);
  color: var(--red);
  letter-spacing: 0;
  line-height: 1.4;
}

.nav a.active .nav-count{
  background: var(--primary);
  color: var(--on-primary);
}

/* ══════════════════════════════════════════════════════════════
   8b — SIDEBAR FOOTER ACTIONS
   ══════════════════════════════════════════════════════════════ */

.sidebar-footer{
  margin-top: auto;
  padding-top: var(--sp-4);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sidebar-footer .btn{
  justify-content: flex-start;
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  padding: 8px 12px;
  font-size: var(--fs-base);
  font-weight: var(--fw-medium);
  color: var(--ink-soft);
  width: 100%;
}

.sidebar-footer .btn:hover{
  background: var(--primary-soft);
  color: var(--ink);
  transform: none;
  box-shadow: none;
}

.sidebar-footer .btn:active{
  background: var(--primary-tint);
  box-shadow: none;
}

.sidebar-footer .btn.danger{
  color: var(--red);
}

.sidebar-footer .btn.danger:hover{
  background: var(--red-bg);
  color: var(--red);
}

/* ══════════════════════════════════════════════════════════════
   8c — TOPBAR EXTRAS : date chip, notification bell, avatar
   ══════════════════════════════════════════════════════════════ */

.topbar-chip{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  color: var(--ink-2);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-paper-sm);
  box-shadow: 0 1px 0 rgba(31,41,55,0.03);
  white-space: nowrap;
  user-select: none;
}

.topbar-chip .chip-icon{
  font-size: 13px;
  opacity: 0.75;
}

/* ─── NOTIFICATION BELL ──────────────────────────────────── */
.topbar-bell{
  position: relative;
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-paper-sm);
  color: var(--ink-soft);
  font-size: 15px;
  cursor: pointer;
  transition:
    background var(--dur-fast) var(--ease),
    border-color var(--dur-fast) var(--ease),
    transform var(--dur-fast) var(--ease-paper);
  box-shadow: 0 1px 0 rgba(31,41,55,0.03);
}

.topbar-bell:hover{
  background: var(--primary-soft);
  border-color: var(--primary-tint);
  transform: translateY(-1px);
}

.topbar-bell:active{
  transform: translateY(0);
}

.topbar-bell .badge{
  position: absolute;
  top: -3px;
  right: -3px;
  box-shadow: 0 0 0 2px var(--card-alt);
}

/* ─── USER AVATAR ────────────────────────────────────────── */
.topbar-avatar{
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--on-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: var(--fw-bold);
  font-size: var(--fs-base);
  letter-spacing: var(--ls-tight);
  user-select: none;
  cursor: pointer;
  border: 2px solid var(--card);
  box-shadow: 0 0 0 1px var(--primary-tint), 0 2px 6px rgba(199,154,40,0.25);
  transition: transform var(--dur-fast) var(--ease-paper);
}

.topbar-avatar:hover{
  transform: translateY(-1px);
}

html[data-reduce-effects="true"] .topbar-avatar:hover{
  transform: none;
}

/* ══════════════════════════════════════════════════════════════
   8d — MOBILE BOTTOM NAV BAR
   ══════════════════════════════════════════════════════════════ */

#mobile-nav{
  display: none;
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  background: var(--glass);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-top: 1px solid var(--glass-border);
  box-shadow: 0 -1px 0 var(--primary-glow);
  padding: 6px var(--sp-2);
  padding-bottom: max(6px, env(safe-area-inset-bottom));
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

#mobile-nav::-webkit-scrollbar{
  display: none;
}

#mobile-nav a{
  flex: 1 0 62px;
  text-align: center;
  font-size: var(--fs-2xs);
  font-weight: var(--fw-semibold);
  color: var(--ink-3);
  text-decoration: none;
  padding: 6px 2px;
  border-radius: var(--r-sm);
  transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  position: relative;
}

#mobile-nav a .mn-icon{
  display: block;
  font-size: 17px;
  margin-bottom: 2px;
  line-height: 1;
  filter: saturate(0.9);
}

#mobile-nav a:hover{
  color: var(--ink);
  background: var(--primary-soft);
  text-decoration: none;
}

#mobile-nav a.active{
  color: var(--primary-active);
  font-weight: var(--fw-bold);
}

#mobile-nav a.active .mn-icon{
  filter: saturate(1.2);
}

#mobile-nav a.active::after{
  content: '';
  position: absolute;
  left: 50%;
  bottom: 2px;
  transform: translateX(-50%);
  width: 18px;
  height: 2px;
  background: var(--primary);
  border-radius: var(--r-pill);
}

html[data-reduce-effects="true"] #mobile-nav{
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  background: var(--card);
}

/* ══════════════════════════════════════════════════════════════
   8e — COMMAND PALETTE (Ctrl + K)
   ══════════════════════════════════════════════════════════════ */

.cmdk-overlay{
  position: fixed;
  inset: 0;
  background: rgba(31, 41, 55, 0.42);
  backdrop-filter: blur(6px) saturate(120%);
  -webkit-backdrop-filter: blur(6px) saturate(120%);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 80px var(--sp-5) var(--sp-5);
  z-index: var(--z-modal);
  animation: overlayFade var(--dur) var(--ease);
}

html[data-reduce-effects="true"] .cmdk-overlay{
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  animation: none;
}

.cmdk{
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-modal);
  overflow: hidden;
  animation: modalFlick var(--dur-slow) var(--ease-paper);
}

html[data-reduce-effects="true"] .cmdk{
  animation: none;
}

.cmdk-head{
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-5);
  border-bottom: 1px solid var(--border);
  background: var(--card-alt);
}

.cmdk-head::before{
  content: '⌘';
  font-size: 15px;
  color: var(--primary-hover);
  flex-shrink: 0;
}

.cmdk-input{
  flex: 1;
  border: 0;
  background: transparent;
  font-size: var(--fs-md);
  font-weight: var(--fw-medium);
  color: var(--ink);
  outline: none;
  padding: 0;
}

.cmdk-input::placeholder{
  color: var(--ink-4);
  font-weight: var(--fw-normal);
}

.cmdk-hint{
  font-size: var(--fs-2xs);
  color: var(--ink-4);
  padding: 2px 6px;
  background: var(--card);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: var(--r-xs);
  font-family: var(--font-mono);
  font-weight: var(--fw-medium);
}

.cmdk-results{
  max-height: 380px;
  overflow-y: auto;
  padding: var(--sp-2);
}

.cmdk-group-label{
  font-size: var(--fs-2xs);
  font-weight: var(--fw-bold);
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: var(--ls-wider);
  padding: var(--sp-4) var(--sp-3) var(--sp-2);
}

.cmdk-item{
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 9px 11px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
  font-size: var(--fs-base);
}

.cmdk-item:hover,
.cmdk-item.active{
  background: var(--primary-soft);
}

.cmdk-item.active{
  box-shadow: inset 0 0 0 1px var(--primary-tint);
}

.cmdk-item .ck-icon{
  font-size: 15px;
  width: 22px;
  text-align: center;
  flex-shrink: 0;
  opacity: 0.85;
}

.cmdk-item .ck-label{
  flex: 1;
  font-weight: var(--fw-medium);
  color: var(--ink);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cmdk-item .ck-sub{
  font-size: var(--fs-xs);
  color: var(--ink-3);
  font-weight: var(--fw-normal);
  margin-left: auto;
  flex-shrink: 0;
}

.cmdk-empty{
  padding: var(--sp-8) var(--sp-5);
  text-align: center;
  color: var(--ink-3);
  font-size: var(--fs-base);
}

.cmdk-foot{
  padding: var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--border);
  background: var(--card-alt);
  display: flex;
  gap: var(--sp-4);
  align-items: center;
  font-size: var(--fs-2xs);
  color: var(--ink-3);
  flex-wrap: wrap;
}

.cmdk-foot .kbd-hint{
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* ══════════════════════════════════════════════════════════════
   8f — KEYBOARD SHORTCUT HINT POPOVER
   ══════════════════════════════════════════════════════════════ */

.kbd-pop{
  position: fixed;
  bottom: var(--sp-7);
  left: var(--sp-7);
  background: var(--card);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  padding: var(--sp-4) var(--sp-5);
  box-shadow: var(--shadow-modal);
  font-size: var(--fs-xs);
  color: var(--ink-2);
  z-index: var(--z-calc);
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 240px;
}

.kbd-pop .kbd-row{
  display: flex;
  justify-content: space-between;
  gap: var(--sp-4);
  align-items: center;
}

.kbd-pop .kbd-row span:first-child{
  color: var(--ink-3);
}

/* ══════════════════════════════════════════════════════════════
   8g — RESPONSIVE ADJUSTMENTS FOR NAV
   ══════════════════════════════════════════════════════════════ */

@media (max-width: 900px){
  #mobile-nav{
    display: flex;
  }

  .nav-group-title{
    padding-left: 4px;
  }
}

@media (max-width: 480px){
  #mobile-nav a{
    flex: 0 0 60px;
    font-size: 10px;
  }

  #mobile-nav a .mn-icon{
    font-size: 16px;
  }
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 8
   ══════════════════════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════════════════════
   BLOCK 9 — FULL RESPONSIVE & MOBILE PASS
   Tablet (≤1100px), Mobile (≤900px), Small (≤640px), Tiny (≤480px),
   Landscape, Print media. Consolidates + extends Block 4's quick pass.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   9a — TABLET : ≤1100px
   Sidebar still visible, but denser layout.
   ══════════════════════════════════════════════════════════════ */

@media (max-width: 1100px){
  :root{
    --page-pad-x: 18px;
    --page-pad-y: 18px;
  }

  .grid-4{
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  }

  .grid-3{
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  }

  .topbar-search{
    max-width: 240px;
  }

  .kpi-value{
    font-size: var(--fs-2xl);
  }
}

/* ══════════════════════════════════════════════════════════════
   9b — MOBILE : ≤900px
   Sidebar becomes off-canvas drawer. Topbar hidden, mobile header
   takes over. Mobile bottom nav appears.
   ══════════════════════════════════════════════════════════════ */

@media (max-width: 900px){
  :root{
    --page-pad-x: 16px;
    --page-pad-y: 16px;
  }

  /* Main content gets bottom padding for the mobile nav */
  .main{
    padding: var(--sp-5) var(--page-pad-x);
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
    max-width: 100%;
  }

  /* Grids collapse to single column */
  .grid-2,
  .grid-3{
    grid-template-columns: 1fr;
    gap: var(--sp-4);
  }

  .grid-4{
    grid-template-columns: repeat(2, 1fr);
    gap: var(--sp-4);
  }

  /* Filter bar stacks */
  .filter-bar{
    flex-direction: column;
    align-items: stretch;
    gap: var(--sp-4);
    padding: var(--sp-4);
  }

  .filter-bar > *,
  .filter-bar .grow-1,
  .filter-bar .grow-2,
  .filter-bar .no-grow{
    flex: 1 1 100%;
    min-width: 0;
  }

  /* Form rows stack */
  .form-row,
  .form-row-2,
  .form-row-3{
    grid-template-columns: 1fr;
    gap: var(--sp-3);
  }

  /* Page header */
  .page-head{
    flex-direction: column;
    align-items: stretch;
    gap: var(--sp-4);
    margin-bottom: var(--sp-5);
  }

  .page-head h1{
    font-size: var(--fs-xl);
  }

  .page-head p{
    font-size: var(--fs-sm);
  }

  .page-actions{
    gap: var(--sp-2);
  }

  .page-actions .btn{
    flex: 1 1 auto;
    min-width: 0;
  }

  /* Cards */
  .card{
    padding: var(--sp-5);
    border-radius: var(--r-md);
  }

  .card-title{
    font-size: var(--fs-base);
    margin-bottom: var(--sp-4);
  }

  /* KPI tiles */
  .kpi{
    padding: var(--sp-4) var(--sp-5);
  }

  .kpi-value{
    font-size: var(--fs-xl);
  }

  .kpi-icon{
    width: 30px;
    height: 30px;
    font-size: 13px;
  }

  /* Tables : horizontal scroll fallback + compact */
  .tbl-wrap{
    border-radius: var(--r-sm);
  }

  thead th{
    padding: 9px var(--sp-3);
    font-size: 10px;
  }

  tbody td{
    padding: 9px var(--sp-3);
    font-size: var(--fs-sm);
  }

  /* Command palette fills more of the screen */
  .cmdk-overlay{
    padding: 60px var(--sp-3) var(--sp-3);
  }

  .cmdk{
    border-radius: var(--r-md);
  }

  .cmdk-head{
    padding: var(--sp-4);
  }

  .cmdk-results{
    max-height: 55vh;
  }

  /* Toast */
  #toast-root{
    left: var(--sp-3);
    right: var(--sp-3);
    bottom: calc(var(--sp-3) + env(safe-area-inset-bottom));
    max-width: none;
  }

  /* Modal already handled in Block 7 — reinforce nothing here */

  /* Empty state */
  .empty{
    padding: 40px var(--sp-4);
  }

  .empty-icon{
    font-size: 42px;
  }

  /* Buttons get slightly taller for touch */
  .btn{
    padding: 10px 16px;
  }

  .btn-sm{
    padding: 7px 11px;
  }

  /* Inputs get slightly taller for touch */
  .input,
  select.input,
  textarea.input{
    padding: 10px 12px;
    font-size: var(--fs-base);
  }

  /* Hide tablet-only elements */
  .hide-mobile{
    display: none !important;
  }
}

/* ══════════════════════════════════════════════════════════════
   9c — SMALL MOBILE : ≤640px
   Tables stack, modals full width, chips shrink, filter bars tight.
   ══════════════════════════════════════════════════════════════ */

@media (max-width: 640px){
  :root{
    --page-pad-x: 12px;
    --page-pad-y: 12px;
  }

  .main{
    padding: var(--sp-4) var(--page-pad-x);
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }

  /* Grid : 4 becomes single column */
  .grid-4{
    grid-template-columns: 1fr;
  }

  /* Compact card padding */
  .card{
    padding: var(--sp-4);
    border-radius: var(--r-sm);
  }

  .mini-stat{
    padding: var(--sp-3) var(--sp-4);
  }

  .mini-stat .val{
    font-size: var(--fs-base);
  }

  /* Modal : top-anchored, edge-to-edge */
  .modal-overlay{
    align-items: flex-start;
    padding: var(--sp-2);
    padding-top: calc(var(--sp-2) + env(safe-area-inset-top));
  }

  .modal{
    max-width: 100%;
    margin: var(--sp-2) 0;
    max-height: 92vh;
    padding: var(--sp-4);
    border-radius: var(--r-md);
  }

  .modal h2{
    font-size: var(--fs-md);
  }

  .modal-close{
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    font-size: 14px;
  }

  /* Chips shrink a touch */
  .chip{
    padding: 2px 7px;
    font-size: 10px;
  }

  .chip-xs{
    padding: 1px 5px;
    font-size: 9px;
  }

  /* Tables : tighter cells */
  thead th{
    padding: 8px var(--sp-3);
  }

  tbody td{
    padding: 8px var(--sp-3);
    font-size: var(--fs-sm);
  }

  /* Page header tighter */
  .page-head{
    margin-bottom: var(--sp-4);
  }

  .page-head h1{
    font-size: var(--fs-lg);
  }

  /* Buttons tighter */
  .btn{
    padding: 9px 14px;
    font-size: var(--fs-sm);
  }

  .btn-sm{
    padding: 6px 9px;
    font-size: var(--fs-xs);
  }

  /* Filter bar */
  .filter-bar{
    padding: var(--sp-3);
    border-radius: var(--r-md);
    gap: var(--sp-3);
  }

  /* Command palette */
  .cmdk-overlay{
    padding: 40px var(--sp-2) var(--sp-2);
  }

  .cmdk-results{
    max-height: 50vh;
  }

  .cmdk-foot{
    font-size: 9px;
    padding: var(--sp-2) var(--sp-3);
  }

  /* Sidebar */
  .sidebar{
    width: 250px;
    padding: var(--sp-4) var(--sp-3);
  }

  .brand-logo{
    width: 34px;
    height: 34px;
    font-size: 18px;
  }

  /* Hide small-only elements */
  .hide-sm{
    display: none !important;
  }
}

/* ══════════════════════════════════════════════════════════════
   9d — TINY MOBILE : ≤480px
   Emergency compact — one column, small type, big touch targets.
   ══════════════════════════════════════════════════════════════ */

@media (max-width: 480px){
  .kpi-value{
    font-size: var(--fs-lg);
  }

  .kpi-label{
    font-size: 10px;
  }

  .mini-stat .lbl{
    font-size: 9px;
  }

  .page-head h1{
    font-size: var(--fs-md);
  }

  .card-title{
    font-size: var(--fs-sm);
  }

  /* Mobile nav tighter */
  #mobile-nav a{
    flex: 0 0 58px;
    font-size: 9px;
  }

  #mobile-nav a .mn-icon{
    font-size: 15px;
  }

  /* Buttons: full width if they start stacking */
  .page-actions .btn{
    flex: 1 1 100%;
  }

  /* Calculator fills width */
  .calc{
    left: var(--sp-3);
    right: var(--sp-3);
    bottom: calc(var(--sp-3) + env(safe-area-inset-bottom));
    width: auto;
  }

  .calc-display{
    font-size: 17px;
    min-height: 46px;
  }

  .calc-keys button{
    padding: 11px 0;
    font-size: var(--fs-base);
  }

  /* Toast */
  #toast-root{
    left: var(--sp-2);
    right: var(--sp-2);
  }

  .toast{
    font-size: var(--fs-sm);
    padding: 10px 13px;
  }
}

/* ══════════════════════════════════════════════════════════════
   9e — LANDSCAPE MOBILE (short height)
   When a phone is rotated, reduce top chrome height.
   ══════════════════════════════════════════════════════════════ */

@media (max-height: 500px) and (orientation: landscape){
  .mobile-header{
    padding: var(--sp-2) var(--sp-4);
  }

  .modal-overlay{
    align-items: flex-start;
    padding: var(--sp-2);
  }

  .modal{
    max-height: 96vh;
    margin: 2px 0;
  }

  #mobile-nav{
    padding: 3px var(--sp-2);
  }

  #mobile-nav a{
    padding: 3px 2px;
    font-size: 9px;
  }

  #mobile-nav a .mn-icon{
    font-size: 14px;
    margin-bottom: 0;
  }
}

/* ══════════════════════════════════════════════════════════════
   9f — LARGE DESKTOP : ≥1600px
   Extra breathing room on big monitors.
   ══════════════════════════════════════════════════════════════ */

@media (min-width: 1600px){
  :root{
    --content-max: 1700px;
    --page-pad-x: 32px;
    --page-pad-y: 28px;
  }

  .kpi-value{
    font-size: var(--fs-3xl);
  }
}

/* ══════════════════════════════════════════════════════════════
   9g — ULTRA-WIDE : ≥1920px
   Sidebar stays, content stays centered.
   ══════════════════════════════════════════════════════════════ */

@media (min-width: 1920px){
  :root{
    --content-max: 1800px;
  }
}

/* ══════════════════════════════════════════════════════════════
   9h — HOVER-CAPABLE DEVICES ONLY
   Disable hover transforms on touch-only devices to avoid
   sticky hover states.
   ══════════════════════════════════════════════════════════════ */

@media (hover: none){
  .btn:hover,
  .chip:hover,
  .kpi:hover,
  .card:hover,
  .nav a:hover,
  .topbar-bell:hover,
  .topbar-avatar:hover,
  .hamburger:hover,
  .calc-keys button:hover{
    transform: none !important;
  }
}

/* ══════════════════════════════════════════════════════════════
   9i — PRINT MEDIA : A4 INVOICES
   Hide all chrome, show only the print target.
   ══════════════════════════════════════════════════════════════ */

@media print{
  /* Kill notebook bg */
  body::before{
    display: none !important;
  }

  /* Reset body background to pure white for ink saving */
  html,
  body{
    background: #FFFFFF !important;
    color: #000000 !important;
    font-size: 12px;
  }

  /* Hide navigation chrome */
  .sidebar,
  .sidebar-backdrop,
  .topbar,
  .mobile-header,
  #mobile-nav,
  #toast-root,
  #calc-root,
  #modal-root,
  .page-actions,
  .filter-bar,
  .btn,
  .btn-fab,
  .cmdk-overlay,
  .loadbar,
  .kbd-pop{
    display: none !important;
  }

  /* Layout flattens */
  .layout{
    display: block !important;
  }

  .main-wrap{
    display: block !important;
  }

  .main{
    padding: 0 !important;
    max-width: 100% !important;
    margin: 0 !important;
  }

  /* Cards become print-friendly */
  .card{
    box-shadow: none !important;
    border: 1px solid #DDDDDD !important;
    border-radius: 0 !important;
    padding: 12px !important;
    page-break-inside: avoid;
  }

  /* Tables : pure B&W for print */
  table{
    font-size: 11px;
  }

  thead th{
    background: #F2F2F2 !important;
    color: #000000 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  tbody td{
    color: #000000 !important;
  }

  .chip{
    border: 1px solid #CCCCCC !important;
    background: transparent !important;
    color: #000000 !important;
    box-shadow: none !important;
  }

  /* Hide everything except the invoice print area if class is used */
  body.print-invoice-only > #app > .layout > .main-wrap > .main > *:not(#print-area){
    display: none !important;
  }

  /* Print-area specifics (invoice view) */
  #print-area{
    box-shadow: none !important;
    border: 0 !important;
    padding: 0 !important;
    max-width: 100% !important;
  }

  /* Page setup */
  @page{
    size: A4;
    margin: 12mm 10mm;
  }
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 9
   ══════════════════════════════════════════════════════════════ */
 /* ══════════════════════════════════════════════════════════════
   BLOCK 10 — REDUCED-EFFECTS MODE (FULL OVERRIDES)
   Consolidated performance mode.
   Activated by JS via:  document.documentElement.dataset.reduceEffects = "true"
   Or auto-detected for low-end devices.
   Removes: backdrop-filter, all box-shadows, all animations,
   all transform lifts, all grain/ruled backgrounds.
   Keeps:   colors, layout, borders, hover color changes, spinner.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   10a — GLOBAL KILLS
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] *,
html[data-reduce-effects="true"] *::before,
html[data-reduce-effects="true"] *::after{
  /* Kill all blur work */
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;

  /* Kill filter work */
  filter: none !important;
  -webkit-filter: none !important;

  /* Kill all transitions */
  transition: none !important;
