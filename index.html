/* ══════════════════════════════════════════════════════════════
   BLOCK 37 — PROFIT & LOSS
   Product-wise profitability report.
   Revenue − Cost = Profit; Margin % = Profit / Revenue.
   Cost basis: product.cost × base units sold.
   ══════════════════════════════════════════════════════════════ */

function renderPnL(content){
  if(!content) return;

  const today      = todayStr();
  const monthStart = firstOfMonthStr();
  const yearStart  = firstOfYearStr();

  /* ══════════════════════════════════════════════════════
     PAGE SHELL
     ══════════════════════════════════════════════════════ */

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Profit &amp; Loss</h1>
        <p>Product-wise profitability for any date range</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost" type="button" id="pnl-export">📤 Export</button>
      </div>
    </div>

    <!-- Range bar -->
    <div class="filter-bar">
      <div class="grow-1">
        <label class="label">From</label>
        <input class="input" type="date" id="pnl-from" max="${today}" value="${monthStart}">
      </div>
      <div class="grow-1">
        <label class="label">To</label>
        <input class="input" type="date" id="pnl-to" max="${today}" value="${today}">
      </div>
      <div class="grow-1">
        <label class="label">&nbsp;</label>
        <div class="btn-group" id="pnl-presets" style="display:inline-flex">
          <button type="button" class="btn" data-p="today">Today</button>
          <button type="button" class="btn btn-primary active" data-p="month">Month</button>
          <button type="button" class="btn" data-p="year">Year</button>
          <button type="button" class="btn" data-p="all">All</button>
        </div>
      </div>
      <div class="grow-1" style="flex:0 0 auto">
        <label class="label">&nbsp;</label>
        <button class="btn btn-primary" type="button" id="pnl-load" style="width:100%">Load</button>
      </div>
    </div>

    <!-- KPI row -->
    <div class="grid-4" id="pnl-kpis" style="margin-bottom:16px"></div>

    <!-- Product-wise table -->
    <div class="card" style="padding:0;overflow:hidden">
      <div class="card-title" style="padding:14px 18px;margin:0;border-bottom:1px solid var(--border);background:var(--card-alt)">
        Product-wise Profit
        <small id="pnl-range-label"></small>
      </div>
      <div class="tbl-wrap" style="border:0;border-radius:0">
        <table>
          <thead>
            <tr>
              <th style="width:36%">Product</th>
              <th style="text-align:right">Sold Qty</th>
              <th style="text-align:right">Revenue</th>
              <th style="text-align:right">Cost</th>
              <th style="text-align:right">Profit</th>
              <th style="text-align:right">Margin</th>
            </tr>
          </thead>
          <tbody id="pnl-body"></tbody>
        </table>
      </div>
    </div>
  `;

  /* ══════════════════════════════════════════════════════
     CORE COMPUTATION
     ══════════════════════════════════════════════════════ */

  function compute(from, to){
    const invoices = (DB.invoices || []).filter(i => {
      const d = txDate(i, 'invoice_date');
      return d >= from && d <= to;
    });

    const perProduct = {};
    let totalRevenue = 0;
    let totalCost = 0;
    let invoiceCount = 0;

    invoices.forEach(inv => {
      /* Skip credit notes (negative totals) — they'd distort P&L */
      if(Number(inv.total) < 0) return;
      invoiceCount++;

      const items = (DB.invoice_items || []).filter(x => x.invoice_id === inv.id);

      items.forEach(it => {
        const product = (DB.products || []).find(p => p.id === it.product_id);
        const costPerBase = product ? Number(product.cost || 0) : 0;
        const baseQty     = lineDeductBaseQty(it);
        const cost        = baseQty * costPerBase;
        const revenue     = Number(it.total || 0);

        const key = it.product_id || ('name:' + it.product_name);

        if(!perProduct[key]){
          perProduct[key] = {
            name:     it.product_name,
            unit:     product
                        ? (product.dual ? (product.base_unit || 'piece') : (product.unit || 'piece'))
                        : (it.unit || ''),
            qty:      0,
            revenue:  0,
            cost:     0,
            hasProduct: !!product
          };
        }

        perProduct[key].qty     += baseQty;
        perProduct[key].revenue += revenue;
        perProduct[key].cost    += cost;

        totalRevenue += revenue;
        totalCost    += cost;
      });
    });

    const profit = totalRevenue - totalCost;
    const margin = totalRevenue > 0 ? (profit / totalRevenue) * 100 : 0;

    return {
      perProduct,
      totalRevenue,
      totalCost,
      profit,
      margin,
      invoiceCount
    };
  }

  /* ══════════════════════════════════════════════════════
     RENDER KPIs
     ══════════════════════════════════════════════════════ */

  function renderKPIs(r){
    const isProfit = r.profit >= 0;

    $('#pnl-kpis').innerHTML = `
      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Revenue</div>
          <div class="kpi-icon">💰</div>
        </div>
        <div class="kpi-value">${rs(r.totalRevenue)}</div>
        <div class="kpi-trend">${r.invoiceCount} invoice${r.invoiceCount === 1 ? '' : 's'}</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Cost of Goods</div>
          <div class="kpi-icon" style="background:var(--amber-bg);color:var(--amber)">📦</div>
        </div>
        <div class="kpi-value">${rs(r.totalCost)}</div>
        <div class="kpi-trend">at current cost price</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">${isProfit ? 'Profit' : 'Loss'}</div>
          <div class="kpi-icon" style="background:${isProfit ? 'var(--green-bg)' : 'var(--red-bg)'};color:${isProfit ? 'var(--green)' : 'var(--red)'}">
            ${isProfit ? '📈' : '📉'}
          </div>
        </div>
        <div class="kpi-value" style="color:${isProfit ? 'var(--green)' : 'var(--red)'}">
          ${rs(r.profit)}
        </div>
        <div class="kpi-trend">${isProfit ? 'in profit' : 'in loss'}</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Avg Margin</div>
          <div class="kpi-icon" style="background:var(--purple-bg);color:var(--purple)">%</div>
        </div>
        <div class="kpi-value" style="color:${r.margin >= 0 ? 'var(--green)' : 'var(--red)'}">
          ${r.margin.toFixed(1)}%
        </div>
        <div class="kpi-trend">profit / revenue</div>
      </div>
    `;
  }

  /* ══════════════════════════════════════════════════════
     RENDER TABLE
     ══════════════════════════════════════════════════════ */

  function renderTable(r, label){
    const rangeLabel = $('#pnl-range-label');
    if(rangeLabel) rangeLabel.textContent = label || '';

    const rows = Object.values(r.perProduct).sort((a, b) => {
      const pA = a.revenue - a.cost;
      const pB = b.revenue - b.cost;
      return pB - pA;
    });

    const body = $('#pnl-body');

    if(!rows.length){
      body.innerHTML = `
        <tr>
          <td colspan="6" style="padding:0">
            ${emptyStateHTML(
              '📊',
              'No sales in this range',
              'Adjust the dates above and click Load.'
            )}
          </td>
        </tr>
      `;
      return;
    }

    body.innerHTML = rows.map(x => {
      const profit = x.revenue - x.cost;
      const margin = x.revenue > 0 ? (profit / x.revenue) * 100 : 0;
      const isProfit = profit >= 0;

      return `
        <tr>
          <td>
            <strong style="color:var(--ink)">${esc(x.name)}</strong>
            ${!x.hasProduct ? '<span class="chip chip-red chip-xs" style="margin-left:6px">DELETED</span>' : ''}
          </td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">
            ${fmtNum(x.qty)} <span style="color:var(--ink-3);font-size:var(--fs-xs)">${esc(x.unit)}</span>
          </td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${rs(x.revenue)}</td>
          <td style="text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums">${rs(x.cost)}</td>
          <td style="text-align:right;font-weight:700;color:${isProfit ? 'var(--green)' : 'var(--red)'};font-variant-numeric:tabular-nums">
            ${rs(profit)}
          </td>
          <td style="text-align:right;color:${margin >= 0 ? 'var(--green)' : 'var(--red)'};font-variant-numeric:tabular-nums">
            ${margin.toFixed(1)}%
          </td>
        </tr>
      `;
    }).join('');
  }

  /* ══════════════════════════════════════════════════════
     MASTER RENDER
     ══════════════════════════════════════════════════════ */

  let lastReport = null;
  let lastLabel = '';

  function load(){
    const from = $('#pnl-from').value;
    const to   = $('#pnl-to').value;

    if(!from || !to){
      toast('Pick both dates', 'error');
      return;
    }
    if(from > to){
      toast('From cannot be after To', 'error');
      return;
    }

    const r = compute(from, to);
    const label = fmtDate(from) + ' → ' + fmtDate(to);

    lastReport = r;
    lastLabel  = label;

    renderKPIs(r);
    renderTable(r, label);
  }

  /* ══════════════════════════════════════════════════════
     PRESETS
     ══════════════════════════════════════════════════════ */

  $$('#pnl-presets button').forEach(btn => {
    btn.onclick = () => {
      $$('#pnl-presets button').forEach(b => {
        b.classList.toggle('btn-primary', b === btn);
        b.classList.toggle('active', b === btn);
      });

      const p = btn.dataset.p;
      const bounds = rangeForPreset(p);
      $('#pnl-from').value = bounds.from;
      $('#pnl-to').value   = bounds.to;
      load();
    };
  });

  /* ══════════════════════════════════════════════════════
     EXPORT
     ══════════════════════════════════════════════════════ */

  $('#pnl-export').onclick = () => {
    if(!lastReport){
      toast('Load a range first', 'info');
      return;
    }

    const rows = Object.values(lastReport.perProduct).sort((a, b) => {
      return (b.revenue - b.cost) - (a.revenue - a.cost);
    }).map(x => {
      const profit = x.revenue - x.cost;
      const margin = x.revenue > 0 ? (profit / x.revenue) * 100 : 0;
      return [
        x.name,
        x.unit,
        Number(x.qty).toFixed(2),
        Number(x.revenue).toFixed(2),
        Number(x.cost).toFixed(2),
        Number(profit).toFixed(2),
        margin.toFixed(1) + '%'
      ];
    });

    const header = ['Product', 'Unit', 'Qty Sold', 'Revenue', 'Cost', 'Profit', 'Margin %'];
    const summary = [
      ['', '', '', '', '', '', ''],
      ['TOTAL', '', '', Number(lastReport.totalRevenue).toFixed(2),
       Number(lastReport.totalCost).toFixed(2),
       Number(lastReport.profit).toFixed(2),
       lastReport.margin.toFixed(1) + '%']
    ];

    const all = [header, ...rows, ...summary];
    const csv = all.map(row => row.map(cell => {
      const s = String(cell ?? '');
      if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(',')).join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    downloadBlob(blob, 'ProfitLoss-' + todayStr() + '.csv');
    toast('CSV downloaded', 'success');
  };

  /* ══════════════════════════════════════════════════════
     INITIAL LOAD
     ══════════════════════════════════════════════════════ */

  load();
}

   END BLOCK 37
   ══════════════════════════════════════════════════════════════ */

    <!-- Table -->

      <div class="card-title" style="padding:14px 18px;margin:0;border-bottom:1px solid var(--border);background:var(--card-alt)">

      </div>
      <div class="tbl-wrap" style="border:0;border-radius:0">
        <table>
          <thead>
            <tr>
              <th>Invoice</th>
              <th>Party</th>
              <th>Date</th>
              <th style="text-align:right">Revenue</th>
              <th style="text-align:right">Cost</th>
              <th style="text-align:right">Profit</th>
              <th style="text-align:right">Margin</th>
            </tr>

  /* ══════════════════════════════════════════════════════
     PER-INVOICE METRICS
     ══════════════════════════════════════════════════════ */

  function invoiceMetrics(inv){
    const items = (DB.invoice_items || []).filter(x => x.invoice_id === inv.id);

    let subtotal = 0;
    let totalCost = 0;
    const itemData = [];

    items.forEach(it => {
      const product = (DB.products || []).find(p => p.id === it.product_id);
      const costPerBase = product ? Number(product.cost || 0) : 0;
      const baseQty     = lineDeductBaseQty(it);
      const revenue     = Number(it.total || 0);
      const cost        = baseQty * costPerBase;

      subtotal  += revenue;
      totalCost += cost;

      itemData.push({
        item: it,
        product,
        costPerBase,
        baseQty,
        revenue,
        cost,
        profit: revenue - cost,
        margin: revenue > 0 ? ((revenue - cost) / revenue) * 100 : 0,
        unit: product
          ? (product.dual ? (product.base_unit || 'piece') : (product.unit || 'piece'))
          : (it.unit || '')
      });
    });

    /* Invoice-level total includes discount + GST, so cost-to-revenue
       must be scaled by the same factor to keep margins meaningful. */
    const invoiceTotal = Number(inv.total) || 0;
    const factor = subtotal > 0 ? (invoiceTotal / subtotal) : 1;

    itemData.forEach(d => {
      d.netRevenue = d.revenue * factor;
      d.profit     = d.netRevenue - d.cost;
      d.margin     = d.netRevenue > 0 ? (d.profit / d.netRevenue) * 100 : 0;
    });

    const profit = invoiceTotal - totalCost;
    const margin = invoiceTotal > 0 ? (profit / invoiceTotal) * 100 : 0;

    return {
      items: itemData,
      subtotal,
      revenue: invoiceTotal,
      totalCost,
      profit,
      margin
    };
  }

  /* ══════════════════════════════════════════════════════
     DATA + KPIs
     ══════════════════════════════════════════════════════ */

  let currentRows = [];
  let currentLabel = '';

  function buildRows(from, to){
    const invs = (DB.invoices || []).filter(inv => {
      /* Skip credit notes */
      if(Number(inv.total) < 0) return false;
      const d = txDate(inv, 'invoice_date');
      return d >= from && d <= to;
    });

    return invs.map(inv => {
      const m = invoiceMetrics(inv);
      return { inv, m };
    });
  }

  function sortRows(rows, sortBy){
    const sorted = rows.slice();

    switch(sortBy){
      case 'date-desc':
        sorted.sort((a, b) => txDate(b.inv, 'invoice_date').localeCompare(txDate(a.inv, 'invoice_date')));
        break;
      case 'date':
        sorted.sort((a, b) => txDate(a.inv, 'invoice_date').localeCompare(txDate(b.inv, 'invoice_date')));
        break;
      case 'margin-desc':
        sorted.sort((a, b) => b.m.margin - a.m.margin);
        break;
      case 'margin':
        sorted.sort((a, b) => a.m.margin - b.m.margin);
        break;
      case 'profit-desc':
        sorted.sort((a, b) => b.m.profit - a.m.profit);
        break;
      case 'revenue-desc':
        sorted.sort((a, b) => b.m.revenue - a.m.revenue);
        break;
    }

    return sorted;
  }

  function renderKPIs(rows){
    let totalRevenue = 0;
    let totalCost = 0;
    let totalProfit = 0;

    rows.forEach(r => {
      totalRevenue += r.m.revenue;
      totalCost    += r.m.totalCost;
      totalProfit  += r.m.profit;
    });

    const avgMargin = totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0;
    const isProfit = totalProfit >= 0;

    $('#mg-kpis').innerHTML = `
      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Revenue</div>
          <div class="kpi-icon">💰</div>
        </div>
        <div class="kpi-value">${rs(totalRevenue)}</div>
        <div class="kpi-trend">${rows.length} invoice${rows.length === 1 ? '' : 's'}</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Cost of Goods</div>
          <div class="kpi-icon" style="background:var(--amber-bg);color:var(--amber)">📦</div>
        </div>
        <div class="kpi-value">${rs(totalCost)}</div>
        <div class="kpi-trend">at current cost</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">${isProfit ? 'Profit' : 'Loss'}</div>
          <div class="kpi-icon" style="background:${isProfit ? 'var(--green-bg)' : 'var(--red-bg)'};color:${isProfit ? 'var(--green)' : 'var(--red)'}">
            ${isProfit ? '📈' : '📉'}
          </div>
        </div>
        <div class="kpi-value" style="color:${isProfit ? 'var(--green)' : 'var(--red)'}">${rs(totalProfit)}</div>
        <div class="kpi-trend">${isProfit ? 'net gain' : 'net loss'}</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Avg Margin</div>
          <div class="kpi-icon" style="background:var(--purple-bg);color:var(--purple)">%</div>
        </div>
        <div class="kpi-value" style="color:${avgMargin >= 0 ? 'var(--green)' : 'var(--red)'}">
          ${avgMargin.toFixed(1)}%
        </div>
        <div class="kpi-trend">weighted by revenue</div>
      </div>
    `;
  }

  /* ══════════════════════════════════════════════════════
     TABLE
     ══════════════════════════════════════════════════════ */

  function renderTable(rows){
    const body = $('#mg-body');

    if(!rows.length){
      body.innerHTML = `
        <tr>

              '📊',
              'No invoices in this range',
              'Adjust the dates or pick a different preset.'
            )}
          </td>
        </tr>
      `;
      return;
    }

    body.innerHTML = rows.map(r => {
      const inv = r.inv;
      const m   = r.m;

      const party = inv.party_type === 'retailer'
        ? (DB.retailers || []).find(x => x.id === inv.party_id)
        : (DB.customers || []).find(x => x.id === inv.party_id);

      const pCol = m.profit >= 0 ? 'var(--green)' : 'var(--red)';
      const typeChip = inv.party_type === 'retailer'
        ? '<span class="chip chip-blue chip-xs">Retailer</span>'
        : '<span class="chip chip-green chip-xs">Customer</span>';

      return `
        <tr style="cursor:pointer" data-mg-id="${inv.id}">
          <td style="font-weight:600;color:var(--ink)">${esc(inv.invoice_no || 'INV')}</td>
          <td>
            ${party ? esc(party.name) : '<span style="color:var(--ink-4)">—</span>'}
            <span style="margin-left:6px">${typeChip}</span>
          </td>
          <td style="color:var(--ink-3);font-size:var(--fs-sm);white-space:nowrap">${txDT(inv, 'invoice_date')}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${rs(m.revenue)}</td>
          <td style="text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums">${rs(m.totalCost)}</td>
          <td style="text-align:right;font-weight:700;color:${pCol};font-variant-numeric:tabular-nums">${rs(m.profit)}</td>
          <td style="text-align:right;color:${pCol};font-variant-numeric:tabular-nums">${m.margin.toFixed(1)}%</td>
        </tr>
      `;
    }).join('');

    $$('[data-mg-id]', body).forEach(tr => {
      tr.onclick = () => showBreakdown(tr.dataset.mgId);

  /* ══════════════════════════════════════════════════════
     ITEM-LEVEL BREAKDOWN MODAL
     ══════════════════════════════════════════════════════ */

  function showBreakdown(invId){
    const row = currentRows.find(r => r.inv.id === invId);

    const m   = row.m;

    const party = inv.party_type === 'retailer'
      ? (DB.retailers || []).find(x => x.id === inv.party_id)
      : (DB.customers || []).find(x => x.id === inv.party_id);

    const pCol = m.profit >= 0 ? 'var(--green)' : 'var(--red)';

    const rowsHTML = m.items.map(d => {
      const it = d.item;
      const itemCol = d.profit >= 0 ? 'var(--green)' : 'var(--red)';

        ? ' <span style="color:var(--red);font-size:10px">(product deleted)</span>'
        : '';

      return `

          <td style="text-align:right;font-variant-numeric:tabular-nums">${rs(it.price)}</td>

          <td style="text-align:right;color:var(--amber);font-variant-numeric:tabular-nums">${rs(d.cost)}</td>
          <td style="text-align:right;font-weight:600;color:${itemCol};font-variant-numeric:tabular-nums">${rs(d.profit)}</td>
          <td style="text-align:right;color:${itemCol};font-variant-numeric:tabular-nums">${d.margin.toFixed(1)}%</td>
        </tr>
      `;
    }).join('');

    openModal(`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div>
          <h2 style="margin-bottom:2px">${esc(inv.invoice_no || 'INV')}</h2>

        </div>
        <div style="text-align:right">
          <div style="font-size:10px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:0.06em">Margin</div>
          <div style="font-size:22px;font-weight:800;color:${pCol};line-height:1.1">${m.margin.toFixed(1)}%</div>
        </div>
      </div>

      <div class="grid-3" style="margin-bottom:14px">
        <div class="mini-stat">
          <div class="lbl">Revenue</div>
          <div class="val" style="color:var(--green)">${rs(m.revenue)}</div>
        </div>
        <div class="mini-stat">
          <div class="lbl">Cost</div>
          <div class="val" style="color:var(--amber)">${rs(m.totalCost)}</div>
        </div>
        <div class="mini-stat">
          <div class="lbl">Profit</div>

      <div class="tbl-wrap" style="border:1px solid var(--border)">

          <thead>
            <tr>
              <th style="width:26%">Item</th>
              <th style="text-align:right">Qty</th>
              <th style="text-align:right">Price</th>
              <th style="text-align:right">Revenue</th>
              <th style="text-align:right">Cost/Unit</th>
              <th style="text-align:right">Total Cost</th>
              <th style="text-align:right">Profit</th>
              <th style="text-align:right">Margin</th>
            </tr>
          </thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>

      <div class="form-actions" style="margin-top:16px">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Close</button>
      </div>
    `);
  }

  /* ══════════════════════════════════════════════════════
     LOAD + PRESETS + SORT
     ══════════════════════════════════════════════════════ */

  function load(){
    const from = $('#mg-from').value;
    const to   = $('#mg-to').value;

    if(!from || !to){
      toast('Pick both dates', 'error');
      return;
    }
    if(from > to){
      toast('From cannot be after To', 'error');
      return;
    }

    const sortBy = $('#mg-sort').value;
    const rows = sortRows(buildRows(from, to), sortBy);

    currentRows  = rows;
    currentLabel = fmtDate(from) + ' → ' + fmtDate(to);

    const labelEl = $('#mg-range-label');
    if(labelEl) labelEl.textContent = currentLabel;

    renderKPIs(rows);
    renderTable(rows);
  }

  $$('#mg-presets button').forEach(btn => {
    btn.onclick = () => {
      $$('#mg-presets button').forEach(b => {
        b.classList.toggle('btn-primary', b === btn);
        b.classList.toggle('active', b === btn);
      });
      const bounds = rangeForPreset(btn.dataset.p);
      $('#mg-from').value = bounds.from;
      $('#mg-to').value   = bounds.to;
      load();
    };
  });

  $('#mg-sort').onchange = load;
  $('#mg-load').onclick  = load;

  /* ══════════════════════════════════════════════════════
     EXPORT
     ══════════════════════════════════════════════════════ */

  $('#mg-export').onclick = () => {
    if(!currentRows.length){
      toast('Load a range with invoices first', 'info');
      return;
    }

    const rows = currentRows.map(r => {
      const inv = r.inv;
      const m   = r.m;
      const party = inv.party_type === 'retailer'
        ? (DB.retailers || []).find(x => x.id === inv.party_id)
        : (DB.customers || []).find(x => x.id === inv.party_id);
      return [
        inv.invoice_no || '',
        party ? party.name : '',
        inv.party_type === 'retailer' ? 'Retailer' : 'Customer',
        txDate(inv, 'invoice_date'),
        Number(m.revenue).toFixed(2),
        Number(m.totalCost).toFixed(2),
        Number(m.profit).toFixed(2),
        m.margin.toFixed(1) + '%'
      ];
    });

    /* Totals row */
    const totalRevenue = currentRows.reduce((s, r) => s + r.m.revenue, 0);
    const totalCost    = currentRows.reduce((s, r) => s + r.m.totalCost, 0);
    const totalProfit  = totalRevenue - totalCost;
    const totalMargin  = totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0;

    const header  = ['Invoice', 'Party', 'Type', 'Date', 'Revenue', 'Cost', 'Profit', 'Margin %'];
    const spacer  = ['', '', '', '', '', '', '', ''];
    const summary = ['TOTAL', '', '', '', totalRevenue.toFixed(2), totalCost.toFixed(2), totalProfit.toFixed(2), totalMargin.toFixed(1) + '%'];

    const all = [header, ...rows, spacer, summary];
    const csv = all.map(row => row.map(cell => {
      const s = String(cell ?? '');
      if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(',')).join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    downloadBlob(blob, 'Margin-' + todayStr() + '.csv');
    toast('CSV downloaded', 'success');
  };

  /* Initial load */
  load();
}

    </div>
  `;

  /* ══════════════════════════════════════════════════════
     DATA STATE
     ══════════════════════════════════════════════════════ */

  let currentData = null;

  /* ══════════════════════════════════════════════════════
     COMPUTE
     ══════════════════════════════════════════════════════ */

  function compute(from, to){
    /* ─── Invoices (all, including credit notes) ──────── */
    const invoices = (DB.invoices || []).filter(i => {
      const d = txDate(i, 'invoice_date');
      return d >= from && d <= to;
    });

    const sales = invoices.filter(i => Number(i.total) >= 0);
    const credits = invoices.filter(i => Number(i.total) < 0);

    const totalSales   = sales.reduce((s, i) => s + Number(i.total || 0), 0);
    const totalCredits = Math.abs(credits.reduce((s, i) => s + Number(i.total || 0), 0));
    const netSales     = totalSales - totalCredits;
    const totalDue     = sales.reduce((s, i) => s + Number(i.due || 0), 0);

    /* ─── Customer vs Retailer split ──────────────────── */
    const customerSales = sales
      .filter(i => i.party_type === 'customer')
      .reduce((s, i) => s + Number(i.total || 0), 0);
    const retailerSales = sales
      .filter(i => i.party_type === 'retailer')
      .reduce((s, i) => s + Number(i.total || 0), 0);

    /* ─── GST collected (only if enabled per invoice) ─── */
    const gstCollected = sales.reduce((s, i) => s + Number(i.gst_amount || 0), 0);

    /* ─── Purchases ──────────────────────────────────── */
    const bills = (DB.supplier_invoices || []).filter(b => {
      const d = txDate(b, 'bill_date');
      return d >= from && d <= to;
    });
    const totalPurchases = bills.reduce((s, b) => s + Number(b.total || 0), 0);
    const purchaseDue    = bills.reduce((s, b) => s + (Number(b.total || 0) - Number(b.paid || 0)), 0);

    /* ─── Payments received ──────────────────────────── */
    /* Two sources: paid-at-invoice + standalone payments table.
       Add both, no double-count since the flows are independent. */
    const invoicePaid = sales.reduce((s, i) => s + Number(i.paid || 0), 0);
    const payments = (DB.payments || []).filter(p => {
      const d = txDate(p, 'payment_date');
      return d >= from && d <= to;
    });
    const paymentsTableTotal = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
    const totalReceived = invoicePaid + paymentsTableTotal;

    /* Payment mode breakdown */
    const modeTotals = {};
    PAYMENT_MODES.forEach(m => { modeTotals[m] = 0; });
    payments.forEach(p => {
      const m = p.mode || 'cash';
      modeTotals[m] = (modeTotals[m] || 0) + Number(p.amount || 0);
    });

    /* ─── Expenses ───────────────────────────────────── */
    const expenses = (DB.expenses || []).filter(e => {
      const d = txDate(e, 'expense_date');
      return d >= from && d <= to;
    });
    const totalExpenses = expenses.reduce((s, e) => s + Number(e.amount || 0), 0);

    /* Expense category breakdown */
    const expCatTotals = {};
    expenses.forEach(e => {
      const c = e.category || 'Uncategorised';
      expCatTotals[c] = (expCatTotals[c] || 0) + Number(e.amount || 0);
    });

    return {
      invoices,
      sales,
      credits,
      totalSales,
      totalCredits,
      netSales,
      totalDue,
      customerSales,
      retailerSales,
      gstCollected,
      bills,
      totalPurchases,
      purchaseDue,
      payments,
      paymentsTableTotal,
      invoicePaid,
      totalReceived,
      modeTotals,
      expenses,
      totalExpenses,
      expCatTotals
    };
  }

  /* ══════════════════════════════════════════════════════
     RENDER KPIs
     ══════════════════════════════════════════════════════ */

  function renderKPIs(d){

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Sales</div>
          <div class="kpi-icon">💰</div>
        </div>
        <div class="kpi-value">${rs(d.totalSales)}</div>
        <div class="kpi-trend">${d.sales.length} invoice${d.sales.length === 1 ? '' : 's'}</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Payments Received</div>
          <div class="kpi-icon" style="background:var(--green-bg);color:var(--green)">✅</div>
        </div>
        <div class="kpi-value" style="color:var(--green)">${rs(d.totalReceived)}</div>
        <div class="kpi-trend">
          ${d.payments.length} payment${d.payments.length === 1 ? '' : 's'}
        </div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Purchases</div>
          <div class="kpi-icon" style="background:var(--amber-bg);color:var(--amber)">📦</div>
        </div>
        <div class="kpi-value">${rs(d.totalPurchases)}</div>
        <div class="kpi-trend">${d.bills.length} bill${d.bills.length === 1 ? '' : 's'}</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Expenses</div>
          <div class="kpi-icon" style="background:var(--red-bg);color:var(--red)">💸</div>
        </div>
        <div class="kpi-value">${rs(d.totalExpenses)}</div>
        <div class="kpi-trend">${d.expenses.length} entr${d.expenses.length === 1 ? 'y' : 'ies'}</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Outstanding</div>
          <div class="kpi-icon" style="background:var(--blue-bg);color:var(--blue)">⏳</div>
        </div>
        <div class="kpi-value" style="color:${d.totalDue > 0 ? 'var(--red)' : 'var(--green)'}">
          ${rs(d.totalDue)}
        </div>
        <div class="kpi-trend">from these invoices</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Returns / Credits</div>
          <div class="kpi-icon" style="background:var(--pink-bg);color:var(--pink)">↩️</div>
        </div>
        <div class="kpi-value" style="color:var(--pink)">${rs(d.totalCredits)}</div>
        <div class="kpi-trend">${d.credits.length} credit note${d.credits.length === 1 ? '' : 's'}</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Net Sales</div>
          <div class="kpi-icon" style="background:var(--primary-soft);color:var(--primary-hover)">📊</div>
        </div>
        <div class="kpi-value">${rs(d.netSales)}</div>
        <div class="kpi-trend">sales − returns</div>
      </div>

      ${d.gstCollected > 0 ? `
        <div class="kpi">
          <div class="kpi-head">
            <div class="kpi-label">GST Collected</div>
            <div class="kpi-icon" style="background:var(--purple-bg);color:var(--purple)">📋</div>
          </div>
          <div class="kpi-value">${rs(d.gstCollected)}</div>
          <div class="kpi-trend">on sales in range</div>
        </div>
      ` : `
        <div class="kpi">
          <div class="kpi-head">
            <div class="kpi-label">Company Payable</div>
            <div class="kpi-icon" style="background:var(--amber-bg);color:var(--amber)">🏢</div>
          </div>
          <div class="kpi-value">${rs(d.purchaseDue)}</div>
          <div class="kpi-trend">to suppliers</div>
        </div>
      `}
    `;
  }

  /* ══════════════════════════════════════════════════════
     SUMMARY CARDS
     ══════════════════════════════════════════════════════ */

  function rowLine(label, value, color){
    return `
      <div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border)">
        <span style="color:var(--ink-3)">${esc(label)}</span>
        <b style="color:${color || 'var(--ink)'};font-variant-numeric:tabular-nums">${rs(value)}</b>
      </div>
    `;
  }

  function renderSalesSummary(d){
    const customerCount = new Set(d.sales.filter(i => i.party_type === 'customer').map(i => i.party_id)).size;
    const retailerCount = new Set(d.sales.filter(i => i.party_type === 'retailer').map(i => i.party_id)).size;
    const avgTicket = d.sales.length > 0 ? d.totalSales / d.sales.length : 0;

    $('#rp-sales-summary').innerHTML =
      rowLine('Customer sales (' + customerCount + ' customers)', d.customerSales, 'var(--green)') +
      rowLine('Retailer sales (' + retailerCount + ' retailers)', d.retailerSales, 'var(--blue)') +
      rowLine('Total sales', d.totalSales) +
      rowLine('Returns / credits', -d.totalCredits, 'var(--red)') +
      rowLine('Net sales', d.netSales, 'var(--primary-hover)') +
      rowLine('Average invoice', avgTicket, 'var(--ink-2)');
  }

  function renderPurchaseSummary(d){
    const paidBills = d.bills.reduce((s, b) => s + Number(b.paid || 0), 0);

    $('#rp-purchase-summary').innerHTML =
      rowLine('Total purchases', d.totalPurchases) +
      rowLine('Already paid', paidBills, 'var(--green)') +
      rowLine('Outstanding', d.purchaseDue, d.purchaseDue > 0 ? 'var(--red)' : 'var(--green)') +
      rowLine('Number of bills', d.bills.length, 'var(--ink-2)')
        .replace(rs(d.bills.length), d.bills.length);
  }

  function renderPaymentsSummary(d){
    let html = '';
    PAYMENT_MODES.forEach(m => {
      const amt = d.modeTotals[m] || 0;
      if(amt > 0){
        html += rowLine(m.toUpperCase(), amt, 'var(--green)');
      }
    });

    if(!html){
      html = '<div style="text-align:center;color:var(--ink-3);padding:12px 0;font-size:var(--fs-sm)">No payments in range</div>';
    } else {
      html += rowLine('Total received', d.totalReceived, 'var(--primary-hover)');
    }

    $('#rp-payments-summary').innerHTML = html;
  }

  function renderExpensesSummary(d){
    const sorted = Object.entries(d.expCatTotals).sort((a, b) => b[1] - a[1]).slice(0, 6);

    if(!sorted.length){
      $('#rp-expenses-summary').innerHTML = '<div style="text-align:center;color:var(--ink-3);padding:12px 0;font-size:var(--fs-sm)">No expenses in range</div>';
      return;
    }

    let html = sorted.map(([cat, amt]) => rowLine(cat, amt, 'var(--red)')).join('');
    html += rowLine('Total expenses', d.totalExpenses, 'var(--red)');
    $('#rp-expenses-summary').innerHTML = html;
  }

  /* ══════════════════════════════════════════════════════
     INVOICE DETAIL TABLE
     ══════════════════════════════════════════════════════ */

  function renderTable(d){
    const body = $('#rp-body');
    const count = $('#rp-invoice-count');
    if(count) count.textContent = d.invoices.length + ' in range';

    const sorted = d.invoices.slice().sort((a, b) =>
      txDate(b, 'invoice_date').localeCompare(txDate(a, 'invoice_date'))
    );

    if(!sorted.length){
      body.innerHTML = `
        <tr>
          <td colspan="7" style="padding:0">
            ${emptyStateHTML('📄', 'No invoices in range', 'Adjust the dates or pick a different preset.')}
          </td>
        </tr>
      `;
      return;
    }

    body.innerHTML = sorted.map(i => {
      const party = i.party_type === 'retailer'
        ? (DB.retailers || []).find(x => x.id === i.party_id)
        : (DB.customers || []).find(x => x.id === i.party_id);

      const isCredit = Number(i.total) < 0;

      return `
        <tr>
          <td>
            <a href="#/invoice/${i.id}" style="font-weight:600;color:var(--ink)">
              ${esc(i.invoice_no || 'INV')}
            </a>
            ${isCredit ? ' <span class="chip chip-red chip-xs">CREDIT</span>' : ''}
          </td>
          <td>${party ? esc(party.name) : '<span style="color:var(--ink-4)">—</span>'}</td>
          <td>
            <span class="chip ${i.party_type === 'retailer' ? 'chip-blue' : 'chip-green'} chip-xs">
              ${i.party_type === 'retailer' ? 'Retailer' : 'Customer'}
            </span>
          </td>
          <td style="color:var(--ink-3);font-size:var(--fs-sm);white-space:nowrap">${txDT(i, 'invoice_date')}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${isCredit ? 'var(--red)' : 'var(--ink)'}">
            ${rs(i.total)}
          </td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;color:var(--green)">${rs(i.paid)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${Number(i.due) > 0 ? 'var(--red)' : 'var(--ink-3)'}">
            ${Number(i.due) > 0 ? rs(i.due) : '—'}
          </td>
        </tr>
      `;
    }).join('');
  }

  /* ══════════════════════════════════════════════════════
     MASTER LOAD
     ══════════════════════════════════════════════════════ */

  function load(){
    const from = $('#rp-from').value;
    const to   = $('#rp-to').value;

    if(!from || !to){
      toast('Pick both dates', 'error');
      return;
    }
    if(from > to){
      toast('From cannot be after To', 'error');
      return;
    }

    const d = compute(from, to);
    currentData = d;

    const label = $('#rp-range-label');
    if(label) label.textContent = fmtDate(from) + '  →  ' + fmtDate(to);

    renderKPIs(d);
    renderSalesSummary(d);
    renderPurchaseSummary(d);
    renderPaymentsSummary(d);
    renderExpensesSummary(d);
    renderTable(d);
  }

  /* ══════════════════════════════════════════════════════
     PRESETS
     ══════════════════════════════════════════════════════ */

  $$('#rp-presets button').forEach(btn => {
    btn.onclick = () => {
      $$('#rp-presets button').forEach(b => {
        b.classList.toggle('btn-primary', b === btn);
        b.classList.toggle('active', b === btn);
      });
      const bounds = rangeForPreset(btn.dataset.p);
      $('#rp-from').value = bounds.from;
      $('#rp-to').value   = bounds.to;
      load();
    };
  });

  $('#rp-load').onclick = load;

  /* ══════════════════════════════════════════════════════
     PRINT (uses body.print-report from Block 11)
     ══════════════════════════════════════════════════════ */

  $('#rp-print').onclick = () => {
    document.body.classList.remove('print-report');
    document.body.classList.add('print-report');

    let cleaned = false;
    const cleanup = () => {
      if(cleaned) return;
      cleaned = true;
      document.body.classList.remove('print-report');
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    setTimeout(cleanup, 2500);

    setTimeout(() => {
      try { window.print(); }
      catch(e){
        console.error('[print] failed', e);
        toast('Print failed — try Ctrl+P', 'error');
        cleanup();
      }
    }, 60);
  };

  /* ══════════════════════════════════════════════════════
     CSV EXPORT
     ══════════════════════════════════════════════════════ */

  $('#rp-export').onclick = () => {
    if(!currentData){
      toast('Load a range first', 'info');
      return;
    }

    const d = currentData;
    const lines = [];

    /* ─── Section: Summary ────────────────────────────── */
    lines.push(['SUMMARY', '', '', '', '']);
    lines.push(['Period from', txDate({ invoice_date: $('#rp-from').value }, 'invoice_date'), '', '', '']);
    lines.push(['Period to',   txDate({ invoice_date: $('#rp-to').value   }, 'invoice_date'), '', '', '']);
    lines.push(['', '', '', '', '']);
    lines.push(['Total Sales',    Number(d.totalSales).toFixed(2),    '', '', '']);
    lines.push(['Net Sales',      Number(d.netSales).toFixed(2),      '', '', '']);
    lines.push(['Returns',        Number(d.totalCredits).toFixed(2),  '', '', '']);
    lines.push(['Payments Recv.', Number(d.totalReceived).toFixed(2), '', '', '']);
    lines.push(['Purchases',      Number(d.totalPurchases).toFixed(2),'', '', '']);
    lines.push(['Expenses',       Number(d.totalExpenses).toFixed(2), '', '', '']);
    lines.push(['Outstanding',    Number(d.totalDue).toFixed(2),      '', '', '']);
    lines.push(['GST Collected',  Number(d.gstCollected).toFixed(2),  '', '', '']);
    lines.push(['', '', '', '', '']);

    /* ─── Section: Invoices ───────────────────────────── */
    lines.push(['INVOICES', '', '', '', '', '', '']);
    lines.push(['Invoice No', 'Party', 'Type', 'Date', 'Total', 'Paid', 'Due']);

    const sortedInvoices = d.invoices.slice().sort((a, b) =>
      txDate(b, 'invoice_date').localeCompare(txDate(a, 'invoice_date'))
    );
    sortedInvoices.forEach(i => {
      const party = i.party_type === 'retailer'
        ? (DB.retailers || []).find(x => x.id === i.party_id)
        : (DB.customers || []).find(x => x.id === i.party_id);
      lines.push([
        i.invoice_no || '',
        party ? party.name : '',
        i.party_type === 'retailer' ? 'Retailer' : 'Customer',
        txDate(i, 'invoice_date'),
        Number(i.total || 0).toFixed(2),
        Number(i.paid  || 0).toFixed(2),
        Number(i.due   || 0).toFixed(2)
      ]);
    });

    /* ─── Serialize ──────────────────────────────────── */
    const csv = lines.map(row => row.map(cell => {
      const s = String(cell ?? '');
      if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(',')).join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    downloadBlob(blob, 'Report-' + todayStr() + '.csv');
    toast('CSV downloaded', 'success');
  };

  /* Initial load */
  load();
}
