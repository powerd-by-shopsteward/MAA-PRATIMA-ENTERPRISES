  /* ─── Filter + sort ────────────────────────────────────── */
  function filtered(){
    const q       = ($('#pu-search').value || '').toLowerCase().trim();
    const type    = $('#pu-type').value;
    const balance = $('#pu-balance').value;
    const sortBy  = $('#pu-sort').value;

    let arr = list.slice();

    if(q){
      arr = arr.filter(b => {
        const sup = getSupplier(b);
        const hay = ((b.bill_no || '') + ' ' + (sup?.name || '')).toLowerCase();
        return hay.includes(q);
      });
    }

    if(type){
      arr = arr.filter(b => {
        const sup = getSupplier(b);
        return sup && (sup.type || 'company') === type;
      });
    }

    if(balance === 'due'){
      arr = arr.filter(b => (Number(b.total) - Number(b.paid)) > 0);
    }
    if(balance === 'paid'){
      arr = arr.filter(b => (Number(b.total) - Number(b.paid)) <= 0);
    }

    switch(sortBy){
      case 'date-desc':
        arr.sort((a, b) => txDate(b, 'bill_date').localeCompare(txDate(a, 'bill_date')));
        break;
      case 'date':
        arr.sort((a, b) => txDate(a, 'bill_date').localeCompare(txDate(b, 'bill_date')));
        break;
      case 'total-desc':
        arr.sort((a, b) => Number(b.total) - Number(a.total));
        break;
      case 'balance-desc':
        arr.sort((a, b) => (Number(b.total) - Number(b.paid)) - (Number(a.total) - Number(a.paid)));
        break;
    }

    return arr;
  }

  /* ─── Render table ─────────────────────────────────────── */
  function renderTable(){
    const arr = filtered();
    const body = $('#pu-body');

    if(!arr.length){
      body.innerHTML = `
        <tr>
          <td colspan="8" style="padding:0">
            ${emptyStateHTML(
              '📥',
              list.length ? 'No matches' : 'No purchase bills yet',
              list.length
                ? 'Try clearing search or filters.'
                : 'Record what you bought from a company or vendor to add stock.',
              list.length
                ? ''
                : '<button class="btn btn-primary" type="button" onclick="openPurchaseBillForm()">+ New Purchase Bill</button>'
            )}
          </td>
        </tr>
      `;
      return;
    }

    body.innerHTML = arr.map(b => {
      const sup = getSupplier(b);
      const bal = Number(b.total) - Number(b.paid);
      const isVendor = sup && sup.type === 'vendor';

      return `
        <tr>
          <td>
            <button class="btn btn-link" type="button" data-edit="${b.id}" style="padding:0;font-weight:600;color:var(--ink)">
              ${esc(b.bill_no || 'Bill')}
            </button>
          </td>
          <td>
            ${sup
              ? `<a href="#/${isVendor ? 'vendor' : 'company'}/${sup.id}" style="color:var(--ink-2)">${esc(sup.name)}</a>`
              : '<span style="color:var(--ink-4)">—</span>'}
          </td>
          <td>
            ${sup
              ? `<span class="chip ${isVendor ? 'chip-purple' : 'chip-blue'} chip-xs">${isVendor ? 'Vendor' : 'Company'}</span>`
              : '<span class="chip chip-gray chip-xs">—</span>'}
          </td>
          <td style="color:var(--ink-3);font-size:var(--fs-sm)">${txDT(b, 'bill_date')}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${rs(b.total)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;color:var(--green)">${rs(b.paid)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${bal > 0 ? 'var(--red)' : 'var(--ink-3)'}">
            ${bal > 0 ? rs(bal) : '—'}
          </td>
          <td class="td-actions">
            <button class="btn btn-ghost btn-sm" type="button" data-edit="${b.id}">Edit</button>
            <button class="btn btn-ghost btn-sm" type="button" data-del="${b.id}" style="color:var(--red)">Del</button>
          </td>
        </tr>
      `;
    }).join('');

    $$('[data-edit]', body).forEach(btn => {
      btn.onclick = () => {
        const b = (DB.supplier_invoices || []).find(x => x.id === btn.dataset.edit);
        if(!b) return;
        const sup = getSupplier(b);
        if(!sup){
          toast('Supplier missing for this bill', 'error');
          return;
        }
        openPurchaseBillForm(sup, b);
      };
    });

    $$('[data-del]', body).forEach(btn => {
      btn.onclick = () => deletePurchaseBill(btn.dataset.del, false);
    });
  }

  /* ─── Events ───────────────────────────────────────────── */
  $('#pu-search').oninput  = debounce(renderTable, 200);
  $('#pu-type').onchange   = renderTable;
  $('#pu-balance').onchange = renderTable;
  $('#pu-sort').onchange   = renderTable;

  $('#pu-add').onclick = () => openPurchaseBillForm();

  $('#pu-export').onclick = () => exportPurchasesCSV(filtered());

  renderTable();
}

/* ══════════════════════════════════════════════════════════════
   32b — PURCHASE BILL FORM (Fixed Dual-Unit Cost & Delete Bug)
   ══════════════════════════════════════════════════════════════ */
function openPurchaseBillForm(supplier, existing){
  let billLines = existing
    ? (DB.supplier_invoice_items || [])
        .filter(x => x.supplier_invoice_id === existing.id)
        .map(x => {
          const p = (DB.products || []).find(p => p.id === x.product_id);
          return {
            product_id:   x.product_id,
            product_name: x.product_name,
            dual:         !!p?.dual,
            base_unit:    p?.base_unit || null,
            pack_unit:    p?.pack_unit || null,
            pack_size:    Number(p?.pack_size) || 1,
            unit:         x.unit,
            qty:          Number(x.qty) || 0,
            cost:         Number(x.cost) || 0,
            total:        Number(x.total) || 0
          };
        })
    : [];

  const showSupplierPicker = !supplier;
  const b = existing || { bill_no: '', bill_date: todayStr(), tx_time: '', discount: 0, paid: 0, notes: '' };

  openModal(`
    <h2>${existing ? 'Edit Purchase Bill' : 'New Purchase Bill'}</h2>
    <p class="modal-sub">
      ${supplier ? 'From: <b>' + esc(supplier.name) + '</b>' : 'Record what you bought — stock gets added automatically.'}
    </p>

    <form id="pbill-form" class="modal-body" novalidate>
      ${showSupplierPicker ? `
        <div class="field">
          <label class="label">Purchased from <span class="req">*</span></label>
          <div id="pb-supplier-mount"></div>
        </div>
      ` : ''}

           <div class="form-row-2">
        <div class="field">
          <label class="label">Bill number</label>
          <input class="input" type="text" name="bill_no" maxlength="60" value="${esc(b.bill_no || '')}" placeholder="Company's bill no." autofocus>
        </div>
        <div class="field">
          <label class="label">Discount (₹)</label>
          <input class="input" type="number" step="any" min="0" id="pb-disc" name="discount" value="${b.discount || 0}" placeholder="0.00">
        </div>
      </div>

      ${dateTimeFieldHTML(b.bill_date, b.tx_time, 'Bill date')}

      <div class="field">
        <label class="label">Add items</label>
        <div id="pb-prod-mount"></div>
      </div>

      <div id="pb-lines"></div>

      <div class="form-row-2">
        <div class="field">
          <label class="label">Paid now (₹)</label>
          <input class="input" type="number" step="any" min="0" name="paid" value="${b.paid || 0}">
        </div>
        <div class="field">
          <label class="label">Notes</label>
          <input class="input" type="text" name="notes" maxlength="200" value="${esc(b.notes || '')}" placeholder="Optional">
        </div>
      </div>

      <div id="pb-summary" style="background:var(--card-alt);padding:14px;border-radius:var(--r-md);border:1px solid var(--border);font-size:var(--fs-sm);display:flex;flex-direction:column;gap:6px"></div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="pbill-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="pbill-save">${existing ? 'Update' : 'Save'} Bill</button>
      </div>
    </form>
  `, (root) => {
    const form = root.querySelector('#pbill-form');
    const saveBtn = root.querySelector('#pbill-save');
    let selectedSupplier = supplier || null;

    if(showSupplierPicker){
      const supMount = root.querySelector('#pb-supplier-mount');
      supMount.innerHTML = searchSelectHTML('pb-sup-ss', 'Search company or vendor…');
      const supSS = mountSearchSelect(root.querySelector('#pb-sup-ss'), {
        items: (DB.suppliers || []).map(s => supplierToOption(s)),
        allowAdd: true,
        onAdd: () => {
          const wantVendor = confirm('Add a new supplier.\n\nOK → Vendor\nCancel → Company');
          openSupplierForm(null, wantVendor ? 'vendor' : 'company', (newSup) => {
            supSS.setItems((DB.suppliers || []).map(s => supplierToOption(s)));
            setTimeout(() => { supSS.setValue(newSup.id); selectedSupplier = newSup; updateSummary(); }, 80);
          });
        },
        onSelect: (opt) => {
          selectedSupplier = opt ? (DB.suppliers || []).find(x => x.id === opt.id) : null;
        }
      });
    }

    const prodMount = root.querySelector('#pb-prod-mount');
    prodMount.innerHTML = searchSelectHTML('pb-prod-ss', 'Search products to buy…');
    const prodSS = mountSearchSelect(root.querySelector('#pb-prod-ss'), {
      items: (DB.products || []).map(p => productToOption(p)),
      allowAdd: true,
      onAdd: () => {
        openQuickProductForm((newP) => {
          prodSS.setItems((DB.products || []).map(p => productToOption(p)));
          addLine(newP);
          setTimeout(() => prodSS.reset(), 60);
        }, selectedSupplier ? selectedSupplier.id : null);
      },
      onSelect: (opt) => {
        if(!opt) return;
        const p = (DB.products || []).find(x => x.id === opt.id);
        if(!p) return;
        addLine(p);
        setTimeout(() => prodSS.reset(), 60);
      }
    });

    // ✅ FIX: Helper to calculate cost based on unit
    function costForUnit(p, unit) {
      const baseCost = Number(p.cost) || 0;
      if (p.dual && p.pack_unit && unit === p.pack_unit) {
        return round2(baseCost * (Number(p.pack_size) || 1));
      }
      return baseCost;
    }

    function addLine(p){
      let defaultUnit = p.dual ? (p.base_unit || 'piece') : (p.unit || 'piece');
      const cost = costForUnit(p, defaultUnit);
      
      billLines.push({
        product_id: p.id, product_name: p.name, dual: !!p.dual,
        base_unit: p.base_unit || null, pack_unit: p.pack_unit || null,
        pack_size: Number(p.pack_size) || 1, unit: defaultUnit,
        qty: 1, cost: cost, total: cost
      });
      renderLines();
    }

    function renderLines(){
      const box = root.querySelector('#pb-lines');
      if(!billLines.length){
        box.innerHTML = '<div style="padding:20px;text-align:center;color:var(--ink-3);background:var(--card-alt);border-radius:var(--r-md);border:1px dashed var(--border-strong)">No items yet. Search products above to add them.</div>';
        updateSummary(); return;
      }

      box.innerHTML = `
        <div class="tbl-wrap"><table>
          <thead><tr>
            <th style="width:36%">Item</th><th style="width:90px;text-align:right">Qty</th><th style="width:140px">Unit</th><th style="width:110px;text-align:right">Cost ₹</th><th style="text-align:right">Total</th><th style="width:40px"></th>
          </tr></thead>
          <tbody>
            ${billLines.map((l, i) => {
              const unitCell = l.dual
                ? `<select class="input-inline unit" data-i="${i}" data-f="unit">
                     <option value="${esc(l.base_unit)}" ${l.unit === l.base_unit ? 'selected' : ''}>${esc(l.base_unit)}</option>
                     <option value="${esc(l.pack_unit)}" ${l.unit === l.pack_unit ? 'selected' : ''}>${esc(l.pack_unit)} (${fmtNum(l.pack_size)} ${esc(l.base_unit)})</option>
                   </select>`
                : `<span style="font-size:var(--fs-sm);color:var(--ink-3)">${esc(l.unit || '—')}</span>`;
              return `
                <tr>
                  <td><strong>${esc(l.product_name)}</strong>${l.dual ? `<div style="font-size:var(--fs-xs);color:var(--ink-3)">${fmtNum(l.pack_size)} ${esc(l.base_unit)} / ${esc(l.pack_unit)}</div>` : ''}</td>
                  <td><input class="input-inline qty" type="number" step="any" min="0.01" data-i="${i}" data-f="qty" value="${l.qty}"></td>
                  <td>${unitCell}</td>
                  <td><input class="input-inline price" type="number" step="any" min="0" data-i="${i}" data-f="cost" value="${l.cost}" placeholder="0.00"></td>
                  <td style="text-align:right;font-weight:600;">${rs(l.total)}</td>
                  <td><button class="btn btn-ghost btn-sm" type="button" data-del="${i}" style="color:var(--red)">✕</button></td>
                </tr>`;
            }).join('')}
          </tbody>
        </table></div>
      `;

      box.querySelectorAll('input[data-i]').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const i = +e.target.dataset.i; const f = e.target.dataset.f; const v = Number(e.target.value) || 0;
          billLines[i][f] = v;
          billLines[i].total = round2(Number(billLines[i].qty || 0) * Number(billLines[i].cost || 0));
          const totalCell = e.target.closest('tr').querySelector('td:nth-last-child(2)');
          if(totalCell) totalCell.textContent = rs(billLines[i].total);
          updateSummary();
        });
        inp.addEventListener('blur', () => renderLines());
      });

      box.querySelectorAll('select[data-i]').forEach(sel => {
        sel.onchange = (e) => {
          const i = +e.target.dataset.i;
          billLines[i].unit = e.target.value;
          // ✅ FIX: Recalculate cost when unit changes
          const p = DB.products.find(x => x.id === billLines[i].product_id);
          if (p) {
            billLines[i].cost = costForUnit(p, billLines[i].unit);
            billLines[i].total = round2(Number(billLines[i].qty || 0) * Number(billLines[i].cost || 0));
          }
          renderLines();
        };
      });

      // ✅ FIX: Use onmousedown instead of onclick to fire before blur
      box.querySelectorAll('[data-del]').forEach(b => {
        b.onmousedown = (e) => {
          e.preventDefault(); // Prevent focus loss
          billLines.splice(+b.dataset.del, 1);
          renderLines();
        };
      });
      updateSummary();
    }

        function updateSummary(){
      const sumEl = root.querySelector('#pb-summary');
      if(!sumEl) return;
      
      const sub  = billLines.reduce((s, l) => s + Number(l.total || 0), 0);
      const disc = Number(root.querySelector('#pb-disc').value) || 0;
      const total = round2(Math.max(0, sub - disc));
      
      // ✅ FIX: Read the "Paid now" input and calculate Due
      const paidInput = root.querySelector('input[name="paid"]');
      const paid = Number(paidInput ? paidInput.value : 0) || 0;
      const due = round2(Math.max(0, total - paid));

      sumEl.innerHTML = `
        <div style="display:flex;justify-content:space-between"><span style="color:var(--ink-3)">Subtotal</span><b>${rs(sub)}</b></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--ink-3)">Discount</span><b style="color:var(--red)">− ${rs(disc)}</b></div>
        <div style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px solid var(--border)"><b>Total</b><b style="color:var(--primary-hover);font-size:var(--fs-md)">${rs(total)}</b></div>
        <div style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px dashed var(--border)"><span style="color:var(--ink-3)">Paid Now</span><b style="color:var(--green)">${rs(paid)}</b></div>
        <div style="display:flex;justify-content:space-between"><b>Balance Due</b><b style="color:${due > 0 ? 'var(--red)' : 'var(--green)'}">${rs(due)}</b></div>
      `;
    }

    // ✅ FIX: Wire up the event listeners for both Discount and Paid inputs
    root.querySelector('#pb-disc').oninput = updateSummary;
    const paidInput = root.querySelector('input[name="paid"]');
    if (paidInput) {
      paidInput.oninput = updateSummary;
    }
    renderLines();
    root.querySelector('#pbill-cancel').onclick = () => closeModal(root);

    form.onsubmit = async (e) => {
      e.preventDefault();
      if(!selectedSupplier){ toast('Please select a company or vendor', 'error'); return; }
      if(!billLines.length){ toast('Add at least one item', 'error'); return; }
      for(const l of billLines){
        if(!(Number(l.qty) > 0)){ toast('Qty must be > 0 for ' + l.product_name, 'error'); return; }
        if(Number(l.cost) < 0){ toast('Cost cannot be negative for ' + l.product_name, 'error'); return; }
      }
      const dt = readDateTime(form);
      if(!dt) return;
      const fd = new FormData(form);
      const sub  = billLines.reduce((s, l) => s + Number(l.total || 0), 0);
      const disc = Number(fd.get('discount')) || 0;
      const total = round2(Math.max(0, sub - disc));
      const paid  = Number(fd.get('paid')) || 0;
      const header = {
        supplier_id: selectedSupplier.id, bill_no: (fd.get('bill_no') || '').trim(),
        bill_date: dt.date, tx_time: dt.time, subtotal: round2(sub),
        discount: round2(disc), total, paid: round2(paid), notes: (fd.get('notes') || '').trim()
      };
      const itemRowsBase = billLines.map(l => ({
        product_id: l.product_id, product_name: l.product_name,
        unit: l.unit, qty: Number(l.qty), cost: Number(l.cost), total: Number(l.total)
      }));

      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

      if(existing){
        const upd = await sb.from('supplier_invoices').update(header).eq('id', existing.id).select().single();
        if(upd.error){ toast(upd.error.message, 'error'); saveBtn.disabled = false; saveBtn.textContent = 'Update Bill'; return; }
        const oldItems = (DB.supplier_invoice_items || []).filter(x => x.supplier_invoice_id === existing.id);
                for(const oi of oldItems){ await adjustStock(oi.product_id, -purchaseLineBaseQty(oi)); }
        await sb.from('supplier_invoice_items').delete().eq('supplier_invoice_id', existing.id);
        const newRows = itemRowsBase.map(r => ({ ...r, supplier_invoice_id: existing.id }));
        const itIns = await sb.from('supplier_invoice_items').insert(newRows);
        if(itIns.error){ toast('Items save failed: ' + itIns.error.message, 'error'); saveBtn.disabled = false; saveBtn.textContent = 'Update Bill'; return; }
        for(const l of billLines){ await adjustStock(l.product_id, lineDeductBaseQty(l)); }
        await syncDB(); toast('Bill updated — stock adjusted', 'success'); closeModal(root); route(); return;
      }

      const ins = await sb.from('supplier_invoices').insert(header).select().single();
      if(ins.error){ toast(ins.error.message, 'error'); saveBtn.disabled = false; saveBtn.textContent = 'Save Bill'; return; }
      const bill = ins.data;
      const newRows = itemRowsBase.map(r => ({ ...r, supplier_invoice_id: bill.id }));
      const itIns = await sb.from('supplier_invoice_items').insert(newRows);
      if(itIns.error){ await sb.from('supplier_invoices').delete().eq('id', bill.id); toast('Items save failed: ' + itIns.error.message, 'error'); saveBtn.disabled = false; saveBtn.textContent = 'Save Bill'; return; }
      for(const l of billLines){ await adjustStock(l.product_id, lineDeductBaseQty(l)); }
      await syncDB(); toast('Bill saved — stock added', 'success'); closeModal(root); route();
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   32c — DELETE PURCHASE BILL (with stock reversal)
   afterDelete = true → routes to purchases list after success
   ══════════════════════════════════════════════════════════════ */

async function deletePurchaseBill(billId, afterDelete){
  const bill = (DB.supplier_invoices || []).find(x => x.id === billId);
  if(!bill) return;

  const sup = (DB.suppliers || []).find(s => s.id === bill.supplier_id);
  const items = (DB.supplier_invoice_items || []).filter(x => x.supplier_invoice_id === billId);
  const linkedReturns = (DB.returns || []).filter(r => r.direction === 'to_supplier' && r.supplier_id === bill.supplier_id).length;

  let warn = `Delete purchase bill ${bill.bill_no || '(no no.)'}?\n\n`;
  warn += `Supplier: ${sup?.name || '—'}\n`;
  warn += `Total: ${rs(bill.total)}\n`;
  warn += `Items: ${items.length}\n\n`;
  warn += `Stock added by this bill will be REVERSED.`;

  if(linkedReturns){
    warn += `\n\n⚠️ There are ${linkedReturns} return${linkedReturns === 1 ? '' : 's'} to this supplier. They remain unaffected.`;
  }

  if(!confirmDlg(warn, 'Confirm Delete')) return;

   /* Reverse stock */
  for(const it of items){
    await adjustStock(it.product_id, -purchaseLineBaseQty(it));
  }

  const { error } = await sb.from('supplier_invoices').delete().eq('id', billId);
  if(error){
    toast('Delete failed: ' + error.message, 'error');
    return;
  }

  await syncDB();
  toast('Bill deleted — stock reversed', 'success');

  if(afterDelete){
    location.hash = '#/purchases';
  } else {
    route();
  }
}

/* ══════════════════════════════════════════════════════════════
   32d — CSV EXPORT
   ══════════════════════════════════════════════════════════════ */

function exportPurchasesCSV(rows){
  const list = (rows || []).map(b => {
    const sup = (DB.suppliers || []).find(s => s.id === b.supplier_id);
    const bal = Number(b.total) - Number(b.paid);
    return [
      b.bill_no || '',
      sup ? sup.name : '',
      sup ? (sup.type === 'vendor' ? 'Vendor' : 'Company') : '',
      txDate(b, 'bill_date'),
      b.tx_time || '',
      Number(b.subtotal || 0).toFixed(2),
      Number(b.discount || 0).toFixed(2),
      Number(b.total || 0).toFixed(2),
      Number(b.paid || 0).toFixed(2),
      bal.toFixed(2),
      b.notes || ''
    ];
  });

  const header = [
    'Bill No', 'Supplier', 'Type',
    'Date', 'Time',
    'Subtotal', 'Discount', 'Total', 'Paid', 'Balance', 'Notes'
  ];

  const all = [header, ...list];
  const csv = all.map(row => row.map(cell => {
    const s = String(cell ?? '');
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'Purchases-' + todayStr() + '.csv');
  toast('CSV downloaded', 'success');
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 32
   ══════════════════════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════════════════════
   BLOCK 33 — RETURNS MODULE
   Two directions:
     • from_party    → customer / retailer returns goods.
                        Stock goes UP. Credit note invoice created
                        (negative total, RET- prefix).
     • to_supplier   → shop returns goods to a company / vendor.
                        Stock goes DOWN. Supplier payable reduced
                        via a supplier_payment with mode='credit-note'.
   Delete reverses everything safely.
   ══════════════════════════════════════════════════════════════ */

function renderReturns(content){
  if(!content) return;

  /* ══════════════════════════════════════════════════════
     PAGE SHELL (tabs + slot for tab content + recent list)
     ══════════════════════════════════════════════════════ */

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Returns</h1>
        <p>Customer &amp; retailer returns · returns to company or vendor</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="btn-group" id="rt-tabs" style="display:inline-flex">
        <button type="button" class="btn btn-primary active" data-tab="from">From Party</button>
        <button type="button" class="btn" data-tab="to">To Company</button>
      </div>
    </div>

    <div id="rt-panel"></div>

    <div class="card" style="margin-top:16px">
      <div class="card-title">
        Recent returns
        <small id="rt-count"></small>
      </div>
      <div id="rt-list"></div>
    </div>
  `;

  /* ══════════════════════════════════════════════════════
     TAB SWITCHER
     ══════════════════════════════════════════════════════ */

  $$('#rt-tabs button').forEach(btn => {
    btn.onclick = () => {
      $$('#rt-tabs button').forEach(b => {
        b.classList.toggle('btn-primary', b === btn);
        b.classList.toggle('active', b === btn);
      });
      const tab = btn.dataset.tab;
      if(tab === 'from') renderFromParty();
      else               renderToSupplier();
    };
  });

  /* ══════════════════════════════════════════════════════
     TAB A — FROM PARTY (customer / retailer returns)
     ══════════════════════════════════════════════════════ */

  function renderFromParty(){
    const panel = $('#rt-panel');
    panel.innerHTML = `
      <div class="card">
        <div class="card-title">Record Return from Customer / Retailer</div>

        <form id="rt-from-form" class="modal-body" novalidate>
          ${dateTimeFieldHTML(null, '', 'Return date')}

          <div class="field">
            <label class="label">Original invoice <span class="req">*</span></label>
            <div id="rt-inv-mount"></div>
            <div class="field-hint">Search the invoice this return belongs to.</div>
          </div>

          <div id="rt-from-lines"></div>

          <div id="rt-from-fields" style="display:none;flex-direction:column;gap:12px">
            <div class="form-row-3">
              <div class="field">
                <label class="label">Return qty <span class="req">*</span></label>
                <input class="input" type="number" step="any" min="0.01" id="rt-qty" value="1">
              </div>
              <div class="field">
                <label class="label">Refund amount (₹) <span class="req">*</span></label>
                <input class="input" type="number" step="any" min="0.01" id="rt-amt" value="0">
              </div>
              <div class="field">
                <label class="label">Reason</label>
                <input class="input" type="text" id="rt-reason" maxlength="160" placeholder="Damaged, wrong item, etc.">
              </div>
            </div>

            <div style="font-size:var(--fs-xs);color:var(--ink-3);padding:4px 0" id="rt-hint"></div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-primary" id="rt-from-submit" disabled>Record Return</button>
          </div>
        </form>
      </div>
    `;

    const invMount = $('#rt-inv-mount', panel);
    invMount.innerHTML = searchSelectHTML('rt-inv-ss', 'Search invoice by no. or party…');

    let selectedInvoice = null;

    const invSS = mountSearchSelect($('#rt-inv-ss', panel), {
      items: (DB.invoices || []).map(invoiceToOption),
      onSelect: (opt) => {
        selectedInvoice = opt ? (DB.invoices || []).find(i => i.id === opt.id) : null;
        renderLinePicker();
      }
    });

    /* ─── Render the item-picker inside an invoice ──────── */
    function renderLinePicker(){
      const box      = $('#rt-from-lines', panel);
      const fieldsBox = $('#rt-from-fields', panel);
      const submitBtn = $('#rt-from-submit', panel);

      if(!selectedInvoice){
        box.innerHTML = '';
        fieldsBox.style.display = 'none';
        submitBtn.disabled = true;
        return;
      }

      const items = (DB.invoice_items || []).filter(i => i.invoice_id === selectedInvoice.id);
      if(!items.length){
        box.innerHTML = '<p style="color:var(--ink-3);font-size:var(--fs-sm)">No items on this invoice.</p>';
        fieldsBox.style.display = 'none';
        submitBtn.disabled = true;
        return;
      }

      box.innerHTML = `
        <label class="label" style="margin-top:8px">Select item <span class="req">*</span></label>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:40px"></th>
                <th>Item</th>
                <th style="text-align:right">Qty</th>
                <th style="text-align:right">Rate</th>
                <th style="text-align:right">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(it => `
                <tr>
                  <td>
                    <input type="radio" name="rt-line" value="${it.id}"
                      data-pid="${it.product_id || ''}"
                      data-name="${esc(it.product_name)}"
                      data-unit="${esc(it.unit || '')}"
                      data-price="${it.price}"
                      data-qty="${it.qty}"
                      data-pack="${it.pack_size || 1}"
                      data-punit="${esc(it.pack_unit || '')}"
                      data-bunit="${esc(it.base_unit || '')}"
                      data-dual="${it.dual ? '1' : '0'}">
                  </td>
                  <td>${esc(productLineLabel(it))}</td>
                  <td style="text-align:right">${fmtNum(it.qty)}</td>
                  <td style="text-align:right">${rs(it.price)}</td>
                  <td style="text-align:right">${rs(it.total)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      fieldsBox.style.display = 'flex';
      submitBtn.disabled = false;

      /* Default qty + amount from the invoice line */
      const qtyEl    = $('#rt-qty', panel);
      const amtEl    = $('#rt-amt', panel);
      const hintEl   = $('#rt-hint', panel);

      qtyEl.value = 1;
      amtEl.value = 0;

      function updateHint(){
        const radio = panel.querySelector('input[name="rt-line"]:checked');
        if(!radio){ hintEl.textContent = ''; return; }
        const price    = Number(radio.dataset.price) || 0;
        const invQty   = Number(radio.dataset.qty) || 0;
        const qty      = Number(qtyEl.value) || 0;
        const maxQty   = invQty;
        const isDual   = radio.dataset.dual === '1';
        const unit     = radio.dataset.unit || '';
        const pUnit    = radio.dataset.punit || '';
        const bUnit    = radio.dataset.bunit || '';
        const packSize = Number(radio.dataset.pack) || 1;

        let unitLabel = unit;
        let totalBaseQty = qty;
        if(isDual && unit === pUnit){
          totalBaseQty = qty * packSize;
        }

        hintEl.textContent =
          `Max return qty: ${fmtNum(maxQty)} ${unitLabel}. ` +
          `Adding back ${fmtNum(totalBaseQty)} ${bUnit} to stock.`;
      }

      panel.querySelectorAll('input[name="rt-line"]').forEach(r => {
        r.onchange = (e) => {
          const price = Number(e.target.dataset.price) || 0;
          qtyEl.value = 1;
          amtEl.value = price.toFixed(2);
          updateHint();
        };
      });

      qtyEl.oninput = () => {
        const radio = panel.querySelector('input[name="rt-line"]:checked');
        if(!radio) return;
        const price = Number(radio.dataset.price) || 0;
        amtEl.value = (Number(qtyEl.value) || 0) * price;
        updateHint();
      };

      updateHint();
    }

    /* ─── Submit ────────────────────────────────────────── */
    const form = $('#rt-from-form', panel);
    form.onsubmit = async (e) => {
      e.preventDefault();
      if(!selectedInvoice){ toast('Select an invoice', 'error'); return; }

      const radio = panel.querySelector('input[name="rt-line"]:checked');
      if(!radio){ toast('Select an item', 'error'); return; }

      const dt = readDateTime(form);
      if(!dt) return;

      const qty    = Number($('#rt-qty', panel).value) || 0;
      const amount = Number($('#rt-amt', panel).value) || 0;
      const reason = ($('#rt-reason', panel).value || '').trim();

      if(qty <= 0){ toast('Qty must be greater than 0', 'error'); return; }
      if(amount <= 0){ toast('Refund must be greater than 0', 'error'); return; }

      const invQty = Number(radio.dataset.qty) || 0;
      if(qty > invQty){
        toast('Cannot return more than invoiced (' + fmtNum(invQty) + ')', 'error');
        return;
      }

      const productId  = radio.dataset.pid || null;
      const unit       = radio.dataset.unit || '';
      const pUnit      = radio.dataset.punit || '';
      const packSize   = Number(radio.dataset.pack) || 1;
      const isDual     = radio.dataset.dual === '1';
      const baseQty    = (isDual && unit === pUnit) ? qty * packSize : qty;

      const btn = $('#rt-from-submit', panel);
      btn.disabled = true;
      btn.textContent = 'Saving…';

      /* 1) Insert the return */
      const { data: retRow, error: retErr } = await sb
        .from('returns')
        .insert({
          direction:    'from_party',
          invoice_id:   selectedInvoice.id,
          party_id:     selectedInvoice.party_id,
          party_type:   selectedInvoice.party_type,
          product_id:   productId,
          product_name: radio.dataset.name,
          unit,
          qty,
          base_qty:     baseQty,
          amount,
          reason,
          return_date:  dt.date,
          tx_time:      dt.time
        })
        .select()
        .single();

      if(retErr){
        toast(retErr.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Record Return';
        return;
      }

      /* 2) Stock goes UP (goods came back) */
      if(productId){
        await adjustStock(productId, baseQty);
      }

      /* 3) Create a credit-note invoice with negative total */
      const creditNo = RETURN_PREFIX + String(Date.now()).slice(-8);

      const creditData = {
        invoice_no:   creditNo,
        party_id:     selectedInvoice.party_id,
        party_type:   selectedInvoice.party_type,
        subtotal:     -amount,
        discount:     0,
        total:        -amount,
        paid:         0,
        due:          -amount,
        notes:        'Return: ' + (reason || 'no reason') + ' — original invoice ' + (selectedInvoice.invoice_no || ''),
        invoice_date: dt.date,
        tx_time:      dt.time,
        gst_enabled:  false,
        gst_rate:     0,
        gst_amount:   0
      };

      const { error: credErr } = await sb.from('invoices').insert(creditData);
      if(credErr){
        /* Roll back the return row */
        await sb.from('returns').delete().eq('id', retRow.id);
        toast('Credit note save failed: ' + credErr.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Record Return';
        return;
      }

      /* 4) Full sync so due / stock / KPIs are consistent */
      await syncDB();
      toast('Return recorded — stock restored, party credited', 'success');
      route();
    };
  }

  /* ══════════════════════════════════════════════════════
     TAB B — TO SUPPLIER (returns to a company / vendor)
     ══════════════════════════════════════════════════════ */

  function renderToSupplier(){
    const panel = $('#rt-panel');
    panel.innerHTML = `
      <div class="card">
        <div class="card-title">Record Return to Company / Vendor</div>

        <form id="rt-to-form" class="modal-body" novalidate>
          ${dateTimeFieldHTML(null, '', 'Return date')}

          <div class="field">
            <label class="label">Company / Vendor <span class="req">*</span></label>
            <div id="rt-sup-mount"></div>
          </div>

          <div class="field">
            <label class="label">Product <span class="req">*</span></label>
            <div id="rt-prod-mount"></div>
          </div>

          <div class="form-row-3">
            <div class="field">
              <label class="label">Qty <span class="req">*</span></label>
              <input class="input" type="number" step="any" min="0.01" id="rt-to-qty" value="1">
              <div class="field-hint" id="rt-to-hint"></div>
            </div>
            <div class="field">
              <label class="label">Amount (₹) <span class="req">*</span></label>
              <input class="input" type="number" step="any" min="0" id="rt-to-amt" value="0">
            </div>
            <div class="field">
              <label class="label">Reason</label>
              <input class="input" type="text" id="rt-to-reason" maxlength="160" placeholder="Expired, damaged, etc.">
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-primary" id="rt-to-submit">Record Return to Company</button>
          </div>
        </form>
      </div>
    `;

    /* ─── Supplier picker ───────────────────────────────── */
    const supMount = $('#rt-sup-mount', panel);
    supMount.innerHTML = searchSelectHTML('rt-sup-ss', 'Search company or vendor…');

    const supSS = mountSearchSelect($('#rt-sup-ss', panel), {
      items: (DB.suppliers || []).map(s => supplierToOption(s))
    });

    /* ─── Product picker ────────────────────────────────── */
    const prodMount = $('#rt-prod-mount', panel);
    prodMount.innerHTML = searchSelectHTML('rt-prod-ss', 'Search product…');

    const prodSS = mountSearchSelect($('#rt-prod-ss', panel), {
      items: (DB.products || []).map(p => productToOption(p)),
      onSelect: (opt) => {
        if(!opt) return;
        const p = (DB.products || []).find(x => x.id === opt.id);
        if(!p) return;
        /* Default refund = cost price for that base unit */
        $('#rt-to-amt', panel).value = (Number(p.cost) || 0).toFixed(2);
        updateToHint();
      }
    });

    function updateToHint(){
      const prodId = prodSS.getValue();
      const qty    = Number($('#rt-to-qty', panel).value) || 0;
      const hint   = $('#rt-to-hint', panel);
      if(!prodId){ hint.textContent = ''; return; }
      const p = (DB.products || []).find(x => x.id === prodId);
      if(!p){ hint.textContent = ''; return; }
      const baseUnit = p.dual ? (p.base_unit || 'piece') : (p.unit || 'piece');
      hint.textContent = 'Available: ' + fmtNum(p.stock) + ' ' + baseUnit;
    }

    $('#rt-to-qty', panel).oninput = updateToHint;

    /* ─── Submit ────────────────────────────────────────── */
    const form = $('#rt-to-form', panel);
    form.onsubmit = async (e) => {
      e.preventDefault();

      const supId  = supSS.getValue();
      const prodId = prodSS.getValue();
      if(!supId){ toast('Select a company or vendor', 'error'); return; }
      if(!prodId){ toast('Select a product', 'error'); return; }

      const dt = readDateTime(form);
      if(!dt) return;

      const qty    = Number($('#rt-to-qty', panel).value) || 0;
      const amount = Number($('#rt-to-amt', panel).value) || 0;
      const reason = ($('#rt-to-reason', panel).value || '').trim();

      if(qty <= 0){ toast('Qty must be greater than 0', 'error'); return; }
      if(amount < 0){ toast('Amount cannot be negative', 'error'); return; }

      const p = (DB.products || []).find(x => x.id === prodId);
      if(!p){ toast('Product not found', 'error'); return; }
      if(Number(p.stock) < qty){
        toast('Not enough stock (' + fmtNum(p.stock) + ' available)', 'error');
        return;
      }

      const btn = $('#rt-to-submit', panel);
      btn.disabled = true;
      btn.textContent = 'Saving…';

      /* 1) Insert return row */
      const { data: retRow, error: retErr } = await sb
        .from('returns')
        .insert({
          direction:    'to_supplier',
          supplier_id:  supId,
          product_id:   prodId,
          product_name: p.name,
          unit:         p.dual ? p.base_unit : p.unit,
          qty,
          base_qty:     qty,
          amount,
          reason,
          return_date:  dt.date,
          tx_time:      dt.time
        })
        .select()
        .single();

      if(retErr){
        toast(retErr.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Record Return to Company';
        return;
      }

      /* 2) Stock DOWN (goods went out) */
      await adjustStock(prodId, -qty);

      /* 3) Reduce payable via a credit-note supplier_payment */
      if(amount > 0){
        const { error: cpe } = await sb.from('supplier_payments').insert({
          supplier_id:  supId,
          amount,
          mode:         'credit-note',
          notes:        'Return: ' + p.name + ' x ' + fmtNum(qty) + (reason ? ' — ' + reason : ''),
          payment_date: dt.date,
          tx_time:      dt.time
        });

        if(cpe){
          /* Roll back the return + stock */
          await sb.from('returns').delete().eq('id', retRow.id);
          await adjustStock(prodId, qty);
          toast('Payable update failed: ' + cpe.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Record Return to Company';
          return;
        }
      }

      await syncDB();
      toast('Return recorded — stock reduced, payable adjusted', 'success');
      route();
    };
  }

  /* ══════════════════════════════════════════════════════
     RECENT RETURNS LIST

    box.innerHTML = `

        <table>

            <tr>
              <th>Date</th>
              <th>Direction</th>
              <th>Product</th>
              <th>Counterparty</th>

              const counterparty = fromParty

                : (supplierRow ? esc(supplierRow.name) : '<span style="color:var(--ink-4)">—</span>');

                  <td>${esc(r.product_name || '—')}</td>
                  <td style="color:var(--ink-2)">${counterparty}</td>

                  <td style="color:var(--ink-3);font-size:var(--fs-sm)">${esc(r.reason || '—')}</td>

    });

  /* ══════════════════════════════════════════════════════
     DELETE RETURN — reverses stock + removes credit note
     ══════════════════════════════════════════════════════ */

  async function deleteReturn(id){
    const r = (DB.returns || []).find(x => x.id === id);
    if(!r) return;

    if(!confirmDlg(
      'Delete this return?\n\nStock and credit will be reversed.',
      'Confirm Delete'
    )) return;

    if(r.direction === 'from_party'){
      /* Reverse stock: put stock DOWN by base_qty */
      if(r.product_id){
        await adjustStock(r.product_id, -Number(r.base_qty || r.qty || 0));
      }

      /* Remove the auto-generated credit note.
         Match by: same party, RET- prefix, negative total, amount matches */
     const candidates = (DB.invoices || []).filter(i =>
  i.party_id    === r.party_id &&
  i.party_type  === r.party_type &&
  String(i.invoice_no || '').startsWith(RETURN_PREFIX) && // ✅ uses the constant
  Number(i.total) < 0 &&
  Math.abs(Number(i.total)) === Math.abs(Number(r.amount))
);

      if(candidates.length){
        candidates.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
        await sb.from('invoices').delete().eq('id', candidates[0].id);
      }
    } else {
      /* To supplier: reverse stock — put stock UP by base_qty */
      if(r.product_id){
        await adjustStock(r.product_id, Number(r.base_qty || r.qty || 0));
      }

      /* Remove the matching credit-note supplier payment */
      const candidates = (DB.supplier_payments || []).filter(p =>
        p.supplier_id === r.supplier_id &&
        p.mode === 'credit-note' &&
        Number(p.amount) === Number(r.amount)
      );

      if(candidates.length){
        candidates.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
        await sb.from('supplier_payments').delete().eq('id', candidates[0].id);
      }
    }

    /* Finally delete the return row */
    const { error } = await sb.from('returns').delete().eq('id', r.id);
    if(error){
      toast('Delete failed: ' + error.message, 'error');
      return;
    }

    await syncDB();
    toast('Return deleted — reversed', 'success');
    route();
  }

  /* ══════════════════════════════════════════════════════
     INITIAL RENDER
     ══════════════════════════════════════════════════════ */

  renderFromParty();
  renderRecent();
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 34 — PAYMENTS LIST
   Unified view of all customer + retailer payments received.
   The payment *form* itself lives in Block 29 (openPartyPaymentForm).
   This block is the list + filters + analytics + export.
   ══════════════════════════════════════════════════════════════ */

function renderPayments(content){
  if(!content) return;

  const list = DB.payments || [];
  const today = todayStr();
  const monthStart = firstOfMonthStr();
  const yearStart  = firstOfYearStr();

  /* ─── KPIs (all-time) ────────────────────────────────── */
  const totalAll   = list.reduce((s, p) => s + Number(p.amount || 0), 0);
  const totalMonth = list
    .filter(p => txDate(p, 'payment_date') >= monthStart)
    .reduce((s, p) => s + Number(p.amount || 0), 0);
  const totalYear  = list
    .filter(p => txDate(p, 'payment_date') >= yearStart)
    .reduce((s, p) => s + Number(p.amount || 0), 0);
  const totalToday = list
    .filter(p => txDate(p, 'payment_date') === today)
    .reduce((s, p) => s + Number(p.amount || 0), 0);

  /* Breakdown by mode (all-time) */
  const modeTotals = {};
  PAYMENT_MODES.forEach(m => { modeTotals[m] = 0; });
  list.forEach(p => {
    const m = p.mode || 'cash';

     ══════════════════════════════════════════════════════ */

  function filtered(){
    const q      = ($('#pay-search').value || '').toLowerCase().trim();
    const type   = $('#pay-type').value;
    const mode   = $('#pay-mode').value;
    const range  = $('#pay-range').value;
    const sortBy = $('#pay-sort').value;

    let arr = list.slice();

    /* Date range */
    let fromDate = null;
    let toDate   = null;
    if(range === 'today'){ fromDate = toDate = today; }
    else if(range === 'month'){ fromDate = monthStart; toDate = today; }
    else if(range === 'year'){ fromDate = yearStart;  toDate = today; }
    else if(range === 'custom'){
      fromDate = $('#pay-from').value || '0000-01-01';
      toDate   = $('#pay-to').value   || '9999-12-31';
    }

    if(fromDate && toDate){
      arr = arr.filter(p => {
        const d = txDate(p, 'payment_date');
        return d >= fromDate && d <= toDate;
      });
    }

    if(type) arr = arr.filter(p => p.party_type === type);
    if(mode) arr = arr.filter(p => (p.mode || 'cash') === mode);

    if(q){
      arr = arr.filter(p => {
        const party = getParty(p);
        const hay = ((party?.name || '') + ' ' + (party?.phone || '') + ' ' + (p.notes || '')).toLowerCase();
        return hay.includes(q);
      });
    }

    switch(sortBy){
      case 'date-desc':
        arr.sort((a, b) => txDate(b, 'payment_date').localeCompare(txDate(a, 'payment_date')));
        break;
      case 'date':
        arr.sort((a, b) => txDate(a, 'payment_date').localeCompare(txDate(b, 'payment_date')));
        break;
      case 'amount-desc':
        arr.sort((a, b) => Number(b.amount) - Number(a.amount));
        break;
      case 'amount':
        arr.sort((a, b) => Number(a.amount) - Number(b.amount));
        break;
    }

    return arr;
  }

/* ══════════════════════════════════════════════════════════════
   34b — CSV EXPORT
   ══════════════════════════════════════════════════════════════ */

function exportPaymentsCSV(rows){
  const list = (rows || []).map(p => {
    const party = p.party_type === 'retailer'
      ? (DB.retailers || []).find(x => x.id === p.party_id)
      : (DB.customers || []).find(x => x.id === p.party_id);

    return [
      txDate(p, 'payment_date'),
      p.tx_time || '',
      party ? party.name : '',
      party ? (party.phone || '') : '',
      p.party_type === 'retailer' ? 'Retailer' : 'Customer',
      (p.mode || 'cash'),
      Number(p.amount || 0).toFixed(2),
      p.notes || ''
    ];
  });

  const header = [
    'Date', 'Time', 'Party', 'Phone', 'Type', 'Mode', 'Amount', 'Notes'
  ];

  const all = [header, ...list];
  const csv = all.map(row => row.map(cell => {
    const s = String(cell ?? '');
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'Payments-' + todayStr() + '.csv');
  toast('CSV downloaded', 'success');
}

    const { from, to } = currentRange();

    let arr = list.slice();

    /* Range */
    arr = arr.filter(e => {
      const d = txDate(e, 'expense_date');
      return d >= from && d <= to;
    });

    /* Category */
    if(cat) arr = arr.filter(e => e.category === cat);

    /* Search */
    if(q){
      arr = arr.filter(e => {
        const hay = ((e.category || '') + ' ' + (e.notes || '')).toLowerCase();
        return hay.includes(q);
      });
    }

    /* Sort */
    switch(sortBy){
      case 'date-desc':
        arr.sort((a, b) => txDate(b, 'expense_date').localeCompare(txDate(a, 'expense_date')));
        break;
      case 'date':
        arr.sort((a, b) => txDate(a, 'expense_date').localeCompare(txDate(b, 'expense_date')));
        break;
      case 'amount-desc':
        arr.sort((a, b) => Number(b.amount) - Number(a.amount));
        break;
      case 'amount':
        arr.sort((a, b) => Number(a.amount) - Number(b.amount));
        break;
    }

    return arr;
  }

  /* ══════════════════════════════════════════════════════
     RENDER TABLE
     ══════════════════════════════════════════════════════ */

  function renderTable(){
    const arr = filtered();
    const total = arr.reduce((s, e) => s + Number(e.amount || 0), 0);

    /* Update filtered KPI */
    const kpiTotal = $('#ex-filtered-total');
    if(kpiTotal) kpiTotal.textContent = rs(total);
    const kpiCount = $('#ex-filtered-count');
    if(kpiCount) kpiCount.textContent = arr.length + ' entr' + (arr.length === 1 ? 'y' : 'ies');

    const body = $('#ex-body');
    if(!arr.length){
      body.innerHTML = `
        <tr>
          <td colspan="5" style="padding:0">
            ${emptyStateHTML(
              '💸',
              list.length ? 'No expenses in range' : 'No expenses yet',
              list.length
                ? 'Try a different range or clear filters.'
                : 'Record shop expenses like rent, electricity, or transport.',
              list.length
                ? ''
                : '<button class="btn btn-primary" type="button" onclick="openExpenseForm()">+ Add Expense</button>'
            )}
          </td>
        </tr>
      `;
      renderCategoryBreakdown(arr);
      return;
    }

    body.innerHTML = arr.map(e => `
      <tr>
        <td style="color:var(--ink-3);font-size:var(--fs-sm);white-space:nowrap">
          ${txDT(e, 'expense_date')}
        </td>
        <td>
          <span class="chip chip-gray chip-xs">${esc(e.category || '—')}</span>
        </td>
        <td style="color:var(--ink-2);font-size:var(--fs-sm)">
          ${esc(e.notes || '—')}
        </td>
        <td style="text-align:right;font-weight:600;color:var(--red);font-variant-numeric:tabular-nums">
          ${rs(e.amount)}
        </td>
        <td class="td-actions">
          <button class="btn btn-ghost btn-sm" type="button" data-edit="${e.id}">Edit</button>
          <button class="btn btn-ghost btn-sm" type="button" data-del="${e.id}" style="color:var(--red)">Del</button>
        </td>
      </tr>
    `).join('');

    $$('[data-edit]', body).forEach(b => {
      b.onclick = () => {
        const e = DB.expenses.find(x => x.id === b.dataset.edit);
        if(e) openExpenseForm(e);
      };
    });

    $$('[data-del]', body).forEach(b => {
      b.onclick = () => deleteExpense(b.dataset.del);
    });

    renderCategoryBreakdown(arr);
  }

  /* ══════════════════════════════════════════════════════
     CATEGORY BREAKDOWN
     ══════════════════════════════════════════════════════ */

  function renderCategoryBreakdown(arr){
    const wrap = $('#ex-categories');
    const rangeLabel = $('#ex-cat-range-label');
    if(!wrap) return;

    const { label } = currentRange();
    if(rangeLabel) rangeLabel.textContent = label;

    /* Group by category */
    const byCat = {};
    arr.forEach(e => {
      const c = e.category || 'Uncategorised';
      byCat[c] = (byCat[c] || 0) + Number(e.amount || 0);
    });

    const sorted = Object.entries(byCat)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 6);

    if(!sorted.length){
      wrap.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--ink-3);font-size:var(--fs-sm);padding:16px 0">No data in range</div>';
      return;
    }

    const total = arr.reduce((s, e) => s + Number(e.amount || 0), 0);

    wrap.innerHTML = sorted.map(([cat, amt]) => {
      const pct = total > 0 ? (amt / total) * 100 : 0;
      return `
        <div class="mini-stat">
          <div class="lbl">${esc(cat)}</div>
          <div class="val" style="color:var(--red);font-size:var(--fs-base)">${rs(amt)}</div>
          <div style="margin-top:6px;height:4px;background:var(--bg-deep);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:var(--primary);border-radius:2px"></div>
          </div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:4px">${pct.toFixed(1)}%</div>
        </div>
      `;
    }).join('');
  }

  /* ══════════════════════════════════════════════════════
     DELETE
     ══════════════════════════════════════════════════════ */

  async function deleteExpense(id){
    const e = list.find(x => x.id === id);
    if(!e) return;

    if(!confirmDlg(
      `Delete this expense?\n\nCategory: ${e.category || '—'}\nAmount: ${rs(e.amount)}\nDate: ${txDT(e, 'expense_date')}`,
      'Confirm Delete'
    )) return;

    const { error } = await sb.from('expenses').delete().eq('id', id);
    if(error){
      toast(error.message, 'error');
      return;
    }

    dbRemoveLocal('expenses', id);
    toast('Expense deleted', 'success');
    route();
  }

  /* ══════════════════════════════════════════════════════
     EVENTS
     ══════════════════════════════════════════════════════ */

  $('#ex-search').oninput   = debounce(renderTable, 200);
  $('#ex-category').onchange = renderTable;
  $('#ex-sort').onchange    = renderTable;
  $('#ex-range').onchange   = () => {
    const custom = $('#ex-range').value === 'custom';
    $('#ex-custom-range').style.display = custom ? 'block' : 'none';
    renderTable();
  };
  $('#ex-from').onchange = renderTable;
  $('#ex-to').onchange   = renderTable;

  $('#ex-add').onclick = () => openExpenseForm();

  $('#ex-export').onclick = () => exportExpensesCSV(filtered());

  renderTable();
}

/* ══════════════════════════════════════════════════════════════
   35b — ADD / EDIT EXPENSE MODAL
   ══════════════════════════════════════════════════════════════ */

function openExpenseForm(existing){
  const e = existing || {
    category:     '',
    amount:       '',
    notes:        '',
    expense_date: todayStr(),
    tx_time:      ''
  };

  /* Common categories offered as quick-pick chips */
  const QUICK_CATS = [
    'Rent', 'Electricity', 'Water', 'Internet',
    'Transport', 'Wages', 'Packaging', 'Marketing',
    'Repairs', 'Food', 'Stationery', 'Misc'
  ];

  openModal(`
    <h2>${existing ? 'Edit' : 'Add'} Expense</h2>
    <p class="modal-sub">Record an operating cost for the shop.</p>

    <form id="ef" class="modal-body" novalidate>
      ${dateTimeFieldHTML(e.expense_date || todayStr(), e.tx_time || '', 'Expense date')}

      <div class="field">
        <label class="label">Category <span class="req">*</span></label>
        <input class="input" type="text" name="category" maxlength="60" required
          value="${esc(e.category || '')}" placeholder="e.g. Electricity" autofocus>
        <div class="field-hint" style="margin-top:6px">Quick pick:</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px" id="eq-cats">
          ${QUICK_CATS.map(c => `
            <button type="button" class="chip chip-gray" data-cat="${esc(c)}" style="cursor:pointer;border:1px solid var(--border)">
              ${esc(c)}
            </button>
          `).join('')}
        </div>
      </div>

      <div class="field">
        <label class="label">Amount (₹) <span class="req">*</span></label>
        <input class="input" type="number" step="any" min="0.01" name="amount" required
          value="${existing ? e.amount : ''}" placeholder="0.00">
      </div>

      <div class="field">
        <label class="label">Notes</label>
        <input class="input" type="text" name="notes" maxlength="200"
          value="${esc(e.notes || '')}" placeholder="Optional detail">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="ef-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="ef-save">
          ${existing ? 'Update' : 'Save'} Expense
        </button>
      </div>
    </form>
  `, (root) => {
    const form    = root.querySelector('#ef');
    const catEl   = form.querySelector('input[name="category"]');
    const amtEl   = form.querySelector('input[name="amount"]');
    const saveBtn = root.querySelector('#ef-save');

    /* Quick-pick chips */
    root.querySelectorAll('#eq-cats button').forEach(btn => {
      btn.onclick = () => {
        catEl.value = btn.dataset.cat;
        amtEl.focus();
      };
    });

    root.querySelector('#ef-cancel').onclick = () => closeModal(root);

    form.onsubmit = async (ev) => {
      ev.preventDefault();

      const cat = (catEl.value || '').trim();
      if(!cat){
        toast('Enter a category', 'error');
        catEl.focus();
        return;
      }

      const amt = Number(amtEl.value) || 0;
      if(amt <= 0){
        toast('Amount must be greater than 0', 'error');
        amtEl.focus();
        return;
      }

      const dt = readDateTime(form);
      if(!dt) return;

      const fd = new FormData(form);
      const data = {
        category:     cat,
        amount:       round2(amt),
        notes:        (fd.get('notes') || '').trim(),
        expense_date: dt.date,
        tx_time:      dt.time
      };

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';

      let res;
      if(existing){
        res = await sb.from('expenses').update(data).eq('id', existing.id).select().single();
      } else {
        res = await sb.from('expenses').insert(data).select().single();
      }

      if(res.error){
        toast(res.error.message, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = (existing ? 'Update' : 'Save') + ' Expense';
        return;
      }

      /* Update local DB instantly */
      if(existing){
        dbUpsertLocal('expenses', res.data);
      } else {
        DB.expenses = [res.data, ...(DB.expenses || [])];
      }

      toast('Expense ' + (existing ? 'updated' : 'added'), 'success');
      closeModal(root);
      route();
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   35c — CSV EXPORT
   ══════════════════════════════════════════════════════════════ */

function exportExpensesCSV(rows){
  const list = (rows || []).map(e => [
    txDate(e, 'expense_date'),
    e.tx_time || '',
    e.category || '',
    Number(e.amount || 0).toFixed(2),
    e.notes || ''
  ]);

  const header = ['Date', 'Time', 'Category', 'Amount', 'Notes'];
  const all = [header, ...list];

  const csv = all.map(row => row.map(cell => {
    const s = String(cell ?? '');
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'Expenses-' + todayStr() + '.csv');
  toast('CSV downloaded', 'success');
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 36 — ANALYTICS
   Business insights with 5 interactive charts.
   Range-aware; all charts redraw on range change.
   ══════════════════════════════════════════════════════════════ */

function renderAnalytics(content){
  if(!content) return;

  /* ══════════════════════════════════════════════════════
     PAGE SHELL
     ══════════════════════════════════════════════════════ */

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Analytics</h1>
        <p>Trends, growth, and top performers</p>
      </div>
      <div class="page-actions">
        <div class="btn-group" id="an-range" style="display:inline-flex">
          <button type="button" class="btn" data-r="7">7D</button>
          <button type="button" class="btn btn-primary active" data-r="30">30D</button>
          <button type="button" class="btn" data-r="90">90D</button>
          <button type="button" class="btn" data-r="all">All</button>
        </div>
      </div>
    </div>

    <!-- KPI row -->
    <div class="grid-4" id="an-kpis" style="margin-bottom:16px"></div>

    <!-- Trend chart -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">
        Sales vs Purchases
        <small id="an-trend-label">last 30 days</small>
      </div>
      <div style="position:relative;height:320px">
        <canvas id="an-ch-trend"></canvas>
      </div>
    </div>

    <!-- Monthly growth + Paid vs Due -->
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">Monthly Growth <small>sales &amp; purchases</small></div>
        <div style="position:relative;height:280px">
          <canvas id="an-ch-month"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Payments: Paid vs Outstanding</div>
        <div style="position:relative;height:280px">
          <canvas id="an-ch-paid"></canvas>
        </div>
      </div>
    </div>

    <!-- Top products + Top parties -->
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">
          Top Products
          <small>by revenue</small>
        </div>
        <div style="position:relative;height:320px">
          <canvas id="an-ch-prod"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          Top Parties
          <small>by billed amount</small>
        </div>
        <div style="position:relative;height:320px">
          <canvas id="an-ch-party"></canvas>
        </div>
      </div>
    </div>

    <!-- Category breakdown -->
    <div class="card">
      <div class="card-title">
        Category Breakdown
        <small id="an-cat-label">last 30 days</small>
      </div>
      <div class="grid-3" id="an-cat-breakdown"></div>
    </div>
  `;

  /* ══════════════════════════════════════════════════════
     RANGE STATE
     ══════════════════════════════════════════════════════ */

  let rangeDays = 30;

  function rangeBounds(){
    const today = todayStr();
    if(rangeDays === 'all'){
      return { from: '0000-01-01', to: today, label: 'all time' };
    }
    const from = daysAgoStr(Number(rangeDays) - 1);
    return {
      from,
      to: today,
      label: 'last ' + rangeDays + ' days'
    };
  }

  /* ══════════════════════════════════════════════════════
     AGGREGATE DATA
     ══════════════════════════════════════════════════════ */

  function buildData(){
    const { from, to, label } = rangeBounds();

    /* Filter invoices + bills in range */
    const invoices = (DB.invoices || []).filter(i => {
      const d = txDate(i, 'invoice_date');
      return d >= from && d <= to;
    });
    const bills = (DB.supplier_invoices || []).filter(b => {
      const d = txDate(b, 'bill_date');
      return d >= from && d <= to;
    });

    /* ─── KPIs ───────────────────────────────────────────── */
    const totalSales      = invoices.reduce((s, i) => s + Number(i.total || 0), 0);
    const totalPurchases  = bills.reduce((s, b) => s + Number(b.total || 0), 0);
    const totalPaid       = invoices.reduce((s, i) => s + Number(i.paid || 0), 0);
    const totalDue        = invoices.reduce((s, i) => s + Number(i.due || 0), 0);
    const invoiceCount    = invoices.length;
    const avgTicket       = invoiceCount > 0 ? totalSales / invoiceCount : 0;

    /* ─── Daily series for trend chart ───────────────────── */
    const dayMap = {};
    const daysBack = rangeDays === 'all' ? 90 : Number(rangeDays);
    for(let i = daysBack - 1; i >= 0; i--){
      dayMap[daysAgoStr(i)] = { sales: 0, purchase: 0 };
    }

    invoices.forEach(i => {
      const d = txDate(i, 'invoice_date');
      if(dayMap[d]) dayMap[d].sales += Number(i.total || 0);
    });

    bills.forEach(b => {
      const d = txDate(b, 'bill_date');
      if(dayMap[d]) dayMap[d].purchase += Number(b.total || 0);
    });

    const trendLabels = Object.keys(dayMap).sort().map(d => d.slice(5));
    const trendSales  = Object.keys(dayMap).sort().map(d => dayMap[d].sales);
    const trendPurch  = Object.keys(dayMap).sort().map(d => dayMap[d].purchase);

    /* ─── Monthly aggregation ────────────────────────────── */
    const monthMap = {};
    invoices.forEach(i => {
      const d = txDate(i, 'invoice_date');
      if(!d) return;
      const key = d.slice(0, 7);
      monthMap[key] = monthMap[key] || { sales: 0, purchase: 0 };
      monthMap[key].sales += Number(i.total || 0);
    });
    bills.forEach(b => {
      const d = txDate(b, 'bill_date');
      if(!d) return;
      const key = d.slice(0, 7);
      monthMap[key] = monthMap[key] || { sales: 0, purchase: 0 };
      monthMap[key].purchase += Number(b.total || 0);
    });
    const monthKeys = Object.keys(monthMap).sort().slice(-6);
    const monthLabels = monthKeys.map(k => {
      const [y, m] = k.split('-');
      return new Date(y, Number(m) - 1, 1).toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
    });
    const monthSales = monthKeys.map(k => monthMap[k].sales);
    const monthPurch = monthKeys.map(k => monthMap[k].purchase);

    /* ─── Top products (by revenue) ──────────────────────── */
    const prodMap = {};
    invoices.forEach(inv => {
      const items = (DB.invoice_items || []).filter(it => it.invoice_id === inv.id);
      items.forEach(it => {
        const key = it.product_id || it.product_name;
        if(!prodMap[key]){
          prodMap[key] = { name: it.product_name, revenue: 0, qty: 0 };
        }
        prodMap[key].revenue += Number(it.total || 0);
        prodMap[key].qty += Number(it.qty || 0);
      });
    });
    const topProducts = Object.values(prodMap)
      .sort((a, b) => b.revenue - a.revenue)
      .slice(0, 8);

    /* ─── Top parties (by billed) ────────────────────────── */
    const partyMap = {};
    invoices.forEach(inv => {
      const party = inv.party_type === 'retailer'
        ? (DB.retailers || []).find(x => x.id === inv.party_id)
        : (DB.customers || []).find(x => x.id === inv.party_id);
      if(!party) return;
      const key = party.id;
      if(!partyMap[key]){
        partyMap[key] = { name: party.name, type: inv.party_type, billed: 0 };
      }
      partyMap[key].billed += Number(inv.total || 0);
    });
    const topParties = Object.values(partyMap)
      .sort((a, b) => b.billed - a.billed)
      .slice(0, 8);

    /* ─── Category breakdown ─────────────────────────────── */
    const catMap = {};
    invoices.forEach(inv => {
      const items = (DB.invoice_items || []).filter(it => it.invoice_id === inv.id);
      items.forEach(it => {
        const product = (DB.products || []).find(p => p.id === it.product_id);
        const cat = product ? (product.category || 'Uncategorised') : 'Uncategorised';
        catMap[cat] = (catMap[cat] || 0) + Number(it.total || 0);
      });
    });
    const catTotals = Object.entries(catMap).sort((a, b) => b[1] - a[1]);

    return {
      label,
      totalSales, totalPurchases, totalPaid, totalDue,
      invoiceCount, avgTicket,
      trendLabels, trendSales, trendPurch,
      monthLabels, monthSales, monthPurch,
      topProducts, topParties, catTotals
    };
  }

  /* ══════════════════════════════════════════════════════
     RENDER KPIs
     ══════════════════════════════════════════════════════ */

  function renderKPIs(d){
    $('#an-kpis').innerHTML = `
      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Total Sales</div>
          <div class="kpi-icon">💰</div>
        </div>
        <div class="kpi-value">${rs(d.totalSales)}</div>
        <div class="kpi-trend">${d.invoiceCount} invoices</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Total Purchases</div>
          <div class="kpi-icon" style="background:var(--amber-bg);color:var(--amber)">📥</div>
        </div>
        <div class="kpi-value">${rs(d.totalPurchases)}</div>
        <div class="kpi-trend">cost of stock brought in</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Avg Invoice</div>
          <div class="kpi-icon" style="background:var(--blue-bg);color:var(--blue)">📊</div>
        </div>
        <div class="kpi-value">${rs(d.avgTicket)}</div>
        <div class="kpi-trend">per invoice</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Outstanding</div>
          <div class="kpi-icon" style="background:var(--red-bg);color:var(--red)">⏳</div>
        </div>
        <div class="kpi-value" style="color:${d.totalDue > 0 ? 'var(--red)' : 'var(--green)'}">${rs(d.totalDue)}</div>
        <div class="kpi-trend">from these invoices</div>
      </div>
    `;
  }

  /* ══════════════════════════════════════════════════════
     CHART OPTIONS (shared)
     ══════════════════════════════════════════════════════ */

  function baseLineOptions(){
    const reduce = !!SETTINGS.reduced_effects;
    return {
      responsive: true,
      maintainAspectRatio: false,
      animation: reduce ? false : { duration: 400 },
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: '#4B5563',
            font: { size: 11 },
            usePointStyle: true,
            boxWidth: 8,
            padding: 12
          }
        },
        tooltip: {
          backgroundColor: '#1F2937',
          titleColor: '#FFFFFF',
          bodyColor: '#FFFFFF',
          borderColor: '#C79A28',
          borderWidth: 1,
          padding: 10,
          callbacks: {
            label: (ctx) => ctx.dataset.label + ': ' + rs(ctx.parsed.y)
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            color: '#6B7280',
            font: { size: 10 },
            callback: (v) => '₹' + Number(v).toLocaleString('en-IN')
          },
          grid: { color: '#F1F5F9', drawBorder: false }
        },
        x: {
          ticks: { color: '#6B7280', font: { size: 10 }, maxRotation: 0, autoSkipPadding: 14 },
          grid: { display: false }
        }
      }
    };
  }

  function baseBarOptions(horizontal){
    const opts = baseLineOptions();
    opts.plugins.legend.display = false;
    if(horizontal){
      opts.indexAxis = 'y';
      opts.scales = {
        x: {
          beginAtZero: true,
          ticks: {
            color: '#6B7280',
            font: { size: 10 },
            callback: (v) => '₹' + Number(v).toLocaleString('en-IN')
          },
          grid: { color: '#F1F5F9', drawBorder: false }
        },
        y: {
          ticks: { color: '#1F2937', font: { size: 11, weight: '600' } },
          grid: { display: false }
        }
      };
    }
    return opts;
  }

  /* ══════════════════════════════════════════════════════
     RENDER CHARTS
     ══════════════════════════════════════════════════════ */

  function destroyOldCharts(){
    if(Array.isArray(charts)){
      charts.forEach(c => { try { c.destroy(); } catch(e){} });
    }
    charts = [];
  }

  function drawTrend(d){
    const canvas = $('#an-ch-trend');
    if(!canvas || typeof Chart === 'undefined') return;

    charts.push(new Chart(canvas, {
      type: 'line',
      data: {
        labels: d.trendLabels,
        datasets: [
          {
            label: 'Sales',
            data: d.trendSales,
            borderColor: '#C79A28',
            backgroundColor: 'rgba(199,154,40,0.10)',
            borderWidth: 2,
            tension: 0.35,
            fill: true,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: '#C79A28',
            pointHoverBorderColor: '#FFFFFF',
            pointHoverBorderWidth: 2
          },
          {
            label: 'Purchases',
            data: d.trendPurch,
            borderColor: '#1D4ED8',
            backgroundColor: 'rgba(29,78,216,0.08)',
            borderWidth: 2,
            tension: 0.35,
            fill: true,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: '#1D4ED8',
            pointHoverBorderColor: '#FFFFFF',
            pointHoverBorderWidth: 2
          }
        ]
      },
      options: baseLineOptions()
    }));
  }

  function drawMonthly(d){
    const canvas = $('#an-ch-month');
    if(!canvas || typeof Chart === 'undefined') return;

    charts.push(new Chart(canvas, {
      type: 'bar',
      data: {
        labels: d.monthLabels,
        datasets: [
          {
            label: 'Sales',
            data: d.monthSales,
            backgroundColor: '#C79A28',
            borderRadius: 6,
            maxBarThickness: 32
          },
          {
            label: 'Purchases',
            data: d.monthPurch,
            backgroundColor: '#1D4ED8',
            borderRadius: 6,
            maxBarThickness: 32
          }
        ]
      },
      options: baseLineOptions()
    }));
  }

  function drawPaid(d){
    const canvas = $('#an-ch-paid');
    if(!canvas || typeof Chart === 'undefined') return;

    const paid = d.totalPaid;
    const due  = d.totalDue;
    const total = paid + due;

    charts.push(new Chart(canvas, {
      type: 'doughnut',
      data: {
        labels: ['Paid', 'Outstanding'],
        datasets: [{
          data: [paid, due],
          backgroundColor: ['#15803D', '#B91C1C'],
          borderWidth: 0,
          hoverOffset: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: SETTINGS.reduced_effects ? false : { duration: 400 },
        cutout: '68%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              color: '#4B5563',
              font: { size: 11 },
              usePointStyle: true,
              boxWidth: 8,
              padding: 12
            }
          },
          tooltip: {
            backgroundColor: '#1F2937',
            titleColor: '#FFFFFF',
            bodyColor: '#FFFFFF',
            borderColor: '#C79A28',
            borderWidth: 1,
            padding: 10,
            callbacks: {
              label: (ctx) => {
                const pct = total > 0 ? (ctx.parsed / total) * 100 : 0;
                return ctx.label + ': ' + rs(ctx.parsed) + ' (' + pct.toFixed(1) + '%)';
              }
            }
          }
        }
      }
    }));
  }

  function drawTopProducts(d){
    const canvas = $('#an-ch-prod');
    if(!canvas || typeof Chart === 'undefined') return;

    const top = d.topProducts;
    if(!top.length){
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    charts.push(new Chart(canvas, {
      type: 'bar',
      data: {
        labels: top.map(p => p.name.length > 22 ? p.name.slice(0, 22) + '…' : p.name),
        datasets: [{
          label: 'Revenue',
          data: top.map(p => p.revenue),
          backgroundColor: top.map((_, i) =>
            i === 0 ? '#C79A28' :
            i === 1 ? '#E0B84A' :
            i === 2 ? '#EFD27C' :
            '#F4E4B4'
          ),
          borderRadius: 6,
          maxBarThickness: 26
        }]
      },
      options: baseBarOptions(true)
    }));
  }

  function drawTopParties(d){
    const canvas = $('#an-ch-party');
    if(!canvas || typeof Chart === 'undefined') return;

    const top = d.topParties;
    if(!top.length){
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    charts.push(new Chart(canvas, {
      type: 'bar',
      data: {
        labels: top.map(p => p.name.length > 22 ? p.name.slice(0, 22) + '…' : p.name),
        datasets: [{
          label: 'Billed',
          data: top.map(p => p.billed),
          backgroundColor: top.map(p =>
            p.type === 'retailer' ? '#1D4ED8' : '#15803D'
          ),
          borderRadius: 6,
          maxBarThickness: 26
        }]
      },
      options: (() => {
        const o = baseBarOptions(true);
        o.plugins.tooltip.callbacks.label = (ctx) => {
          const p = top[ctx.dataIndex];
          return (p.type === 'retailer' ? 'Retailer' : 'Customer') + ': ' + rs(ctx.parsed.x);
        };
        return o;
      })()
    }));
  }

  /* ══════════════════════════════════════════════════════
     CATEGORY BREAKDOWN CARDS
     ══════════════════════════════════════════════════════ */

  function renderCategoryBreakdown(d){
    const wrap = $('#an-cat-breakdown');
    if(!wrap) return;

    const cats = d.catTotals;
    if(!cats.length){
      wrap.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--ink-3);font-size:var(--fs-sm);padding:16px 0">No sales in this range</div>';
      return;
    }

    const total = cats.reduce((s, [, v]) => s + v, 0);

    wrap.innerHTML = cats.slice(0, 6).map(([cat, amt]) => {
      const pct = total > 0 ? (amt / total) * 100 : 0;
      return `
        <div class="mini-stat">
          <div class="lbl">${esc(cat)}</div>
          <div class="val" style="font-size:var(--fs-base)">${rs(amt)}</div>
          <div style="margin-top:6px;height:4px;background:var(--bg-deep);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:var(--primary);border-radius:2px"></div>
          </div>
          <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:4px">${pct.toFixed(1)}%</div>
        </div>
      `;
    }).join('');
  }

  /* ══════════════════════════════════════════════════════
     MASTER RENDER
     ══════════════════════════════════════════════════════ */

  function renderAll(){
    const d = buildData();

    /* Update labels */
    const trendLabel = $('#an-trend-label');
    const catLabel   = $('#an-cat-label');
    if(trendLabel) trendLabel.textContent = d.label;
    if(catLabel)   catLabel.textContent   = d.label;

    /* KPIs */
    renderKPIs(d);

    /* Charts */
    destroyOldCharts();
    drawTrend(d);
    drawMonthly(d);
    drawPaid(d);
    drawTopProducts(d);
    drawTopParties(d);

    /* Category breakdown */
    renderCategoryBreakdown(d);
  }

  /* ══════════════════════════════════════════════════════
     RANGE TOGGLE
     ══════════════════════════════════════════════════════ */

  $$('#an-range button').forEach(btn => {
    btn.onclick = () => {
      $$('#an-range button').forEach(b => {
        b.classList.toggle('btn-primary', b === btn);
        b.classList.toggle('active', b === btn);
      });
      const r = btn.dataset.r;
      rangeDays = r === 'all' ? 'all' : Number(r);
      renderAll();
    };
  });

  /* Initial render */
  renderAll();
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 36
