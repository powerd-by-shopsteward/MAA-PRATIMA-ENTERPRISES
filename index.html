/* ══════════════════════════════════════════════════════════════
   BLOCK 47 — A4 PRINT PATH
   Provides a unified A4 print API for statements, and exposes
   a generic printNode() helper.
   The invoice A4 print is already handled by Block 31's
   printInvoiceA4(). This block adds:
     • Statement printing (customers, retailers, companies, vendors)
     • A reusable #__a4_temp__ container that gets shown only in
       print mode
   Public API: window.A4Print
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   47a — ENSURE TEMP STYLE IS IN THE HEAD
   The temp container is hidden on-screen and only revealed when
   the browser enters print mode.
   ══════════════════════════════════════════════════════════════ */

(function ensureA4Style(){
  if(document.getElementById('__a4_style')) return;
  const s = document.createElement('style');
  s.id = '__a4_style';
  s.textContent = `
    #__a4_temp__ { display: none; }
    @media print {
      #__a4_temp__ { display: block !important; }
    }
  `;
  document.head.appendChild(s);
})();

/* ══════════════════════════════════════════════════════════════
   47b — PUBLIC NAMESPACE
   ══════════════════════════════════════════════════════════════ */

window.A4Print = (function(){
  'use strict';

  /* ─── Body classes managed by Block 11's print CSS ───── */
  const BODY_CLASSES = ['print-invoice', 'print-statement', 'print-report'];

  /* ══════════════════════════════════════════════════════════
     47b.1 — withPrintClass
     Applies the given body class, calls window.print(), and
     cleans up reliably via `afterprint` (with a timeout fallback).
     ══════════════════════════════════════════════════════════ */

  function withPrintClass(bodyClass){
    /* Remove any stale classes first */
    BODY_CLASSES.forEach(c => document.body.classList.remove(c));
    document.body.classList.add(bodyClass);

    let cleaned = false;
    const cleanup = () => {
      if(cleaned) return;
      cleaned = true;
      BODY_CLASSES.forEach(c => document.body.classList.remove(c));
      window.removeEventListener('afterprint', cleanup);
    };

    window.addEventListener('afterprint', cleanup);
    setTimeout(cleanup, 3000);

    setTimeout(() => {
      try {
        window.print();
      } catch(err){
        console.error('[A4Print] print failed', err);
        toast('Print failed — try Ctrl+P', 'error');
        cleanup();
      }
    }, 80);
  }

  /* ══════════════════════════════════════════════════════════
     47b.2 — printNode
     Injects a temporary #print-area with the given HTML, applies
     the print class, prints, and removes the temp container.
     ══════════════════════════════════════════════════════════ */

    function printNode(html, bodyClass){
    const oldTemp = document.getElementById('__a4_temp__');
    if(oldTemp) oldTemp.remove();

    /* Hide any real #print-area so we don't print twice */
    const hidden = [];
    document.querySelectorAll('#app #print-area').forEach(el => {
      hidden.push({ el, prev: el.style.display });
      el.style.display = 'none';
    });

    const temp = document.createElement('div');
    temp.id = '__a4_temp__';
    temp.innerHTML = '<div id="print-area">' + html + '</div>';
    document.body.appendChild(temp);

    const cleanup = () => {
      const t = document.getElementById('__a4_temp__');
      if(t) t.remove();
      hidden.forEach(({ el, prev }) => { el.style.display = prev; });
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    setTimeout(cleanup, 3000);

    withPrintClass(bodyClass);
  }

  /* ══════════════════════════════════════════════════════════
     47b.3 — printInvoice (delegates to Block 31)
     ══════════════════════════════════════════════════════════ */

  function printInvoice(){
    if(typeof printInvoiceA4 === 'function'){
      printInvoiceA4();
    } else {
      toast('Invoice print not available', 'error');
    }
  }

  /* ══════════════════════════════════════════════════════════
     47b.4 — HELPERS
     ══════════════════════════════════════════════════════════ */

  function kpiTile(label, value, color){
    return `
      <div style="flex:1;padding:10px 12px;border:1px solid #DDDDDD;border-radius:4px;background:#FFFFFF">
        <div style="font-size:9px;color:#666666;font-weight:700;text-transform:uppercase;letter-spacing:0.06em">
          ${esc(label)}
        </div>
        <div style="font-weight:700;font-size:14px;margin-top:3px;color:${color || '#000000'}">
          ${value}
        </div>
      </div>
    `;
  }

  function headerBlock(partyName, partyMeta){
    return `
      <div class="stmt-header" style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid #000000">
        <div>
          <div class="stmt-title" style="font-size:16px;font-weight:800;letter-spacing:-0.01em">
            Statement of Account
          </div>
          <div class="stmt-party-name" style="font-size:13px;font-weight:700;margin-top:2px">
            ${esc(partyName)}
          </div>
          <div class="stmt-party-meta" style="font-size:10px;color:#555555;line-height:1.5;margin-top:2px">
            ${partyMeta}
          </div>
        </div>
        <div style="text-align:right;font-size:10px;color:#555555;line-height:1.5">
          <div style="font-weight:800;font-size:14px;color:#000000">${esc(SETTINGS.shop_name || 'Stationery Hub')}</div>
          ${SETTINGS.owner_name ? '<div>' + esc(SETTINGS.owner_name) + '</div>' : ''}
          ${SETTINGS.address ? '<div>' + esc(SETTINGS.address) + '</div>' : ''}
          ${SETTINGS.phone ? '<div>Ph: ' + esc(SETTINGS.phone) + '</div>' : ''}
          ${(SETTINGS.gst_enabled && SETTINGS.gst_number) ? '<div>GSTIN: ' + esc(SETTINGS.gst_number) + '</div>' : ''}
        </div>
      </div>
    `;
  }

  function ledgerTable(rows, openingRow){
    return `
      <table style="width:100%;border-collapse:collapse;font-size:10.5px;margin-top:8px">
        <thead>
          <tr style="background:#F1F1F1">
            <th style="padding:6px 8px;text-align:left;border:1px solid #CCCCCC">Date</th>
            <th style="padding:6px 8px;text-align:left;border:1px solid #CCCCCC">Reference</th>
            <th style="padding:6px 8px;text-align:right;border:1px solid #CCCCCC">Debit</th>
            <th style="padding:6px 8px;text-align:right;border:1px solid #CCCCCC">Credit</th>
            <th style="padding:6px 8px;text-align:right;border:1px solid #CCCCCC">Balance</th>
          </tr>
        </thead>
        <tbody>
          ${openingRow || ''}
          ${rows || (!openingRow ? '<tr><td colspan="5" style="padding:20px;text-align:center;border:1px solid #DDDDDD;color:#666666">No transactions yet</td></tr>' : '')}
        </tbody>
      </table>
    `;
  }

  function footerBlock(){
    return `
      <div style="margin-top:24px;padding-top:10px;border-top:1px dashed #999999;font-size:9px;color:#666666;text-align:center">
        Generated on ${esc(fmtDate(todayStr()))} &nbsp;·&nbsp; ${esc(SETTINGS.shop_name || 'Stationery Hub')}
      </div>
    `;
  }

  /* ══════════════════════════════════════════════════════════
     47b.5 — PARTY STATEMENT (customer + retailer)
     ══════════════════════════════════════════════════════════ */

  function buildPartyStatement(party, type){
    const isRetailer = type === 'retailer';
    const typeLabel  = isRetailer ? 'Retailer' : 'Customer';

    const invs = (DB.invoices || [])
      .filter(i => i.party_id === party.id && i.party_type === type);
    const pays = (DB.payments || [])
      .filter(p => p.party_id === party.id && p.party_type === type);

    /* Combined timeline */
        const timeline = [
      ...invs.map(i => ({
        date:   txDate(i, 'invoice_date'),
        ref:    i.invoice_no || 'INV',
        debit:  Number(i.total || 0),
        credit: 0
      })),
      ...invs
        .filter(i => Number(i.paid || 0) > 0)
        .map(i => ({
          date:   txDate(i, 'invoice_date'),
          ref:    (i.invoice_no || 'INV') + ' — paid',
          debit:  0,
          credit: Number(i.paid || 0)
        })),
      ...pays.map(p => ({
        date:   txDate(p, 'payment_date'),
        ref:    (p.mode || 'payment').toUpperCase() + (p.notes ? ' — ' + p.notes : ''),
        debit:  0,
        credit: Number(p.amount || 0)
      }))
    ].sort((a, b) => a.date.localeCompare(b.date));

    let balance = 0;
    const rows = timeline.map(t => {
      balance += t.debit - t.credit;
      return `
        <tr>
          <td style="padding:6px 8px;border:1px solid #DDDDDD">${esc(fmtDate(t.date))}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD">${esc(t.ref)}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD;text-align:right">${t.debit ? esc(rs(t.debit)) : '—'}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD;text-align:right">${t.credit ? esc(rs(t.credit)) : '—'}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD;text-align:right;font-weight:600">${esc(rs(balance))}</td>
        </tr>
      `;
    }).join('');

    const st = partyStats(party.id, type);

    const meta =
      typeLabel +
      (party.phone   ? ' · ' + esc(party.phone)   : '') +
      (party.address ? '<br>' + esc(party.address) : '');

    return `
      <div style="font-family:Arial,sans-serif;color:#000000;padding:0">
        ${headerBlock(party.name, meta)}

        <div class="stmt-kpis" style="display:flex;gap:12px;margin-bottom:12px">
          ${kpiTile('Total Billed', esc(rs(st.total_billed)), '#000000')}
          ${kpiTile('Total Paid',   esc(rs(st.total_paid)),   '#15803D')}
          ${kpiTile('Balance Due',  esc(rs(st.due)),          st.due > 0 ? '#B91C1C' : '#15803D')}
        </div>

        ${ledgerTable(rows, '')}
        ${footerBlock()}
      </div>
    `;
  }

  function printPartyStatement(partyId, type){
    const table = type === 'retailer' ? 'retailers' : 'customers';
    const party = (DB[table] || []).find(x => x.id === partyId);
    if(!party){ toast('Party not found', 'error'); return; }

    const html = buildPartyStatement(party, type);
    printNode(html, 'print-statement');
  }

  /* ══════════════════════════════════════════════════════════
     47b.6 — SUPPLIER STATEMENT (company + vendor)
     ══════════════════════════════════════════════════════════ */

  function buildSupplierStatement(supplier){
    const isVendor = supplier.type === 'vendor';
    const typeLabel = isVendor ? 'Vendor' : 'Company';

    const bills = (DB.supplier_invoices || [])
      .filter(b => b.supplier_id === supplier.id);
    const pays = (DB.supplier_payments || [])
      .filter(p => p.supplier_id === supplier.id);

    const tt = supplierTotals(supplier.id);

       const timeline = [
      ...bills.map(b => ({
        date:   txDate(b, 'bill_date'),
        ref:    b.bill_no || 'Bill',
        debit:  Number(b.total || 0),
        credit: 0
      })),
      ...bills
        .filter(b => Number(b.paid || 0) > 0)
        .map(b => ({
          date:   txDate(b, 'bill_date'),
          ref:    (b.bill_no || 'Bill') + ' — paid',
          debit:  0,
          credit: Number(b.paid || 0)
        })),
      ...pays.map(p => ({
        date:   txDate(p, 'payment_date'),
        ref:    (p.mode || 'payment').toUpperCase() + (p.notes ? ' — ' + p.notes : ''),
        debit:  0,
        credit: Number(p.amount || 0)
      }))
    ].sort((a, b) => a.date.localeCompare(b.date));
    let balance = tt.opening;
    const rows = timeline.map(t => {
      balance += t.debit - t.credit;
      return `
        <tr>
          <td style="padding:6px 8px;border:1px solid #DDDDDD">${esc(fmtDate(t.date))}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD">${esc(t.ref)}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD;text-align:right">${t.debit ? esc(rs(t.debit)) : '—'}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD;text-align:right">${t.credit ? esc(rs(t.credit)) : '—'}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD;text-align:right;font-weight:600">${esc(rs(balance))}</td>
        </tr>
      `;
    }).join('');

    let openingRow = '';
    if(tt.opening !== 0){
      openingRow = `
        <tr style="background:#FAFAFA">
          <td style="padding:6px 8px;border:1px solid #DDDDDD">—</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD">Opening Balance</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD;text-align:right">${tt.opening > 0 ? esc(rs(tt.opening)) : '—'}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD;text-align:right">${tt.opening < 0 ? esc(rs(Math.abs(tt.opening))) : '—'}</td>
          <td style="padding:6px 8px;border:1px solid #DDDDDD;text-align:right;font-weight:600">${esc(rs(tt.opening))}</td>
        </tr>
      `;
    }

    const meta =
      typeLabel +
      (supplier.phone   ? ' · ' + esc(supplier.phone)   : '') +
      (supplier.address ? '<br>' + esc(supplier.address) : '');

    return `
      <div style="font-family:Arial,sans-serif;color:#000000;padding:0">
        ${headerBlock(supplier.name, meta)}

        <div class="stmt-kpis" style="display:flex;gap:12px;margin-bottom:12px">
          ${kpiTile('Total Purchases', esc(rs(tt.total_purchase)), '#000000')}
          ${kpiTile('Total Paid',      esc(rs(tt.total_paid)),     '#15803D')}
          ${kpiTile('Payable',         esc(rs(tt.total_due)),      tt.total_due > 0 ? '#B91C1C' : '#15803D')}
        </div>

        ${ledgerTable(rows, openingRow)}
        ${footerBlock()}
      </div>
    `;
  }

  function printSupplierStatement(supplierId){
    const supplier = (DB.suppliers || []).find(x => x.id === supplierId);
    if(!supplier){ toast('Supplier not found', 'error'); return; }

    const html = buildSupplierStatement(supplier);
    printNode(html, 'print-statement');
  }

  /* ══════════════════════════════════════════════════════════
     47b.7 — PUBLIC API
     ══════════════════════════════════════════════════════════ */

  return {
    printNode,
    printInvoice,
    printPartyStatement,
    printSupplierStatement,
    withPrintClass
  };
})();

/* ══════════════════════════════════════════════════════════════
   47c — AUTO-INJECT "🖨 Statement" BUTTON ON PROFILE PAGES
   Adds the button as the first action on customer/retailer/
   company/vendor profiles.
   ══════════════════════════════════════════════════════════════ */

function injectStatementButton(){
  const hash = location.hash || '';

  const match = hash.match(/^#\/(customer|retailer|company|vendor)\/(.+)$/);
  if(!match) return;

  if(document.getElementById('btn-print-statement')) return;

  const actions = document.querySelector('.page-actions');
  if(!actions) return;

  const type = match[1];
  const id   = match[2];

  const btn = document.createElement('button');
  btn.id = 'btn-print-statement';
  btn.type = 'button';
  btn.className = 'btn btn-ghost';
  btn.innerHTML = '🖨 Statement';
  btn.title = 'Print A4 statement';

  btn.onclick = () => {
    if(type === 'customer' || type === 'retailer'){
      window.A4Print.printPartyStatement(id, type);
    } else if(type === 'company' || type === 'vendor'){
      window.A4Print.printSupplierStatement(id);
    }
  };

  /* Insert as the first action button */
  actions.insertBefore(btn, actions.firstChild);
}

/* Poller — same pattern as other injectors */
setInterval(injectStatementButton, 500);

/* ══════════════════════════════════════════════════════════
   END BLOCK 47
   ══════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   BLOCK 48 — PDF EXPORT MODULE
   jsPDF + autotable for A4 PDF export.
   Public API: window.PDFMaker
     • invoice(inv, items, party)
     • statement(party, type, rows, totals)
     • report({ title, meta, kpis, tables, filename })
     • auto(pageTitle) — scrapes the current page → PDF
     • run(type, data) — dispatcher used by Margin (Block 38)
   Auto-injects PDF buttons into:
     • invoice view (Block 31)
     • party / supplier profiles (Blocks 29 / 28)
     • list pages (products, invoices, companies, etc.)
   ══════════════════════════════════════════════════════════════ */

window.PDFMaker = (function(){
  'use strict';

  /* ══════════════════════════════════════════════════════════
     48a — UTIL
     ══════════════════════════════════════════════════════════ */

    function libReady(){
    if(!(window.jspdf && window.jspdf.jsPDF)) return false;
    return !!(window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
  }

  function guard(){
    if(!libReady()){
      toast('PDF library not loaded — check internet', 'error');
      return false;
    }
    return true;
  }

  /* Strip ₹ — standard jsPDF fonts don't render it */
  function clean(s){
    if(s == null) return '';
    return String(s).replace(/\u20B9/g, '');
  }

    /* Numeric cell helper — the name is intentionally NOT "rs" because
     the output has no currency symbol (jsPDF Helvetica can't render ₹). */
  function pdfNum(n){
    return inr(n);
  }

  /* ══════════════════════════════════════════════════════════
     48b — HEADER (logo + shop details)
     ══════════════════════════════════════════════════════════ */

  function pdfHeader(doc, subtitle){
    const W = doc.internal.pageSize.getWidth();
    let y = 12;
    const logoW = 18;
    let textX = 14;

    /* ─── Logo ─────────────────────────────────────────── */
    if(SETTINGS.logo){
      try {
        let fmt = 'PNG';
        const lg = SETTINGS.logo;
        if(lg.indexOf('data:image/jpeg') === 0 || lg.indexOf('data:image/jpg') === 0) fmt = 'JPEG';
        else if(lg.indexOf('data:image/webp') === 0) fmt = 'WEBP';
        doc.addImage(lg, fmt, 14, y, logoW, logoW);
      } catch(err){
        console.warn('[PDF] logo add failed', err);
      }
      textX = 14 + logoW + 5;
    }

    /* ─── Shop name + details ──────────────────────────── */
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(15);
    doc.setTextColor(0, 0, 0);
    doc.text(clean(SETTINGS.shop_name || 'Stationery Hub'), textX, y + 5);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(60, 60, 60);
    let ty = y + 10;

    if(SETTINGS.owner_name){ doc.text(clean(SETTINGS.owner_name), textX, ty); ty += 4; }
    if(SETTINGS.address){    doc.text(clean(SETTINGS.address),    textX, ty); ty += 4; }
    if(SETTINGS.phone){      doc.text('Ph: ' + clean(SETTINGS.phone), textX, ty); ty += 4; }
    if(SETTINGS.email){      doc.text(clean(SETTINGS.email),      textX, ty); ty += 4; }
    if(SETTINGS.gst_enabled && SETTINGS.gst_number){
      doc.text('GSTIN: ' + clean(SETTINGS.gst_number), textX, ty); ty += 4;
    }

    /* ─── Separator line ───────────────────────────────── */
    const lineY = Math.max(y + logoW + 3, ty + 2);
    doc.setDrawColor(200);
    doc.line(14, lineY, W - 14, lineY);

    y = lineY + 6;

    /* ─── Subtitle ─────────────────────────────────────── */
    if(subtitle){
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(0, 0, 0);
      doc.text(clean(subtitle), 14, y);
      y += 5;
    }

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(90, 90, 90);
    return y;
  }

  /* ══════════════════════════════════════════════════════════
     48c — FOOTER (page numbers + timestamp)
     ══════════════════════════════════════════════════════════ */

  function pdfFooter(doc){
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();
    const n = doc.internal.getNumberOfPages();

    for(let i = 1; i <= n; i++){
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(150, 150, 150);
      doc.text('Page ' + i + ' / ' + n, W / 2, H - 8, { align: 'center' });
      doc.text('Generated ' + new Date().toLocaleString('en-IN'), 14, H - 8);
    }
  }

  /* ══════════════════════════════════════════════════════════
     48d — KPI ROW
     ══════════════════════════════════════════════════════════ */

  function kpiRow(doc, kpis, y){
    if(!kpis || !kpis.length) return y;

    const W = doc.internal.pageSize.getWidth();
    const usable = W - 28;
    const colW = usable / kpis.length;

    doc.setFontSize(7);
    doc.setTextColor(120, 120, 120);
    kpis.forEach((k, i) => {
      doc.text(clean(k[0] || '').toUpperCase(), 14 + i * colW, y);
    });

    doc.setFontSize(11);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(0, 0, 0);
    kpis.forEach((k, i) => {
      doc.text(clean(k[1] || ''), 14 + i * colW, y + 6);
    });
    doc.setFont('helvetica', 'normal');

    return y + 14;
  }

  /* ══════════════════════════════════════════════════════════
     48e — GENERIC REPORT BUILDER
     ══════════════════════════════════════════════════════════ */

  function buildReport(opts){
    opts = opts || {};
    const doc = new window.jspdf.jsPDF('p', 'mm', 'a4');
    let y = pdfHeader(doc, opts.title || 'Report');

    if(opts.meta){
      doc.setFontSize(9);
      doc.setTextColor(100, 100, 100);
      doc.text(clean(opts.meta), 14, y);
      y += 7;
      doc.setTextColor(0, 0, 0);
    }

    if(opts.kpis && opts.kpis.length){
      y = kpiRow(doc, opts.kpis, y);
      y += 4;
    }

    (opts.tables || []).forEach(t => {
      if(!t || !t.head || !t.rows || !t.rows.length) return;

      if(t.title){
        doc.setFontSize(11);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(0, 0, 0);
        doc.text(clean(t.title), 14, y);
        y += 3;
      }

      const cleanRows = t.rows.map(r => r.map(clean));
      const cleanHead = t.head.map(clean);

      doc.autoTable({
        startY: y,
        head: [cleanHead],
        body: cleanRows,
        styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
        headStyles: { fillColor: [199, 154, 40], textColor: 255, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [250, 248, 240] },
        margin: { left: 14, right: 14 }
      });

      y = doc.lastAutoTable.finalY + 8;

      if(y > doc.internal.pageSize.getHeight() - 30){
        doc.addPage();
        y = 20;
      }
    });

    pdfFooter(doc);
    return doc;
  }

  function saveDoc(doc, filename){
    doc.save(filename || ('StationeryHub-' + todayStr() + '.pdf'));
    toast('PDF downloaded', 'success');
  }

  /* ══════════════════════════════════════════════════════════
     48f — INVOICE PDF
     Matches the call signature used by Block 44's WhatsApp flow.
     ══════════════════════════════════════════════════════════ */

  function invoicePDF(inv, items, party){
    if(!guard()) return;

    const doc = new window.jspdf.jsPDF('p', 'mm', 'a4');
    const W = doc.internal.pageSize.getWidth();
    let y = pdfHeader(doc, 'INVOICE');

    /* ─── Left meta: invoice no, date, type ─────────────── */
    doc.setFontSize(9);
    doc.setTextColor(0, 0, 0);
    doc.setFont('helvetica', 'bold');
    doc.text('Invoice No:', 14, y);
    doc.text('Date:',       14, y + 5);
    doc.text('Type:',       14, y + 10);

    doc.setFont('helvetica', 'normal');
    doc.text(clean(inv.invoice_no || ''), 40, y);
    doc.text(clean(txDT(inv, 'invoice_date')), 40, y + 5);
    doc.text(inv.party_type === 'retailer' ? 'Retailer' : 'Customer', 40, y + 10);

    /* ─── Right side: billed to ─────────────────────────── */
    doc.setFont('helvetica', 'bold');
    doc.text('BILLED TO', W - 14, y, { align: 'right' });

    doc.setFont('helvetica', 'normal');
    let by = y + 5;
    doc.text(clean(party ? (party.name || '-') : '-'), W - 14, by, { align: 'right' }); by += 4;
    if(party && party.phone){   doc.text(clean(party.phone),   W - 14, by, { align: 'right' }); by += 4; }
    if(party && party.address){ doc.text(clean(party.address), W - 14, by, { align: 'right' }); by += 4; }

    y += 20;

    /* ─── Item table ────────────────────────────────────── */
    const body = items.map(it => [
      clean(productLineLabel(it)),
      clean(fmtNum(it.qty) + ' ' + (it.unit || '')),
      pdfRs(it.price),
      pdfRs(it.total)
    ]);

    doc.autoTable({
      startY: y,
      head: [['Item', 'Qty', 'Rate', 'Amount']],
      body: body,
      styles: { fontSize: 9, cellPadding: 2.5 },
      headStyles: { fillColor: [199, 154, 40], textColor: 255 },
      columnStyles: {
        1: { halign: 'center' },
        2: { halign: 'right' },
        3: { halign: 'right' }
      },
      margin: { left: 14, right: 14 }
    });

    y = doc.lastAutoTable.finalY + 8;

    /* ─── Totals ───────────────────────────────────────── */
    const labelX = W - 80;
    const valX   = W - 14;

    function row(lbl, val, bold){
      doc.setFont('helvetica', bold ? 'bold' : 'normal');
      doc.text(clean(lbl), labelX, y);
      doc.text(clean(val), valX, y, { align: 'right' });
      y += 5.5;
    }

    row('Subtotal', pdfRs(inv.subtotal));
    if(Number(inv.discount) > 0) row('Discount', '- ' + pdfRs(inv.discount));
    if(inv.gst_enabled)          row('GST @ ' + inv.gst_rate + '%', pdfRs(inv.gst_amount));

    doc.setDrawColor(220);
    doc.line(labelX, y - 2, valX, y - 2);
    y += 2;

    row('Total', pdfRs(inv.total), true);
    row('Paid',  pdfRs(inv.paid));
    row('Due',   pdfRs(inv.due), true);

    /* ─── Notes ─────────────────────────────────────────── */
    if(inv.notes){
      y += 6;
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(8);
      doc.setTextColor(100, 100, 100);
      doc.text('Notes: ' + clean(inv.notes), 14, y);
    }

    pdfFooter(doc);
    saveDoc(doc, clean(inv.invoice_no || 'invoice') + '.pdf');
  }

  /* ══════════════════════════════════════════════════════════
     48g — STATEMENT PDF (party or supplier)
     ══════════════════════════════════════════════════════════ */

  function statementPDF(party, type, rows, totals){
    if(!guard()) return;

    const doc = new window.jspdf.jsPDF('p', 'mm', 'a4');
    const label = type === 'retailer' ? 'Retailer'
                : type === 'vendor'   ? 'Vendor'
                : type === 'company'  ? 'Company'
                : 'Customer';

    let y = pdfHeader(doc, 'STATEMENT - ' + clean(party.name || ''));

    doc.setFontSize(9);
    doc.setTextColor(0, 0, 0);
    doc.text('Type: ' + label, 14, y); y += 4;
    if(party.phone){   doc.text('Phone: '   + clean(party.phone),   14, y); y += 4; }
    if(party.address){ doc.text('Address: ' + clean(party.address), 14, y); y += 4; }
    y += 3;

    if(totals){
      y = kpiRow(doc, [
        ['Total Billed', pdfRs(totals.billed)],
        ['Total Paid',   pdfRs(totals.paid)],
        ['Balance',      pdfRs(totals.due)]
      ], y);
    }

    doc.autoTable({
      startY: y,
      head: [['Date', 'Reference', 'Debit', 'Credit', 'Balance']],
      body: rows.map(r => r.map(clean)),
      styles: { fontSize: 8.5, cellPadding: 2 },
      headStyles: { fillColor: [199, 154, 40], textColor: 255 },
      columnStyles: {
        2: { halign: 'right' },
        3: { halign: 'right' },
        4: { halign: 'right' }
      },
      alternateRowStyles: { fillColor: [250, 248, 240] },
      margin: { left: 14, right: 14 }
    });

    pdfFooter(doc);
    saveDoc(doc, 'Statement-' + clean(party.name || '').replace(/\s+/g, '_') + '.pdf');
  }

  /* ══════════════════════════════════════════════════════════
     48h — AUTO-SCRAPE CURRENT PAGE
     Reads KPIs + tables from the visible page and produces a PDF.
     ══════════════════════════════════════════════════════════ */

  function autoGrab(pageTitle){
    const kpis = [];
    document.querySelectorAll('#content .kpi').forEach(k => {
      const lbl = k.querySelector('.kpi-label');
      const val = k.querySelector('.kpi-value');
      if(lbl && val) kpis.push([clean(lbl.innerText.trim()), clean(val.innerText.trim())]);
    });

    const tables = [];
    document.querySelectorAll('#content .card').forEach(card => {
      const tbl = card.querySelector('table');
      if(!tbl) return;

      const titleEl = card.querySelector('.card-title');
      let title = '';
      if(titleEl && titleEl.firstChild){
        title = titleEl.firstChild.textContent ? titleEl.firstChild.textContent.trim() : '';
      }

      const head = [];
      tbl.querySelectorAll('thead th').forEach(th => head.push(clean(th.innerText.trim())));

      const rows = [];
      tbl.querySelectorAll('tbody tr').forEach(tr => {
        const row = [];
        tr.querySelectorAll('td').forEach(td => {
          const clone = td.cloneNode(true);
          clone.querySelectorAll('button, a.btn').forEach(b => b.remove());
          row.push(clean(clone.innerText.trim()));
        });
        if(row.length && row.join('').trim()) rows.push(row);
      });

      if(head.length && rows.length) tables.push({ title: title || 'Table', head, rows });
    });

    if(!kpis.length && !tables.length){
      toast('Nothing to export from this page', 'info');
      return;
    }

    report({
      title: pageTitle,
      meta: 'Generated ' + new Date().toLocaleString('en-IN'),
      kpis: kpis,
      tables: tables,
      filename: pageTitle.replace(/\s+/g, '_') + '-' + todayStr() + '.pdf'
    });
  }

  /* ══════════════════════════════════════════════════════════
     48i — PUBLIC ENTRY POINTS
     ══════════════════════════════════════════════════════════ */

  function report(opts){
    if(!guard()) return;
    const doc = buildReport(opts);
    saveDoc(doc, opts && opts.filename);
  }

  /* Dispatcher used by Margin (Block 38) */
  function run(type, data){
    if(type === 'margin'){ report(data || { title: 'Margin Report' }); return; }
    report(data || { title: 'Report' });
  }

  return {
    invoice:    invoicePDF,
    statement:  statementPDF,
    report:     report,
    auto:       autoGrab,
    run:        run
  };
})();

/* ══════════════════════════════════════════════════════════════
   48j — AUTO-INJECT PDF BUTTONS
    Three contexts:
      1. Invoice view  → "PDF" button next to Print
      2. Profiles      → "Statement" PDF button
      3. Lists / P&L   → "Export PDF" button that scrapes the page
   ══════════════════════════════════════════════════════════════ */

function makeBtn(id, label, handler){
  const b = document.createElement('button');
  b.id = id;
  b.type = 'button';
  b.className = 'btn btn-ghost';
  b.innerHTML = label;
  b.onclick = handler;
  return b;
}

function injectPDFButtons(){
  const hash = location.hash || '#/';
  const content = document.getElementById('content');
  if(!content) return;

  /* ══════════════════════════════════════════════════════
     1. INVOICE VIEW
     ══════════════════════════════════════════════════════ */
  if(hash.indexOf('#/invoice/') === 0){
    if(!document.getElementById('btn-pdf-inv')){
      const ref = document.getElementById('btn-print-a4');
      if(ref){
        const invId = hash.slice(10);
        const btn = makeBtn('btn-pdf-inv', '📄 PDF', () => {
          const inv = (DB.invoices || []).find(x => x.id === invId);
          if(!inv){ toast('Invoice not found', 'error'); return; }
          const items = (DB.invoice_items || []).filter(i => i.invoice_id === invId);
          const party = inv.party_type === 'retailer'
            ? (DB.retailers || []).find(x => x.id === inv.party_id)
            : (DB.customers || []).find(x => x.id === inv.party_id);
          window.PDFMaker.invoice(inv, items, party);
        });
        ref.parentNode.insertBefore(btn, ref.nextSibling);
      }
    }
    return;
  }

  /* ══════════════════════════════════════════════════════
     2. PARTY / SUPPLIER PROFILES
     ══════════════════════════════════════════════════════ */
    const profileMatch = hash.match(/^#\/(customer|retailer|company|vendor)\/(.+)$/);
  if(profileMatch && !document.getElementById('btn-print-statement') && !document.getElementById('btn-pdf-statement')){
    const type = profileMatch[1];
    const id   = profileMatch[2];
    const actions = content.querySelector('.page-actions');
    if(actions){
      const btn = makeBtn('btn-pdf-statement', '📄 Statement', () => {
        if(type === 'customer' || type === 'retailer'){
          const party = (type === 'retailer' ? DB.retailers : DB.customers).find(x => x.id === id);
          if(!party) return;

          const invs = (DB.invoices || []).filter(i => i.party_id === id && i.party_type === type);
          const pays = (DB.payments || []).filter(p => p.party_id === id && p.party_type === type);

          const timeline = [
            ...invs.map(i => ({ date: txDate(i, 'invoice_date'), ref: i.invoice_no, debit: Number(i.total || 0), credit: 0 })),
            ...pays.map(p => ({ date: txDate(p, 'payment_date'), ref: 'Payment - ' + (p.mode || ''), debit: 0, credit: Number(p.amount || 0) }))
          ].sort((a, b) => a.date.localeCompare(b.date));

          let bal = 0;
          const rows = timeline.map(x => {
            bal += x.debit - x.credit;
            return [
              fmtDate(x.date),
              x.ref,
              x.debit  ? pdfRs(x.debit)  : '-',
              x.credit ? pdfRs(x.credit) : '-',
              pdfRs(bal)
            ];
          });

          const st = partyStats(id, type);
          window.PDFMaker.statement(party, type, rows, {
            billed: st.total_billed,
            paid: st.total_paid,
            due: st.due
          });
        } else {
          const s = (DB.suppliers || []).find(x => x.id === id);
          if(!s) return;

          const bills = (DB.supplier_invoices || []).filter(b => b.supplier_id === id);
          const spays = (DB.supplier_payments || []).filter(p => p.supplier_id === id);

          const timeline = [
            ...bills.map(b => ({ date: txDate(b, 'bill_date'), ref: b.bill_no || 'Bill', debit: Number(b.total || 0), credit: 0 })),
            ...spays.map(p => ({ date: txDate(p, 'payment_date'), ref: 'Payment - ' + (p.mode || ''), debit: 0, credit: Number(p.amount || 0) }))
          ].sort((a, b) => a.date.localeCompare(b.date));

          const opening = Number(s.opening_balance || 0);
          let bal = opening;
          const rows = [];
          if(opening){
            rows.push(['Opening', '-', pdfRs(opening), '-', pdfRs(bal)]);
          }
          timeline.forEach(x => {
            bal += x.debit - x.credit;
            rows.push([
              fmtDate(x.date),
              x.ref,
              x.debit  ? pdfRs(x.debit)  : '-',
              x.credit ? pdfRs(x.credit) : '-',
              pdfRs(bal)
            ]);
          });

          const tt = supplierTotals(id);
          window.PDFMaker.report({
            title: 'Statement - ' + s.name,
            meta: clean((s.shop_name || '') + (s.phone ? '   Ph: ' + s.phone : '')),
            kpis: [
              ['Total Purchase', pdfRs(tt.total_purchase)],
              ['Paid',           pdfRs(tt.total_paid)],
              ['Payable',        pdfRs(tt.total_due)]
            ],
            tables: [{
              title: 'Ledger',
              head: ['Date', 'Reference', 'Debit', 'Credit', 'Balance'],
              rows: rows
            }],
            filename: 'Statement-' + clean(s.name).replace(/\s+/g, '_') + '.pdf'
          });
        }
      });
      actions.insertBefore(btn, actions.firstChild);
    }
    return;
  }

  /* ══════════════════════════════════════════════════════
     3. SHOP HEALTH — dedicated export button
     ══════════════════════════════════════════════════════ */
  if(hash === '#/shop-health' && !document.getElementById('btn-pdf-health')){
    const head = content.querySelector('.page-head');
    if(head){
      const btn = makeBtn('btn-pdf-health', '📄 Export PDF', () => {
        const kpis = [];
        const hero = document.getElementById('sh-hero');
        if(hero){
          const lines = hero.innerText.split('\n').map(x => x.trim()).filter(Boolean);
          if(lines.length) kpis.push(['Result', clean(lines.join(' - '))]);
        }
        document.querySelectorAll('#sh-metrics .card').forEach(c => {
          const d = c.children;
          if(d.length >= 2) kpis.push([clean(d[0].innerText.trim()), clean(d[1].innerText.trim())]);
        });

        window.PDFMaker.report({
          title: 'Shop Health',
          meta: 'Generated ' + new Date().toLocaleString('en-IN'),
          kpis: kpis,
          tables: [],
          filename: 'Shop-Health-' + todayStr() + '.pdf'
        });
      });
      head.appendChild(btn);
    }
    return;
  }

  /* ══════════════════════════════════════════════════════
     4. COMPANIES / VENDORS LISTS
     ══════════════════════════════════════════════════════ */
  if((hash === '#/companies' || hash === '#/vendors') && !document.getElementById('btn-pdf-vendors')){
    const isVendor = hash === '#/vendors';
    const list = (DB.suppliers || []).filter(s => (s.type || 'company') === (isVendor ? 'vendor' : 'company'));

    const actions = content.querySelector('.page-actions');
    if(actions){
      const btn = makeBtn('btn-pdf-vendors', '📄 Export PDF', () => {
        const rows = list.map(v => {
          const t = supplierTotals(v.id);
          return [
            v.name,
            v.phone || '-',
            v.category || '-',
            pdfRs(t.total_purchase),
            pdfRs(t.total_paid),
            pdfRs(t.total_due)
          ];
        });
        const totalPayable = list.reduce((a, v) => a + supplierTotals(v.id).total_due, 0);

        window.PDFMaker.report({
          title: isVendor ? 'Vendors' : 'Companies',
          kpis: [
            ['Count',         String(list.length)],
            ['Total Payable', pdfRs(totalPayable)]
          ],
          tables: [{
            title: isVendor ? 'Vendors' : 'Companies',
            head: ['Name', 'Phone', 'Category', 'Purchased', 'Paid', 'Payable'],
            rows: rows
          }],
          filename: (isVendor ? 'Vendors' : 'Companies') + '-' + todayStr() + '.pdf'
        });
      });
      actions.appendChild(btn);
    }
    return;
  }

  /* ══════════════════════════════════════════════════════
     5. GENERIC LIST PAGES
     ══════════════════════════════════════════════════════ */
  const generics = {
    '#/reports':   'Reports',
    '#/pnl':       'Profit and Loss',
    '#/margin':    'Margin',
    '#/invoices':  'Invoices',
    '#/products':  'Products',
    '#/customers': 'Customers',
    '#/retailers': 'Retailers',
    '#/purchases': 'Purchases',
    '#/expenses':  'Expenses',
    '#/payments':  'Payments',
    '#/returns':   'Returns'
  };

  if(generics[hash] && !document.getElementById('btn-pdf-generic')){
    const title = generics[hash];
    const btn = makeBtn('btn-pdf-generic', '📄 Export PDF', () => {
      window.PDFMaker.auto(title);
    });
    const slot = content.querySelector('.page-actions')
              || content.querySelector('.page-head')
              || content.querySelector('.card');
    if(slot) slot.appendChild(btn);
  }
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 49 — ROUTER
   The single entry point that decides which page to render based
   on location.hash. Called by:
     • the initial boot sequence (Block 50)
     • `hashchange` events
     • explicit `route()` calls after save/delete flows
   ══════════════════════════════════════════════════════════════ */

async function route(){
  const rawHash = location.hash || '#/';
  const path    = hashPath(rawHash);

  /* ══════════════════════════════════════════════════════
     49a — PUBLIC PORTAL LINKS (removed feature)
     Any #/c/... link shows a "not available" message.
     ══════════════════════════════════════════════════════ */

  if(path.startsWith('#/c/')){
    const app = $('#app');
    if(app){
      app.innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--ink-3);padding:20px;text-align:center">
          <div style="font-size:40px;opacity:0.35">🔗</div>
          <div style="font-weight:600;color:var(--ink)">Link not available</div>
          <div style="font-size:var(--fs-sm)">Public portal links are not enabled.</div>
        </div>
      `;
    }
    return;
  }

  /* ══════════════════════════════════════════════════════
     49b — AUTH GUARD
     If not logged in → show login screen, stop here.
     ══════════════════════════════════════════════════════ */

  if(!isLoggedIn()){
    renderLogin();
    return;
  }

  /* ══════════════════════════════════════════════════════
     49c — FIRST-LOAD DATA FETCH
     Only on the very first successful route after login.
     Subsequent routes use the in-memory DB.
     ══════════════════════════════════════════════════════ */

  if(window.DB_SYNCED !== true){
    await syncDB();
  }

  /* ══════════════════════════════════════════════════════
     49d — RENDER SHELL
     Layout is rebuilt on every route so the sidebar/topbar
     reflect the current page title + active link.
     ══════════════════════════════════════════════════════ */

  renderLayout();

  const content = document.getElementById('content');
  if(!content) return;

  /* Scroll to top on route change */
  try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch(e){ window.scrollTo(0, 0); }

  /* Close any lingering modal (safety net) */
  const modalRoot = document.getElementById('modal-root');
  if(modalRoot && modalRoot.children.length > 0){
    modalRoot.innerHTML = '';
  }

  /* ══════════════════════════════════════════════════════
     49e — DISPATCH
     Try/catch wraps every page renderer so a single page bug
     never kills the whole app.
     ══════════════════════════════════════════════════════ */

  try {

    /* ─── Core pages ────────────────────────────────── */
    if(path === '#/' || path === ''){
      renderDashboard(content);
    }
    else if(path === '#/analytics'){
      renderAnalytics(content);
    }
    else if(path === '#/margin'){
      renderMargin(content);
    }
    else if(path === '#/shop-health'){
      renderShopHealth(content);
    }

    /* ─── Parties ──────────────────────────────────── */
    else if(path === '#/customers'){
      renderCustomers(content);
    }
    else if(path.startsWith('#/customer/')){
      await renderCustomerProfile(content, path.slice(11));
    }
    else if(path === '#/retailers'){
      renderRetailers(content);
    }
    else if(path.startsWith('#/retailer/')){
      await renderRetailerProfile(content, path.slice(11));
    }

    /* ─── Catalogue ────────────────────────────────── */
    else if(path === '#/products'){
      renderProducts(content);
    }
    else if(path === '#/companies'){
      renderCompanies(content);
    }
    else if(path.startsWith('#/company/')){
      await renderSupplierProfile(content, path.slice(10));
    }
    else if(path === '#/vendors'){
      renderVendors(content);
    }
    else if(path.startsWith('#/vendor/')){
      await renderVendorProfile(content, path.slice(9));
    }

    /* ─── Transactions ─────────────────────────────── */
    else if(path === '#/invoices'){
      renderInvoices(content);
    }
    else if(path.startsWith('#/invoice/')){
      await renderInvoiceView(content, path.slice(10));
    }
    else if(path.startsWith('#/new-invoice/')){
      const afterPrefix = path.slice(14); /* strip '#/new-invoice/' */
      const parts = afterPrefix.split('/');
      const partyType = parts[0] || 'customer';
      const params = hashQuery(rawHash);
      renderNewInvoice(content, partyType, params.party || null);
    }
    else if(path === '#/purchases'){
      renderPurchases(content);
    }
    else if(path === '#/returns'){
      renderReturns(content);
    }
    else if(path === '#/expenses'){
      renderExpenses(content);
    }
    else if(path === '#/payments'){
      renderPayments(content);
    }

    /* ─── Reports ──────────────────────────────────── */
    else if(path === '#/pnl'){
      renderPnL(content);
    }
    else if(path === '#/reports'){
      renderReports(content);
    }

    /* ─── Settings ─────────────────────────────────── */
    else if(path === '#/myshop'){
      renderMyShop(content);
    }
    else if(path === '#/backup'){
      renderBackup(content);
    }

    /* ─── Fallback ─────────────────────────────────── */
    else {
      renderDashboard(content);
    }

  } catch(err){
    console.error('[route] page render failed:', path, err);
    content.innerHTML = `
      <div class="card" style="border-color:var(--red-border);background:var(--red-bg)">
        <div style="font-weight:700;color:var(--red);margin-bottom:6px">
          ⚠️ Page failed to load
        </div>
        <div style="font-size:var(--fs-sm);color:var(--red);font-family:var(--font-mono);word-break:break-word">
          ${esc(err && err.message ? err.message : String(err))}
        </div>
        <div style="margin-top:12px">
          <button class="btn btn-ghost" type="button" onclick="location.hash='#/';location.reload()">
            ← Back to Dashboard
          </button>
        </div>
      </div>
    `;
  }

  /* ══════════════════════════════════════════════════════
     49f — POST-RENDER SIDE EFFECTS
     ══════════════════════════════════════════════════════ */

  /* Refresh active nav highlight + topbar title */
  try { refreshNavActive(); } catch(e){ /* optional */ }

  /* First-time tip for keyboard shortcuts (Block 22) */
  try {
    if(typeof window.maybeShowShortcutHint === 'function'){
      window.maybeShowShortcutHint();
    }
  } catch(e){ /* optional */ }
}

/* ══════════════════════════════════════════════════════════════
   49g — HASHCHANGE LISTENER
   The one and only listener for hash changes.
   Debounced so rapid-fire changes (e.g. programmatic redirects)
   don't trigger multiple overlapping renders.
   ══════════════════════════════════════════════════════════════ */

let _routeDebounceTimer = null;

window.addEventListener('hashchange', () => {
  if(_routeDebounceTimer) clearTimeout(_routeDebounceTimer);
  _routeDebounceTimer = setTimeout(() => {
    _routeDebounceTimer = null;
    route();
  }, 40);
});

/* ══════════════════════════════════════════════════════════════
   49h — GLOBAL ERROR BANNER
   Anything that throws outside of route() gets surfaced in the
   #error-box at the top of the page (usually invisible).
   ══════════════════════════════════════════════════════════════ */

window.addEventListener('error', (event) => {
  const box = document.getElementById('error-box');
  if(!box) return;
  /* Only show errors that look like they came from our app */
  const msg = event.message || '';
  if(!msg) return;
  box.textContent = '[error] ' + msg + (event.filename ? ' (' + event.filename + ':' + event.lineno + ')' : '');
  box.style.display = 'block';
  box.style.padding = '10px';
  box.style.background = '#dc2626';
  box.style.color = '#fff';
  box.style.fontSize = '11px';
  box.style.fontFamily = 'monospace';
  box.style.zIndex = '99999';
  box.style.whiteSpace = 'pre-wrap';
  box.style.maxHeight = '30vh';
  box.style.overflow = 'auto';
});

window.addEventListener('unhandledrejection', (event) => {
  const box = document.getElementById('error-box');
  if(!box) return;
  const reason = event.reason;
  const msg = reason && reason.message ? reason.message : String(reason);
  box.textContent = '[unhandled] ' + msg;
  box.style.display = 'block';
  box.style.padding = '10px';
  box.style.background = '#dc2626';
  box.style.color = '#fff';
  box.style.fontSize = '11px';
  box.style.fontFamily = 'monospace';
  box.style.zIndex = '99999';
  box.style.whiteSpace = 'pre-wrap';
  box.style.maxHeight = '30vh';
  box.style.overflow = 'auto';
});

/* ══════════════════════════════════════════════════════════════
   END BLOCK 49
   ══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   BLOCK 50 — BOOT SEQUENCE & CLOSING TAGS
   Runs once, after every other block has been evaluated.
   ══════════════════════════════════════════════════════════════ */

(async function boot(){
  /* ─── 50a — Apply favicon early ─────────────────────── */
  try {
    applyFavicon();
  } catch(err){
    console.warn('[boot] favicon failed:', err);
  }

  /* ─── 50b — Show loading spinner ───────────────────── */
  const app = document.getElementById('app');
  if(app){
    app.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <div>Connecting…</div>
      </div>
    `;
  }

  try {
    /* ─── 50c — Restore auth session ─────────────────── */
    await initAuth();

    /* ─── 50d — Fetch data only if logged in ─────────── */
    if(isLoggedIn()){
      loadbarStart();
      try {
        await syncDB();
      } finally {
        loadbarEnd();
      }

      /* Apply the reduce-effects preference from settings */
      try {
        initReduceEffects();
      } catch(err){
        console.warn('[boot] reduce-effects init failed:', err);
      }
    }

    /* ─── 50e — Boot the router ──────────────────────── */
    await route();

  } catch(err){
    /* ─── 50f — Fatal boot error ─────────────────────── */
    console.error('[boot] fatal:', err);

    const box = document.getElementById('error-box');
    if(box){
      box.textContent = '[boot error] ' + (err && err.message ? err.message : String(err));
      box.style.display = 'block';
      box.style.background = '#dc2626';
      box.style.color = '#fff';
      box.style.padding = '10px';
      box.style.fontSize = '11px';
      box.style.fontFamily = 'monospace';
      box.style.zIndex = '99999';
      box.style.whiteSpace = 'pre-wrap';
    }

    if(app){
      app.innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center">
          <div style="font-size:40px">⚠️</div>
          <div style="font-size:var(--fs-lg);font-weight:600;color:var(--ink)">Startup failed</div>
          <div style="font-size:var(--fs-sm);color:var(--ink-3);max-width:480px;line-height:1.6">
            Something went wrong while loading the app. Check your internet connection and try again.
          </div>
          <div style="font-size:var(--fs-xs);color:var(--ink-4);font-family:var(--font-mono);max-width:600px;word-break:break-word">
            ${(err && err.message) ? err.message : ''}
          </div>
          <button class="btn btn-primary" type="button" onclick="location.reload()">Reload</button>
        </div>
      `;
    }
  }
})();

/* ══════════════════════════════════════════════════════════════

/* ══════════════════════════════════════════════════════════════
   BLOCK 51 — WALK-IN MODE PATCH
   Adds support for walk-in customers/retailers that don't create
   a saved record. Owner can still save them later from the
   invoice view via a "Save as Customer" button.
   Everything else (saved customer / saved retailer flow) works
   exactly as before.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   51a — HELPER : resolve party name for an invoice
   ══════════════════════════════════════════════════════════════ */

function invoicePartyName(inv){
  if(!inv) return '—';
  if(inv.party_id){
    const p = inv.party_type === 'retailer'
      ? (DB.retailers || []).find(x => x.id === inv.party_id)
      : (DB.customers || []).find(x => x.id === inv.party_id);
    if(p) return p.name;
  }
  return inv.party_name || 'Walk-in';
}

function invoiceParty(inv){
  if(!inv) return null;
  if(inv.party_id){
    const p = inv.party_type === 'retailer'
      ? (DB.retailers || []).find(x => x.id === inv.party_id)
      : (DB.customers || []).find(x => x.id === inv.party_id);
    if(p) return p;
  }
  /* Synthetic party for display-only use */
  if(inv.party_name){
    return { id: null, name: inv.party_name, phone: '', address: '', _walkin: true };
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════
   51b — HELPER : "Save as Customer" modal
   ══════════════════════════════════════════════════════════════ */

function openSaveWalkinModal(inv){
  if(!inv) return;

  const isRetailer = inv.party_type === 'retailer';
  const table = isRetailer ? 'retailers' : 'customers';
  const label = isRetailer ? 'Retailer' : 'Customer';

  openModal(`
    <h2>Save as ${label}</h2>
    <p class="modal-sub">
      Create a proper ${label.toLowerCase()} record for
      "<b>${esc(inv.party_name || 'Walk-in')}</b>"
      and link this invoice to it.
    </p>

    <form id="swf" class="modal-body" novalidate>
      <div class="field">
        <label class="label">Name <span class="req">*</span></label>
        <input class="input" type="text" name="name" maxlength="80"
          value="${esc(inv.party_name || '')}" required autofocus>
      </div>

      <div class="form-row-2">
        <div class="field">
          <label class="label">Phone</label>
          <input class="input" type="tel" name="phone" maxlength="20" placeholder="Optional">
        </div>
        <div class="field">
          <label class="label">Address</label>
          <input class="input" type="text" name="address" maxlength="140" placeholder="Optional">
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="swf-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="swf-save">Save &amp; Link</button>
      </div>
    </form>
  `, (root) => {
    const form = root.querySelector('#swf');
    const btn  = root.querySelector('#swf-save');

    root.querySelector('#swf-cancel').onclick = () => closeModal(root);

    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const name = (fd.get('name') || '').trim();
      if(!name){ toast('Name required', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      const data = {
        name,
        phone:       (fd.get('phone')   || '').trim(),
        address:     (fd.get('address') || '').trim(),
        joined_date: todayStr(),
        tx_time:     ''
      };

      const ins = await sb.from(table).insert(data).select().single();
      if(ins.error){
        toast(ins.error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Save & Link';
        return;
      }

      /* Link the invoice to the new record */
      const upd = await sb.from('invoices').update({ party_id: ins.data.id }).eq('id', inv.id);
      if(upd.error){
        /* Rollback the just-created row */
        await sb.from(table).delete().eq('id', ins.data.id);
        toast(upd.error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Save & Link';
        return;
      }

      await syncDB();
      toast(label + ' saved and linked', 'success');
      closeModal(root);
      route();
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   51c — OVERRIDE : invoiceToOption (returns picker)
   Adds walk-in name fallback so the invoice picker on the Returns
   page shows the walk-in name for those invoices.
   ══════════════════════════════════════════════════════════════ */

invoiceToOption = function(i){
  if(!i) return null;
  const name = invoicePartyName(i);
  const typeLabel = i.party_type === 'retailer' ? 'Retailer' : 'Customer';
  const walkinTag = !i.party_id ? ' (walk-in)' : '';

  return {
    id:         i.id,
    label:      (i.invoice_no || 'INV') + ' — ' + name + walkinTag,
    sublabel:   txDT(i, 'invoice_date') + '   ' + rs(i.total) + (Number(i.due) > 0 ? '   Due ' + rs(i.due) : ''),
    searchText: ((i.invoice_no || '') + ' ' + name).toLowerCase(),
    dueText:    Number(i.due) > 0 ? 'Due ' + rs(i.due) : '',
    metaText:   typeLabel
  };
};

/* ══════════════════════════════════════════════════════════════
   51d — OVERRIDE : renderNewInvoice
   Party section now has a two-mode toggle:
     🚶 Walk-in  →  free-text name (optional)
     👥 Saved    →  searchable picker (with + Add new)
   Defaults: customer → walk-in · retailer → saved
   ══════════════════════════════════════════════════════════════ */

renderNewInvoice = function(content, partyType, preselectPartyId){
  if(!content) return;

  const isRetailer = partyType === 'retailer';
  const partyLabel = isRetailer ? 'Retailer' : 'Customer';
  const priceField = isRetailer ? 'wholesale_price' : 'customer_price';
  const priceLabel = isRetailer ? 'Wholesale' : 'Customer';
  const priceColor = isRetailer ? 'var(--purple)' : 'var(--blue)';
  const backUrl    = isRetailer ? '#/retailers' : '#/customers';
  const parties    = isRetailer ? DB.retailers : DB.customers;

  /* Local state */
  let lines = [];
  let partyMode = isRetailer ? 'saved' : 'walkin';
  let walkinName = '';

  content.innerHTML = `
    <a href="${backUrl}" style="color:var(--ink-3);font-size:var(--fs-sm)">← Back to ${partyLabel}s</a>

    <div class="page-head" style="margin-top:8px">
      <div>
        <h1>New Invoice — ${partyLabel}</h1>
        <p>
          Prices auto-set to
          <b style="color:${priceColor}">${priceLabel}</b>
          tier — you can override per line.
        </p>
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:16px">
      ${dateTimeFieldHTML(null, '', 'Invoice date')}

      <!-- ════════ PARTY SECTION ════════ -->
      <div class="field">
        <label class="label">${partyLabel} <span class="req">*</span></label>

        <div class="btn-group" id="ni-party-mode" style="display:inline-flex;margin-bottom:10px">
          <button type="button" class="btn" data-mode="walkin">🚶 Walk-in</button>
          <button type="button" class="btn" data-mode="saved">👥 Saved ${partyLabel}</button>
        </div>

        <!-- Walk-in box -->
        <div id="ni-walkin-box" style="display:none">
          <input class="input" type="text" id="ni-walkin-name" maxlength="80"
            placeholder="Name (optional — leave blank for generic walk-in)">
          <div class="field-hint">
            Walk-in ${partyLabel.toLowerCase()}s aren't saved. You can save them later from the invoice.
          </div>
        </div>

        <!-- Saved picker -->
        <div id="ni-saved-box" style="display:none">
          <div id="ni-party-mount"></div>
        </div>
      </div>

      <!-- ════════ PRODUCTS ════════ -->
      <div class="field">
        <label class="label">Add products</label>
        <div id="ni-prod-mount"></div>
        <div class="field-hint">
          Search by name or category. Click a result to add it.
        </div>
      </div>

      <div id="ni-lines"></div>

      ${SETTINGS.gst_enabled ? `
        <div style="padding:12px;background:var(--primary-soft);border-radius:var(--r-md);border:1px solid var(--primary-tint)">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:var(--fs-sm)">
            <input type="checkbox" id="ni-gst" checked>
            <span>
              <b>Apply GST @ ${Number(SETTINGS.gst_rate) || 0}%</b>
              ${SETTINGS.gst_number ? `<span style="color:var(--ink-3)"> · ${esc(SETTINGS.gst_number)}</span>` : ''}
            </span>
          </label>
        </div>
      ` : ''}

      <div class="form-row-3">
        <div class="field">
          <label class="label">Discount (₹)</label>
          <input class="input" type="number" step="any" min="0" id="ni-disc" value="0">
        </div>
        <div class="field">
          <label class="label">Paid now (₹)</label>
          <input class="input" type="number" step="any" min="0" id="ni-paid" value="0">
        </div>
        <div class="field">
          <label class="label">Notes</label>
          <input class="input" type="text" id="ni-notes" maxlength="200" placeholder="Optional">
        </div>
      </div>

      <div id="ni-summary" style="background:var(--card-alt);padding:14px;border-radius:var(--r-md);border:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:var(--fs-sm)"></div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="history.back()">Cancel</button>
        <button type="button" class="btn btn-ghost" id="ni-save-print">Save &amp; Print</button>
        <button type="button" class="btn btn-primary" id="ni-save">Save Invoice</button>
      </div>
    </div>
  `;

  /* ══════════════════════════════════════════════════════
     PARTY MODE TOGGLE
     ══════════════════════════════════════════════════════ */

  const modeBtns = content.querySelectorAll('#ni-party-mode button');
  const walkinBox = content.querySelector('#ni-walkin-box');
  const savedBox  = content.querySelector('#ni-saved-box');

  function setPartyMode(mode){
    partyMode = mode;
    modeBtns.forEach(b => {
      b.classList.toggle('btn-primary', b.dataset.mode === mode);
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    walkinBox.style.display = mode === 'walkin' ? 'block' : 'none';
    savedBox.style.display  = mode === 'saved'  ? 'block' : 'none';
  }

  modeBtns.forEach(b => { b.onclick = () => setPartyMode(b.dataset.mode); });

  /* Walk-in name input */
  const walkinInput = content.querySelector('#ni-walkin-name');
  walkinInput.oninput = (e) => { walkinName = e.target.value; };

  /* Mount saved picker */
  const partyMount = content.querySelector('#ni-party-mount');
  partyMount.innerHTML = searchSelectHTML('ni-party-ss', 'Search by name or phone…');

  const partySS = mountSearchSelect(content.querySelector('#ni-party-ss'), {
    items: parties.map(p => partyToOption(p, partyType)),
    allowAdd: true,
    onAdd: () => {
      openPartyForm(partyType, null);
      const check = setInterval(() => {
        if(!document.querySelector('#modal-root .modal-overlay')){
          clearInterval(check);
          partySS.setItems((isRetailer ? DB.retailers : DB.customers).map(p => partyToOption(p, partyType)));
        }
      }, 300);
    }
  });

  if(preselectPartyId){
    setTimeout(() => {
      partySS.setValue(preselectPartyId);
      setPartyMode('saved');
    }, 120);
  }

  /* Apply default mode */
  setPartyMode(partyMode);

  /* ══════════════════════════════════════════════════════
     PRODUCT PICKER
     ══════════════════════════════════════════════════════ */

  const prodMount = content.querySelector('#ni-prod-mount');
  prodMount.innerHTML = searchSelectHTML('ni-prod-ss', 'Search products…');

  const prodSS = mountSearchSelect(content.querySelector('#ni-prod-ss'), {
    items: DB.products.map(productToOption),
    allowAdd: true,
    onAdd: () => {
      openProductForm(null, null, () => {
        prodSS.setItems(DB.products.map(productToOption));
      });
    },
    onSelect: (opt) => {
      if(!opt) return;
      const p = DB.products.find(x => x.id === opt.id);
      if(!p) return;
      addLine(p);
      setTimeout(() => prodSS.reset(), 60);
    }
  });

  /* ══════════════════════════════════════════════════════
     LINES
     ══════════════════════════════════════════════════════ */

  // ✅ FIX: Added missing priceForUnit helper function
  function priceForUnit(p, unit){
    const base = Number(p[priceField]) || 0;
    if(p.dual && p.pack_unit && unit === p.pack_unit){
      return round2(base * (Number(p.pack_size) || 1));
    }
    return base;
  }

  function addLine(p){
    let defaultUnit;
    if(p.dual){
      defaultUnit = (p.primary_unit === 'pack_unit' && p.pack_unit)
        ? p.pack_unit
        : (p.base_unit || 'piece');
    } else {
      defaultUnit = p.unit || 'piece';
    }

    // ✅ FIX: Defined the missing 'price' variable
    const price = priceForUnit(p, defaultUnit);

    lines.push({
      product_id:   p.id,
      product_name: p.name,
      dual:         !!p.dual,
      base_unit:    p.base_unit || null,
      pack_unit:    p.pack_unit || null,
      pack_size:    Number(p.pack_size) || 1,
      unit:         defaultUnit,
      qty:          1,
      price:        price,
      total:        price
    });

    renderLines();
  }

  function renderLines(){
    const box = content.querySelector('#ni-lines');
    if(!box) return;

    if(!lines.length){
      box.innerHTML = `
        <div style="padding:28px 16px;text-align:center;color:var(--ink-3);font-size:var(--fs-sm);background:var(--card-alt);border-radius:var(--r-md);border:1px dashed var(--border-strong)">
          No items added yet. Search and add products above.
        </div>
      `;
      updateSummary();
      return;
    }

    box.innerHTML = `
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:32%">Item</th>
              <th style="width:90px;text-align:right">Qty</th>
              <th style="width:150px">Unit</th>
              <th style="width:110px;text-align:right">Price ₹</th>
              <th style="text-align:right">Total</th>
              <th style="width:40px"></th>
            </tr>
          </thead>
          <tbody>
            ${lines.map((l, i) => {
              const unitCell = l.dual
                ? `<select class="input-inline unit" data-i="${i}" data-f="unit">
                     <option value="${esc(l.pack_unit)}" ${l.unit === l.pack_unit ? 'selected' : ''}>
                       ${esc(l.pack_unit)} (${fmtNum(l.pack_size)} ${esc(l.base_unit)})
                     </option>
                     <option value="${esc(l.base_unit)}" ${l.unit === l.base_unit ? 'selected' : ''}>
                       ${esc(l.base_unit)}
                     </option>
                   </select>`
                : `<span style="font-size:var(--fs-sm);color:var(--ink-3)">${esc(l.unit || '—')}</span>`;

              return `
                <tr>
                  <td>
                    <strong style="display:block;color:var(--ink)">${esc(l.product_name)}</strong>
                    ${l.dual ? `<span style="font-size:var(--fs-xs);color:var(--ink-3)">${fmtNum(l.pack_size)} ${esc(l.base_unit)} / ${esc(l.pack_unit)}</span>` : ''}
                  </td>
                  <td>
                    <input class="input-inline qty" type="number" step="any" min="0.01"
                      data-i="${i}" data-f="qty" value="${l.qty}">
                  </td>
                  <td>${unitCell}</td>
                  <td>
                    <input class="input-inline price" type="number" step="any" min="0"
                      data-i="${i}" data-f="price" value="${l.price}" placeholder="0.00">
                  </td>
                  <td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${rs(l.total)}</td>
                  <td>
                    <button class="btn btn-ghost btn-sm" type="button" data-del="${i}" style="color:var(--red)">✕</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
    /* ✅ FIX: wire up Qty and Price inputs so the row total
       and the summary recompute as the user types. */
    box.querySelectorAll('input[data-i]').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const i = +e.target.dataset.i;
        const f = e.target.dataset.f;
        const v = Number(e.target.value) || 0;

        lines[i][f] = v;
        lines[i].total = round2(Number(lines[i].qty || 0) * Number(lines[i].price || 0));

        /* Update only the row's Total cell — full re-render would
           steal focus from the input the user is typing in. */
        const totalCell = e.target.closest('tr').querySelector('td:nth-last-child(2)');
        if(totalCell) totalCell.textContent = rs(lines[i].total);

        updateSummary();
      });

      /* On blur, do a clean re-render so everything is consistent. */
      inp.addEventListener('blur', () => renderLines());
    });
    box.querySelectorAll('select[data-i]').forEach(sel => {
      sel.onchange = (e) => {
        const i = +e.target.dataset.i;
        lines[i].unit = e.target.value;
        const p = DB.products.find(x => x.id === lines[i].product_id);
        if(p){
          lines[i].price = priceForUnit(p, lines[i].unit);
          lines[i].total = round2(Number(lines[i].qty || 0) * Number(lines[i].price || 0));
        }
        renderLines();
      };
    });

    box.querySelectorAll('[data-del]').forEach(b => {
      b.onclick = () => {
        lines.splice(+b.dataset.del, 1);
        renderLines();
      };
    });

    updateSummary();
  }

  /* ══════════════════════════════════════════════════════
     SUMMARY
     ══════════════════════════════════════════════════════ */

  function updateSummary(){
    const sumEl = content.querySelector('#ni-summary');
    if(!sumEl) return;

    const sub = lines.reduce((s, l) => s + Number(l.total || 0), 0);
    const disc = Number(content.querySelector('#ni-disc').value) || 0;
    const gstOn = SETTINGS.gst_enabled && content.querySelector('#ni-gst') && content.querySelector('#ni-gst').checked;
    const gstRate = gstOn ? (Number(SETTINGS.gst_rate) || 0) : 0;
    const afterDisc = Math.max(0, sub - disc);
    const gstAmt = gstOn ? round2(afterDisc * gstRate / 100) : 0;
    const total = round2(afterDisc + gstAmt);
    const paid = Number(content.querySelector('#ni-paid').value) || 0;
    const due = round2(Math.max(0, total - paid));

    sumEl.innerHTML = `
      <div>Subtotal: <b style="font-variant-numeric:tabular-nums">${rs(sub)}</b></div>
      ${disc > 0 ? `<div>Discount: <b style="color:var(--red);font-variant-numeric:tabular-nums">− ${rs(disc)}</b></div>` : ''}
      ${gstOn ? `<div>GST @ ${gstRate}%: <b style="font-variant-numeric:tabular-nums">${rs(gstAmt)}</b></div>` : ''}
      <div>Total: <b style="color:var(--primary-hover);font-size:var(--fs-md);font-variant-numeric:tabular-nums">${rs(total)}</b></div>
      <div>Paid: <b style="color:var(--green);font-variant-numeric:tabular-nums">${rs(paid)}</b></div>
      <div>Due: <b style="color:${due > 0 ? 'var(--red)' : 'var(--green)'};font-variant-numeric:tabular-nums">${rs(due)}</b></div>
    `;
  }

  content.querySelector('#ni-disc').oninput = updateSummary;
  content.querySelector('#ni-paid').oninput = updateSummary;
  const gstToggle = content.querySelector('#ni-gst');
  if(gstToggle) gstToggle.onchange = updateSummary;

  renderLines();

  /* ══════════════════════════════════════════════════════
     SAVE
     ══════════════════════════════════════════════════════ */

  async function saveInvoice(){
    if(!lines.length){
      toast('Add at least one item', 'error');
      return null;
    }

    for(const l of lines){
      if(!(Number(l.qty) > 0)){
        toast('Qty must be greater than 0 for ' + l.product_name, 'error');
        return null;
      }
      if(!(Number(l.price) >= 0)){
        toast('Price cannot be negative for ' + l.product_name, 'error');
        return null;
      }
    }

    let finalPartyId = null;
    let finalPartyName = '';

    if(partyMode === 'saved'){
      const id = partySS.getValue();
      if(!id){
        toast('Please select a ' + partyLabel.toLowerCase(), 'error');
        return null;
      }
      finalPartyId = id;
      finalPartyName = '';
    } else {
      /* Walk-in mode — name is optional */
      const trimmed = (walkinName || '').trim();
      finalPartyId = null;
      finalPartyName = trimmed || 'Walk-in';
    }

    const dt = readDateTime(content);
    if(!dt) return null;

    const sc = checkStock(lines);
    if(!sc.ok){
      toast(
        'Not enough stock: ' + sc.productName +
        ' — need ' + fmtNum(sc.need) + ' ' + sc.unit +
        ', have ' + fmtNum(sc.available),
        'error'
      );
      return null;
    }

    const sub = lines.reduce((s, l) => s + Number(l.total || 0), 0);
    const disc = Number(content.querySelector('#ni-disc').value) || 0;
    const paid = Number(content.querySelector('#ni-paid').value) || 0;
    const notes = (content.querySelector('#ni-notes').value || '').trim();
    const gstOn = SETTINGS.gst_enabled && gstToggle && gstToggle.checked;
    const gstRate = gstOn ? (Number(SETTINGS.gst_rate) || 0) : 0;
    const afterDisc = Math.max(0, sub - disc);
    const gstAmt = gstOn ? round2(afterDisc * gstRate / 100) : 0;
    const total = round2(afterDisc + gstAmt);
    const due = round2(Math.max(0, total - paid));

    const invData = {
      invoice_no:   nextInvoiceNo(partyType),
      party_id:     finalPartyId,
      party_type:   partyType,
      party_name:   finalPartyName,
      subtotal:     round2(sub),
      discount:     round2(disc),
      total,
      paid:         round2(paid),
      due,
      notes,
      invoice_date: dt.date,
      tx_time:      dt.time,
      gst_enabled:  gstOn,
      gst_rate:     gstRate,
      gst_amount:   gstAmt
    };

    const { data: inv, error: invErr } = await sb.from('invoices').insert(invData).select().single();
    if(invErr){
      toast('Invoice save failed: ' + invErr.message, 'error');
      return null;
    }

    const itemRows = lines.map(l => ({
      invoice_id:   inv.id,
      product_id:   l.product_id,
      product_name: l.product_name,
      dual:         !!l.dual,
      base_unit:    l.base_unit || null,
      pack_unit:    l.pack_unit || null,
      pack_size:    l.pack_size || null,
      unit:         l.unit || null,
      qty:          Number(l.qty),
      price:        Number(l.price),
      total:        Number(l.total)
    }));

    const { error: itErr } = await sb.from('invoice_items').insert(itemRows);
    if(itErr){
      toast('Line items save failed: ' + itErr.message, 'error');
      await sb.from('invoices').delete().eq('id', inv.id);
      return null;
    }

    for(const l of lines){
      const ded = lineDeductBaseQty(l);
      await adjustStock(l.product_id, -ded);
    }

    await syncDB();
    return inv;
  }

  const saveBtn = content.querySelector('#ni-save');
  const savePrint = content.querySelector('#ni-save-print');

  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    const original = saveBtn.textContent;
    saveBtn.textContent = 'Saving…';
    const inv = await saveInvoice();
    saveBtn.disabled = false;
    saveBtn.textContent = original;
    if(inv){
      toast('Invoice saved · ' + inv.invoice_no, 'success');
      location.hash = '#/invoice/' + inv.id;
    }
  };

  savePrint.onclick = async () => {
    savePrint.disabled = true;
    const original = savePrint.textContent;
    savePrint.textContent = 'Saving…';
    const inv = await saveInvoice();
    savePrint.disabled = false;
    savePrint.textContent = original;
    if(!inv) return;
    toast('Invoice saved · ' + inv.invoice_no, 'success');
    location.hash = '#/invoice/' + inv.id;
  };
};

/* ══════════════════════════════════════════════════════════════

          <option value="due">Only with due</option>

          <option value="walkin">Walk-ins only</option>
        </select>
      </div>

        <label class="label">Sort</label>
        <select class="input" id="inv-sort">
          <option value="date-desc">Newest first</option>
          <option value="date">Oldest first</option>
          <option value="total-desc">Total (high)</option>
          <option value="due-desc">Due (high)</option>

  function filtered(){
    const q      = (content.querySelector('#inv-search').value || '').toLowerCase().trim();
    const type   = content.querySelector('#inv-type').value;
    const status = content.querySelector('#inv-status').value;
    const sortBy = content.querySelector('#inv-sort').value;

    let arr = list.slice();

    if(q){
      arr = arr.filter(i => {
        const name = invoicePartyName(i).toLowerCase();
        const hay = ((i.invoice_no || '') + ' ' + name).toLowerCase();
        return hay.includes(q);
      });
    }

    if(type) arr = arr.filter(i => i.party_type === type);

    if(status === 'due')    arr = arr.filter(i => Number(i.due) > 0);
    if(status === 'paid')   arr = arr.filter(i => Number(i.due) === 0 && Number(i.total) > 0);
    if(status === 'credit') arr = arr.filter(i => Number(i.total) < 0);
    if(status === 'walkin') arr = arr.filter(i => !i.party_id);

    switch(sortBy){
      case 'date-desc':
        arr.sort((a, b) => txDate(b, 'invoice_date').localeCompare(txDate(a, 'invoice_date')));

      case 'date':

        arr.sort((a, b) => Number(b.total) - Number(a.total));
        break;
      case 'due-desc':
        arr.sort((a, b) => Number(b.due) - Number(a.due));

    body.innerHTML = arr.map(i => {

        } else {

          partyCell = `<span style="color:var(--ink-3)">${esc(i.party_name || '—')}</span>`;
        }
      } else if(i.party_name){
        partyCell = `<span style="color:var(--ink-2)">${esc(i.party_name)}</span>
          <span class="chip chip-amber chip-xs" style="margin-left:4px">walk-in</span>`;

      return `
        <tr>
          <td>
            <a href="#/invoice/${i.id}" style="font-weight:600;color:var(--ink)">
              ${esc(i.invoice_no || 'INV')}
            </a>
            ${isCredit ? ' <span class="chip chip-red chip-xs">CREDIT</span>' : ''}
          </td>
          <td>${partyCell}</td>
          <td>${typeChip}</td>
          <td style="color:var(--ink-3);font-size:var(--fs-sm)">${txDT(i, 'invoice_date')}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${isCredit ? 'var(--red)' : 'var(--ink)'}">
            ${rs(i.total)}

          <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${Number(i.due) > 0 ? 'var(--red)' : 'var(--ink-3)'}">

  content.querySelector('#inv-type').onchange   = renderTable;
  content.querySelector('#inv-status').onchange = renderTable;

/* ══════════════════════════════════════════════════════════════
   51g — OVERRIDE : exportInvoicesCSV
   Includes walk-in name when party_id is null.
   ══════════════════════════════════════════════════════════════ */

exportInvoicesCSV = function(rows){
  const list = (rows || []).map(i => {
    const name = invoicePartyName(i);
    const isWalkin = !i.party_id;

    return [
      i.invoice_no || '',
      name,
      isWalkin ? 'walk-in' : '',
      i.party_type === 'retailer' ? 'Retailer' : 'Customer',
      txDate(i, 'invoice_date'),
      i.tx_time || '',
      Number(i.subtotal || 0).toFixed(2),
      Number(i.discount || 0).toFixed(2),
      i.gst_enabled ? (Number(i.gst_rate) || 0) : '',
      Number(i.gst_amount || 0).toFixed(2),
      Number(i.total || 0).toFixed(2),
      Number(i.paid || 0).toFixed(2),
      Number(i.due || 0).toFixed(2),
      i.notes || ''
    ];
  });

  const header = [
    'Invoice No', 'Party', 'Walk-in', 'Type',
    'Date', 'Time',
    'Subtotal', 'Discount', 'GST Rate', 'GST Amount',
    'Total', 'Paid', 'Due', 'Notes'
  ];

  const all = [header, ...list];
  const csv = all.map(row => row.map(cell => {
    const s = String(cell ?? '');
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'Invoices-' + todayStr() + '.csv');
  toast('CSV downloaded', 'success');
};
