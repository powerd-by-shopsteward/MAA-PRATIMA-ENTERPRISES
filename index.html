/* ══════════════════════════════════════════════════════════════
   BLOCK 28 — COMPANIES MODULE (SHARED SUPPLIER ENGINE)
   Companies (type='company') and Vendors (type='vendor') share
   the same table, form, list, and profile. This block defines
   the shared engine + the Companies routes. Block 29 wires
   Vendors by calling the same functions with type='vendor'.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   28a — SUPPLIER CATEGORIES (stationery)
   ══════════════════════════════════════════════════════════════ */

const SUP_CATS = [
  'Pens & Writing',
  'Pencils & Erasers',
  'Notebooks & Registers',
  'Books & Guides',
  'Art & Craft Supplies',
  'Geometry & Instruments',
  'Paper & Rolls',
  'Files & Folders',
  'Office Stationery',
  'School Kits',
  'Other'
];

/* ══════════════════════════════════════════════════════════════
   28b — SHARED SUPPLIER LIST
   Used by Companies (type='company') and Vendors (type='vendor').
   ══════════════════════════════════════════════════════════════ */

function renderSupplierList(content, type){
  if(!content) return;

  const isVendor   = type === 'vendor';
  const label      = isVendor ? 'Vendors' : 'Companies';
  const labelSing  = isVendor ? 'Vendor'  : 'Company';
  const subtitle   = isVendor
    ? 'other distributors you buy from'
    : 'companies whose products you stock';
  const icon       = isVendor ? '🚚' : '🏢';
  const routeTag   = isVendor ? '#/vendor/' : '#/company/';

  const list = (DB.suppliers || []).filter(s => (s.type || 'company') === type);

  /* Aggregate KPIs */
  const totalPurchase = list.reduce((s, sup) => s + supplierTotals(sup.id).total_purchase, 0);
  const totalPayable  = list.reduce((s, sup) => s + supplierTotals(sup.id).total_due, 0);

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>${label}</h1>
        <p>
          ${list.length} ${labelSing.toLowerCase()}${list.length === 1 ? '' : 's'} ·
          ${subtitle} ·
          payable <b style="color:${totalPayable > 0 ? 'var(--red)' : 'var(--green)'}">${rs(totalPayable)}</b>
        </p>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost" type="button" id="sup-export">📤 Export</button>
        <button class="btn btn-primary" type="button" id="sup-add">+ Add ${labelSing}</button>
      </div>
    </div>

    <!-- KPI row -->
    <div class="grid-4" style="margin-bottom:16px">
      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Total ${labelSing}s</div>
          <div class="kpi-icon">${icon}</div>
        </div>
        <div class="kpi-value">${list.length}</div>
        <div class="kpi-trend">in your network</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Total Purchased</div>
          <div class="kpi-icon">📥</div>
        </div>
        <div class="kpi-value">${rs(totalPurchase)}</div>
        <div class="kpi-trend">all-time cost</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Total Payable</div>
          <div class="kpi-icon" style="background:var(--red-bg);color:var(--red)">💳</div>
        </div>
        <div class="kpi-value" style="color:${totalPayable > 0 ? 'var(--red)' : 'var(--green)'}">${rs(totalPayable)}</div>
        <div class="kpi-trend">outstanding balance</div>
      </div>

      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Products Linked</div>
          <div class="kpi-icon">📦</div>
        </div>
        <div class="kpi-value">
          ${(DB.products || []).filter(p => list.some(s => s.id === p.supplier_id)).length}
        </div>
        <div class="kpi-trend">across all ${labelSing.toLowerCase()}s</div>
      </div>
    </div>

    ${list.length === 0 ? `
      <div class="card">
        ${emptyStateHTML(
          icon,
          `No ${labelSing.toLowerCase()}s yet`,
          isVendor
            ? 'Add other distributors you buy from.'
            : 'Add the companies whose products you stock.',
          `<button class="btn btn-primary" type="button" onclick="openSupplierForm(null, '${type}')">+ Add your first ${labelSing.toLowerCase()}</button>`
        )}
      </div>
    ` : `
      <div class="grid-2">
        ${list.map(s => {
          const tt = supplierTotals(s.id);
          const productCount = (DB.products || []).filter(p => p.supplier_id === s.id).length;
          return `
            <div class="card" style="cursor:pointer" data-sup-card="${s.id}">
              <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px">
                <div style="flex:1;min-width:0">
                  <div style="font-weight:700;font-size:var(--fs-md);color:var(--ink);margin-bottom:2px">
                    ${esc(s.name)}
                  </div>
                  ${s.shop_name ? `<div style="font-size:var(--fs-sm);color:var(--ink-3)">${esc(s.shop_name)}</div>` : ''}
                  <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-3);margin-top:6px">
                    ${s.phone ? `<span>📞 ${esc(s.phone)}</span>` : ''}
                    ${s.category ? categoryChip(s.category) : ''}
                  </div>
                </div>
                <span class="chip ${isVendor ? 'chip-purple' : 'chip-blue'} chip-xs">
                  ${labelSing.toUpperCase()}
                </span>
              </div>

              <div class="grid-3" style="margin-top:6px">
                <div class="mini-stat">
                  <div class="lbl">Purchased</div>
                  <div class="val" style="font-size:var(--fs-base)">${rs(tt.total_purchase)}</div>
                </div>
                <div class="mini-stat">
                  <div class="lbl">Paid</div>
                  <div class="val" style="font-size:var(--fs-base);color:var(--green)">${rs(tt.total_paid)}</div>
                </div>
                <div class="mini-stat" style="background:${tt.total_due > 0 ? 'var(--red-bg)' : 'var(--green-bg)'};border-color:${tt.total_due > 0 ? 'var(--red-border)' : 'var(--green-border)'}">
                  <div class="lbl">Payable</div>
                  <div class="val" style="font-size:var(--fs-base);color:${tt.total_due > 0 ? 'var(--red)' : 'var(--green)'}">${rs(tt.total_due)}</div>
                </div>
              </div>

              ${productCount ? `
                <div style="margin-top:10px;font-size:var(--fs-xs);color:var(--ink-3)">
                  📦 ${productCount} product${productCount === 1 ? '' : 's'} linked
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;

  /* ─── Wire card clicks → profile ──────────────────────── */
  $$('[data-sup-card]', content).forEach(card => {
    card.onclick = () => { location.hash = routeTag + card.dataset.supCard; };
  });

  /* ─── Add button ──────────────────────────────────────── */
  const addBtn = $('#sup-add', content);
  if(addBtn){
    addBtn.onclick = () => openSupplierForm(null, type);
  }

  /* ─── Export ──────────────────────────────────────────── */
  const exp = $('#sup-export', content);
  if(exp){
    exp.onclick = () => exportSuppliersCSV(list, type);
  }
}

/* ══════════════════════════════════════════════════════════════
   28c — COMPANY LIST ROUTE (thin wrapper)
   ══════════════════════════════════════════════════════════════ */

function renderCompanies(content){
  renderSupplierList(content, 'company');
}

/* ══════════════════════════════════════════════════════════════
   28d — SHARED SUPPLIER FORM (add / edit)
   type = 'company' | 'vendor'
   ══════════════════════════════════════════════════════════════ */

function openSupplierForm(existing, type, onCreated){
  const vType = (existing && existing.type) || type || 'company';
  const isVendor = vType === 'vendor';
  const label = isVendor ? 'Vendor' : 'Company';

  const s = existing || {
    name:             '',
    shop_name:        '',
    phone:            '',
    email:            '',
    address:          '',
    gst:              '',
    category:         '',
    notes:            '',
    opening_balance:  0,
    joined_date:      todayStr(),
    tx_time:          ''
  };

  openModal(`
    <h2>${existing ? 'Edit ' + label : 'New ' + label}</h2>
    <p class="modal-sub">${isVendor ? 'A distributor you buy from.' : 'A company whose products you stock.'}</p>

    <form id="supf" class="modal-body" novalidate>
      <div class="form-row-2">
        <div class="field">
          <label class="label">${label} name <span class="req">*</span></label>
          <input class="input" type="text" name="name" maxlength="120" required
            value="${esc(s.name)}" autofocus
            placeholder="${isVendor ? 'e.g. Sharma Distributors' : 'e.g. Camlin Ltd.'}">
        </div>
        <div class="field">
          <label class="label">Firm / brand name</label>
          <input class="input" type="text" name="shop_name" maxlength="120"
            value="${esc(s.shop_name || '')}"
            placeholder="Optional secondary name">
        </div>
      </div>

      <div class="form-row-2">
        <div class="field">
          <label class="label">Phone</label>
          <input class="input" type="tel" name="phone" maxlength="20"
            value="${esc(s.phone || '')}" placeholder="10-digit number">
        </div>
        <div class="field">
          <label class="label">Email</label>
          <input class="input" type="email" name="email" maxlength="100"
            value="${esc(s.email || '')}" placeholder="Optional">
        </div>
      </div>

      <div class="field">
        <label class="label">Address</label>
        <input class="input" type="text" name="address" maxlength="200"
          value="${esc(s.address || '')}" placeholder="Street, area, city">
      </div>

      <div class="form-row-2">
        <div class="field">
          <label class="label">GSTIN</label>
          <input class="input" type="text" name="gst" maxlength="20"
            value="${esc(s.gst || '')}" placeholder="Optional">
        </div>
        <div class="field">
          <label class="label">Category</label>
          <select class="input" name="category">
            <option value="">— Select —</option>
            ${SUP_CATS.map(c => `
              <option value="${esc(c)}" ${s.category === c ? 'selected' : ''}>${esc(c)}</option>
            `).join('')}
          </select>
        </div>
      </div>

      ${dateTimeFieldHTML(s.joined_date || todayStr(), s.tx_time || '', 'Associated since')}

      <div class="form-row-2">
        <div class="field">
          <label class="label">Opening balance (₹)</label>
          <input class="input" type="number" step="any" name="opening_balance"
            value="${s.opening_balance || 0}" placeholder="0.00">
          <div class="field-hint">Amount already owed before using this app.</div>
        </div>
        <div class="field">
          <label class="label">Notes</label>
          <input class="input" type="text" name="notes" maxlength="200"
            value="${esc(s.notes || '')}" placeholder="Optional">
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="supf-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="supf-save">
          ${existing ? 'Update' : 'Save'} ${label}
        </button>
      </div>
    </form>
  `, (root) => {
    const form = root.querySelector('#supf');
    const btn  = root.querySelector('#supf-save');

    root.querySelector('#supf-cancel').onclick = () => closeModal(root);

    form.onsubmit = async (e) => {
      e.preventDefault();

      const nameEl = form.querySelector('input[name="name"]');
      const name = (nameEl.value || '').trim();
      if(!name){
        toast('Please enter a name', 'error');
        nameEl.focus();
        return;
      }

      const dt = readDateTime(form);
      if(!dt) return;

      const fd = new FormData(form);
      const data = {
        name,
        shop_name:       (fd.get('shop_name')       || '').trim(),
        phone:           (fd.get('phone')           || '').trim(),
        email:           (fd.get('email')           || '').trim(),
        address:         (fd.get('address')         || '').trim(),
        gst:             (fd.get('gst')             || '').trim(),
        category:        (fd.get('category')        || '').trim(),
        notes:           (fd.get('notes')           || '').trim(),
        opening_balance: Number(fd.get('opening_balance')) || 0,
        joined_date:     dt.date,
        tx_time:         dt.time,
        type:            vType
      };

      btn.disabled = true;
      btn.textContent = 'Saving…';

      let res;
      if(existing){
        res = await sb.from('suppliers').update(data).eq('id', existing.id).select().single();
      } else {
        res = await sb.from('suppliers').insert(data).select().single();
      }

      if(res.error){
        toast(res.error.message, 'error');
        btn.disabled = false;
        btn.textContent = (existing ? 'Update' : 'Save') + ' ' + label;
        return;
      }

      if(existing) dbUpsertLocal('suppliers', res.data);
      else DB.suppliers = [res.data, ...(DB.suppliers || [])];

      toast(label + ' ' + (existing ? 'updated' : 'added'), 'success');
      closeModal(root);

      if(typeof onCreated === 'function'){
        try { onCreated(res.data); } catch(err){ console.warn('[sup created]', err); }
      } else {
        route();
      }
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   28e — SUPPLIER PAYMENT FORM
   Records a payment made to a company or vendor.
   ══════════════════════════════════════════════════════════════ */

function openSupplierPaymentForm(supplier){
  if(!supplier) return;

  const tt = supplierTotals(supplier.id);

  openModal(`
    <h2>Pay to ${esc(supplier.name)}</h2>
    <p class="modal-sub">
      Current payable:
      <b style="color:${tt.total_due > 0 ? 'var(--red)' : 'var(--green)'}">${rs(tt.total_due)}</b>
    </p>

    <form id="spf" class="modal-body" novalidate>
      ${dateTimeFieldHTML(null, '', 'Payment date')}

      <div class="field">
        <label class="label">Amount <span class="req">*</span></label>
        <input class="input" type="number" step="any" min="0.01" name="amount" required
          value="${tt.total_due > 0 ? tt.total_due.toFixed(2) : ''}" autofocus>
        ${tt.total_due > 0 ? `<div class="field-hint">Suggested: full outstanding balance</div>` : ''}
      </div>

      <div class="field">
        <label class="label">Payment mode</label>
        <select class="input" name="mode">
          ${PAYMENT_MODES.map(m => `<option value="${m}">${m.charAt(0).toUpperCase() + m.slice(1)}</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <label class="label">Notes</label>
        <input class="input" type="text" name="notes" maxlength="200" placeholder="Optional">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="spf-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="spf-save">Save Payment</button>
      </div>
    </form>
  `, (root) => {
    const form = root.querySelector('#spf');
    const btn  = root.querySelector('#spf-save');

    root.querySelector('#spf-cancel').onclick = () => closeModal(root);

    form.onsubmit = async (e) => {
      e.preventDefault();

      const dt = readDateTime(form);
      if(!dt) return;

      const fd = new FormData(form);
      const amt = Number(fd.get('amount')) || 0;
      if(amt <= 0){
        toast('Amount must be greater than 0', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      const payload = {
        supplier_id:  supplier.id,
        amount:       amt,
        mode:         fd.get('mode') || 'cash',
        notes:        (fd.get('notes') || '').trim(),
        payment_date: dt.date,
        tx_time:      dt.time
      };

      const { error } = await sb.from('supplier_payments').insert(payload);
      if(error){
        toast(error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Save Payment';
        return;
      }

      toast('Payment recorded', 'success');
      closeModal(root);
      route();
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   28f — SUPPLIER PROFILE (shared for company + vendor)
   ══════════════════════════════════════════════════════════════ */

async function renderSupplierProfile(content, id){
  if(!content) return;

  const s = (DB.suppliers || []).find(x => x.id === id);
  if(!s){
    content.innerHTML = emptyStateHTML('❓', 'Not found', 'This supplier may have been deleted.');
    return;
  }

  const isVendor = s.type === 'vendor';
  const label    = isVendor ? 'Vendor' : 'Company';
  const backUrl  = isVendor ? '#/vendors' : '#/companies';
  const icon     = isVendor ? '🚚' : '🏢';

  const tt = supplierTotals(id);
  const bills = (DB.supplier_invoices || [])
    .filter(b => b.supplier_id === id)
    .sort((a, b) => txDate(b, 'bill_date').localeCompare(txDate(a, 'bill_date')));
  const pays = (DB.supplier_payments || [])
    .filter(p => p.supplier_id === id)
    .sort((a, b) => txDate(b, 'payment_date').localeCompare(txDate(a, 'payment_date')));
  const returnsToThis = (DB.returns || [])
    .filter(r => r.direction === 'to_supplier' && r.supplier_id === id);
  const products = (DB.products || [])
    .filter(p => p.supplier_id === id)
    .sort((a, b) => a.name.localeCompare(b.name));

  content.innerHTML = `
    <a href="${backUrl}" style="color:var(--ink-3);font-size:var(--fs-sm)">← Back to ${label}s</a>

    <div class="page-head" style="margin-top:8px">
      <div>
        <h1>${esc(s.name)}</h1>
        <p>
          <span class="chip ${isVendor ? 'chip-purple' : 'chip-blue'} chip-xs">${label.toUpperCase()}</span>
          ${s.shop_name ? '   ' + esc(s.shop_name) : ''}
          ${s.phone ? '   📞 ' + esc(s.phone) : ''}
          ${s.category ? '   ' + esc(s.category) : ''}
        </p>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost" type="button" id="sup-edit">Edit</button>
        <button class="btn btn-ghost" type="button" id="sup-pay">💳 Pay</button>
        <button class="btn btn-primary" type="button" id="sup-buy">+ Purchase Bill</button>
      </div>
    </div>

    <!-- KPI row -->
    <div class="grid-4" style="margin-bottom:16px">
      <div class="mini-stat">
        <div class="lbl">Opening</div>
        <div class="val">${rs(tt.opening)}</div>
      </div>
      <div class="mini-stat">
        <div class="lbl">Total Purchased</div>
        <div class="val">${rs(tt.total_purchase)}</div>
      </div>
      <div class="mini-stat">
        <div class="lbl">Total Paid</div>
        <div class="val" style="color:var(--green)">${rs(tt.total_paid)}</div>
      </div>
      <div class="mini-stat" style="background:${tt.total_due > 0 ? 'var(--red-bg)' : 'var(--green-bg)'};border-color:${tt.total_due > 0 ? 'var(--red-border)' : 'var(--green-border)'}">
        <div class="lbl">Payable</div>
        <div class="val" style="color:${tt.total_due > 0 ? 'var(--red)' : 'var(--green)'}">${rs(tt.total_due)}</div>
      </div>
    </div>

    <!-- Contact details -->
    ${(s.address || s.email || s.gst || s.notes) ? `
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">Details</div>
        <div class="grid-2">
          ${s.address ? `<div><div style="font-size:var(--fs-xs);color:var(--ink-3);text-transform:uppercase;font-weight:600;letter-spacing:0.04em">Address</div><div>${esc(s.address)}</div></div>` : ''}
          ${s.email ? `<div><div style="font-size:var(--fs-xs);color:var(--ink-3);text-transform:uppercase;font-weight:600;letter-spacing:0.04em">Email</div><div>${esc(s.email)}</div></div>` : ''}
          ${s.gst ? `<div><div style="font-size:var(--fs-xs);color:var(--ink-3);text-transform:uppercase;font-weight:600;letter-spacing:0.04em">GSTIN</div><div>${esc(s.gst)}</div></div>` : ''}
          ${s.notes ? `<div><div style="font-size:var(--fs-xs);color:var(--ink-3);text-transform:uppercase;font-weight:600;letter-spacing:0.04em">Notes</div><div>${esc(s.notes)}</div></div>` : ''}
        </div>
      </div>
    ` : ''}

    <!-- Bills + Payments -->
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">Purchase Bills <small>${bills.length}</small></div>
        ${!bills.length
          ? '<p style="color:var(--ink-3);font-size:var(--fs-sm);text-align:center;padding:20px 0">No bills yet</p>'
          : `
            <div style="display:flex;flex-direction:column;gap:8px">
              ${bills.slice(0, 10).map(b => {
                const bal = Number(b.total) - Number(b.paid);
                return `
                  <div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm)">
                    <div style="flex:1;min-width:0">
                      <div style="font-weight:600">${esc(b.bill_no || 'Bill')}</div>
                      <div style="color:var(--ink-3);font-size:var(--fs-xs)">${txDT(b, 'bill_date')}</div>

                    <div style="text-align:right;white-space:nowrap">
                      <div style="font-weight:600;font-variant-numeric:tabular-nums">${rs(b.total)}</div>
                      <div style="color:${bal > 0 ? 'var(--red)' : 'var(--green)'};font-size:var(--fs-xs)">
                        ${bal > 0 ? 'Due ' + rs(bal) : 'Paid'}
                      </div>
                    </div>
                    <button class="btn btn-ghost btn-sm" type="button" data-bill-del="${b.id}" style="color:var(--red);align-self:center">Del</button>
                  </div>
                `;

            </div>
            ${bills.length > 10 ? `<div style="text-align:center;padding-top:10px;font-size:var(--fs-xs);color:var(--ink-3)">+ ${bills.length - 10} more…</div>` : ''}
          `}

      <div class="card">
        <div class="card-title">Payments Made <small>${pays.length}</small></div>
        ${!pays.length
          ? '<p style="color:var(--ink-3);font-size:var(--fs-sm);text-align:center;padding:20px 0">No payments yet</p>'
          : `
            <div style="display:flex;flex-direction:column;gap:8px">
              ${pays.slice(0, 10).map(p => `
                <div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm)">
                  <div style="flex:1;min-width:0">
                    <div style="color:var(--green);font-weight:600">${rs(p.amount)}</div>
                    <div style="color:var(--ink-3);font-size:var(--fs-xs)">${txDT(p, 'payment_date')} · ${esc(p.mode || '')}</div>
                  </div>

    <!-- Returns to supplier -->
    ${returnsToThis.length ? `
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">Returns to this ${label} <small>${returnsToThis.length}</small></div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Product</th>
                <th style="text-align:right">Qty</th>
                <th style="text-align:right">Amount</th>
                <th>Reason</th>
              </tr>
            </thead>
            <tbody>
              ${returnsToThis.map(r => `
                <tr>
                  <td>${txDT(r, 'return_date')}</td>

    <!-- Products from this supplier -->
    ${products.length ? `
      <div class="card">
        <div class="card-title">Products from this ${label} <small>${products.length}</small></div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>

                <th>Category</th>
                <th style="text-align:right">Cost</th>
                <th style="text-align:right">Customer</th>
                <th style="text-align:right">Wholesale</th>
                <th style="text-align:right">Stock</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${products.map(p => {
                const d = productDisplay(p);
                return `
                  <tr style="cursor:pointer" data-prod="${p.id}">
                    <td><strong>${esc(p.name)}</strong></td>
                    <td>${categoryChip(p.category)}</td>
                    <td style="text-align:right">${rs(p.cost)}</td>
                    <td style="text-align:right;color:var(--blue)">${rs(p.customer_price)}</td>
                    <td style="text-align:right;color:var(--purple)">${rs(p.wholesale_price)}</td>
                    <td style="text-align:right;font-weight:600">${esc(d.stockLabel)}</td>
                    <td>${stockBadge(p)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    ` : ''}

    <div style="text-align:center;font-size:var(--fs-xs);color:var(--ink-4);padding:12px 0">
      ${enteredOn(s)}
    </div>
  `;

  /* ─── Wire actions ────────────────────────────────────── */

  $('#sup-edit').onclick = () => openSupplierForm(s);

  $('#sup-pay').onclick = () => openSupplierPaymentForm(s);

  $('#sup-buy').onclick = () => {
    try {
      if(typeof openPurchaseBillForm === 'function') openPurchaseBillForm(s);
      else { toast('Purchase module loading…', 'info'); location.hash = '#/purchases'; }
    } catch(e){
      console.warn('[purchase open]', e);
      location.hash = '#/purchases';
    }
  };

  /* Delete a purchase bill — reverses stock first */
  $$('[data-bill-del]', content).forEach(b => {
    b.onclick = async () => {
      const bill = (DB.supplier_invoices || []).find(x => x.id === b.dataset.billDel);
      if(!bill) return;
      if(!confirmDlg(
        `Delete bill "${bill.bill_no || 'Bill'}"?\n\nStock added by this bill will be reversed.`,
        'Confirm Delete'
      )) return;

            const items = (DB.supplier_invoice_items || []).filter(x => x.supplier_invoice_id === bill.id);
      for(const it of items){
        await adjustStock(it.product_id, -purchaseLineBaseQty(it));
      }

      await sb.from('supplier_invoices').delete().eq('id', bill.id);
      toast('Bill deleted, stock reversed', 'success');
      await syncDB();
      route();
    };
  });

  /* Delete a supplier payment */
  $$('[data-spay-del]', content).forEach(b => {
    b.onclick = async () => {
      if(!confirmDlg('Delete this payment?', 'Confirm Delete')) return;
      await sb.from('supplier_payments').delete().eq('id', b.dataset.spayDel);
      toast('Payment deleted', 'success');
      await syncDB();
      route();
    };
  });

  /* Product row click → product edit */
  $$('[data-prod]', content).forEach(row => {
    row.onclick = () => {
      const p = (DB.products || []).find(x => x.id === row.dataset.prod);
      if(p && typeof openProductForm === 'function') openProductForm(p);
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   28g — SUPPLIER CSV EXPORT
   ══════════════════════════════════════════════════════════════ */

function exportSuppliersCSV(rows, type){
  const list = (rows || []).map(s => {
    const tt = supplierTotals(s.id);
    return [
      s.name,
      s.shop_name || '',
      s.phone || '',
      s.email || '',
      s.address || '',
      s.gst || '',
      s.category || '',
      Number(tt.opening).toFixed(2),
      Number(tt.total_purchase).toFixed(2),
      Number(tt.total_paid).toFixed(2),
      Number(tt.total_due).toFixed(2),
      fmtDate(s.joined_date),
      type === 'vendor' ? 'Vendor' : 'Company'
    ];
  });

  const header = [
    'Name', 'Firm', 'Phone', 'Email', 'Address', 'GSTIN', 'Category',
    'Opening', 'Purchased', 'Paid', 'Payable', 'Associated Since', 'Type'
  ];

  const all = [header, ...list];
  const csv = all.map(row => row.map(cell => {
    const str = String(cell ?? '');
    if(/[",\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
    return str;
  }).join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const label = type === 'vendor' ? 'Vendors' : 'Companies';
  downloadBlob(blob, label + '-' + todayStr() + '.csv');
  toast('CSV downloaded', 'success');
}

async function renderPartyProfile(content, id, type){

  const isRetailer = type === 'retailer';
  const label      = isRetailer ? 'Retailer' : 'Customer';

  const backUrl    = isRetailer ? '#/retailers' : '#/customers';

      <a href="${backUrl}" style="color:var(--ink-3);font-size:var(--fs-sm)">← Back to ${labelPlur}</a>

      </div>

  }

  const st     = partyStats(id, type);
  const rating = computeRating(st);

  let ratingCls = 'chip-green';
  if(rating < 3)      ratingCls = 'chip-red';
  else if(rating < 4) ratingCls = 'chip-amber';

  const invoices = (DB.invoices || [])
    .filter(i => i.party_id === id && i.party_type === type)
    .sort((a, b) => txDate(b, 'invoice_date').localeCompare(txDate(a, 'invoice_date')));

  const payments = (DB.payments || [])
    .filter(p => p.party_id === id && p.party_type === type)
    .sort((a, b) => txDate(b, 'payment_date').localeCompare(txDate(a, 'payment_date')));

  const returns = (DB.returns || [])
    .filter(r => r.direction === 'from_party' && r.party_id === id && r.party_type === type);

  content.innerHTML = `
    <a href="${backUrl}" style="color:var(--ink-3);font-size:var(--fs-sm)">
      ← Back to ${labelPlur}
    </a>

    <div class="page-head" style="margin-top:8px">
      <div>
        <h1 style="display:flex;align-items:center;gap:10px">
          <span>${esc(party.name)}</span>
          <span class="chip ${ratingCls} chip-xs">${rating} ★</span>
        </h1>
        <p>
          <span class="chip ${isRetailer ? 'chip-blue' : 'chip-green'} chip-xs">${label.toUpperCase()}</span>
          ${party.phone ? '   📞 ' + esc(party.phone) : ''}
          ${party.address ? '   📍 ' + esc(party.address) : ''}
          ${party.joined_date ? '   ·   Joined ' + fmtDate(party.joined_date) : ''}
        </p>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost" type="button" id="pp-edit">Edit</button>
        <button class="btn btn-ghost" type="button" id="pp-pay">💳 Payment</button>
        <button class="btn btn-primary" type="button" id="pp-new-inv">+ New Invoice</button>
      </div>
    </div>

    <!-- KPI row -->
    <div class="grid-4" style="margin-bottom:16px">
      <div class="mini-stat">
        <div class="lbl">Total Invoiced</div>
        <div class="val">${rs(st.total_billed)}</div>
      </div>
      <div class="mini-stat">
        <div class="lbl">Returns</div>
        <div class="val" style="color:${st.total_returned > 0 ? 'var(--red)' : 'var(--ink-3)'}">
          ${st.total_returned > 0 ? '− ' + rs(st.total_returned) : rs(0)}
        </div>
      </div>
      <div class="mini-stat">
        <div class="lbl">Total Paid</div>
        <div class="val" style="color:${st.total_paid > 0 ? 'var(--green)' : 'var(--ink-3)'}">${rs(st.total_paid)}</div>
      </div>
      <div class="mini-stat" style="background:${st.due > 0 ? 'var(--red-bg)' : (st.due < 0 ? 'var(--blue-bg)' : 'var(--green-bg)')};border-color:${st.due > 0 ? 'var(--red-border)' : (st.due < 0 ? 'var(--blue-border)' : 'var(--green-border)')}">
        <div class="lbl">${st.due < 0 ? 'Credit Balance' : 'Net Due'}</div>
        <div class="val" style="color:${st.due > 0 ? 'var(--red)' : (st.due < 0 ? 'var(--blue)' : 'var(--green)')}">
          ${rs(st.due)}
        </div>
      </div>
    </div>

    <!-- Invoices + Payments side by side -->
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">
          Invoices
          <small>${invoices.length}</small>
        </div>
        ${!invoices.length
          ? '<p style="color:var(--ink-3);font-size:var(--fs-sm);text-align:center;padding:20px 0">No invoices yet</p>'
          : `
            <div style="display:flex;flex-direction:column;gap:8px">
              ${invoices.slice(0, 12).map(i => {
                const isCredit = Number(i.total) < 0;
                const displayTotal = isCredit ? -Math.abs(Number(i.total || 0)) : Number(i.total || 0);
                return `
                  <div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm)">
                    <div style="flex:1;min-width:0">
                      <a href="#/invoice/${i.id}" style="font-weight:600;color:var(--ink)">
                        ${esc(i.invoice_no || 'INV')}
                      </a>
                      ${isCredit ? ' <span class="chip chip-red chip-xs">CREDIT</span>' : ''}
                      <div style="color:var(--ink-3);font-size:var(--fs-xs)">${txDT(i, 'invoice_date')}</div>
                    </div>
                    <div style="text-align:right;white-space:nowrap">
                      <div style="font-weight:600;font-variant-numeric:tabular-nums;color:${isCredit ? 'var(--red)' : 'var(--ink)'}">
                        ${rs(displayTotal)}
                      </div>
                      ${!isCredit && Number(i.due) > 0
                        ? `<div style="color:var(--red);font-size:var(--fs-xs)">Due ${rs(i.due)}</div>`
                        : (!isCredit ? '<div style="color:var(--green);font-size:var(--fs-xs)">Paid</div>' : '')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            ${invoices.length > 12
              ? `<div style="text-align:center;padding-top:10px;font-size:var(--fs-xs);color:var(--ink-3)">+ ${invoices.length - 12} more…</div>`
              : ''}
          `}
      </div>

      <div class="card">
        <div class="card-title">
          Payments
          <small>${payments.length}</small>
        </div>
        ${!payments.length
          ? '<p style="color:var(--ink-3);font-size:var(--fs-sm);text-align:center;padding:20px 0">No payments yet</p>'
          : `
            <div style="display:flex;flex-direction:column;gap:8px">
              ${payments.slice(0, 12).map(p => `
                <div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm)">
                  <div style="flex:1;min-width:0">
                    <div style="color:var(--green);font-weight:600;font-variant-numeric:tabular-nums">${rs(p.amount)}</div>
                    <div style="color:var(--ink-3);font-size:var(--fs-xs)">${txDT(p, 'payment_date')} · ${esc(p.mode || '')}</div>
                  </div>
                  <button class="btn btn-ghost btn-sm" type="button"
                    data-pay-del="${p.id}" style="color:var(--red);align-self:center">Del</button>
                </div>
              `).join('')}
            </div>
            ${payments.length > 12
              ? `<div style="text-align:center;padding-top:10px;font-size:var(--fs-xs);color:var(--ink-3)">+ ${payments.length - 12} more…</div>`
              : ''}
          `}
      </div>
    </div>

    <!-- Statement -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">
        Statement
        <small>Running balance</small>
      </div>
      ${(() => {
               const timeline = [
          ...invoices.map(i => {
            const isCredit = Number(i.total) < 0;
            return {
              date:   txDate(i, 'invoice_date'),
              kind:   isCredit ? 'Credit Note' : 'Invoice',
              ref:    i.invoice_no || 'INV',
              id:     i.id,
              debit:  isCredit ? 0 : Number(i.total || 0),
              credit: isCredit ? Math.abs(Number(i.total || 0)) : 0
            };
          }),

          /* ✅ FIX: amounts paid at invoice time live on invoices.paid,
             not in the payments table — add them as credits */
          ...invoices
            .filter(i => Number(i.paid || 0) > 0)
            .map(i => ({
              date:   txDate(i, 'invoice_date'),
              kind:   'Paid at invoice',
              ref:    (i.invoice_no || 'INV') + ' — paid',
              id:     i.id,
              debit:  0,
              credit: Number(i.paid || 0)
            })),

          ...payments.map(p => ({
            date:   txDate(p, 'payment_date'),
            kind:   'Payment',
            ref:    p.mode || 'payment',
            id:     p.id,
            debit:  0,
            credit: Number(p.amount || 0)
          }))
        ].sort((a, b) => a.date.localeCompare(b.date));

        if(!timeline.length){
          return '<p style="color:var(--ink-3);font-size:var(--fs-sm);text-align:center;padding:20px 0">No transactions yet</p>';
        }

        let balance = 0;
        const rows = timeline.map(t => {
          balance += t.debit - t.credit;
          const isInvoice = t.kind === 'Invoice';
          return `
            <tr>
              <td style="color:var(--ink-3);font-size:var(--fs-sm)">${fmtDate(t.date)}</td>
              <td>
                ${isInvoice
                  ? `<a href="#/invoice/${t.id}" style="font-weight:600">${esc(t.ref)}</a>`
                  : `<span style="color:var(--ink-2)">${esc(t.ref)}</span>`}
              </td>
              <td style="text-align:right;font-variant-numeric:tabular-nums">${t.debit ? rs(t.debit) : '—'}</td>
              <td style="text-align:right;color:var(--green);font-variant-numeric:tabular-nums">${t.credit ? rs(t.credit) : '—'}</td>
              <td style="text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:${balance > 0 ? 'var(--red)' : (balance < 0 ? 'var(--blue)' : 'var(--green)')}">
                ${rs(balance)}
              </td>
            </tr>
          `;
        }).join('');

        return `
          <div class="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Reference</th>
                  <th style="text-align:right">Debit</th>
                  <th style="text-align:right">Credit</th>
                  <th style="text-align:right">Balance</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      })()}
    </div>

    ${returns.length ? `
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">Returns from this ${label} <small>${returns.length}</small></div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Product</th>
                <th style="text-align:right">Qty</th>
                <th style="text-align:right">Refund</th>
                <th>Reason</th>
              </tr>
            </thead>
            <tbody>
              ${returns.map(r => `
                <tr>
                  <td style="color:var(--ink-3);font-size:var(--fs-sm)">${txDT(r, 'return_date')}</td>
                  <td>${esc(r.product_name || '—')}</td>
                  <td style="text-align:right">${fmtNum(r.qty)} ${esc(r.unit || '')}</td>
                  <td style="text-align:right;color:var(--red);font-weight:600">${rs(r.amount)}</td>
                  <td style="color:var(--ink-3);font-size:var(--fs-sm)">${esc(r.reason || '—')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    ` : ''}

    <div style="text-align:center;font-size:var(--fs-xs);color:var(--ink-4);padding:12px 0">
      ${enteredOn(party)}
    </div>
  `;

  /* ─── Wire actions ────────────────────────────────────── */
  $('#pp-edit').onclick = () => openPartyForm(type, party);
  $('#pp-pay').onclick  = () => openPartyPaymentForm(id, type);
  $('#pp-new-inv').onclick = () => {
    location.hash = '#/new-invoice/' + type + '?party=' + id;
  };

  $$('[data-pay-del]', content).forEach(b => {
    b.onclick = async () => {
      const p = (DB.payments || []).find(x => x.id === b.dataset.payDel);
      if(!p) return;
      if(!confirmDlg('Delete payment of ' + rs(p.amount) + '?', 'Confirm Delete')) return;

      const { error } = await sb.from('payments').delete().eq('id', p.id);
      if(error){
        toast(error.message, 'error');
        return;
      }
      dbRemoveLocal('payments', p.id);
      toast('Payment deleted', 'success');
      route();
    };
  });
}

/* ══════════════════════════════════════════════════════════
   29d — PARTY PAYMENT FORM (customer + retailer)
   Records a payment received from a customer or retailer.
   ══════════════════════════════════════════════════════════ */

function openPartyPaymentForm(partyId, partyType){
  const isRetailer = partyType === 'retailer';
  const label      = isRetailer ? 'Retailer' : 'Customer';
  const table      = isRetailer ? 'retailers' : 'customers';
  const party      = (DB[table] || []).find(x => x.id === partyId);
  if(!party) return;

  const st = partyStats(partyId, partyType);

  openModal(`
    <h2>Record Payment</h2>
    <p class="modal-sub">
      ${label}: <b>${esc(party.name)}</b>
      ${st.due > 0 ? `  ·  Outstanding: <b style="color:var(--red)">${rs(st.due)}</b>` : ''}
    </p>

    <form id="ppf" class="modal-body" novalidate>
      ${dateTimeFieldHTML(null, '', 'Payment date')}

      <div class="field">
        <label class="label">Amount <span class="req">*</span></label>
        <input class="input" type="number" step="any" min="0.01" name="amount" required
          value="${st.due > 0 ? st.due.toFixed(2) : ''}" autofocus
          placeholder="0.00">
        ${st.due > 0 ? '<div class="field-hint">Suggested: full outstanding balance</div>' : ''}
      </div>

      <div class="field">
        <label class="label">Payment mode</label>
        <select class="input" name="mode">
          ${PAYMENT_MODES.map(m => `
            <option value="${m}">${m.charAt(0).toUpperCase() + m.slice(1)}</option>
          `).join('')}
        </select>
      </div>

      <div class="field">
        <label class="label">Notes</label>
        <input class="input" type="text" name="notes" maxlength="200" placeholder="Optional reference or remark">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="ppf-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="ppf-save">Save Payment</button>
      </div>
    </form>
  `, (root) => {
    const form = root.querySelector('#ppf');
    const btn  = root.querySelector('#ppf-save');

    root.querySelector('#ppf-cancel').onclick = () => closeModal(root);

    form.onsubmit = async (e) => {
      e.preventDefault();

      const dt = readDateTime(form);
      if(!dt) return;

      const fd = new FormData(form);
      const amt = Number(fd.get('amount')) || 0;
      if(amt <= 0){
        toast('Amount must be greater than 0', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      const payload = {
        party_id:     partyId,
        party_type:   partyType,
        amount:       amt,
        mode:         fd.get('mode') || 'cash',
        notes:        (fd.get('notes') || '').trim(),
        payment_date: dt.date,
        tx_time:      dt.time
      };

      const { error } = await sb.from('payments').insert(payload);
      if(error){
        toast(error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Save Payment';
        return;
      }

      toast('Payment recorded', 'success');
      closeModal(root);

      /* Refresh profile page if we're on one */
      if(location.hash.startsWith('#/customer/') || location.hash.startsWith('#/retailer/')){
        await syncDB();
        route();
      }
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   30 — NEW INVOICE BUILDER (Fixed Dual-Unit Price & Delete Bug)
   ══════════════════════════════════════════════════════════════ */
function renderNewInvoice(content, partyType, preselectPartyId){
  if(!content) return;

  const isRetailer = partyType === 'retailer';
  const partyLabel = isRetailer ? 'Retailer' : 'Customer';
  const priceField = isRetailer ? 'wholesale_price' : 'customer_price';
  const priceLabel = isRetailer ? 'Wholesale' : 'Customer';
  const priceColor = isRetailer ? 'var(--purple)' : 'var(--blue)';
  const backUrl    = isRetailer ? '#/retailers' : '#/customers';
  const parties    = isRetailer ? DB.retailers : DB.customers;

  let lines = [];

  content.innerHTML = `
    <a href="${backUrl}" style="color:var(--ink-3);font-size:var(--fs-sm)">← Back to ${partyLabel}s</a>
    <div class="page-head" style="margin-top:8px">
      <div><h1>New Invoice — ${partyLabel}</h1><p>Prices auto-set to <b style="color:${priceColor}">${priceLabel}</b> tier — you can override per line.</p></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:16px">
      ${dateTimeFieldHTML(null, '', 'Invoice date')}
      <div class="field">
        <label class="label">${partyLabel} <span class="req">*</span></label>
        <div id="ni-party-mount"></div>
      </div>
      <div class="field">
        <label class="label">Add products</label>
        <div id="ni-prod-mount"></div>
        <div class="field-hint">Search by name, category, or unit.</div>
      </div>
      <div id="ni-lines"></div>
      ${SETTINGS.gst_enabled ? `
        <div style="padding:12px;background:var(--primary-soft);border-radius:var(--r-md);border:1px solid var(--primary-tint)">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:var(--fs-sm)">
            <input type="checkbox" id="ni-gst" checked>
            <span><b>Apply GST @ ${Number(SETTINGS.gst_rate) || 0}%</b>${SETTINGS.gst_number ? ` · ${esc(SETTINGS.gst_number)}` : ''}</span>
          </label>
        </div>
      ` : ''}
      <div class="form-row-3">
              <div class="form-row-3">
        <div class="field">
          <label class="label">Discount (₹)</label>
          <input class="input" type="number" step="any" min="0" id="ni-disc" value="0" placeholder="0.00">
        </div>
        <div class="field">
          <label class="label">Paid now (₹)</label>
          <input class="input" type="number" step="any" min="0" id="ni-paid" value="0" placeholder="0.00">
        </div>
        <div class="field">
          <label class="label">Notes</label>
          <input class="input" type="text" id="ni-notes" maxlength="200" placeholder="Optional">
        </div>
      </div>
      <div id="ni-summary" style="background:var(--card-alt);padding:14px;border-radius:var(--r-md);border:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:var(--fs-sm)"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="history.back()">Cancel</button>
        <button type="button" class="btn btn-ghost" id="ni-save-print">Save &amp; Print</button>
        <button type="button" class="btn btn-primary" id="ni-save">Save Invoice</button>
      </div>
    </div>
  `;

  const partyMount = $('#ni-party-mount');
  partyMount.innerHTML = searchSelectHTML('ni-party-ss', 'Search by name or phone…');
  const partySS = mountSearchSelect($('#ni-party-ss'), {
    items: parties.map(p => partyToOption(p, partyType)),
    allowAdd: true,
    onAdd: () => {
      openPartyForm(partyType, null);
      const check = setInterval(() => {
        if(!document.querySelector('#modal-root .modal-overlay')){
          clearInterval(check);
          partySS.setItems((isRetailer ? DB.retailers : DB.customers).map(p => partyToOption(p, partyType)));
        }
      }, 300);
    }
  });
  if(preselectPartyId){ setTimeout(() => partySS.setValue(preselectPartyId), 120); }

  const prodMount = $('#ni-prod-mount');
  prodMount.innerHTML = searchSelectHTML('ni-prod-ss', 'Search products…');
  const prodSS = mountSearchSelect($('#ni-prod-ss'), {
    items: DB.products.map(productToOption),
    allowAdd: true,
    onAdd: () => { openProductForm(null, null, () => { prodSS.setItems(DB.products.map(productToOption)); }); },
    onSelect: (opt) => {
      if(!opt) return;
      const p = DB.products.find(x => x.id === opt.id);
      if(!p) return;
      addLine(p);
      setTimeout(() => prodSS.reset(), 60);
    }
  });

  // ✅ FIX: Correctly handle price based on unit
  function priceForUnit(p, unit){
    const base = Number(p[priceField]) || 0;
    if(p.dual && p.pack_unit && unit === p.pack_unit){
      return round2(base * (Number(p.pack_size) || 1));
    }
    return base;
  }

  function addLine(p){
    let defaultUnit = p.dual ? (p.primary_unit === 'pack_unit' && p.pack_unit ? p.pack_unit : (p.base_unit || 'piece')) : (p.unit || 'piece');
    const price = priceForUnit(p, defaultUnit);
    lines.push({
      product_id: p.id, product_name: p.name, dual: !!p.dual,
      base_unit: p.base_unit || null, pack_unit: p.pack_unit || null,
      pack_size: Number(p.pack_size) || 1, unit: defaultUnit,
      qty: 1, price: price, total: price
    });
    renderLines();
  }

  function renderLines(){
    const box = $('#ni-lines');
    if(!box) return;
    if(!lines.length){
      box.innerHTML = '<div style="padding:28px;text-align:center;color:var(--ink-3);background:var(--card-alt);border-radius:var(--r-md);border:1px dashed var(--border-strong)">No items added yet.</div>';
      updateSummary(); return;
    }
    box.innerHTML = `
      <div class="tbl-wrap"><table>
        <thead><tr><th style="width:32%">Item</th><th style="width:90px;text-align:right">Qty</th><th style="width:150px">Unit</th><th style="width:110px;text-align:right">Price ₹</th><th style="text-align:right">Total</th><th style="width:40px"></th></tr></thead>
        <tbody>
          ${lines.map((l, i) => {
            const unitCell = l.dual
              ? `<select class="input-inline unit" data-i="${i}" data-f="unit">
                   <option value="${esc(l.pack_unit)}" ${l.unit === l.pack_unit ? 'selected' : ''}>${esc(l.pack_unit)} (${fmtNum(l.pack_size)} ${esc(l.base_unit)})</option>
                   <option value="${esc(l.base_unit)}" ${l.unit === l.base_unit ? 'selected' : ''}>${esc(l.base_unit)}</option>
                 </select>`
              : `<span style="font-size:var(--fs-sm);color:var(--ink-3)">${esc(l.unit || '—')}</span>`;
            return `
              <tr>
                <td><strong>${esc(l.product_name)}</strong>${l.dual ? `<div style="font-size:var(--fs-xs);color:var(--ink-3)">${fmtNum(l.pack_size)} ${esc(l.base_unit)} / ${esc(l.pack_unit)}</div>` : ''}</td>
                <td><input class="input-inline qty" type="number" step="any" min="0.01" data-i="${i}" data-f="qty" value="${l.qty}"></td>
                <td>${unitCell}</td>
                <td><input class="input-inline price" type="number" step="any" min="0" data-i="${i}" data-f="price" value="${l.price}" placeholder="0.00"></td>
                <td style="text-align:right;font-weight:600;">${rs(l.total)}</td>
                <td><button class="btn btn-ghost btn-sm" type="button" data-del="${i}" style="color:var(--red)">✕</button></td>
              </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    `;

    $$('input[data-i]', box).forEach(inp => {
      inp.addEventListener('input', (e) => {
        const i = +e.target.dataset.i; const f = e.target.dataset.f; const v = Number(e.target.value) || 0;
        lines[i][f] = v;
        lines[i].total = Number(lines[i].qty || 0) * Number(lines[i].price || 0);
        const totalCell = e.target.closest('tr').querySelector('td:nth-last-child(2)');
        if(totalCell) totalCell.textContent = rs(lines[i].total);
        updateSummary();
      });
      inp.addEventListener('blur', () => renderLines());
    });

    $$('select[data-i]', box).forEach(sel => {
      sel.onchange = (e) => {
        const i = +e.target.dataset.i;
        lines[i].unit = e.target.value;
        const p = DB.products.find(x => x.id === lines[i].product_id);
        if(p){
          lines[i].price = priceForUnit(p, lines[i].unit);
          lines[i].total = round2(Number(lines[i].qty || 0) * Number(lines[i].price || 0));
        }
        renderLines();
      };
    });

    // ✅ FIX: Use onmousedown instead of onclick to fire before blur
    $$('[data-del]', box).forEach(b => {
      b.onmousedown = (e) => {
        e.preventDefault();
        lines.splice(+b.dataset.del, 1);
        renderLines();
      };
    });
    updateSummary();
  }

  function updateSummary(){
    const sumEl = $('#ni-summary');
    if(!sumEl) return;
    const sub = lines.reduce((s, l) => s + Number(l.total || 0), 0);
    const disc = Number($('#ni-disc').value) || 0;
    const gstOn = SETTINGS.gst_enabled && $('#ni-gst') && $('#ni-gst').checked;
    const gstRate = gstOn ? (Number(SETTINGS.gst_rate) || 0) : 0;
    const afterDisc = Math.max(0, sub - disc);
    const gstAmt = gstOn ? round2(afterDisc * gstRate / 100) : 0;
    const total = round2(afterDisc + gstAmt);
    const paid = Number($('#ni-paid').value) || 0;
    const due = round2(Math.max(0, total - paid));
    sumEl.innerHTML = `
      <div>Subtotal: <b>${rs(sub)}</b></div>
      ${disc > 0 ? `<div>Discount: <b style="color:var(--red)">− ${rs(disc)}</b></div>` : ''}
      ${gstOn ? `<div>GST @ ${gstRate}%: <b>${rs(gstAmt)}</b></div>` : ''}
      <div>Total: <b style="color:var(--primary-hover);font-size:var(--fs-md)">${rs(total)}</b></div>
      <div>Paid: <b style="color:var(--green)">${rs(paid)}</b></div>
      <div>Due: <b style="color:${due > 0 ? 'var(--red)' : 'var(--green)'}">${rs(due)}</b></div>
    `;
  }

    // ✅ FIX: Ensure both Discount and Paid inputs trigger the summary update
  $('#ni-disc').oninput = updateSummary;
  $('#ni-paid').oninput = updateSummary;
  $('#ni-paid').addEventListener('change', updateSummary); // Backup for some browsers
  const gstToggle = $('#ni-gst');
  if(gstToggle) gstToggle.onchange = updateSummary;
  renderLines();

  async function saveInvoice(){
    if(!lines.length){ toast('Add at least one item', 'error'); return null; }
    for(const l of lines){
      if(!(Number(l.qty) > 0)){ toast('Qty must be > 0 for ' + l.product_name, 'error'); return null; }
      if(!(Number(l.price) >= 0)){ toast('Price cannot be negative for ' + l.product_name, 'error'); return null; }
    }
    const partyId = partySS.getValue();
    if(!partyId){ toast('Please select a ' + partyLabel.toLowerCase(), 'error'); return null; }
    const dt = readDateTime(content);
    if(!dt) return null;
    const sc = checkStock(lines);
    if(!sc.ok){ toast('Not enough stock: ' + sc.productName + ' — need ' + fmtNum(sc.need) + ' ' + sc.unit + ', have ' + fmtNum(sc.available), 'error'); return null; }
    const sub = lines.reduce((s, l) => s + Number(l.total || 0), 0);
    const disc = Number($('#ni-disc').value) || 0;
    const paid = Number($('#ni-paid').value) || 0;
    const notes = ($('#ni-notes').value || '').trim();
    const gstOn = SETTINGS.gst_enabled && gstToggle && gstToggle.checked;
    const gstRate = gstOn ? (Number(SETTINGS.gst_rate) || 0) : 0;
    const afterDisc = Math.max(0, sub - disc);
    const gstAmt = gstOn ? round2(afterDisc * gstRate / 100) : 0;
    const total = round2(afterDisc + gstAmt);
    const due = round2(Math.max(0, total - paid));
    const invData = {
      invoice_no: nextInvoiceNo(partyType), party_id: partyId, party_type: partyType,
      subtotal: round2(sub), discount: round2(disc), total, paid: round2(paid), due,
      notes, invoice_date: dt.date, tx_time: dt.time, gst_enabled: gstOn, gst_rate: gstRate, gst_amount: gstAmt
    };
    const { data: inv, error: invErr } = await sb.from('invoices').insert(invData).select().single();
    if(invErr){ toast('Invoice save failed: ' + invErr.message, 'error'); return null; }
    const itemRows = lines.map(l => ({
      invoice_id: inv.id, product_id: l.product_id, product_name: l.product_name,
      dual: !!l.dual, base_unit: l.base_unit || null, pack_unit: l.pack_unit || null,
      pack_size: l.pack_size || null, unit: l.unit || null,
      qty: Number(l.qty), price: Number(l.price), total: Number(l.total)
    }));
    const { error: itErr } = await sb.from('invoice_items').insert(itemRows);
    if(itErr){ toast('Line items save failed: ' + itErr.message, 'error'); await sb.from('invoices').delete().eq('id', inv.id); return null; }
    for(const l of lines){ await adjustStock(l.product_id, -lineDeductBaseQty(l)); }
    await syncDB(); return inv;
  }

  $('#ni-save').onclick = async () => {
    const btn = $('#ni-save'); btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Saving…';
    const inv = await saveInvoice(); btn.disabled = false; btn.textContent = orig;
    if(inv){ toast('Invoice saved · ' + inv.invoice_no, 'success'); location.hash = '#/invoice/' + inv.id; }
  };
  $('#ni-save-print').onclick = async () => {
    const btn = $('#ni-save-print'); btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Saving…';
    const inv = await saveInvoice(); btn.disabled = false; btn.textContent = orig;
    if(!inv) return; toast('Invoice saved · ' + inv.invoice_no, 'success'); location.hash = '#/invoice/' + inv.id;
  };
}

    return (DB.customers || []).find(x => x.id === inv.party_id);

  function filtered(){
    const q      = ($('#inv-search').value || '').toLowerCase().trim();
    const type   = $('#inv-type').value;
    const status = $('#inv-status').value;
    const sortBy = $('#inv-sort').value;

    let arr = list.slice();

    if(status === 'credit') arr = arr.filter(i => Number(i.total) < 0);

      case 'date':

        arr.sort((a, b) => Number(b.total) - Number(a.total));

              : '<span style="color:var(--ink-4)">—</span>'}
          </td>
          <td>${typeChip}</td>
          <td style="color:var(--ink-3);font-size:var(--fs-sm)">${txDT(i, 'invoice_date')}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${isCredit ? 'var(--red)' : 'var(--ink)'}">
            ${rs(i.total)}
          </td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;color:var(--green)">
            ${rs(i.paid)}
          </td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${Number(i.due) > 0 ? 'var(--red)' : 'var(--ink-3)'}">
            ${Number(i.due) > 0 ? rs(i.due) : '—'}

/* ══════════════════════════════════════════════════════════════
   31d — A4 PRINT HELPER
   Adds body.print-invoice, calls window.print(), cleans up after.
   ══════════════════════════════════════════════════════════════ */

function printInvoiceA4(){
  /* Ensure no stale class is lingering */
  document.body.classList.remove('print-invoice');

  /* Add the mode class */
  document.body.classList.add('print-invoice');

  /* Track cleanup */
  let cleaned = false;
  const cleanup = () => {
    if(cleaned) return;
    cleaned = true;
    document.body.classList.remove('print-invoice');
    window.removeEventListener('afterprint', cleanup);
  };

  /* Try the modern event, with a fallback timer */
  window.addEventListener('afterprint', cleanup);
  setTimeout(cleanup, 2500);

  /* Give the browser a tick to apply the class, then print */
  setTimeout(() => {
    try { window.print(); }
    catch(e){
      console.error('[print] failed', e);
      toast('Print failed — try Ctrl+P', 'error');
      cleanup();
    }
  }, 60);
}

/* ══════════════════════════════════════════════════════════════
   31e — DELETE INVOICE
   Restores stock (base-unit aware), warns about linked returns.
   afterDelete = true → route() after delete (used from view page)
   ══════════════════════════════════════════════════════════════ */

async function deleteInvoice(id, afterDelete){
  const inv = (DB.invoices || []).find(x => x.id === id);
  if(!inv) return;

  const party = inv.party_type === 'retailer'
    ? (DB.retailers || []).find(x => x.id === inv.party_id)
    : (DB.customers || []).find(x => x.id === inv.party_id);

  const items = (DB.invoice_items || []).filter(x => x.invoice_id === id);
  const linkedReturns = (DB.returns || []).filter(r => r.invoice_id === id).length;

  let warn = `Delete invoice ${inv.invoice_no}?\n\n`;
  warn += `Party: ${party?.name || '—'}\n`;
  warn += `Total: ${rs(inv.total)}\n`;
  warn += `Items: ${items.length}\n\n`;
  warn += `Stock will be restored for all items.`;

  if(linkedReturns){
    warn += `\n\n⚠️ ${linkedReturns} return${linkedReturns === 1 ? '' : 's'} ${linkedReturns === 1 ? 'is' : 'are'} linked to this invoice. They will remain but become orphaned.`;
  }

  if(!confirmDlg(warn, 'Confirm Delete')) return;

  /* Reverse stock — restore base units */
  for(const it of items){
    const back = lineDeductBaseQty(it);
    if(it.product_id){
      await adjustStock(it.product_id, back);
    }
  }

  /* Delete invoice — cascade removes invoice_items */
  const { error } = await sb.from('invoices').delete().eq('id', id);
  if(error){
    toast('Delete failed: ' + error.message, 'error');
    return;
  }

  /* Full sync so charts + lists update */
  await syncDB();
  toast('Invoice deleted — stock restored', 'success');

  /* Route back to list, or refresh the current page */
  if(afterDelete){
    location.hash = '#/invoices';
  } else {
    route();
  }
}

/* ══════════════════════════════════════════════════════════════
   31f — CSV EXPORT
   ══════════════════════════════════════════════════════════════ */

function exportInvoicesCSV(rows){
  const list = (rows || []).map(i => {
    const party = i.party_type === 'retailer'
      ? (DB.retailers || []).find(x => x.id === i.party_id)
      : (DB.customers || []).find(x => x.id === i.party_id);

    return [
      i.invoice_no || '',
      party ? party.name : '',
      party ? party.phone || '' : '',
      i.party_type === 'retailer' ? 'Retailer' : 'Customer',
      txDate(i, 'invoice_date'),
      i.tx_time || '',
      Number(i.subtotal || 0).toFixed(2),
      Number(i.discount || 0).toFixed(2),
      i.gst_enabled ? (Number(i.gst_rate) || 0) : '',
      Number(i.gst_amount || 0).toFixed(2),
      Number(i.total || 0).toFixed(2),
      Number(i.paid || 0).toFixed(2),
      Number(i.due || 0).toFixed(2),
      i.notes || ''
    ];
  });

  const header = [
    'Invoice No', 'Party', 'Phone', 'Type',
    'Date', 'Time',
    'Subtotal', 'Discount', 'GST Rate', 'GST Amount',
    'Total', 'Paid', 'Due', 'Notes'
  ];

  const all = [header, ...list];
  const csv = all.map(row => row.map(cell => {
    const s = String(cell ?? '');
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'Invoices-' + todayStr() + '.csv');
  toast('CSV downloaded', 'success');
}
