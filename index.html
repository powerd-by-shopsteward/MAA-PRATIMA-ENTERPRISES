/* ══════════════════════════════════════════════════════════════
   BLOCK 40 — SHOP HEALTH
   Single-page business snapshot: hero profit/loss + 6 metric
   cards. Meant to be readable in 5 seconds.
   Profit formula (same as P&L):  Net Sales − Purchases + Stock Value
                                   − Expenses − Company Payable
   ══════════════════════════════════════════════════════════════ */

function renderShopHealth(content){
  if(!content) return;

  const today      = todayStr();
  const monthStart = firstOfMonthStr();

  /* ══════════════════════════════════════════════════════
     PAGE SHELL
     ══════════════════════════════════════════════════════ */

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Shop Health</h1>
        <p>Complete business snapshot</p>
      </div>
    </div>

    <!-- Range selector -->
    <div class="filter-bar">
      <div class="grow-1">
        <label class="label">&nbsp;</label>
        <div class="btn-group" id="sh-presets" style="display:inline-flex">
          <button type="button" class="btn btn-primary active" data-p="all">All Time</button>
          <button type="button" class="btn" data-p="today">Today</button>
          <button type="button" class="btn" data-p="month">This Month</button>
          <button type="button" class="btn" data-p="year">This Year</button>
          <button type="button" class="btn" data-p="custom">Custom</button>
        </div>
      </div>
      <div class="grow-1" id="sh-custom-wrap" style="display:none">
        <label class="label">From</label>
        <input class="input" type="date" id="sh-from" max="${today}" value="${monthStart}">
      </div>
      <div class="grow-1" id="sh-custom-wrap-2" style="display:none">
        <label class="label">To</label>
        <input class="input" type="date" id="sh-to" max="${today}" value="${today}">
      </div>
      <div class="grow-1" id="sh-custom-apply" style="display:none;flex:0 0 auto">
        <label class="label">&nbsp;</label>
        <button class="btn btn-primary" type="button" id="sh-apply" style="width:100%">Apply</button>
      </div>
      <div class="grow-1" id="sh-range-label-wrap" style="align-self:flex-end;text-align:right;flex:1">
        <span style="font-size:var(--fs-sm);color:var(--ink-3)" id="sh-range-label"></span>
      </div>
    </div>

    <!-- Hero -->
    <div class="card" id="sh-hero" style="text-align:center;padding:36px 24px;margin-bottom:18px"></div>

    <!-- Metric cards -->
    <div class="grid-3" id="sh-metrics" style="margin-bottom:18px"></div>

    <!-- Sub metrics: invoice count, avg ticket, active parties -->
    <div class="grid-4" id="sh-sub" style="margin-bottom:18px"></div>

    <!-- Top performers this range -->
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Top Selling Products <small>this range</small></div>
        <div id="sh-top-products"></div>
      </div>
      <div class="card">
        <div class="card-title">Top Customers &amp; Retailers <small>this range</small></div>
        <div id="sh-top-parties"></div>
      </div>
    </div>
  `;

  /* ══════════════════════════════════════════════════════
     RANGE STATE
     ══════════════════════════════════════════════════════ */

  let preset = 'all';
  let customFrom = monthStart;
  let customTo = today;

  function currentRange(){
    if(preset === 'custom'){
      return { from: customFrom || '0000-01-01', to: customTo || '9999-12-31', label: fmtDate(customFrom) + ' → ' + fmtDate(customTo) };
    }
    const bounds = rangeForPreset(preset);
    const labels = {
      today: 'Today',
      month: 'This month',
      year:  'This year',
      all:   'All time'
    };
    return { from: bounds.from, to: bounds.to, label: labels[preset] || 'All time' };
  }

  /* ══════════════════════════════════════════════════════
     COMPUTE METRICS
     ══════════════════════════════════════════════════════ */

  function metrics(){
    const { from, to } = currentRange();

    /* ─── Sales (skip credit notes) ───────────────────── */
    const salesInvs = (DB.invoices || []).filter(i => {
      if(Number(i.total) < 0) return false;
      const d = txDate(i, 'invoice_date');
      return d >= from && d <= to;
    });
    const grossSales = salesInvs.reduce((s, i) => s + Number(i.total || 0), 0);

    /* ─── Returns / credits ───────────────────────────── */
    const creditInvs = (DB.invoices || []).filter(i => {
      if(Number(i.total) >= 0) return false;
      const d = txDate(i, 'invoice_date');
      return d >= from && d <= to;
    });
    const totalReturns = creditInvs.reduce((s, i) => s + Math.abs(Number(i.total || 0)), 0);

    const netSales = grossSales - totalReturns;

    /* ─── Purchases ───────────────────────────────────── */
    const bills = (DB.supplier_invoices || []).filter(b => {
      const d = txDate(b, 'bill_date');
      return d >= from && d <= to;
    });
    const totalPurchases = bills.reduce((s, b) => s + Number(b.total || 0), 0);

    /* ─── Expenses ────────────────────────────────────── */
    const expenses = (DB.expenses || []).filter(e => {
      const d = txDate(e, 'expense_date');
      return d >= from && d <= to;
    });
    const totalExpenses = expenses.reduce((s, e) => s + Number(e.amount || 0), 0);

    /* ─── Party due (live, not range-filtered) ────────── */
    let partyDue = 0;
    (DB.customers || []).forEach(c => { partyDue += partyStats(c.id, 'customer').due; });
    (DB.retailers || []).forEach(r => { partyDue += partyStats(r.id, 'retailer').due; });

    /* ─── Supplier payable (live) ─────────────────────── */
    let supplierDue = 0;
    (DB.suppliers || []).forEach(s => { supplierDue += supplierTotals(s.id).total_due; });

    /* ─── Stock value (live) ──────────────────────────── */
    let stockValue = 0;
    (DB.products || []).forEach(p => {
      stockValue += (Number(p.stock) || 0) * (Number(p.cost) || 0);
    });

    /* ─── Profit (same formula as P&L) ────────────────── */
    /* Net Sales − Purchases + Stock Value − Expenses − Company Payable */
    const profit = netSales - totalPurchases + stockValue - totalExpenses - supplierDue;
    const margin = netSales > 0 ? (profit / netSales) * 100 : 0;

    /* ─── Extra counts ────────────────────────────────── */
    const invoiceCount = salesInvs.length;
    const avgTicket = invoiceCount > 0 ? grossSales / invoiceCount : 0;

    /* Active parties in range (anyone who had an invoice) */
    const activeParties = new Set(
      salesInvs.map(i => i.party_type + ':' + i.party_id)
    ).size;

    return {
      grossSales,
      totalReturns,
      netSales,
      totalPurchases,
      totalExpenses,
      partyDue,
      supplierDue,
      stockValue,
      profit,
      margin,
      invoiceCount,
      avgTicket,
      activeParties
    };
  }

  /* ══════════════════════════════════════════════════════
     RENDER HERO
     ══════════════════════════════════════════════════════ */

  function renderHero(m){
    const hero = $('#sh-hero');
    const isProfit = m.profit >= 0;
    const color  = isProfit ? 'var(--green)' : 'var(--red)';
    const bg     = isProfit ? 'var(--green-bg)' : 'var(--red-bg)';
    const border = isProfit ? 'var(--green-border)' : 'var(--red-border)';

    hero.style.background = bg;
    hero.style.borderColor = border;

    hero.innerHTML = `
      <div style="font-size:10px;font-weight:800;letter-spacing:0.14em;color:${color};text-transform:uppercase">
        ${isProfit ? 'IN PROFIT' : 'IN LOSS'}
      </div>
      <div style="font-size:44px;font-weight:800;color:${color};margin:10px 0;line-height:1.05;letter-spacing:-0.02em;font-variant-numeric:tabular-nums">
        ${rs(Math.abs(m.profit))}
      </div>
      <div style="font-size:var(--fs-md);color:var(--ink-2);font-weight:500">
        Margin: <b style="color:${color}">${m.margin.toFixed(1)}%</b>
        &nbsp;·&nbsp;
        ${m.invoiceCount} invoice${m.invoiceCount === 1 ? '' : 's'}
      </div>
      <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:8px">
        Net Sales − Purchases + Stock Value − Expenses − Company Payable
      </div>
    `;
  }

  /* ══════════════════════════════════════════════════════
     RENDER METRIC CARDS
     ══════════════════════════════════════════════════════ */

  function renderMetrics(m){
    const cards = [
      {
        label: 'Net Sales',
        value: rs(m.netSales),
        color: 'var(--green)',
        icon: '💰',
        sub: m.totalReturns > 0
          ? rs(m.grossSales) + ' gross − ' + rs(m.totalReturns) + ' returns'
          : rs(m.grossSales) + ' gross sales'
      },
      {
        label: 'Purchases',
        value: rs(m.totalPurchases),
        color: 'var(--amber)',
        icon: '📥',
        sub: 'cost of stock brought in'
      },
      {
        label: 'Party Due',
        value: rs(m.partyDue),
        color: 'var(--blue)',
        icon: '🧑',
        sub: 'receivable from customers + retailers'
      },
      {
        label: 'Company Payable',
        value: rs(m.supplierDue),
        color: 'var(--red)',
        icon: '🏢',
        sub: 'owed to companies + vendors'
      },
      {
        label: 'Stock Value',
        value: rs(m.stockValue),
        color: 'var(--purple)',
        icon: '📦',
        sub: 'at current cost price'
      },
      {
        label: 'Expenses',
        value: rs(m.totalExpenses),
        color: 'var(--pink)',
        icon: '💸',
        sub: 'operating costs in range'
      }
    ];

    $('#sh-metrics').innerHTML = cards.map(c => `
      <div class="card" style="border-left:4px solid ${c.color};padding:16px 18px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
          <div style="font-size:10px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:0.06em">
            ${esc(c.label)}
          </div>
          <div style="font-size:16px">${c.icon}</div>
        </div>
        <div style="font-size:20px;font-weight:800;color:${c.color};font-variant-numeric:tabular-nums;line-height:1.1">
          ${c.value}
        </div>
        <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:6px">
          ${esc(c.sub)}
        </div>
      </div>
    `).join('');
  }

  /* ══════════════════════════════════════════════════════
     SUB METRICS
     ══════════════════════════════════════════════════════ */

  function renderSub(m){
    $('#sh-sub').innerHTML = `
      <div class="mini-stat">
        <div class="lbl">Invoices</div>
        <div class="val">${m.invoiceCount}</div>
      </div>
      <div class="mini-stat">
        <div class="lbl">Average Ticket</div>
        <div class="val">${rs(m.avgTicket)}</div>
      </div>
      <div class="mini-stat">
        <div class="lbl">Active Parties</div>
        <div class="val">${m.activeParties}</div>
      </div>
      <div class="mini-stat">
        <div class="lbl">Low Stock Items</div>
        <div class="val" style="color:${(DB.products || []).filter(p => isLowStock(p)).length > 0 ? 'var(--red)' : 'var(--green)'}">
          ${(DB.products || []).filter(p => isLowStock(p)).length}
        </div>
      </div>
    `;
  }

  /* ══════════════════════════════════════════════════════
     TOP PERFORMERS
     ══════════════════════════════════════════════════════ */

  function renderTopPerformers(){
    const { from, to } = currentRange();

    /* Invoices in range (skip credit notes) */
    const invsInRange = (DB.invoices || []).filter(i => {
      if(Number(i.total) < 0) return false;
      const d = txDate(i, 'invoice_date');
      return d >= from && d <= to;
    });

    /* Top products */
    const prodMap = {};
    invsInRange.forEach(inv => {
      (DB.invoice_items || [])
        .filter(it => it.invoice_id === inv.id)
        .forEach(it => {
          const key = it.product_id || it.product_name;
          if(!prodMap[key]){
            prodMap[key] = { name: it.product_name, revenue: 0, qty: 0 };
          }
          prodMap[key].revenue += Number(it.total || 0);
          prodMap[key].qty     += Number(it.qty || 0);
        });
    });

    const topProds = Object.values(prodMap)
      .sort((a, b) => b.revenue - a.revenue)
      .slice(0, 5);

    const prodBox = $('#sh-top-products');
    if(!topProds.length){
      prodBox.innerHTML = '<p style="text-align:center;color:var(--ink-3);font-size:var(--fs-sm);padding:16px 0">No sales in range</p>';
    } else {
      const max = topProds[0].revenue || 1;
      prodBox.innerHTML = topProds.map((p, i) => {
        const pct = (p.revenue / max) * 100;
        return `
          <div style="padding:10px 0;border-bottom:1px dashed var(--border)">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;color:var(--ink);font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <span style="color:var(--primary-hover);font-weight:800">${i + 1}.</span>
                  ${esc(p.name)}
                </div>
                <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px">
                  ${fmtNum(p.qty)} sold
                </div>
              </div>
              <div style="font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap">
                ${rs(p.revenue)}
              </div>
            </div>
            <div style="margin-top:6px;height:3px;background:var(--bg-deep);border-radius:2px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:var(--primary)"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Top parties */
    const partyMap = {};
    invsInRange.forEach(inv => {
      const party = inv.party_type === 'retailer'
        ? (DB.retailers || []).find(x => x.id === inv.party_id)
        : (DB.customers || []).find(x => x.id === inv.party_id);
      if(!party) return;
      const key = party.id;
      if(!partyMap[key]){
        partyMap[key] = {
          name: party.name,
          type: inv.party_type,
          billed: 0,
          invoices: 0
        };
      }
      partyMap[key].billed   += Number(inv.total || 0);
      partyMap[key].invoices += 1;
    });

    const topParties = Object.values(partyMap)
      .sort((a, b) => b.billed - a.billed)
      .slice(0, 5);

    const partyBox = $('#sh-top-parties');
    if(!topParties.length){
      partyBox.innerHTML = '<p style="text-align:center;color:var(--ink-3);font-size:var(--fs-sm);padding:16px 0">No sales in range</p>';
    } else {
      const max = topParties[0].billed || 1;
      partyBox.innerHTML = topParties.map((p, i) => {
        const pct = (p.billed / max) * 100;
        const chipCls = p.type === 'retailer' ? 'chip-blue' : 'chip-green';
        const chipLabel = p.type === 'retailer' ? 'Retailer' : 'Customer';
        return `
          <div style="padding:10px 0;border-bottom:1px dashed var(--border)">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;color:var(--ink);font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <span style="color:var(--primary-hover);font-weight:800">${i + 1}.</span>
                  ${esc(p.name)}
                  <span class="chip ${chipCls} chip-xs" style="margin-left:4px">${chipLabel}</span>
                </div>
                <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px">
                  ${p.invoices} invoice${p.invoices === 1 ? '' : 's'}
                </div>
              </div>
              <div style="font-weight:700;color:var(--primary-hover);font-variant-numeric:tabular-nums;white-space:nowrap">
                ${rs(p.billed)}
              </div>
            </div>
            <div style="margin-top:6px;height:3px;background:var(--bg-deep);border-radius:2px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${p.type === 'retailer' ? 'var(--blue)' : 'var(--green)'}"></div>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  /* ══════════════════════════════════════════════════════
     MASTER RENDER
     ══════════════════════════════════════════════════════ */

  function renderAll(){
    const m = metrics();
    const label = $('#sh-range-label');
    if(label) label.textContent = currentRange().label;

    renderHero(m);
    renderMetrics(m);
    renderSub(m);
    renderTopPerformers();
  }

  /* ══════════════════════════════════════════════════════
     PRESETS
     ══════════════════════════════════════════════════════ */

  $$('#sh-presets button').forEach(btn => {
    btn.onclick = () => {
      $$('#sh-presets button').forEach(b => {
        b.classList.toggle('btn-primary', b === btn);
        b.classList.toggle('active', b === btn);
      });

      preset = btn.dataset.p;

      const showCustom = preset === 'custom';
      $('#sh-custom-wrap').style.display    = showCustom ? 'block' : 'none';
      $('#sh-custom-wrap-2').style.display  = showCustom ? 'block' : 'none';
      $('#sh-custom-apply').style.display   = showCustom ? 'block' : 'none';

      if(!showCustom) renderAll();
    };
  });

  $('#sh-apply').onclick = () => {
    const f = $('#sh-from').value;
    const t = $('#sh-to').value;
    if(!f || !t){ toast('Pick both dates', 'error'); return; }
    if(f > t){ toast('From cannot be after To', 'error'); return; }
    customFrom = f;
    customTo = t;
    renderAll();
  };

  /* Initial */
  renderAll();
}

/* ══════════════════════════════════════════════════════════
   END BLOCK 40
   ══════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   BLOCK 41 — MY SHOP
   Shop details, logo, GST toggle, performance toggle,
   category manager, and app version info.
   ══════════════════════════════════════════════════════════════ */

function renderMyShop(content){
  if(!content) return;

  /* ══════════════════════════════════════════════════════
     PAGE SHELL
     ══════════════════════════════════════════════════════ */

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>My Shop</h1>
        <p>Business details and preferences</p>
      </div>
    </div>

    <!-- Logo -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Logo</div>
      <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
        <div style="width:100px;height:100px;border:1px solid var(--border);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:48px;background:var(--card-alt);overflow:hidden;flex-shrink:0">
          ${SETTINGS.logo
            ? `<img src="${esc(SETTINGS.logo)}" style="max-width:100%;max-height:100%;object-fit:contain" alt="logo">`
            : '✏️'}
        </div>
        <div style="flex:1;min-width:200px">
          <input type="file" id="logo-input" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-primary" type="button" id="btn-upload">📤 Upload Logo</button>
            ${SETTINGS.logo ? '<button class="btn btn-ghost" type="button" id="btn-remove-logo" style="color:var(--red)">Remove</button>' : ''}
          </div>
          <p class="field-hint" style="margin-top:8px">
            PNG / JPG / WebP / SVG · max ~200 KB · appears on invoices and the sidebar.
          </p>
        </div>
      </div>
    </div>

    <!-- Shop details -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Shop Details</div>
      <form id="shop-form" class="modal-body" novalidate>
        <div class="form-row-2">
          <div class="field">
            <label class="label">Shop name</label>
            <input class="input" type="text" name="shop_name" maxlength="80"
              value="${esc(SETTINGS.shop_name || '')}" placeholder="e.g. Stationery Hub">
          </div>
          <div class="field">
            <label class="label">Owner name</label>
            <input class="input" type="text" name="owner_name" maxlength="60"
              value="${esc(SETTINGS.owner_name || '')}" placeholder="e.g. Ramesh Kumar">
          </div>
        </div>

        <div class="field">
          <label class="label">Address</label>
          <input class="input" type="text" name="address" maxlength="200"
            value="${esc(SETTINGS.address || '')}" placeholder="Street, area, city, PIN">
        </div>

        <div class="form-row-2">
          <div class="field">
            <label class="label">Phone</label>
            <input class="input" type="tel" name="phone" maxlength="20"
              value="${esc(SETTINGS.phone || '')}" placeholder="10-digit number">
          </div>
          <div class="field">
            <label class="label">Email</label>
            <input class="input" type="email" name="email" maxlength="100"
              value="${esc(SETTINGS.email || '')}" placeholder="Optional">
          </div>
        </div>

        <div class="form-row-2">
          <div class="field">
            <label class="label">License No.</label>
            <input class="input" type="text" name="license" maxlength="40"
              value="${esc(SETTINGS.license || '')}" placeholder="Shop license or trade ID">
          </div>
          <div class="field">
            <label class="label">UPI ID</label>
            <input class="input" type="text" name="upi" maxlength="60"
              value="${esc(SETTINGS.upi || '')}" placeholder="e.g. shop@upi">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="shop-save">Save Changes</button>
        </div>
      </form>
    </div>

    <!-- GST -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">GST</div>

      <label for="gst-toggle"
        style="display:flex;align-items:center;gap:12px;cursor:pointer;
               padding:12px 14px;background:var(--card-alt);
               border-radius:var(--r-md);border:1px solid var(--border)">
        <input type="checkbox" id="gst-toggle" ${SETTINGS.gst_enabled ? 'checked' : ''}>
        <span style="flex:1">
          <b style="display:block;color:var(--ink)">Enable GST on invoices</b>
          <span style="font-size:var(--fs-xs);color:var(--ink-3)">
            When on, new invoices show GST fields and totals calculate with tax.
          </span>
        </span>
      </label>

      <div id="gst-fields" style="display:${SETTINGS.gst_enabled ? 'grid' : 'none'};grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
        <div class="field">
          <label class="label">GSTIN</label>
          <input class="input" type="text" id="gst-number" maxlength="20"
            value="${esc(SETTINGS.gst_number || '')}" placeholder="22AAAAA0000A1Z5">
        </div>
        <div class="field">
          <label class="label">Default GST rate (%)</label>
          <input class="input" type="number" step="0.01" min="0" max="100" id="gst-rate"
            value="${SETTINGS.gst_rate || 18}">
        </div>
      </div>
    </div>

    <!-- Performance toggle (from Block 18) -->
    <div id="reduce-mount"></div>

    <!-- Categories (from Block 17) -->
    <div id="cats-mount"></div>

    <!-- About -->
    <div class="card">
      <div class="card-title">About</div>
      <div style="font-size:var(--fs-sm);color:var(--ink-2);line-height:1.7">
        <div><b style="color:var(--ink)">App version:</b> ${esc(APP_VERSION)}</div>
        <div><b style="color:var(--ink)">Backend:</b> Supabase</div>
        <div><b style="color:var(--ink)">Shop name:</b> ${esc(SETTINGS.shop_name || '—')}</div>
      </div>
    </div>
  `;

  /* ══════════════════════════════════════════════════════
     LOGO UPLOAD / REMOVE
     ══════════════════════════════════════════════════════ */

  const fileInput = content.querySelector('#logo-input');

  content.querySelector('#btn-upload').onclick = () => fileInput.click();

  fileInput.onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;

    if(file.size > 500 * 1024){
      toast('Image too large (max 500 KB)', 'error');
      e.target.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = async (ev) => {
      SETTINGS.logo = ev.target.result;
      const ok = await saveSettings();
      if(!ok){
        toast('Could not save logo', 'error');
        return;
      }
      applyFavicon();
      toast('Logo updated', 'success');
      route();
    };
    reader.readAsDataURL(file);
  };

  const removeBtn = content.querySelector('#btn-remove-logo');
  if(removeBtn){
    removeBtn.onclick = async () => {
      if(!confirmDlg('Remove the shop logo?', 'Confirm')) return;
      SETTINGS.logo = '';
      const ok = await saveSettings();
      if(!ok){
        toast('Could not remove logo', 'error');
        return;
      }
      applyFavicon();
      toast('Logo removed', 'success');
      route();
    };
  }

  /* ══════════════════════════════════════════════════════
     SHOP DETAILS FORM
     ══════════════════════════════════════════════════════ */

  const form = content.querySelector('#shop-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const saveBtn = content.querySelector('#shop-save');

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    SETTINGS.shop_name  = (fd.get('shop_name')  || '').trim() || 'Stationery Hub';
    SETTINGS.owner_name = (fd.get('owner_name') || '').trim() || 'Owner';
    SETTINGS.address    = (fd.get('address')    || '').trim();
    SETTINGS.phone      = (fd.get('phone')      || '').trim();
    SETTINGS.email      = (fd.get('email')      || '').trim();
    SETTINGS.license    = (fd.get('license')    || '').trim();
    SETTINGS.upi        = (fd.get('upi')        || '').trim();

    const ok = await saveSettings();

    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Changes';

    if(ok){
      toast('Shop details saved', 'success');
      route();
    }
  };

  /* ══════════════════════════════════════════════════════
     GST TOGGLE
     ══════════════════════════════════════════════════════ */

  const gstToggle = content.querySelector('#gst-toggle');
  const gstFields = content.querySelector('#gst-fields');

  gstToggle.onchange = async (e) => {
    SETTINGS.gst_enabled = !!e.target.checked;
    gstFields.style.display = SETTINGS.gst_enabled ? 'grid' : 'none';
    const ok = await saveSettings();
    if(ok) toast('GST ' + (SETTINGS.gst_enabled ? 'enabled' : 'disabled'), 'success');
  };

  const gstNumber = content.querySelector('#gst-number');
  const gstRate   = content.querySelector('#gst-rate');

  gstNumber.onchange = async (e) => {
    SETTINGS.gst_number = (e.target.value || '').trim();
    const ok = await saveSettings();
    if(ok) toast('GSTIN saved', 'success');
  };

  gstRate.onchange = async (e) => {
    const v = Number(e.target.value) || 0;
    SETTINGS.gst_rate = Math.max(0, Math.min(100, v));
    const ok = await saveSettings();
    if(ok) toast('GST rate saved', 'success');
  };

  /* ══════════════════════════════════════════════════════
     PERFORMANCE (Block 18)
     ══════════════════════════════════════════════════════ */

  const reduceMount = content.querySelector('#reduce-mount');
  if(reduceMount && typeof renderReduceEffectsCard === 'function'){
    reduceMount.innerHTML = renderReduceEffectsCard();
    try { mountReduceEffectsToggle(reduceMount); } catch(err){ console.warn('[reduce mount]', err); }
  }

  /* ══════════════════════════════════════════════════════
     CATEGORIES (Block 17)
     ══════════════════════════════════════════════════════ */

  const catsMount = content.querySelector('#cats-mount');
  if(catsMount && typeof renderManageCategories === 'function'){
    try { renderManageCategories(catsMount); } catch(err){ console.warn('[cats mount]', err); }
  }
}

/* ══════════════════════════════════════════════════════════
   END BLOCK 41
   ══════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   BLOCK 42 — BACKUP & RESTORE (JSON smart merge)
   Export:  full JSON snapshot of every table in DB.
   Restore: upsert-by-id merge — existing rows updated, new rows
            added. Never wipes a table.
   Aliases let backups from a different app/schema be imported.
   ══════════════════════════════════════════════════════════════ */

function renderBackup(content){
  if(!content) return;

  /* ══════════════════════════════════════════════════════
     PAGE SHELL
     ══════════════════════════════════════════════════════ */

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Backup &amp; Restore</h1>
        <p>Export your data or merge it from a previous backup</p>
      </div>
    </div>

    <!-- Export -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Download Backup <small>JSON</small></div>
      <p style="color:var(--ink-2);font-size:var(--fs-sm);margin-bottom:14px;line-height:1.6">
        Creates a <b>.json</b> file containing every table — parties, products,
        invoices, payments, purchases, returns, expenses, and shop settings.
        Keep this file somewhere safe.
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" type="button" id="bk-export">📥 Download JSON Backup</button>
      </div>

      <div style="margin-top:16px;padding:12px 14px;background:var(--card-alt);border-radius:var(--r-md);border:1px solid var(--border);font-size:var(--fs-xs);color:var(--ink-3);line-height:1.6">
        <b style="color:var(--ink-2)">Backup snapshot:</b>
        <div id="bk-counts" style="margin-top:6px"></div>
      </div>
    </div>

    <!-- Restore -->
    <div class="card">
      <div class="card-title">Restore from Backup</div>
      <p style="color:var(--ink-2);font-size:var(--fs-sm);margin-bottom:14px;line-height:1.6">
        Select a backup file to <b>merge</b> into your current data. Rows with the
        same ID get updated; new rows are added. Nothing is deleted.
      </p>
      <input type="file" id="bk-file" accept=".json,application/json" style="display:none">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" type="button" id="bk-restore">📤 Choose Backup File</button>
      </div>
      <p class="field-hint" style="margin-top:10px">
        ⚠️ Recommended: download a fresh backup first, so you can roll back if needed.
      </p>
    </div>
  `;

  /* ══════════════════════════════════════════════════════
     DATA TABLE MAP
     ══════════════════════════════════════════════════════ */

  const EXPORT_TABLES = [
    'customers',
    'retailers',
    'suppliers',
    'products',
    'invoices',
    'invoice_items',
    'payments',
    'supplier_invoices',
    'supplier_invoice_items',
    'supplier_payments',
    'returns',
    'expenses'
  ];

  /* ─── Schema whitelist ────────────────────────────────
     Only these columns are accepted during restore. */
   const SCHEMA = {
    customers:              ['id','name','phone','address','opening_balance','joined_date','tx_time','created_at'],                                  // ← CHANGED
    retailers:              ['id','name','phone','address','opening_balance','joined_date','tx_time','created_at'],                                  // ← CHANGED
    products:               ['id','name','category','dual','unit','base_unit','pack_unit','pack_size','cost','customer_price','wholesale_price','stock','low_stock_alert','primary_unit','supplier_id','created_at'],
    suppliers:              ['id','name','shop_name','phone','email','address','gst','category','notes','opening_balance','joined_date','tx_time','type','created_at'],
    invoices:               ['id','invoice_no','party_id','party_type','party_name','subtotal','discount','total','paid','due','notes','invoice_date','tx_time','gst_enabled','gst_rate','gst_amount','created_at'],  // ← CHANGED
    invoice_items:          ['id','invoice_id','product_id','product_name','dual','base_unit','pack_unit','pack_size','unit','qty','price','total','created_at'],
    payments:               ['id','party_id','party_type','amount','mode','notes','payment_date','tx_time','created_at'],
    supplier_invoices:      ['id','supplier_id','bill_no','bill_date','tx_time','subtotal','discount','total','paid','notes','created_at'],
    supplier_invoice_items: ['id','supplier_invoice_id','product_id','product_name','unit','qty','cost','total','created_at'],
    supplier_payments:      ['id','supplier_id','amount','mode','notes','payment_date','tx_time','created_at'],
    returns:                ['id','direction','invoice_id','party_id','party_type','supplier_id','product_id','product_name','unit','qty','base_qty','amount','reason','return_date','tx_time','created_at'],
    expenses:               ['id','category','amount','notes','expense_date','tx_time','created_at']
  };

  /* ─── Table aliases (legacy backups) ────────────────── */
  const TABLE_ALIASES = {
    farmers:     'customers',
    customer:    'customers',
    retailer:    'retailers',
    vendor:      'suppliers',
    vendors:     'suppliers',
    company:     'suppliers',
    companies:   'suppliers',
    stock:       'products',
    items:       'products',
    sales:       'invoices',
    bills:       'invoices',
    receipts:    'payments',
    purchases:   'supplier_invoices'
  };

  /* ─── Field aliases (legacy column names) ───────────── */
  const FIELD_ALIASES = {
    customer_id:  'party_id',
    farmer_id:    'party_id',
    retailer_id:  'party_id',
    buyer_id:     'party_id',
    client_id:    'party_id',
    seller_id:    'supplier_id',
    vendor_id:    'supplier_id',
    company_id:   'supplier_id',
    quantity:     'qty',
    product_qty:  'qty',
    rate:         'price',
    price_unit:   'price',
    date:         'invoice_date',
    phone_number: 'phone',
    mobile:       'phone',
    contact:      'phone',
    shop:         'shop_name',
    firm:         'shop_name',
    company:      'shop_name',
    mrp:          'customer_price',
    retail_price: 'customer_price',
    whole_price:  'wholesale_price'
  };

  /* ══════════════════════════════════════════════════════
     BACKUP SNAPSHOT COUNTS
     ══════════════════════════════════════════════════════ */

  function renderCounts(){
    const box = content.querySelector('#bk-counts');
    if(!box) return;
    const lines = EXPORT_TABLES.map(t => {
      const n = Array.isArray(DB[t]) ? DB[t].length : 0;
      return `${esc(t)}: <b style="color:var(--ink-2)">${n}</b>`;
    });
    lines.push(`settings: <b style="color:var(--ink-2)">1 row</b>`);
    box.innerHTML = lines.join(' &nbsp;·&nbsp; ');
  }
  renderCounts();

  /* ══════════════════════════════════════════════════════
     EXPORT
     ══════════════════════════════════════════════════════ */

  content.querySelector('#bk-export').onclick = () => {
    const payload = {
      app: 'StationeryDistributorManager',
      version: APP_VERSION,
      exported_at: new Date().toISOString(),
      settings: { ...SETTINGS }
    };

    /* Copy every table */
    EXPORT_TABLES.forEach(t => {
      payload[t] = Array.isArray(DB[t]) ? DB[t] : [];
    });

    downloadJSON(payload, 'backup-' + todayStr() + '.json');
    toast('Backup downloaded', 'success');
  };

  /* ══════════════════════════════════════════════════════
     RESTORE (smart merge)
     ══════════════════════════════════════════════════════ */

  const fileInput = content.querySelector('#bk-file');
  content.querySelector('#bk-restore').onclick = () => fileInput.click();

  fileInput.onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = async (ev) => {
      let parsed;
      try {
        parsed = JSON.parse(ev.target.result);
      } catch(err){
        toast('Invalid JSON file', 'error');
        e.target.value = '';
        return;
      }

      if(!parsed || typeof parsed !== 'object'){
        toast('Backup file empty or malformed', 'error');
        e.target.value = '';
        return;
      }

      /* Build a merged dataset keyed by our table names */
      const merged = {};
      Object.keys(parsed).forEach(key => {
        if(!Array.isArray(parsed[key]) || !parsed[key].length) return;
        const target = SCHEMA[key] ? key : TABLE_ALIASES[key];
        if(!target) return; /* unknown table → skip */
        if(!merged[target]) merged[target] = [];
        merged[target] = merged[target].concat(parsed[key]);
      });

      const totalRows = Object.values(merged).reduce((s, a) => s + a.length, 0);
      if(!totalRows){
        toast('No restorable data found in file', 'info');
        e.target.value = '';
        return;
      }

      /* Preview + confirm */
      const preview = Object.keys(merged).map(t =>
        `  • ${t}: ${merged[t].length} row${merged[t].length === 1 ? '' : 's'}`
      ).join('\n');

      const proceed = confirm(
        `Restore backup?\n\nRows to merge:\n${preview}\n\n` +
        `Existing rows with the same ID will be updated.\n` +
        `New rows will be added.\n` +
        `Nothing will be deleted.`
      );

      if(!proceed){
        e.target.value = '';
        return;
      }

      /* ─── Do the merge ─────────────────────────────────── */
      const btn = content.querySelector('#bk-restore');
      btn.disabled = true;
      btn.textContent = 'Restoring…';

      const report = {
        total_ok: 0,
        total_failed: 0,
        tables: {},
        errors: []
      };

      function convertRow(row, allowedCols){
        const out = {};
        Object.keys(row).forEach(k => {
          const key = FIELD_ALIASES[k] || k;
          if(allowedCols.includes(key)){
            out[key] = row[k];
          }
        });
        return out;
      }

      for(const table of Object.keys(merged)){
        const rows = merged[table];
        const allowedCols = SCHEMA[table] || [];
        const cleanRows = rows.map(r => convertRow(r, allowedCols));

        let ok = 0;
        let failed = 0;

        for(const row of cleanRows){
          if(!row.id){
            failed++;
            if(report.errors.length < 20) report.errors.push(table + ': missing id');
            continue;
          }

          const { error } = await sb
            .from(table)
            .upsert(row, { onConflict: 'id' });

          if(error){
            failed++;
            if(report.errors.length < 20) report.errors.push(table + ': ' + error.message);
          } else {
            ok++;
          }
        }

        report.total_ok     += ok;
        report.total_failed += failed;
        report.tables[table] = { ok, failed };
      }

      /* Settings */
      if(parsed.settings && typeof parsed.settings === 'object'){
        /* Whitelist settings fields too */
        const ALLOWED_SETTINGS = [
          'shop_name','owner_name','address','license','upi','phone','email','logo',
          'gst_enabled','gst_number','gst_rate','reduced_effects','custom_categories'
        ];
        ALLOWED_SETTINGS.forEach(k => {
          if(k in parsed.settings){
            SETTINGS[k] = parsed.settings[k];
          }
        });
        await saveSettings();
        report.tables.settings = { ok: 1, failed: 0 };
      }

      /* Full sync — pull fresh data down */
      await syncDB();

      /* Restore the performance toggle UI state */
      try { applyReduceEffects(!!SETTINGS.reduced_effects); } catch(e){}

      /* ─── Report ───────────────────────────────────────── */
      const lines = [];
      lines.push(`Merge complete.`);
      lines.push('');
      lines.push(`✔ ${report.total_ok} row${report.total_ok === 1 ? '' : 's'} saved`);
      if(report.total_failed){
        lines.push(`✖ ${report.total_failed} row${report.total_failed === 1 ? '' : 's'} failed`);
      }
      lines.push('');
      lines.push('Per-table:');
      Object.keys(report.tables).forEach(t => {
        const r = report.tables[t];
        lines.push(`  ${t}: ${r.ok} ok${r.failed ? ', ' + r.failed + ' failed' : ''}`);
      });
      if(report.errors.length){
        lines.push('');
        lines.push('Errors (first 20):');
        report.errors.forEach(e => lines.push('  ' + e));
      }

      alert(lines.join('\n'));

      btn.disabled = false;
      btn.textContent = '📤 Choose Backup File';
      e.target.value = '';

      toast('Backup merged', 'success');
      route();
    };
    reader.readAsText(file);
  };
}

/* ══════════════════════════════════════════════════════════
   END BLOCK 42
   ══════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   BLOCK 43 — EXCEL EXPORT (.xlsx, MULTI-SHEET)
   Companion to Block 42's JSON backup.
   Exports every table as its own Excel sheet + a Summary tab.
   Injects a "Download Excel" button into the Backup page.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   43a — CORE EXPORT FUNCTION
   ══════════════════════════════════════════════════════════════ */

function buildExcelWorkbook(){
  if(typeof XLSX === 'undefined'){
    toast('Excel library not loaded — check internet connection', 'error');
    return null;
  }

  const wb = XLSX.utils.book_new();
  const exportedAt = new Date().toLocaleString('en-IN');

  /* ─── Helper: add a sheet from rows ─────────────────── */
  function addSheet(name, header, rows, cols){
    const data = [header, ...rows];
    const ws = XLSX.utils.aoa_to_sheet(data);

    /* Column widths */
    if(Array.isArray(cols)){
      ws['!cols'] = cols.map(w => ({ wch: w }));
    }

    /* Freeze the header row */
    ws['!freeze'] = { xSplit: 0, ySplit: 1 };

    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  }

  /* ══════════════════════════════════════════════════════
     1. SUMMARY
     ══════════════════════════════════════════════════════ */

  const totalSales = (DB.invoices || [])
    .filter(i => Number(i.total) >= 0)
    .reduce((s, i) => s + Number(i.total || 0), 0);
  const totalPurchases = (DB.supplier_invoices || [])
    .reduce((s, b) => s + Number(b.total || 0), 0);
  const totalExpenses = (DB.expenses || [])
    .reduce((s, e) => s + Number(e.amount || 0), 0);

  let partyDue = 0;
  (DB.customers || []).forEach(c => { partyDue += partyStats(c.id, 'customer').due; });
  (DB.retailers || []).forEach(r => { partyDue += partyStats(r.id, 'retailer').due; });

  let supplierDue = 0;
  (DB.suppliers || []).forEach(s => { supplierDue += supplierTotals(s.id).total_due; });

  let stockValue = 0;
  (DB.products || []).forEach(p => {
    stockValue += (Number(p.stock) || 0) * (Number(p.cost) || 0);
  });

  const summaryRows = [
    ['Exported at', exportedAt],
    ['App version', APP_VERSION],
    ['Shop name', SETTINGS.shop_name || ''],
    ['Owner', SETTINGS.owner_name || ''],
    ['Phone', SETTINGS.phone || ''],
    ['Email', SETTINGS.email || ''],
    ['Address', SETTINGS.address || ''],
    ['GST enabled', SETTINGS.gst_enabled ? 'Yes' : 'No'],
    ['GSTIN', SETTINGS.gst_number || ''],
    ['', ''],
    ['— COUNTS —', ''],
    ['Customers', (DB.customers || []).length],
    ['Retailers', (DB.retailers || []).length],
    ['Products', (DB.products || []).length],
    ['Companies', (DB.suppliers || []).filter(s => (s.type || 'company') === 'company').length],
    ['Vendors', (DB.suppliers || []).filter(s => s.type === 'vendor').length],
    ['Invoices', (DB.invoices || []).length],
    ['Payments', (DB.payments || []).length],
    ['Purchase bills', (DB.supplier_invoices || []).length],
    ['Returns', (DB.returns || []).length],
    ['Expenses', (DB.expenses || []).length],
    ['', ''],
    ['— TOTALS —', ''],
    ['Total Sales', Number(totalSales.toFixed(2))],
    ['Total Purchases', Number(totalPurchases.toFixed(2))],
    ['Total Expenses', Number(totalExpenses.toFixed(2))],
    ['Receivable (party due)', Number(partyDue.toFixed(2))],
    ['Payable (to suppliers)', Number(supplierDue.toFixed(2))],
    ['Stock Value (at cost)', Number(stockValue.toFixed(2))]
  ];

  const sumSheet = XLSX.utils.aoa_to_sheet([['Metric', 'Value'], ...summaryRows]);
  sumSheet['!cols'] = [{ wch: 32 }, { wch: 32 }];
  XLSX.utils.book_append_sheet(wb, sumSheet, 'Summary');

  /* ══════════════════════════════════════════════════════
     2. CUSTOMERS
     ══════════════════════════════════════════════════════ */

  addSheet(
    'Customers',
    ['Name', 'Phone', 'Address', 'Joined', 'Rating', 'Total Billed', 'Total Paid', 'Due'],
    (DB.customers || []).map(c => {
      const st = partyStats(c.id, 'customer');
      return [
        c.name || '',
        c.phone || '',
        c.address || '',
        c.joined_date ? String(c.joined_date).slice(0, 10) : '',
        computeRating(st),
        Number(st.total_billed.toFixed(2)),
        Number(st.total_paid.toFixed(2)),
        Number(st.due.toFixed(2))
      ];
    }),
    [26, 14, 32, 12, 8, 14, 14, 14]
  );

  /* ══════════════════════════════════════════════════════
     3. RETAILERS
     ══════════════════════════════════════════════════════ */

  addSheet(
    'Retailers',
    ['Shop Name', 'Phone', 'Address', 'Onboarded', 'Rating', 'Total Billed', 'Total Paid', 'Due'],
    (DB.retailers || []).map(r => {
      const st = partyStats(r.id, 'retailer');
      return [
        r.name || '',
        r.phone || '',
        r.address || '',
        r.joined_date ? String(r.joined_date).slice(0, 10) : '',
        computeRating(st),
        Number(st.total_billed.toFixed(2)),
        Number(st.total_paid.toFixed(2)),
        Number(st.due.toFixed(2))
      ];
    }),
    [26, 14, 32, 12, 8, 14, 14, 14]
  );

  /* ══════════════════════════════════════════════════════
     4. PRODUCTS
     ══════════════════════════════════════════════════════ */

  addSheet(
    'Products',
    ['Name', 'Category', 'Type', 'Pack Size', 'Base Unit', 'Pack Unit',
     'Cost', 'Customer Price', 'Wholesale Price', 'Stock', 'Low Alert', 'Stock Value'],
    (DB.products || []).map(p => {
      const val = (Number(p.stock) || 0) * (Number(p.cost) || 0);
      return [
        p.name || '',
        p.category || '',
        p.dual ? 'Dual' : 'Single',
        p.dual ? Number(p.pack_size || 0) : '',
        p.dual ? (p.base_unit || '') : (p.unit || ''),
        p.dual ? (p.pack_unit || '') : '',
        Number(p.cost || 0),
        Number(p.customer_price || 0),
        Number(p.wholesale_price || 0),
        Number(p.stock || 0),
        Number(p.low_stock_alert || 0),
        Number(val.toFixed(2))
      ];
    }),
    [30, 18, 8, 10, 12, 12, 10, 14, 14, 10, 10, 14]
  );

  /* ══════════════════════════════════════════════════════
     5. COMPANIES
     ══════════════════════════════════════════════════════ */

  addSheet(
    'Companies',
    ['Name', 'Firm', 'Phone', 'Email', 'Address', 'GSTIN', 'Category',
     'Opening', 'Purchased', 'Paid', 'Payable'],
    (DB.suppliers || []).filter(s => (s.type || 'company') === 'company').map(s => {
      const tt = supplierTotals(s.id);
      return [
        s.name || '',
        s.shop_name || '',
        s.phone || '',
        s.email || '',
        s.address || '',
        s.gst || '',
        s.category || '',
        Number(tt.opening.toFixed(2)),
        Number(tt.total_purchase.toFixed(2)),
        Number(tt.total_paid.toFixed(2)),
        Number(tt.total_due.toFixed(2))
      ];
    }),
    [26, 20, 14, 24, 32, 18, 18, 12, 14, 14, 14]
  );

  /* ══════════════════════════════════════════════════════
     6. VENDORS
     ══════════════════════════════════════════════════════ */

  addSheet(
    'Vendors',
    ['Name', 'Firm', 'Phone', 'Email', 'Address', 'GSTIN', 'Category',
     'Opening', 'Purchased', 'Paid', 'Payable'],
    (DB.suppliers || []).filter(s => s.type === 'vendor').map(s => {
      const tt = supplierTotals(s.id);
      return [
        s.name || '',
        s.shop_name || '',
        s.phone || '',
        s.email || '',
        s.address || '',
        s.gst || '',
        s.category || '',
        Number(tt.opening.toFixed(2)),
        Number(tt.total_purchase.toFixed(2)),
        Number(tt.total_paid.toFixed(2)),
        Number(tt.total_due.toFixed(2))
      ];
    }),
    [26, 20, 14, 24, 32, 18, 18, 12, 14, 14, 14]
  );

  /* ══════════════════════════════════════════════════════
     7. INVOICES
     ══════════════════════════════════════════════════════ */

  addSheet(
    'Invoices',
    ['Invoice No', 'Date', 'Time', 'Party', 'Type',
     'Subtotal', 'Discount', 'GST Rate', 'GST Amount',
     'Total', 'Paid', 'Due', 'Notes'],
    (DB.invoices || []).map(i => {
      const party = i.party_type === 'retailer'
        ? (DB.retailers || []).find(x => x.id === i.party_id)
        : (DB.customers || []).find(x => x.id === i.party_id);
      return [
        i.invoice_no || '',
        i.invoice_date ? String(i.invoice_date).slice(0, 10) : '',
        i.tx_time || '',
        party ? party.name : '—',
        i.party_type === 'retailer' ? 'Retailer' : 'Customer',
        Number(i.subtotal || 0),
        Number(i.discount || 0),
        i.gst_enabled ? Number(i.gst_rate || 0) : '',
        Number(i.gst_amount || 0),
        Number(i.total || 0),
        Number(i.paid || 0),
        Number(i.due || 0),
        i.notes || ''
      ];
    }),
    [14, 12, 8, 26, 10, 12, 12, 10, 12, 12, 12, 12, 32]
  );

  /* ══════════════════════════════════════════════════════
     8. INVOICE ITEMS
     ══════════════════════════════════════════════════════ */

  addSheet(
    'Invoice Items',
    ['Invoice No', 'Product', 'Unit', 'Qty', 'Price', 'Total'],
    (DB.invoice_items || []).map(it => {
      const inv = (DB.invoices || []).find(i => i.id === it.invoice_id);
      return [
        inv ? inv.invoice_no : '',
        it.product_name || '',
        it.unit || '',
        Number(it.qty || 0),
        Number(it.price || 0),
        Number(it.total || 0)
      ];
    }),
    [14, 30, 12, 10, 12, 12]
  );

  /* ══════════════════════════════════════════════════════
     9. PAYMENTS
     ══════════════════════════════════════════════════════ */

  addSheet(
    'Payments',
    ['Date', 'Time', 'Party', 'Type', 'Mode', 'Amount', 'Notes'],
    (DB.payments || []).map(p => {
      const party = p.party_type === 'retailer'
        ? (DB.retailers || []).find(x => x.id === p.party_id)
        : (DB.customers || []).find(x => x.id === p.party_id);
      return [
        p.payment_date ? String(p.payment_date).slice(0, 10) : '',
        p.tx_time || '',
        party ? party.name : '—',
        p.party_type === 'retailer' ? 'Retailer' : 'Customer',
        p.mode || 'cash',
        Number(p.amount || 0),
        p.notes || ''
      ];
    }),
    [12, 8, 26, 10, 10, 12, 32]
  );

  /* ══════════════════════════════════════════════════════
     10. PURCHASE BILLS
     ══════════════════════════════════════════════════════ */

  addSheet(
    'Purchase Bills',
    ['Bill No', 'Date', 'Time', 'Supplier', 'Type',
     'Subtotal', 'Discount', 'Total', 'Paid', 'Balance', 'Notes'],
    (DB.supplier_invoices || []).map(b => {
      const sup = (DB.suppliers || []).find(s => s.id === b.supplier_id);
      const bal = Number(b.total || 0) - Number(b.paid || 0);
      return [
        b.bill_no || '',
        b.bill_date ? String(b.bill_date).slice(0, 10) : '',
        b.tx_time || '',
        sup ? sup.name : '—',
        sup ? (sup.type === 'vendor' ? 'Vendor' : 'Company') : '',
        Number(b.subtotal || 0),
        Number(b.discount || 0),
        Number(b.total || 0),
        Number(b.paid || 0),
        Number(bal.toFixed(2)),
        b.notes || ''
      ];
    }),

  /* ══════════════════════════════════════════════════════

  addSheet(

/* ══════════════════════════════════════════════════════════════
   BLOCK 44 — WHATSAPP BILLING
   Two ways to send a bill on WhatsApp:
     1. Text message — opens wa.me with a formatted plain-text bill
     2. PDF        — generates the invoice PDF for manual attach
   Buttons are auto-injected into the invoice view action bar.
   Public API: window.WhatsAppBilling
   ══════════════════════════════════════════════════════════════ */

window.WhatsAppBilling = (function(){
  'use strict';

  /* ─── Config ───────────────────────────────────────── */
  const DEFAULT_COUNTRY_CODE = '91'; // India
  const WA_URL_MAX_CHARS = 1800;     // safe limit for wa.me URLs

  /* ══════════════════════════════════════════════════════════
     44a — PHONE NORMALIZATION
     Strips non-digits, prepends country code if missing.
     Returns null if the number is unusable.
     ══════════════════════════════════════════════════════════ */

  function normalizePhone(raw){
    if(!raw) return null;
    let digits = String(raw).replace(/\D/g, '');

    /* Strip leading zeros */
    digits = digits.replace(/^0+/, '');

    if(!digits) return null;

    /* Too short to be a valid phone number */
    if(digits.length < 7) return null;

    /* Already has country code (10 digits + country code ≥ 11) */
    if(digits.length >= 11) return digits;

    /* 10 digits → assume Indian number, prepend 91 */
    if(digits.length === 10) return DEFAULT_COUNTRY_CODE + digits;

    /* Otherwise, return as-is — WhatsApp may still resolve it */
    return digits;
  }

  /* ══════════════════════════════════════════════════════════
     44b — TEXT MESSAGE BUILDER
     Formats the invoice as a WhatsApp-friendly message.
     Uses WhatsApp markdown: *bold*, _italics_.
     ══════════════════════════════════════════════════════════ */

  function buildTextMessage(inv, items, party){
    if(!inv) return '';

    const lines = [];

    /* ─── Header ───────────────────────────────────────── */
    lines.push('*' + (SETTINGS.shop_name || 'Stationery Hub') + '*');
    if(SETTINGS.owner_name) lines.push(SETTINGS.owner_name);
    if(SETTINGS.phone)      lines.push('📞 ' + SETTINGS.phone);
    if(SETTINGS.address)    lines.push(SETTINGS.address);
    if(SETTINGS.gst_enabled && SETTINGS.gst_number){
      lines.push('GSTIN: ' + SETTINGS.gst_number);
    }
    lines.push('');
    lines.push('━━━━━━━━━━━━━━━━━━━━');

    /* ─── Invoice meta ─────────────────────────────────── */
    lines.push('*Invoice:* ' + (inv.invoice_no || 'INV'));
    lines.push('*Date:* ' + txDT(inv, 'invoice_date'));
    lines.push('');

    /* ─── Party greeting ───────────────────────────────── */
    if(party && party.name){
      lines.push('Dear *' + party.name + '*,');
      lines.push('Thank you for your purchase.');
      lines.push('');
    }

    /* ─── Items ────────────────────────────────────────── */
    lines.push('*Items:*');
    items.forEach(it => {
      const label = productLineLabel(it);
      const qty = fmtNum(it.qty);
      lines.push('• ' + label);
      lines.push('   ' + qty + ' × ' + rs(it.price) + ' = *' + rs(it.total) + '*');
    });

    lines.push('');
    lines.push('━━━━━━━━━━━━━━━━━━━━');

    /* ─── Totals ───────────────────────────────────────── */
    lines.push('Subtotal: ' + rs(inv.subtotal));

    if(Number(inv.discount) > 0){
      lines.push('Discount: -' + rs(inv.discount));
    }
    if(inv.gst_enabled && Number(inv.gst_amount) > 0){
      lines.push('GST @ ' + inv.gst_rate + '%: ' + rs(inv.gst_amount));
    }

    lines.push('*Total: ' + rs(inv.total) + '*');
    lines.push('Paid: ' + rs(inv.paid));

    const due = Number(inv.due) || 0;
    if(due > 0){
      lines.push('*Due: ' + rs(due) + '*');
    } else {
      lines.push('✅ *Paid in full*');
    }

    /* ─── UPI hint ─────────────────────────────────────── */
    if(due > 0 && SETTINGS.upi){
      lines.push('');
      lines.push('Pay via UPI: ' + SETTINGS.upi);
    }

    /* ─── Footer ───────────────────────────────────────── */
    lines.push('');
        lines.push('_Thank you! Visit again._ ✏️');

    let text = lines.join('\n');

    /* ─── Truncate if necessary ────────────────────────── */
    if(text.length > WA_URL_MAX_CHARS){
      text = text.slice(0, WA_URL_MAX_CHARS - 30) + '\n\n_(truncated)_';
    }

    return text;
  }

  /* ══════════════════════════════════════════════════════════
     44c — OPEN WHATSAPP WITH TEXT
     ══════════════════════════════════════════════════════════ */

  function sendText(phone, text){
    const normPhone = normalizePhone(phone);
    const encoded   = encodeURIComponent(text);

    /* If no phone → open WhatsApp chooser with message only.
       User picks the contact manually. */
    const url = normPhone
      ? 'https://wa.me/' + normPhone + '?text=' + encoded
      : 'https://wa.me/?text=' + encoded;

    try {
      window.open(url, '_blank', 'noopener,noreferrer');
    } catch(err){
      console.error('[wa.me] open failed', err);
      /* Fallback: try location.href for stubborn browsers */
      location.href = url;
    }
  }

  /* ══════════════════════════════════════════════════════════
     44d — COPY TO CLIPBOARD
     Nice alternative for users who don't want to open WhatsApp.
     ══════════════════════════════════════════════════════════ */

  async function copyText(text){
    try {
      await navigator.clipboard.writeText(text);
      toast('Message copied to clipboard', 'success');
      return true;
    } catch(err){
      /* Older fallback */
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        toast('Message copied', 'success');
        return true;
      } catch(e2){
        toast('Could not copy message', 'error');
        return false;
      }
    }
  }

  /* ══════════════════════════════════════════════════════════
     44e — SEND AS PDF
     Calls Block 48's PDFMaker.invoice if available.
     Falls back to browser print if not.
     ══════════════════════════════════════════════════════════ */

  function sendPDF(inv, items, party){
    try {
      if(window.PDFMaker && typeof window.PDFMaker.invoice === 'function'){
        window.PDFMaker.invoice(inv, items, party);
        toast('PDF downloaded — attach it in WhatsApp', 'success');
        return true;
      }
      /* Fallback: open print dialog */
      toast('PDF module loading… using print instead', 'info');
      if(typeof printInvoiceA4 === 'function'){
        printInvoiceA4();
      } else {
        window.print();
      }
      return false;
    } catch(err){
      console.error('[wa pdf]', err);
      toast('PDF failed — try printing instead', 'error');
      return false;
    }
  }

  /* ══════════════════════════════════════════════════════════
     44f — MAIN PICKER MODAL
     Shows two options: send text message, or send PDF.
     ══════════════════════════════════════════════════════════ */

  function openPicker(inv, items, party){
    if(!inv){ toast('No invoice to send', 'error'); return; }

    const phone   = party ? (party.phone || '') : '';
    const normP   = normalizePhone(phone);
    const message = buildTextMessage(inv, items, party);

    openModal(`
      <h2>Send on WhatsApp</h2>
      <p class="modal-sub">
        ${esc(inv.invoice_no || 'INV')} · ${party ? esc(party.name) : '—'}
        ${party && party.phone ? ' · ' + esc(party.phone) : ''}
      </p>

      <div class="modal-body">

        ${!party || !party.phone ? `
          <div style="padding:12px 14px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-md);font-size:var(--fs-sm);color:var(--amber)">
            ⚠️ No phone number on file for this ${inv.party_type === 'retailer' ? 'retailer' : 'customer'}.
            You'll need to pick a contact manually in WhatsApp.
          </div>
        ` : ''}

        <!-- Option 1: Text message -->
        <div class="card" style="padding:14px;background:var(--card-alt)">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px">
            <div>
              <b style="color:var(--ink);font-size:var(--fs-md)">📝 Text message</b>
              <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px">
                Opens WhatsApp with the bill pre-typed — fastest option.
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button type="button" class="btn btn-ghost btn-sm" id="wa-copy">📋 Copy</button>
              <button type="button" class="btn btn-primary btn-sm" id="wa-send-text">Open WhatsApp →</button>
            </div>
          </div>
          <div id="wa-preview"
            style="background:var(--card);
                   border:1px solid var(--border);
                   border-radius:var(--r-sm);
                   padding:10px 12px;
                   font-family:var(--font-mono);
                   font-size:12px;
                   color:var(--ink-2);
                   max-height:200px;
                   overflow-y:auto;
                   white-space:pre-wrap;
                   line-height:1.5">${esc(message)}</div>
        </div>

        <!-- Option 2: PDF -->
        <div class="card" style="padding:14px;background:var(--card-alt)">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap">
            <div>
              <b style="color:var(--ink);font-size:var(--fs-md)">📄 PDF invoice</b>
              <div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px">
                Downloads a PDF. Attach it in WhatsApp after.
              </div>
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="wa-send-pdf">Download PDF →</button>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="wa-cancel">Close</button>
        </div>
      </div>
    `, (root) => {
      /* ─── Copy ───────────────────────────────────────── */
      root.querySelector('#wa-copy').onclick = () => copyText(message);

      /* ─── Send text ──────────────────────────────────── */
      root.querySelector('#wa-send-text').onclick = () => {
        sendText(phone, message);
        closeModal(root);
      };

      /* ─── Send PDF ───────────────────────────────────── */
      root.querySelector('#wa-send-pdf').onclick = () => {
        sendPDF(inv, items, party);
        closeModal(root);
      };

      /* ─── Cancel ─────────────────────────────────────── */
      root.querySelector('#wa-cancel').onclick = () => closeModal(root);
    });
  }

  /* ══════════════════════════════════════════════════════════
     44g — PUBLIC API
     ══════════════════════════════════════════════════════════ */

  return {
    openPicker,
    sendText,
    sendPDF,
    buildTextMessage,
    normalizePhone
  };
})();

/* ══════════════════════════════════════════════════════════════
   BLOCK 45 — USB THERMAL PRINTER (WebUSB · ESC/POS)
   Supports 58mm (32 chars) and 80mm (48 chars) thermal printers.
   Auto-injects a "USB Print" button into the invoice view.
   Public API: window.USBPrinter
   ══════════════════════════════════════════════════════════════ */

window.USBPrinter = (function(){
  'use strict';

  /* ─── Module state ──────────────────────────────────── */
  let device = null;             // USBDevice object
  let interfaceNum = 0;          // Claimed interface
  let endpointOut = null;        // Outbound endpoint number
  let paperWidth = 32;           // 32 chars for 58mm, 48 for 80mm
  let paperLabel = '58mm';

  /* ══════════════════════════════════════════════════════════
     45a — LIBRARY CHECK
     ══════════════════════════════════════════════════════════ */

  function libsLoaded(){
    return typeof ReceiptPrinterEncoder !== 'undefined';
  }

  function usbSupported(){
    return !!navigator.usb;
  }

  /* ══════════════════════════════════════════════════════════
     45b — CONNECT / DISCONNECT
     ══════════════════════════════════════════════════════════ */

  async function connect(){
    if(!usbSupported()){
      toast('WebUSB is not supported in this browser (use Chrome/Edge)', 'error');
      return false;
    }
    if(!libsLoaded()){
      toast('Printer library not loaded — check internet', 'error');
      return false;
    }
    if(device && device.opened){
      return true;
    }

    try {
      device = await navigator.usb.requestDevice({ filters: [] });
      await device.open();

      if(device.configuration === null){
        await device.selectConfiguration(1);
      }

      /* Find a suitable interface (has an OUT endpoint) */
      let found = false;
      for(const iface of device.configuration.interfaces){
        const alt = iface.alternates[0];
        const outEp = alt.endpoints.find(ep => ep.direction === 'out');
        if(outEp){
          interfaceNum = iface.interfaceNumber;
          endpointOut = outEp.endpointNumber;
          await device.claimInterface(interfaceNum);
          found = true;
          break;
        }
      }

      if(!found){
        throw new Error('No outbound USB endpoint found');
      }

      /* Save paper width from last choice (default 58mm) */
      const saved = localStorage.getItem('sd_usb_paper');
      if(saved === '80'){ paperWidth = 48; paperLabel = '80mm'; }
      else { paperWidth = 32; paperLabel = '58mm'; }

      toast('USB printer connected (' + paperLabel + ')', 'success');
      return true;
    } catch(err){
      if(err && err.name === 'NotFoundError'){
        /* User cancelled the picker — stay silent */
        return false;
      }
      console.error('[usb connect]', err);
      toast('USB connect failed: ' + (err.message || err), 'error');
      device = null;
      return false;
    }
  }

  async function disconnect(){
    try {
      if(device && device.opened){
        await device.close();
      }
    } catch(e){ /* ignore */ }
    device = null;
    interfaceNum = 0;
    endpointOut = null;
  }

  function isConnected(){
    return !!(device && device.opened);
  }

  /* ══════════════════════════════════════════════════════════
     45c — RAW PRINT
     Sends a Uint8Array to the printer via transferOut.
     ══════════════════════════════════════════════════════════ */

  async function rawPrint(bytes){
    if(!device || !device.opened){
      throw new Error('Printer not connected');
    }
    if(!endpointOut){
      throw new Error('No printer endpoint');
    }
    await device.transferOut(endpointOut, bytes);
  }

  /* ══════════════════════════════════════════════════════════
     45d — LOGO RASTER
     Converts the shop logo to a bitmap for ESC/POS printing.
     ══════════════════════════════════════════════════════════ */

  async function prepareLogoRaster(){
    if(!SETTINGS.logo) return null;
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const MAX_W = paperWidth === 48 ? 200 : 128;
          const scale = Math.min(1, MAX_W / img.width);
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          const imageData = ctx.getImageData(0, 0, w, h);
          resolve({ imageData, width: w, height: h });
        } catch(err){
          console.warn('[usb logo]', err);
          resolve(null);
        }
      };
      img.onerror = () => resolve(null);
      img.src = SETTINGS.logo;
    });
  }

  /* ══════════════════════════════════════════════════════════
     45e — BUILD RECEIPT (encoder → ESC/POS bytes)
     ══════════════════════════════════════════════════════════ */

  async function buildReceipt(inv, items, party){
    const W = paperWidth;

    function padLine(left, right){
      left = String(left == null ? '' : left);
      right = String(right == null ? '' : right);
      if(left.length + right.length >= W){
        left = left.slice(0, Math.max(0, W - right.length - 1));
      }
      const spaces = W - left.length - right.length;
      return left + ' '.repeat(spaces > 0 ? spaces : 1) + right;
    }

    function clip(str, max){
      str = String(str == null ? '' : str);
      return str.length <= max ? str : str.slice(0, max);
    }

    function divider(){
      return '-'.repeat(W);
    }

    const enc = new ReceiptPrinterEncoder({ language: 'esc-pos' });

    /* ─── Logo (optional) ──────────────────────────────── */
    const logo = await prepareLogoRaster();
    if(logo){

  function libsLoaded(){

  }

  async function connect(){
    if(!btSupported()){

      return false;
    }
    if(!libsLoaded()){
      toast('Printer library not loaded — check internet', 'error');
      return false;
    }

    /* Already connected */
    if(printer && connectedDevice) return true;

    try {
      printer = new WebBluetoothReceiptPrinter();

      printer.addEventListener('connected', (device) => {
        connectedDevice = device;
      });

      printer.addEventListener('disconnected', () => {
        connectedDevice = null;
        printer = null;
      });

      await printer.connect();

      /* Load saved paper width */
      const saved = localStorage.getItem('sd_bt_paper');
      if(saved === '80'){ paperWidth = 48; paperLabel = '80mm'; }
      else { paperWidth = 32; paperLabel = '58mm'; }

      toast('Bluetooth printer connected (' + paperLabel + ')', 'success');
      return true;
    } catch(err){
      printer = null;
      connectedDevice = null;

      /* User cancelled the picker — silent */
      if(err && err.name === 'NotFoundError') return false;

      console.error('[bt connect]', err);
      toast('Bluetooth connect failed: ' + (err && err.message ? err.message : err), 'error');
      return false;
    }
  }

  async function disconnect(){
    try {
      if(printer && typeof printer.disconnect === 'function'){
        await printer.disconnect();
      }
    } catch(e){ /* ignore */ }
    printer = null;
    connectedDevice = null;
  }

  async function prepareLogoRaster(){
    if(!SETTINGS.logo) return null;
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const MAX_W = paperWidth === 48 ? 200 : 128;
          const scale = Math.min(1, MAX_W / img.width);
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          const imageData = ctx.getImageData(0, 0, w, h);
          resolve({ imageData, width: w, height: h });
        } catch(err){
          console.warn('[bt logo]', err);
          resolve(null);

    enc.text(padLine('Item', 'Amount')).newline();
    enc.text(divider()).newline();

    items.forEach(it => {
      let label = productLineLabel(it);
      if(label.length > W) label = label.slice(0, W);

    if(inv.gst_enabled && Number(inv.gst_amount) > 0){

    }

    enc.bold(true);
    enc.text(padLine('Total:', 'Rs.' + Number(inv.total).toFixed(2))).newline();
    enc.bold(false);

    enc.text(padLine('Paid:', 'Rs.' + Number(inv.paid).toFixed(2))).newline();

    const due = Number(inv.due) || 0;

    /* ─── Due / Paid block ─────────────────────────────── */
    enc.align('center');
    enc.newline();
    if(due > 0){
      enc.bold(true);
      enc.size(1, 2);
      enc.text('BALANCE: Rs.' + due.toFixed(2));
      enc.newline();
      enc.size(1, 1);

    } else {
      enc.bold(true);
      enc.size(1, 2);
      enc.text('** PAID IN FULL **');
      enc.newline();
      enc.size(1, 1);
      enc.bold(false);
    }

    /* ─── UPI hint ─────────────────────────────────────── */
    if(due > 0 && SETTINGS.upi){
      enc.align('center');
      enc.newline();
      enc.text('Pay via UPI:').newline();
      enc.text(clip(SETTINGS.upi, W - 2)).newline();
    }

    /* ─── Footer ───────────────────────────────────────── */
    enc.align('center');
    enc.newline();
    enc.text('Thank you! Visit again').newline();
    enc.newline(3);
    enc.cut();

    return enc.encode();
  }

  /* ══════════════════════════════════════════════════════════

     ══════════════════════════════════════════════════════════ */

  async function printInvoice(inv, items, party){
