   Passes a synthetic party object for walk-ins so the message
   greets the walk-in by name instead of showing "—".
   ══════════════════════════════════════════════════════════════ */

(function wrapWhatsApp(){
  if(!window.WhatsAppBilling) return;
  const orig = window.WhatsAppBilling.openPicker;
  if(!orig) return;

  window.WhatsAppBilling.openPicker = function(inv, items, party){
    if(!party && inv && inv.party_name){
      party = { id: null, name: inv.party_name, phone: '', address: '', _walkin: true };
    }
    return orig.call(this, inv, items, party);
  };
})();

  const SUPPORT_WHATSAPP = CFG.whatsapp      || '';
  const SUPPORT_EMAIL    = CFG.email         || '';
  const REMINDER_DAYS    = CFG.reminderDays  || 15;
  const ACCENT           = CFG.accent        || '#C79A28';
  const ACCENT_WARN      = CFG.accentWarning || '#B45309';
  const ACCENT_DANGER    = CFG.accentDanger  || '#B91C1C';
  const AUTO_CREATE      = CFG.autoCreate === true;

  window.SUB_PLAN_AMOUNT      = PLAN_AMOUNT;
  window.SUB_PLAN_LABEL       = PLAN_LABEL;
  window.SUB_OWNER_UPI        = OWNER_UPI;
  window.SUB_OWNER_NAME       = OWNER_NAME;
  window.SUB_SUPPORT_WHATSAPP = SUPPORT_WHATSAPP;
  window.SUB_SUPPORT_EMAIL    = SUPPORT_EMAIL;
  window.SUB_REMINDER_DAYS    = REMINDER_DAYS;
  window.SUB_ACCENT           = ACCENT;
  window.SUB_ACCENT_WARN      = ACCENT_WARN;
  window.SUB_ACCENT_DANGER    = ACCENT_DANGER;

  window.SUB = {
    loaded: false,
    active: false,
    expires_at: null,
    last_paid_at: null,
    amount: PLAN_AMOUNT
  };

  /* ─── Time helpers ─────────────────────────────────────────── */
  window.subDaysLeft = function () {
    if (!SUB.expires_at) return 0;
    return Math.max(0, Math.ceil((new Date(SUB.expires_at).getTime() - Date.now()) / 86400000));
  };
  window.subPercentLeft = function () {
    if (!SUB.expires_at) return 0;
    const left = Math.max(0, new Date(SUB.expires_at).getTime() - Date.now());
    return Math.max(0, Math.min(100, Math.round((left / (365 * 86400000)) * 100)));
  };
  window.subDaysOverdue = function () {
    if (!SUB.expires_at) return 0;
    return Math.max(0, Math.ceil((Date.now() - new Date(SUB.expires_at).getTime()) / 86400000));
  };

  /* ─── Status helpers ───────────────────────────────────────── */
  window.isSubActive = function () {
    if (!SUB.loaded) return true;
    return !!(SUB.active && SUB.expires_at && new Date(SUB.expires_at).getTime() > Date.now());
  };
  window.isSubExpiringSoon = function () {
    return isSubActive() && subDaysLeft() <= REMINDER_DAYS;
  };
  window.isSubExpired = function () { return !isSubActive(); };
  window.subStatusColor = function () {
    if (isSubExpired()) return ACCENT_DANGER;
    if (subDaysLeft() <= REMINDER_DAYS) return ACCENT_WARN;
    return ACCENT;
  };
  window.subStatusLabel = function () {
    if (isSubExpired()) return 'Expired';
    if (subDaysLeft() <= REMINDER_DAYS) return 'Expiring Soon';
    return 'Active';
  };

  /* ─── Load row from Supabase ───────────────────────────────── */
  window.loadSubscription = async function () {
    try {
      if (typeof sb === 'undefined') throw new Error('Supabase client not available');
      const { data, error } = await sb.from('subscriptions').select('*').eq('id', 1).maybeSingle();
      if (error) throw error;

      if (data) {
        Object.assign(SUB, {
          loaded: true,
          active: !!data.active,
          expires_at: data.expires_at,
          last_paid_at: data.last_paid_at,
          amount: data.amount
        });
      } else if (AUTO_CREATE) {
        const now = new Date();
        const nextYear = new Date(now);
        nextYear.setFullYear(nextYear.getFullYear() + 1);
        const { data: created, error: cErr } = await sb.from('subscriptions').insert({
          id: 1, active: true,
          started_at: now.toISOString(),
          expires_at: nextYear.toISOString(),
          last_paid_at: now.toISOString(),
          amount: PLAN_AMOUNT,
          notes: 'Auto-created on first login'
        }).select().single();
        if (cErr) throw cErr;
        Object.assign(SUB, {
          loaded: true, active: true,
          expires_at: created.expires_at,
          last_paid_at: created.last_paid_at,
          amount: created.amount
        });
      } else {
        /* Row missing and autoCreate off — treat as fresh/unknown, fail-open */
        SUB.loaded = true;
        SUB.active = true;
        SUB.expires_at = new Date(Date.now() + 365 * 86400000).toISOString();
      }
    } catch (e) {
      console.warn('[SUB] load failed:', e.message);
      SUB.loaded = true;
      SUB.active = true;
      SUB.expires_at = new Date(Date.now() + 365 * 86400000).toISOString();
    }
  };

  /* ─── WhatsApp link helper ─────────────────────────────────── */
  window.waLink = function (phone, text) {
    return 'https://wa.me/' + String(phone).replace(/\D/g, '') + '?text=' + encodeURIComponent(text || '');
  };
})();

/* ════════════════════════════════════════════════════════════════════
   BLOCK 52 · PART C — UI
   Sidebar pill + top banner + slide-in reminder.
   ════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ─── Sidebar pill ─────────────────────────────────────────── */
  window.renderSubSidebarPill = function () {
    const sidebar = document.querySelector('.sidebar');
    if (!sidebar) return;

    let pill = document.getElementById('sub-sidebar-pill');
    if (!pill) {
      pill = document.createElement('a');
      pill.id = 'sub-sidebar-pill';
      pill.href = '#/myshop';
      pill.style.cssText = 'display:block;margin-top:8px;margin-bottom:6px;padding:10px 12px;border-radius:10px;background:var(--primary-soft);border:1px solid var(--primary-tint);text-decoration:none;';
      const calcBtn = document.getElementById('btn-calc');
      if (calcBtn) sidebar.insertBefore(pill, calcBtn);
      else sidebar.appendChild(pill);
    }

    if (!window.SUB || !SUB.loaded) { pill.style.display = 'none'; return; }
    pill.style.display = 'block';

    const color = subStatusColor();
    const pct   = subPercentLeft();
    const days  = subDaysLeft();
    const label = days > 0 ? days + 'd' : 'Expired';

    pill.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<span style="font-size:13px;">⭐</span>' +
          '<span style="font-size:11px;font-weight:700;color:var(--ink);">Pro Plan</span>' +
        '</div>' +
        '<span style="font-size:10px;font-weight:700;color:' + color + ';">' + label + '</span>' +
      '</div>' +
      '<div style="height:5px;background:var(--bg-deep);border-radius:999px;overflow:hidden;">' +
        '<div style="height:100%;width:' + pct + '%;background:' + color + ';border-radius:999px;"></div>' +
      '</div>' +
      '<div style="font-size:9px;color:var(--ink-3);margin-top:5px;">' + subStatusLabel() + '</div>';
  };

  /* ─── Top warning banner ───────────────────────────────────── */
  window.renderSubTopBanner = function () {
    const main = document.querySelector('.main');
    if (!main) return;

    const old = document.getElementById('sub-top-banner');
    if (old) old.remove();
    if (!window.SUB || !SUB.loaded) return;
    if (isSubActive() && !isSubExpiringSoon()) return;

    const expired = isSubExpired();
    const pct     = subPercentLeft();
    const days    = subDaysLeft();
    const overdue = subDaysOverdue();

    const barColor  = expired ? SUB_ACCENT_DANGER : SUB_ACCENT_WARN;
    const textColor = expired ? '#7f1d1d' : '#78350f';
    const bg        = expired ? 'var(--red-bg)'     : 'var(--amber-bg)';
    const border    = expired ? 'var(--red-border)' : 'var(--amber-border)';

    const banner = document.createElement('div');
    banner.id = 'sub-top-banner';
    banner.style.cssText = 'margin:0 0 16px 0;padding:14px 18px;border-radius:var(--r-md);background:' + bg + ';border:1px solid ' + border + ';';
    banner.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;">' +
        '<div style="font-size:13px;font-weight:600;color:' + textColor + ';">⚠ ' + (expired ? 'Subscription expired' : 'Subscription ending soon') + '</div>' +
        '<button id="sub-banner-renew" style="background:' + SUB_ACCENT + ';color:#2A1E05;border:none;padding:6px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">Renew Now ₹' + SUB_PLAN_AMOUNT + '</button>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;">' +
        '<div style="flex:1;height:6px;background:rgba(255,255,255,0.6);border-radius:999px;overflow:hidden;">' +
          '<div style="height:100%;width:' + pct + '%;background:' + barColor + ';border-radius:999px;"></div>' +
        '</div>' +
        '<div style="font-size:11px;font-weight:600;color:' + textColor + ';white-space:nowrap;">' + (expired ? overdue + ' days overdue' : days + ' days left') + '</div>' +
      '</div>';

    main.insertBefore(banner, main.firstChild);

    const btn = banner.querySelector('#sub-banner-renew');
    if (btn) btn.onclick = function () { openSubscriptionModal(); };
  };

  /* ─── Slide-in reminder (≤ 15 days, once per day) ──────────── */
  window.maybeShowExpiryReminder = function () {
    if (!window.SUB || !SUB.loaded) return;
    if (isSubExpired()) return;
    if (subDaysLeft() > SUB_REMINDER_DAYS) return;

    const today = new Date().toISOString().slice(0, 10);
    const key   = 'sub_reminder_shown_' + today;
    if (localStorage.getItem(key) === '1') return;
    localStorage.setItem(key, '1');

    const days = subDaysLeft();
    const root = document.getElementById('toast-root') || document.body;

    const slide = document.createElement('div');
    slide.id = 'sub-expiry-slide';
    slide.style.cssText =
      'position:fixed;top:70px;right:20px;z-index:9999;max-width:340px;' +
      'background:#fff;border:1px solid var(--primary-tint);border-left:4px solid ' + SUB_ACCENT_WARN + ';' +
      'border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow-modal);' +
      'font-family:var(--font);transform:translateX(120%);transition:transform .35s ease;';
    slide.innerHTML =
      '<div style="display:flex;gap:10px;align-items:flex-start;">' +
        '<div style="font-size:20px;line-height:1;">⏳</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:700;color:var(--ink);font-size:13px;margin-bottom:3px;">Subscription ending soon</div>' +
          '<div style="font-size:12px;color:var(--ink-2);line-height:1.5;">' +
            'Only <b style="color:' + SUB_ACCENT_WARN + ';">' + days + ' day' + (days === 1 ? '' : 's') + '</b> left. Renew to keep saving data.' +
          '</div>' +
          '<div style="display:flex;gap:6px;margin-top:10px;">' +
            '<button id="sub-slide-renew" style="background:' + SUB_ACCENT + ';color:#2A1E05;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">Renew Now</button>' +
            '<button id="sub-slide-dismiss" style="background:transparent;color:var(--ink-3);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;">Later</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    root.appendChild(slide);
    requestAnimationFrame(function () { slide.style.transform = 'translateX(0)'; });

    function dismiss() {
      slide.style.transform = 'translateX(120%)';
      setTimeout(function () { slide.remove(); }, 400);
    }

    slide.querySelector('#sub-slide-renew').onclick = function () {
      dismiss();
      openSubscriptionModal();
    };
    slide.querySelector('#sub-slide-dismiss').onclick = dismiss;

    setTimeout(function () {
      if (document.getElementById('sub-expiry-slide')) dismiss();
    }, 15000);
  };

  /* ─── Orchestrator ─────────────────────────────────────────── */
  window.updateSubscriptionUI = function () {
    try { renderSubSidebarPill();       } catch (e) {}
    try { renderSubTopBanner();         } catch (e) {}
    try { maybeShowExpiryReminder();    } catch (e) {}
  };

  /* ─── Hook into renderLayout ───────────────────────────────── */
  const _origLayout = window.renderLayout;
  if (typeof _origLayout === 'function') {
    window.renderLayout = function () {
      _origLayout.apply(this, arguments);
      try { renderSubSidebarPill(); renderSubTopBanner(); } catch (e) {}
      /* defer slide-in so layout is painted first */
      setTimeout(function () { try { maybeShowExpiryReminder(); } catch (e) {} }, 400);
    };
  }

  /* ─── Hook into route ──────────────────────────────────────── */
   const _origRoute = window.route;
  if (typeof _origRoute === 'function') {
    window.route = async function () {
      const r = await _origRoute.apply(this, arguments);
      try { renderSubSidebarPill(); renderSubTopBanner(); } catch (e) {}
      return r;
    };
    /* No additional hashchange listener — Block 49 already drives route(). */
  }
  setInterval(function () {
    if (window.SUB && SUB.loaded) updateSubscriptionUI();
  }, 60000);
})();

/* ════════════════════════════════════════════════════════════════════
   BLOCK 52 · PART D — CARD + MODALS + GUARDS
   ════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ─── UPI / QR helpers ─────────────────────────────────────── */
  function buildUpiString(amount, note) {
    const amt = Number(amount).toFixed(2);
    const tn  = encodeURIComponent((note || 'Subscription').substring(0, 50));
    const pn  = encodeURIComponent(SUB_OWNER_NAME);
    return 'upi://pay?pa=' + SUB_OWNER_UPI + '&pn=' + pn + '&am=' + amt + '&cu=INR&tn=' + tn;
  }
  function getQrUrls(str) {
    const enc = encodeURIComponent(str);
    return [
      'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + enc + '&margin=10',
      'https://quickchart.io/qr?text=' + enc + '&size=400&margin=2',
      'https://chart.googleapis.com/chart?chs=400x400&cht=qr&chl=' + enc + '&choe=UTF-8'
    ];
  }
  function attachQrFallback(imgEl, urls) {
    let idx = 1;
    imgEl.onerror = function () { if (idx < urls.length) imgEl.src = urls[idx++]; };
  }

  /* ─── My Shop card ─────────────────────────────────────────── */
  function buildSubCardHTML() {
    const pct          = subPercentLeft();
    const days         = subDaysLeft();
    const color        = subStatusColor();
    const status       = subStatusLabel();
    const expired      = isSubExpired();
    const overdue      = subDaysOverdue();
    const expiringSoon = isSubExpiringSoon();
    const expiresStr   = SUB.expires_at ? fmtDate(SUB.expires_at) : '—';
    const lastPaidStr  = SUB.last_paid_at ? fmtDate(SUB.last_paid_at) : 'First activation';

    const c    = 2 * Math.PI * 32;
    const dash = (pct / 100) * c;

    let btnText, btnId;
    if (expired)          { btnText = 'Subscribe Now ₹' + SUB_PLAN_AMOUNT; btnId = 'sub-main-btn'; }
    else if (expiringSoon){ btnText = 'Renew Now ₹' + SUB_PLAN_AMOUNT;     btnId = 'sub-main-btn'; }
    else                  { btnText = 'Manage Subscription';               btnId = 'sub-manage-btn'; }

    return '' +
      '<div class="card" id="sub-card-root" style="margin-bottom:16px;max-width:480px;">' +
        '<div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;">' +
          '<div style="position:relative;width:80px;height:80px;flex-shrink:0;">' +
            '<svg width="80" height="80" viewBox="0 0 80 80" style="transform:rotate(-90deg);">' +
              '<circle cx="40" cy="40" r="32" fill="none" stroke="var(--border)" stroke-width="7"/>' +
              '<circle cx="40" cy="40" r="32" fill="none" stroke="' + color + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c - dash) + '"/>' +
            '</svg>' +
            '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;">' +
              '<div style="font-size:16px;font-weight:800;color:' + color + ';line-height:1;">' + pct + '%</div>' +
              '<div style="font-size:8px;color:var(--ink-3);margin-top:1px;">LEFT</div>' +
            '</div>' +
          '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;">' + SUB_PLAN_LABEL + '</div>' +
            '<span style="display:inline-block;background:' + color + '22;color:' + color + ';font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid ' + color + '44;">● ' + status.toUpperCase() + '</span>' +
          '</div>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--ink-2);line-height:1.9;margin-bottom:14px;padding:10px 12px;background:var(--card-alt);border-radius:10px;border:1px solid var(--border);">' +
          '<div style="display:flex;justify-content:space-between;"><span>Plan</span><b style="color:var(--ink);">₹' + SUB_PLAN_AMOUNT + ' / year</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Expires</span><b style="color:var(--ink);">' + expiresStr + '</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Remaining</span>' + (expired ? '<b style="color:var(--red);">Overdue ' + overdue + 'd</b>' : '<b style="color:' + color + ';">' + days + ' days</b>') + '</div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Last paid</span><b style="color:var(--ink);font-size:11px;">' + lastPaidStr + '</b></div>' +
          '<div style="display:flex;justify-content:space-between;padding-top:6px;margin-top:4px;border-top:1px solid var(--border);"><span>Pay to</span><code style="color:var(--green);font-family:monospace;font-size:11px;">' + SUB_OWNER_UPI + '</code></div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<button id="' + btnId + '" class="btn btn-primary btn-sm" style="flex:1;justify-content:center;font-weight:600;">' + btnText + '</button>' +
          '<a id="sub-support-link" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="justify-content:center;">Support</a>' +
        '</div>' +
      '</div>';
  }

  /* ─── Hook into renderMyShop ───────────────────────────────── */
  const _origMyShop = window.renderMyShop;
  if (typeof _origMyShop === 'function') {
    window.renderMyShop = function (content) {
      _origMyShop.apply(this, arguments);
      try {
        const old = content.querySelector('#sub-card-root');
        if (old) old.remove();

        const wrap = document.createElement('div');
        wrap.innerHTML = buildSubCardHTML();
        content.insertBefore(wrap.firstElementChild, content.firstChild);

        const mainBtn = content.querySelector('#sub-main-btn');
        if (mainBtn) mainBtn.onclick = function () { openSubscriptionModal(); };

        const mgBtn = content.querySelector('#sub-manage-btn');
        if (mgBtn) mgBtn.onclick = function () { openSubscriptionManageModal(); };

        const sLink = content.querySelector('#sub-support-link');
        if (sLink) sLink.href = waLink(SUB_SUPPORT_WHATSAPP,
          'Hi, I need help with my subscription.\nShop: ' +
          ((typeof SETTINGS !== 'undefined' && SETTINGS.shop_name) || ''));
      } catch (e) { console.warn('[SUB] card inject failed:', e); }
    };
  }

  /* ─── MODAL A: Subscribe / Renew ───────────────────────────── */
  window.openSubscriptionModal = function () {
    const shopName = (typeof SETTINGS !== 'undefined' && SETTINGS.shop_name) || 'Shop';
    const str      = buildUpiString(SUB_PLAN_AMOUNT, 'Subscription renewal - ' + shopName);
    const urls     = getQrUrls(str);

    openModal(
      '<div style="max-width:620px;margin:0 auto;">' +
        '<h2 style="font-size:18px;font-weight:700;margin-bottom:4px;">Subscribe to Pro</h2>' +
        '<p style="font-size:13px;color:var(--ink-3);margin-bottom:16px;">Pay ₹' + SUB_PLAN_AMOUNT + ' for 1 year of unlimited access.</p>' +
        '<div style="display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;">' +
          '<div style="flex:0 0 230px;text-align:center;">' +
            '<div style="background:#fff;padding:14px;border-radius:16px;border:1px solid var(--border);display:inline-block;">' +
              '<img id="sub-qr-img" src="' + urls[0] + '" style="width:200px;height:200px;display:block;border-radius:6px;">' +
            '</div>' +
            '<div style="font-size:12px;font-weight:600;color:var(--green);margin-top:10px;">Scan to pay ₹' + SUB_PLAN_AMOUNT + '</div>' +
          '</div>' +
          '<div style="flex:1;min-width:240px;">' +
            '<div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px;">Or pay to this UPI ID</div>' +
            '<div style="background:var(--card-alt);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;">' +
              '<code style="font-size:14px;color:var(--ink);font-weight:600;font-family:monospace;word-break:break-all;">' + esc(SUB_OWNER_UPI) + '</code>' +
              '<button id="sub-copy-upi" class="btn btn-ghost btn-sm">📋 Copy</button>' +
            '</div>' +
            '<div style="font-size:12px;color:var(--ink-3);margin-bottom:14px;">Receiver: <b style="color:var(--ink);">' + esc(SUB_OWNER_NAME) + '</b></div>' +
            '<div style="font-size:12px;color:var(--ink-2);line-height:1.9;margin-bottom:16px;padding:12px;background:var(--card-alt);border-radius:10px;border-left:3px solid var(--primary);">' +
              '<b style="color:var(--ink);">How to activate:</b><br>' +
              '1. Pay ₹' + SUB_PLAN_AMOUNT + ' via any UPI app<br>' +
              '2. Send the payment screenshot on WhatsApp<br>' +
              '3. Activated within a few hours' +
            '</div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
              '<a id="sub-wa-btn" target="_blank" rel="noopener" class="btn" style="background:#25D366;color:#fff;font-weight:600;">💬 Send screenshot on WhatsApp</a>' +
              '<button class="btn btn-ghost" onclick="closeModal()">Close</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>',
      function (root) {
        const copyBtn = root.querySelector('#sub-copy-upi');
        if (copyBtn) copyBtn.onclick = async function () {
          try { await navigator.clipboard.writeText(SUB_OWNER_UPI); toast('UPI ID copied', 'success'); }
          catch (e) { prompt('Copy:', SUB_OWNER_UPI); }
        };
        const wa = root.querySelector('#sub-wa-btn');
        if (wa) wa.href = waLink(SUB_SUPPORT_WHATSAPP,
          'Hi, I have paid ₹' + SUB_PLAN_AMOUNT + ' for the yearly subscription.\n\nShop: ' + shopName +
          '\nUPI: ' + SUB_OWNER_UPI + '\n\nPlease activate.');
        attachQrFallback(root.querySelector('#sub-qr-img'), urls);
      }
    );
  };

  /* ─── MODAL B: Manage ──────────────────────────────────────── */
  window.openSubscriptionManageModal = function () {
    const expiresStr  = SUB.expires_at ? fmtDate(SUB.expires_at) : '—';
    const lastPaidStr = SUB.last_paid_at ? fmtDate(SUB.last_paid_at) : 'First activation';
    const days        = subDaysLeft();
    const shopName    = (typeof SETTINGS !== 'undefined' && SETTINGS.shop_name) || '';

    openModal(
      '<div style="max-width:480px;margin:0 auto;">' +
        '<h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">Your Subscription</h2>' +
        '<div style="background:var(--card-alt);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:13px;line-height:2;color:var(--ink-2);">' +
          '<div style="display:flex;justify-content:space-between;"><span>Status</span><b style="color:var(--green);">● Active</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Plan</span><b style="color:var(--ink);">₹' + SUB_PLAN_AMOUNT + ' / year</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Expires</span><b style="color:var(--ink);">' + expiresStr + '</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Days remaining</span><b style="color:var(--green);">' + days + ' days</b></div>' +
          '<div style="display:flex;justify-content:space-between;"><span>Last paid</span><b style="color:var(--ink);">' + lastPaidStr + '</b></div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">' +
          '<a id="sub-manage-wa" target="_blank" rel="noopener" class="btn" style="background:#25D366;color:#fff;">💬 Contact Support</a>' +
          '<button class="btn btn-ghost" onclick="closeModal()">Close</button>' +
        '</div>' +
      '</div>',
      function (root) {
        const wa = root.querySelector('#sub-manage-wa');
        if (wa) wa.href = waLink(SUB_SUPPORT_WHATSAPP,
          'Hi, I want to renew my subscription early.\nShop: ' + shopName);
      }
    );
  };

  /* ─── MODAL C: Expired (blocking) ──────────────────────────── */
  window.openSubscriptionExpiredModal = function () {
    const overdue  = subDaysOverdue();
    const shopName = (typeof SETTINGS !== 'undefined' && SETTINGS.shop_name) || 'Shop';
    const str      = buildUpiString(SUB_PLAN_AMOUNT, 'Subscription renewal - ' + shopName);
    const urls     = getQrUrls(str);

    openModal(
      '<div style="max-width:640px;margin:0 auto;">' +
        '<div style="text-align:center;margin-bottom:16px;">' +
          '<div style="font-size:32px;margin-bottom:6px;">⚠</div>' +
          '<h2 style="font-size:20px;font-weight:700;color:var(--red);">Subscription Expired</h2>' +
          '<p style="font-size:13px;color:var(--ink-3);margin-top:4px;">Renew to keep saving data.</p>' +
        '</div>' +
        '<div style="display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;padding:18px;background:var(--card-alt);border:1px solid var(--border);border-radius:16px;">' +
          '<div style="flex:0 0 220px;text-align:center;">' +
            '<div style="background:#fff;padding:14px;border-radius:16px;border:1px solid var(--border);display:inline-block;">' +
              '<img id="sub-exp-qr-img" src="' + urls[0] + '" style="width:190px;height:190px;display:block;border-radius:6px;">' +
            '</div>' +
            '<div style="font-size:12px;font-weight:600;color:var(--green);margin-top:10px;">Scan to pay ₹' + SUB_PLAN_AMOUNT + '</div>' +
          '</div>' +
          '<div style="flex:1;min-width:240px;">' +
            '<div style="font-size:16px;font-weight:700;color:var(--ink);margin-bottom:4px;">Renew for ₹' + SUB_PLAN_AMOUNT + '</div>' +
            '<div style="font-size:12px;color:var(--ink-3);margin-bottom:14px;">We will activate within a few hours after we receive your screenshot.</div>' +
            '<div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px;">UPI ID</div>' +
            '<div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;">' +
              '<code style="font-size:14px;color:var(--ink);font-weight:600;font-family:monospace;word-break:break-all;">' + esc(SUB_OWNER_UPI) + '</code>' +
              '<button id="sub-exp-copy" class="btn btn-ghost btn-sm">📋 Copy</button>' +
            '</div>' +
            '<div style="font-size:12px;color:var(--ink-3);margin-bottom:14px;">Receiver: <b style="color:var(--ink);">' + esc(SUB_OWNER_NAME) + '</b></div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
              '<a id="sub-exp-wa" target="_blank" rel="noopener" class="btn" style="background:#25D366;color:#fff;font-weight:600;">💬 WhatsApp us</a>' +
              '<button class="btn btn-ghost" onclick="closeModal()">Close</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--ink-3);line-height:1.9;">' +
          '<div style="color:var(--red);font-weight:600;margin-bottom:4px;">⚠ Overdue by ' + overdue + ' day' + (overdue === 1 ? '' : 's') + '</div>' +
          '<div>✉ <a href="mailto:' + esc(SUB_SUPPORT_EMAIL) + '" style="color:var(--primary-hover);">' + esc(SUB_SUPPORT_EMAIL) + '</a></div>' +
          '<div style="font-size:11px;color:var(--ink-4);margin-top:6px;">Your existing data is safe. It will not update until you renew.</div>' +
        '</div>' +
      '</div>',
      function (root) {
        const copyBtn = root.querySelector('#sub-exp-copy');
        if (copyBtn) copyBtn.onclick = async function () {
          try { await navigator.clipboard.writeText(SUB_OWNER_UPI); toast('UPI ID copied', 'success'); }
          catch (e) { prompt('Copy:', SUB_OWNER_UPI); }
        };
        const wa = root.querySelector('#sub-exp-wa');
        if (wa) wa.href = waLink(SUB_SUPPORT_WHATSAPP,
          'Hi, I have paid ₹' + SUB_PLAN_AMOUNT + ' for renewal. Please activate.\nShop: ' + shopName);
        attachQrFallback(root.querySelector('#sub-exp-qr-img'), urls);
      }
    );
  };

  /* ─── GUARD: wrap create/edit functions ────────────────────── */
  const GUARDED = [
    'openPartyForm',
    'openProductForm',
    'openQuickProductForm',
    'openRestockForm',
    'openSupplierForm',
    'openSupplierPaymentForm',
    'openPartyPaymentForm',
    'openPurchaseBillForm',
    'openExpenseForm',
    'openSaveWalkinModal'
  ];
  GUARDED.forEach(function (name) {
    const orig = window[name];
    if (typeof orig === 'function') {
      window[name] = function () {
        if (!isSubActive()) { openSubscriptionExpiredModal(); return; }
        return orig.apply(this, arguments);
      };
    }
  });

  /* ─── GUARD: intercept clicks on destructive / create buttons ─ */
  document.addEventListener('click', function (e) {
    if (isSubActive()) return;
    const t = e.target.closest(
      '[data-del],[data-pay-del],[data-rt-del],[data-bill-del],[data-spay-del],' +
      '[data-restock],[data-edit],[data-del-inv],' +
      '#ni-save,#ni-save-print,' +
      '#inv-export,#p-export,#c-export,#r-export,#pu-export,' +
      '#ex-export,#pay-export,#pnl-export,#mg-export,#rp-export'
    );
    if (t) {
      e.preventDefault();
      e.stopPropagation();
      openSubscriptionExpiredModal();
    }
  }, true);

  /* ─── BOOT: wait for owner to be logged in, then load sub ──── */
  let tries = 0;
  const wait = setInterval(async function () {
    tries++;
    if (tries > 60) { clearInterval(wait); return; }
    if (typeof SESSION === 'undefined' || !SESSION) return;
    clearInterval(wait);
    await loadSubscription();
    try { updateSubscriptionUI(); } catch (e) {}
  }, 500);
})();

/* ════════════════════════════════════════════════════════════════════
   END BLOCK 52 — SUBSCRIPTION SYSTEM
   ════════════════════════════════════════════════════════════════════ */
</script>
<!-- ══════════════════════════════════════════════════════════════════
     BLOCK 53 — INVENTORY
     ──────────────────────────────────────────────────────────────────
     Value, health, and money locked in stock. Self-contained.

     Adds:
       • Sidebar link "Inventory"  (Catalogue group, after Products)
       • Mobile nav entry          (same position)
       • Route #/inventory
       • Full page: 8 KPI tiles + category chart + health donut
                    + supplier breakdown + top-10 list + slow movers
                    + filterable/sortable full table + CSV/PDF export

     Reads only: DB.products, DB.invoices, DB.invoice_items, DB.suppliers
     No schema changes. No edits needed to any other block.

     To remove: delete from the START marker above to the END marker
                at the very bottom.
     ══════════════════════════════════════════════════════════════════ -->

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════════
     53.1 — REGISTER NAV ENTRIES
     NAV_LINKS and MOBILE_NAV are const arrays; we mutate them
     (splice) so every future renderLayout() picks up the link.
     ══════════════════════════════════════════════════════════════ */
  try {
    if (typeof NAV_LINKS !== 'undefined' && Array.isArray(NAV_LINKS)) {
      var catGroup = NAV_LINKS.find(function (g) { return g.group === 'Catalogue'; });
      if (catGroup && !catGroup.items.some(function (it) { return it.href === '#/inventory'; })) {
        var pIdx = catGroup.items.findIndex(function (it) { return it.href === '#/products'; });
        catGroup.items.splice(pIdx >= 0 ? pIdx + 1 : 0, 0, {
          href: '#/inventory', icon: '📊', label: 'Inventory'
        });
      }
    }
    if (typeof MOBILE_NAV !== 'undefined' && Array.isArray(MOBILE_NAV)) {
      if (!MOBILE_NAV.some(function (it) { return it.href === '#/inventory'; })) {
        var mIdx = MOBILE_NAV.findIndex(function (it) { return it.href === '#/products'; });
        MOBILE_NAV.splice(mIdx >= 0 ? mIdx + 1 : MOBILE_NAV.length, 0, {
          href: '#/inventory', icon: '📊', label: 'Inventory'
        });
      }
    }
  } catch (e) {
    console.warn('[Inventory] nav inject failed:', e);
  }

  /* ══════════════════════════════════════════════════════════════
     53.2 — PAGE RENDERER
     ══════════════════════════════════════════════════════════════ */
  function renderInventory(content) {
    if (!content) return;

    var products     = DB.products        || [];
    var invoiceItems = DB.invoice_items   || [];
    var invoices     = DB.invoices        || [];
    var suppliers    = DB.suppliers       || [];

    /* ─── Enrich products with value metrics ─────────────────── */
    var enriched = products.map(function (p) {
      var stock = Number(p.stock) || 0;
      var cost  = Number(p.cost)  || 0;
      var cp    = Number(p.customer_price)  || 0;
      var wp    = Number(p.wholesale_price) || 0;

      var costVal      = stock * cost;
      var retailVal    = stock * cp;
      var wholesaleVal = stock * wp;

      return Object.assign({}, p, {
        _stock:           stock,
        _cost:            cost,
        _cp:              cp,
        _wp:              wp,
        _costVal:         costVal,
        _retailVal:       retailVal,
        _wholesaleVal:    wholesaleVal,
        _profitRetail:    retailVal    - costVal,
        _profitWholesale: wholesaleVal - costVal
      });
    });

    /* ─── Totals ──────────────────────────────────────────────── */
    var totalCostValue      = enriched.reduce(function (s, p) { return s + p._costVal; }, 0);
    var totalRetailValue    = enriched.reduce(function (s, p) { return s + p._retailVal; }, 0);
    var totalWholesaleValue = enriched.reduce(function (s, p) { return s + p._wholesaleVal; }, 0);
    var totalProfitRetail   = totalRetailValue - totalCostValue;
    var totalProfitWhole    = totalWholesaleValue - totalCostValue;
    var skuTotal            = enriched.length;
    var lowCount            = enriched.filter(function (p) { return isLowStock(p); }).length;
    var outCount            = enriched.filter(function (p) { return isOutOfStock(p); }).length;

    var retailMarginPct = totalRetailValue > 0 ? (totalProfitRetail / totalRetailValue) * 100 : 0;
    var wholeMarginPct  = totalWholesaleValue > 0 ? (totalProfitWhole / totalWholesaleValue) * 100 : 0;

    /* ─── Value by category ──────────────────────────────────── */
    var catMap = {};
    enriched.forEach(function (p) {
      var c = p.category || 'Uncategorised';
      catMap[c] = (catMap[c] || 0) + p._costVal;
    });
    var catEntries = Object.entries(catMap).sort(function (a, b) { return b[1] - a[1]; });

    /* ─── Value by supplier ──────────────────────────────────── */
    var supMap = {};
    enriched.forEach(function (p) {
      var k = p.supplier_id || '__none__';
      supMap[k] = (supMap[k] || 0) + p._costVal;
    });
    var supEntries = Object.entries(supMap)
      .map(function (kv) {
        var sup = kv[0] === '__none__' ? null : suppliers.find(function (s) { return s.id === kv[0]; });
        return {
          id:    kv[0],
          name:  sup ? sup.name : 'Unassigned',
          type:  sup ? (sup.type || 'company') : null,
          value: kv[1]
        };
      })
      .sort(function (a, b) { return b.value - a.value; })
      .slice(0, 8);

    /* ─── Top 10 by stock value ──────────────────────────────── */
    var topByCostValue = enriched.slice()
      .sort(function (a, b) { return b._costVal - a._costVal; })
      .slice(0, 10);

    /* ─── Last-sold map (for slow movers) ────────────────────── */
    var invById = {};
    invoices.forEach(function (i) { invById[i.id] = i; });

    var lastSold = {};
    invoiceItems.forEach(function (it) {
      if (!it.product_id) return;
      var inv = invById[it.invoice_id];
      if (!inv) return;
      var d = txDate(inv, 'invoice_date');
      if (!d) return;
      if (!lastSold[it.product_id] || d > lastSold[it.product_id]) {
        lastSold[it.product_id] = d;
      }
    });

    var cutoff = daysAgoStr(60);
    var slowMovers = enriched
      .filter(function (p) {
        if (p._stock <= 0)   return false;
        if (p._costVal <= 0) return false;
        var last = lastSold[p.id];
        if (!last) return true;
        return last < cutoff;
      })
      .map(function (p) { return Object.assign({}, p, { _lastSold: lastSold[p.id] || null }); })
      .sort(function (a, b) { return b._costVal - a._costVal; })
      .slice(0, 10);

    /* ─── Page HTML ──────────────────────────────────────────── */
    content.innerHTML = '' +
      '<div class="page-head">' +
        '<div>' +
          '<h1>Inventory</h1>' +
          '<p>Value, health, and money locked in stock · <b>' + skuTotal + '</b> SKU' + (skuTotal === 1 ? '' : 's') + '</p>' +
        '</div>' +
        '<div class="page-actions">' +
          '<button class="btn btn-ghost" type="button" id="invx-csv">📤 Export CSV</button>' +
          '<button class="btn btn-ghost" type="button" id="invx-pdf">📄 Export PDF</button>' +
          '<button class="btn btn-primary" type="button" id="invx-add">+ Add Product</button>' +
        '</div>' +
      '</div>' +

      /* ─── Row 1: Value snapshot ─────────────────────────── */
      '<div class="grid-4" style="margin-bottom:16px">' +
        '<div class="kpi">' +
          '<div class="kpi-head"><div class="kpi-label">Total Cost Value</div><div class="kpi-icon" style="background:var(--amber-bg);color:var(--amber)">💰</div></div>' +
          '<div class="kpi-value">' + rs(totalCostValue) + '</div>' +
          '<div class="kpi-trend">cash locked in stock</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="kpi-head"><div class="kpi-label">Customer Sell Value</div><div class="kpi-icon" style="background:var(--blue-bg);color:var(--blue)">🧑</div></div>' +
          '<div class="kpi-value" style="color:var(--blue)">' + rs(totalRetailValue) + '</div>' +
          '<div class="kpi-trend">if sold at retail tier</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="kpi-head"><div class="kpi-label">Wholesale Sell Value</div><div class="kpi-icon" style="background:var(--purple-bg);color:var(--purple)">🏪</div></div>' +
          '<div class="kpi-value" style="color:var(--purple)">' + rs(totalWholesaleValue) + '</div>' +
          '<div class="kpi-trend">if sold at wholesale tier</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="kpi-head"><div class="kpi-label">Active SKUs</div><div class="kpi-icon">📦</div></div>' +
          '<div class="kpi-value">' + skuTotal + '</div>' +
          '<div class="kpi-trend">in catalogue</div>' +
        '</div>' +
      '</div>' +

      /* ─── Row 2: Profit potential + health ──────────────── */
      '<div class="grid-4" style="margin-bottom:16px">' +
        '<div class="kpi">' +
          '<div class="kpi-head"><div class="kpi-label">Retail Profit Potential</div><div class="kpi-icon" style="background:var(--green-bg);color:var(--green)">📈</div></div>' +
          '<div class="kpi-value" style="color:' + (totalProfitRetail >= 0 ? 'var(--green)' : 'var(--red)') + '">' + rs(totalProfitRetail) + '</div>' +
          '<div class="kpi-trend">' + retailMarginPct.toFixed(1) + '% margin at retail</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="kpi-head"><div class="kpi-label">Wholesale Profit Potential</div><div class="kpi-icon" style="background:var(--green-bg);color:var(--green)">📈</div></div>' +
          '<div class="kpi-value" style="color:' + (totalProfitWhole >= 0 ? 'var(--green)' : 'var(--red)') + '">' + rs(totalProfitWhole) + '</div>' +
          '<div class="kpi-trend">' + wholeMarginPct.toFixed(1) + '% margin at wholesale</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="kpi-head"><div class="kpi-label">Low Stock</div><div class="kpi-icon" style="background:var(--red-bg);color:var(--red)">⚠️</div></div>' +
          '<div class="kpi-value" style="color:' + (lowCount > 0 ? 'var(--red)' : 'var(--green)') + '">' + lowCount + '</div>' +
          '<div class="kpi-trend">restock soon</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="kpi-head"><div class="kpi-label">Out of Stock</div><div class="kpi-icon" style="background:var(--red-bg);color:var(--red)">🚫</div></div>' +
          '<div class="kpi-value" style="color:' + (outCount > 0 ? 'var(--red)' : 'var(--green)') + '">' + outCount + '</div>' +
          '<div class="kpi-trend">zero units on hand</div>' +
        '</div>' +
      '</div>' +

      /* ─── Charts row ──────────────────────────────────────── */
      '<div class="grid-2" style="margin-bottom:16px">' +
        '<div class="card">' +
          '<div class="card-title">Value by Category <small>at cost</small></div>' +
          '<div style="position:relative;height:280px"><canvas id="invx-cat-chart"></canvas></div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-title">Stock Health <small>OK / LOW / OUT</small></div>' +
          '<div style="position:relative;height:280px"><canvas id="invx-health-chart"></canvas></div>' +
        '</div>' +
      '</div>' +

      /* ─── Supplier + Top 10 ──────────────────────────────── */
      '<div class="grid-2" style="margin-bottom:16px">' +
        '<div class="card">' +
          '<div class="card-title">Value by Supplier <small>at cost</small></div>' +
          (!supEntries.length
            ? '<p style="color:var(--ink-3);font-size:var(--fs-sm);text-align:center;padding:20px 0">No supplier-linked products</p>'
            : '<div style="display:flex;flex-direction:column;gap:10px">' +
                supEntries.map(function (s) {
                  var pct = totalCostValue > 0 ? (s.value / totalCostValue) * 100 : 0;
                  var chipCls   = s.type === 'vendor' ? 'chip-purple' : (s.type === 'company' ? 'chip-blue' : 'chip-gray');
                  var chipLabel = s.type === 'vendor' ? 'Vendor' : (s.type === 'company' ? 'Company' : '—');
                  return '' +
                    '<div>' +
                      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px">' +
                        '<div style="display:flex;align-items:center;gap:6px;min-width:0">' +
                          '<span style="font-weight:600;color:var(--ink);font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(s.name) + '</span>' +
                          '<span class="chip ' + chipCls + ' chip-xs">' + chipLabel + '</span>' +
                        '</div>' +
                        '<b style="font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap">' + rs(s.value) + '</b>' +
                      '</div>' +
                      '<div style="height:5px;background:var(--bg-deep);border-radius:2px;overflow:hidden">' +
                        '<div style="height:100%;width:' + pct + '%;background:var(--primary)"></div>' +
                      '</div>' +
                      '<div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px">' + pct.toFixed(1) + '% of inventory</div>' +
                    '</div>';
                }).join('') +
              '</div>') +
        '</div>' +

        '<div class="card">' +
          '<div class="card-title">Top 10 by Stock Value <small>biggest cash tied up</small></div>' +
          (!topByCostValue.length
            ? '<p style="color:var(--ink-3);font-size:var(--fs-sm);text-align:center;padding:20px 0">No products</p>'
            : '<div style="display:flex;flex-direction:column;gap:8px">' +
                topByCostValue.map(function (p, i) {
                  var d = productDisplay(p);
                  return '' +
                    '<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:var(--fs-sm)">' +
                      '<div style="flex:1;min-width:0">' +
                        '<div style="font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
                          '<span style="color:var(--primary-hover);font-weight:800">' + (i + 1) + '.</span> ' + esc(p.name) +
                        '</div>' +
                        '<div style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px">' + esc(d.stockLabel) + '</div>' +
                      '</div>' +
                      '<b style="color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap">' + rs(p._costVal) + '</b>' +
                    '</div>';
                }).join('') +
              '</div>') +
        '</div>' +
      '</div>' +

      /* ─── Slow movers ────────────────────────────────────── */
      (slowMovers.length
        ? '<div class="card" style="margin-bottom:16px">' +
            '<div class="card-title">Slow Movers <small>not sold in 60+ days</small></div>' +
            '<div class="tbl-wrap"><table>' +
              '<thead><tr>' +
                '<th>Product</th><th>Category</th>' +
                '<th style="text-align:right">Stock</th>' +
                '<th style="text-align:right">Cost Value</th>' +
                '<th>Last Sold</th><th></th>' +
              '</tr></thead>' +
              '<tbody>' +
                slowMovers.map(function (p) {
                  var d = productDisplay(p);
                  var last = p._lastSold ? fmtDate(p._lastSold) : 'Never';
                  return '' +
                    '<tr>' +
                      '<td><strong>' + esc(p.name) + '</strong></td>' +
                      '<td>' + categoryChip(p.category) + '</td>' +
                      '<td style="text-align:right;font-weight:600">' + esc(d.stockLabel) + '</td>' +
                      '<td style="text-align:right;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums">' + rs(p._costVal) + '</td>' +
                      '<td style="color:' + (p._lastSold ? 'var(--ink-2)' : 'var(--red)') + ';font-size:var(--fs-sm)">' + esc(last) + '</td>' +
                      '<td style="text-align:right"><button class="btn btn-ghost btn-sm" type="button" data-edit-product="' + p.id + '">Edit</button></td>' +
                    '</tr>';
                }).join('') +
              '</tbody>' +
            '</table></div>' +
            '<p style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:10px;padding:0 4px">💡 Consider discounting these to release the cash.</p>' +
          '</div>'
        : '') +

      /* ─── Full table ─────────────────────────────────────── */
      '<div class="card" style="padding:0;overflow:hidden">' +
        '<div class="card-title" style="padding:14px 18px;margin:0;border-bottom:1px solid var(--border);background:var(--card-alt)">' +
          'All products — value breakdown <small><span id="invx-count">0</span> shown</small>' +
        '</div>' +

        '<div style="padding:12px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;border-bottom:1px solid var(--border)">' +
          '<div style="flex:2;min-width:180px">' +
            '<label class="label">Search</label>' +
            '<input class="input" id="invx-search" placeholder="Product or category…" autocomplete="off">' +
          '</div>' +
          '<div style="flex:1;min-width:140px">' +
            '<label class="label">Category</label>' +
            '<select class="input" id="invx-cat">' +
              '<option value="">All</option>' +
              Array.from(new Set(products.map(function (p) { return p.category; }).filter(Boolean)))
                .sort(function (a, b) { return a.localeCompare(b); })
                .map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; })
                .join('') +
            '</select>' +
          '</div>' +
          '<div style="flex:1;min-width:140px">' +
            '<label class="label">Stock</label>' +
            '<select class="input" id="invx-stock">' +
              '<option value="">All</option>' +
              '<option value="ok">Healthy</option>' +
              '<option value="low">Low</option>' +
              '<option value="out">Out</option>' +
            '</select>' +
          '</div>' +
          '<div style="flex:1;min-width:160px">' +
            '<label class="label">Sort</label>' +
            '<select class="input" id="invx-sort">' +
              '<option value="costVal-desc">Cost value (high)</option>' +
              '<option value="retailVal-desc">Retail value (high)</option>' +
              '<option value="profit-desc">Profit (high)</option>' +
              '<option value="stock">Stock (low first)</option>' +
              '<option value="stock-desc">Stock (high first)</option>' +
              '<option value="name">Name A → Z</option>' +
            '</select>' +
          '</div>' +
        '</div>' +

        '<div class="tbl-wrap" style="border:0;border-radius:0">' +
          '<table>' +
            '<thead><tr>' +
              '<th>Product</th>' +
              '<th>Category</th>' +
              '<th style="text-align:right">Stock</th>' +
              '<th style="text-align:right">Cost Value</th>' +
              '<th style="text-align:right">Retail Value</th>' +
              '<th style="text-align:right">Wholesale Value</th>' +
              '<th style="text-align:right">Profit (retail)</th>' +
              '<th>Status</th>' +
              '<th></th>' +
            '</tr></thead>' +
            '<tbody id="invx-tbody"></tbody>' +
          '</table>' +
        '</div>' +
      '</div>';

    /* ─── Filter + sort + render rows ────────────────────────── */
    function renderRows() {
      var search      = (document.getElementById('invx-search').value || '').toLowerCase().trim();
      var cat         = document.getElementById('invx-cat').value;
      var stockFilter = document.getElementById('invx-stock').value;
      var sortBy      = document.getElementById('invx-sort').value;

      var arr = enriched.slice();

      if (search) {
        arr = arr.filter(function (p) {
          var hay = ((p.name || '') + ' ' + (p.category || '')).toLowerCase();
          return hay.indexOf(search) !== -1;
        });
      }
      if (cat) arr = arr.filter(function (p) { return p.category === cat; });

      if (stockFilter === 'low')      arr = arr.filter(function (p) { return isLowStock(p) && !isOutOfStock(p); });
      else if (stockFilter === 'out') arr = arr.filter(function (p) { return isOutOfStock(p); });
      else if (stockFilter === 'ok')  arr = arr.filter(function (p) { return !isLowStock(p); });

      switch (sortBy) {
        case 'costVal-desc':   arr.sort(function (a, b) { return b._costVal      - a._costVal;      }); break;
        case 'retailVal-desc': arr.sort(function (a, b) { return b._retailVal    - a._retailVal;    }); break;
        case 'profit-desc':    arr.sort(function (a, b) { return b._profitRetail - a._profitRetail; }); break;
        case 'stock':          arr.sort(function (a, b) { return a._stock        - b._stock;        }); break;
        case 'stock-desc':     arr.sort(function (a, b) { return b._stock        - a._stock;        }); break;
        case 'name':           arr.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); }); break;
      }

      document.getElementById('invx-count').textContent = arr.length;

      var tbody = document.getElementById('invx-tbody');
      if (!arr.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="padding:0">' +
          emptyStateHTML('📦', 'No products match', 'Try clearing filters or add a product.', '') +
        '</td></tr>';
        return;
      }

      tbody.innerHTML = arr.map(function (p) {
        var d        = productDisplay(p);
        var supplier = p.supplier_id ? suppliers.find(function (s) { return s.id === p.supplier_id; }) : null;
        var profitCol = p._profitRetail >= 0 ? 'var(--green)' : 'var(--red)';

        return '' +
          '<tr>' +
            '<td>' +
              '<strong>' + esc(p.name) + '</strong>' +
              (p.dual ? '<span class="chip chip-primary chip-xs" style="margin-left:6px">DUAL</span>' : '') +
              (supplier ? '<div style="font-size:var(--fs-xs);color:var(--primary-hover);margin-top:2px">' + esc(supplier.name) + '</div>' : '') +
            '</td>' +
            '<td>' + categoryChip(p.category) + '</td>' +
            '<td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">' + esc(d.stockLabel) + '</td>' +
            '<td style="text-align:right;color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums">' + rs(p._costVal) + '</td>' +
            '<td style="text-align:right;color:var(--blue);font-variant-numeric:tabular-nums">' + rs(p._retailVal) + '</td>' +
            '<td style="text-align:right;color:var(--purple);font-variant-numeric:tabular-nums">' + rs(p._wholesaleVal) + '</td>' +
            '<td style="text-align:right;color:' + profitCol + ';font-weight:600;font-variant-numeric:tabular-nums">' + rs(p._profitRetail) + '</td>' +
            '<td>' + stockBadge(p) + '</td>' +
            '<td class="td-actions">' +
              '<button class="btn btn-ghost btn-sm" type="button" data-restock="' + p.id + '">+ Stock</button>' +
              '<button class="btn btn-ghost btn-sm" type="button" data-edit-product="' + p.id + '">Edit</button>' +
            '</td>' +
          '</tr>';
      }).join('');
    }

        /* Row-action clicks are handled by a single delegated listener
       installed once, at the end of this block. */

    /* ─── Filter events ─────────────────────────────────────── */
    ['invx-search', 'invx-cat', 'invx-stock', 'invx-sort'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) { el.oninput = renderRows; el.onchange = renderRows; }
    });

    renderRows();

    /* ─── "+ Add Product" ───────────────────────────────────── */
    var addBtn = document.getElementById('invx-add');
    if (addBtn) {
      addBtn.onclick = function () {
        if (typeof openProductForm === 'function') openProductForm();
      };
    }

    /* ─── Charts ────────────────────────────────────────────── */
    if (Array.isArray(charts)) {
      charts.forEach(function (c) { try { c.destroy(); } catch (e) {} });
    }
    charts = [];

    var reduce = !!(typeof SETTINGS !== 'undefined' && SETTINGS.reduced_effects);

    /* Category chart (horizontal bar) */
    var catCanvas = document.getElementById('invx-cat-chart');
    if (catCanvas && typeof Chart !== 'undefined' && catEntries.length) {
      charts.push(new Chart(catCanvas, {
        type: 'bar',
        data: {
          labels: catEntries.map(function (e) {
            return e[0].length > 20 ? e[0].slice(0, 20) + '…' : e[0];
          }),
          datasets: [{
            data: catEntries.map(function (e) { return e[1]; }),
            backgroundColor: catEntries.map(function (_, i) {
              var p = ['#C79A28','#E0B84A','#EFD27C','#F4E4B4','#B88A1E','#8F6914','#D4A93A','#E5C97A'];
              return p[i % p.length];
            }),
            borderRadius: 6,
            maxBarThickness: 22
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          animation: reduce ? false : { duration: 400 },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1F2937',
              callbacks: { label: function (ctx) { return rs(ctx.parsed.x); } }
            }
          },
          scales: {
            x: {
              beginAtZero: true,
              ticks: {
                color: '#6B7280', font: { size: 10 },
                callback: function (v) { return '₹' + Number(v).toLocaleString('en-IN'); }
              },
              grid: { color: '#F1F5F9', drawBorder: false }
            },
            y: {
              ticks: { color: '#1F2937', font: { size: 11, weight: '600' } },
              grid: { display: false }
            }
          }
        }
      }));
    } else if (catCanvas) {
      var cc = catCanvas.getContext('2d');
      cc.clearRect(0, 0, catCanvas.width, catCanvas.height);
    }

    /* Health doughnut */
    var healthCanvas = document.getElementById('invx-health-chart');
    if (healthCanvas && typeof Chart !== 'undefined') {
      var okCount   = enriched.filter(function (p) { return !isLowStock(p); }).length;
      var lowOnly   = enriched.filter(function (p) { return isLowStock(p) && !isOutOfStock(p); }).length;
      var totalSkus = okCount + lowOnly + outCount;

      charts.push(new Chart(healthCanvas, {
        type: 'doughnut',
        data: {
          labels: ['Healthy', 'Low', 'Out'],
          datasets: [{
            data: [okCount, lowOnly, outCount],
            backgroundColor: ['#15803D', '#B45309', '#B91C1C'],
            borderWidth: 0,
            hoverOffset: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: reduce ? false : { duration: 400 },
          cutout: '65%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#4B5563', font: { size: 11 }, usePointStyle: true, boxWidth: 8, padding: 12 }
            },
            tooltip: {
              backgroundColor: '#1F2937',
              callbacks: {
                label: function (ctx) {
                  var pct = totalSkus > 0 ? (ctx.parsed / totalSkus) * 100 : 0;
                  return ctx.label + ': ' + ctx.parsed + ' (' + pct.toFixed(1) + '%)';
                }
              }
            }
          }
        }
      }));
    }

    /* ─── CSV export ────────────────────────────────────────── */
    var csvBtn = document.getElementById('invx-csv');
    if (csvBtn) {
      csvBtn.onclick = function () {
        var header = [
          'Product','Category','Unit','Stock','Cost/unit','Customer Price','Wholesale Price',
          'Cost Value','Retail Value','Wholesale Value','Retail Profit','Status'
        ];
        var rows = enriched.map(function (p) {
          var unitLabel = p.dual
            ? (p.primary_unit === 'pack_unit' ? (p.pack_unit || 'box') : (p.base_unit || 'piece'))
            : (p.unit || '');
          var status = isOutOfStock(p) ? 'OUT' : (isLowStock(p) ? 'LOW' : 'OK');
          return [
            p.name || '',
            p.category || '',
            unitLabel,
            p._stock,
            p._cost,
            p._cp,
            p._wp,
            p._costVal.toFixed(2),
            p._retailVal.toFixed(2),
            p._wholesaleVal.toFixed(2),
            p._profitRetail.toFixed(2),
            status
          ];
        });
        var all = [header].concat(rows);
        var csv = all.map(function (row) {
          return row.map(function (cell) {
            var s = String(cell == null ? '' : cell);
            if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
          }).join(',');
        }).join('\n');

        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        downloadBlob(blob, 'Inventory-' + todayStr() + '.csv');
        toast('CSV downloaded', 'success');
      };
    }

    /* ─── PDF export ────────────────────────────────────────── */
    var pdfBtn = document.getElementById('invx-pdf');
    if (pdfBtn) {
      pdfBtn.onclick = function () {
        if (!window.PDFMaker || typeof window.PDFMaker.report !== 'function') {
          toast('PDF module not loaded', 'info');
          return;
        }
        var rows = enriched.slice()
          .sort(function (a, b) { return b._costVal - a._costVal; })
          .map(function (p) {
            var d = productDisplay(p);
            var status = isOutOfStock(p) ? 'OUT' : (isLowStock(p) ? 'LOW' : 'OK');
            return [
              p.name,
              p.category || '-',
              d.stockLabel,
              inr(p._costVal),
              inr(p._retailVal),
              inr(p._wholesaleVal),
              inr(p._profitRetail),
              status
            ];
          });

        window.PDFMaker.report({
          title: 'Inventory Report',
          meta: 'Generated ' + new Date().toLocaleString('en-IN') + ' · ' + skuTotal + ' SKUs',
          kpis: [
            ['Cost Value',      inr(totalCostValue)],
            ['Retail Value',    inr(totalRetailValue)],
            ['Wholesale Value', inr(totalWholesaleValue)],
            ['Profit (retail)', inr(totalProfitRetail)],
            ['Low / Out',       lowCount + ' / ' + outCount]
          ],
          tables: [{
            title: 'All products',
            head: ['Product','Category','Stock','Cost Value','Retail Value','Wholesale Value','Profit','Status'],
            rows: rows
          }],
          filename: 'Inventory-' + todayStr() + '.pdf'
        });
      };
    }
  }

  /* ══════════════════════════════════════════════════════════════
     53.3 — ROUTE WRAPPER
     Chains onto the current window.route (Block 52 already wrapped
     it). Debounced so Block 49's anonymous hashchange listener and
     our own listener don't cause a double render. Falls back to
     syncDB() so direct navigation to #/inventory works.
     ══════════════════════════════════════════════════════════════ */
  var _origRoute = window.route;
  var _lastInvHash  = '';
  var _lastInvStamp = 0;
  var _INV_DEBOUNCE_MS = 120;

  if (typeof _origRoute === 'function') {
    window.route = async function () {
      var rawHash = location.hash || '#/';
      var path    = rawHash.split('?')[0];

      if (path === '#/inventory') {
        /* ─── Auth gate ─────────────────────────────────── */
        if (typeof isLoggedIn === 'function' && !isLoggedIn()) {
          if (typeof renderLogin === 'function') renderLogin();
          return;
        }

        /* ─── Debounce duplicate renders ───────────────── */
        var now = Date.now();
        if (_lastInvHash === rawHash && (now - _lastInvStamp) < _INV_DEBOUNCE_MS) {
          return;
        }
        _lastInvHash  = rawHash;
        _lastInvStamp = now;

        /* ─── Ensure data loaded ───────────────────────── */
        if (window.DB_SYNCED !== true && typeof syncDB === 'function') {
          try { await syncDB(); } catch (e) { console.warn('[Inventory] syncDB failed:', e); }
        }

        /* ─── Render shell + page ──────────────────────── */
        if (typeof renderLayout === 'function') renderLayout();

        var content = document.getElementById('content');
        if (content) {
          try {
            renderInventory(content);
          } catch (err) {
            console.error('[Inventory] render failed:', err);
            content.innerHTML =
              '<div class="card" style="border-color:var(--red-border);background:var(--red-bg)">' +
                '<div style="font-weight:700;color:var(--red);margin-bottom:6px">⚠️ Inventory failed to load</div>' +
                '<div style="font-size:var(--fs-sm);color:var(--red);font-family:var(--font-mono);word-break:break-word">' +
                  (typeof esc === 'function' ? esc(err.message || String(err)) : String(err)) +
                '</div>' +
              '</div>';
          }
        }

        try { if (typeof refreshNavActive === 'function') refreshNavActive(); } catch (e) {}
        return;
      }

      return _origRoute.apply(this, arguments);
    };
  }

  /* Expose for debugging */
  window.renderInventory = renderInventory;
  /* ─── Single delegated click handler for inventory rows ──── */
  document.addEventListener('click', function (e) {
    if (!document.getElementById('invx-tbody')) return;

    var editBtn = e.target.closest('[data-edit-product]');
    if (editBtn) {
      var prod = DB.products.find(function (x) { return x.id === editBtn.dataset.editProduct; });
      if (prod && typeof openProductForm === 'function') openProductForm(prod);
      return;
    }
    var restockBtn = e.target.closest('[data-restock]');
    if (restockBtn && typeof openRestockForm === 'function') {
      openRestockForm(restockBtn.dataset.restock);
    }
  });


  console.log('[Inventory] Block 53 ready');
})();
/* ══════════════════════════════════════════════════════════════════
   END BLOCK 53 — INVENTORY
   ══════════════════════════════════════════════════════════════════ */
     
</script>
</body>
</html>
