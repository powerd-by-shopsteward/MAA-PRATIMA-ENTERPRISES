          group: 'Pages',
          icon:  it.icon,
          label: it.label,
          sub:   g.group,
          keywords: (g.group + ' ' + it.label).toLowerCase(),
          run: () => { location.hash = it.href; }
        });
      });
    });
  }

  /* ─── Customers ──────────────────────────────────────── */
  (DB.customers || []).forEach(c => {
    const st = partyStats(c.id, 'customer');
    idx.push({
      group: 'Customers',
      icon:  '🧑',
      label: c.name,
      sub:   (c.phone || '') + (st.due > 0 ? '  ·  Due ' + rs(st.due) : ''),
      keywords: (c.name + ' ' + (c.phone || '') + ' customer').toLowerCase(),
      run: () => { location.hash = '#/customer/' + c.id; }
    });
  });

  /* ─── Retailers ──────────────────────────────────────── */
  (DB.retailers || []).forEach(r => {
    const st = partyStats(r.id, 'retailer');
    idx.push({
      group: 'Retailers',
      icon:  '🏪',
      label: r.name,
      sub:   (r.phone || '') + (st.due > 0 ? '  ·  Due ' + rs(st.due) : ''),
      keywords: (r.name + ' ' + (r.phone || '') + ' retailer').toLowerCase(),
      run: () => { location.hash = '#/retailer/' + r.id; }
    });
  });

  /* ─── Products ───────────────────────────────────────── */
  (DB.products || []).forEach(p => {
    const d = productDisplay(p);
    idx.push({
      group: 'Products',
      icon:  '📦',
      label: p.name,
      sub:   (p.category ? p.category + '  ·  ' : '') + 'Stock ' + d.stockLabel,
      keywords: (p.name + ' ' + (p.category || '') + ' product item').toLowerCase(),
      run: () => {
        location.hash = '#/products';
        setTimeout(() => {
          try {
            const p2 = DB.products.find(x => x.id === p.id);
            if(p2 && typeof openProductForm === 'function') openProductForm(p2);
          } catch(e){}
        }, 200);
      }
    });
  });

  /* ─── Invoices (last 100 to keep palette snappy) ─────── */
  (DB.invoices || []).slice(0, 100).forEach(i => {
    const party = i.party_type === 'retailer'
      ? DB.retailers.find(x => x.id === i.party_id)
      : DB.customers.find(x => x.id === i.party_id);
    const partyName = party ? party.name : '—';
    idx.push({
      group: 'Invoices',
      icon:  '📄',
      label: (i.invoice_no || 'INV') + ' — ' + partyName,
      sub:   txDT(i, 'invoice_date') + '  ·  ' + rs(i.total),
      keywords: ((i.invoice_no || '') + ' ' + partyName + ' invoice bill').toLowerCase(),
      run: () => { location.hash = '#/invoice/' + i.id; }
    });
  });

  /* ─── Companies ──────────────────────────────────────── */
  (DB.suppliers || []).filter(s => (s.type || 'company') === 'company').forEach(s => {
    idx.push({
      group: 'Companies',
      icon:  '🏢',
      label: s.name,
      sub:   s.shop_name || s.phone || '',
      keywords: (s.name + ' ' + (s.shop_name || '') + ' ' + (s.phone || '') + ' company').toLowerCase(),
      run: () => { location.hash = '#/company/' + s.id; }
    });
  });

  /* ─── Vendors ────────────────────────────────────────── */
  (DB.suppliers || []).filter(s => s.type === 'vendor').forEach(s => {
    idx.push({
      group: 'Vendors',
      icon:  '🚚',
      label: s.name,
      sub:   s.shop_name || s.phone || '',
      keywords: (s.name + ' ' + (s.shop_name || '') + ' ' + (s.phone || '') + ' vendor').toLowerCase(),
      run: () => { location.hash = '#/vendor/' + s.id; }
    });
  });

  return idx;
}

/* ══════════════════════════════════════════════════════════════
   21b — FILTER
   Matches query against label + keywords. Empty query → top 40.
   ══════════════════════════════════════════════════════════════ */

function filterCommands(query){
  const q = String(query || '').toLowerCase().trim();

  if(!q){
    /* Show quick actions + pages first when empty */
    const priority = ['Actions', 'Pages'];
    const top = _cmdkIndex.filter(x => priority.includes(x.group));
    const rest = _cmdkIndex.filter(x => !priority.includes(x.group));
    return top.concat(rest).slice(0, 40);
  }

  const terms = q.split(/\s+/).filter(Boolean);

  return _cmdkIndex.filter(cmd => {
    const hay = (cmd.label + ' ' + (cmd.keywords || '') + ' ' + (cmd.sub || '')).toLowerCase();
    return terms.every(t => hay.includes(t));
  }).slice(0, 60);
}

/* ══════════════════════════════════════════════════════════════
   21c — RENDER
   Writes the overlay into #cmdk-root and wires events.
   ══════════════════════════════════════════════════════════════ */

function renderCommandPalette(){
  const root = document.getElementById('cmdk-root');
  if(!root) return;

  root.innerHTML = `
    <div class="cmdk-overlay" id="cmdk-overlay">
      <div class="cmdk" id="cmdk-box">
        <div class="cmdk-head">
          <input
            type="text"
            class="cmdk-input"
            id="cmdk-input"
            placeholder="Search products, customers, invoices, or type a command…"
            autocomplete="off"
            spellcheck="false"
          >
          <span class="cmdk-hint">Esc</span>
        </div>

        <div class="cmdk-results" id="cmdk-results"></div>

        <div class="cmdk-foot">
          <span class="kbd-hint"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
          <span class="kbd-hint"><kbd>Enter</kbd> Open</span>
          <span class="kbd-hint"><kbd>Esc</kbd> Close</span>
          <span style="margin-left:auto;color:var(--ink-4)" id="cmdk-count"></span>
        </div>
      </div>
    </div>
  `;

  const overlay = document.getElementById('cmdk-overlay');
  const input   = document.getElementById('cmdk-input');
  const results = document.getElementById('cmdk-results');
  const count   = document.getElementById('cmdk-count');

  /* Close on overlay click (not on box click) */
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closeCommandPalette();
  });

  /* Live filtering */
  input.addEventListener('input', () => {
    _cmdkActiveIdx = 0;
    paintResults();
  });

  /* Keyboard nav */
  input.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      _cmdkActiveIdx = Math.min(_cmdkActiveIdx + 1, _cmdkFiltered.length - 1);
      paintResults();
    }
    else if(e.key === 'ArrowUp'){
      e.preventDefault();
      _cmdkActiveIdx = Math.max(_cmdkActiveIdx - 1, 0);
      paintResults();
    }
    else if(e.key === 'Enter'){
      e.preventDefault();
      const picked = _cmdkFiltered[_cmdkActiveIdx];
      if(picked) runCommand(picked);
    }
    else if(e.key === 'Escape'){
      e.preventDefault();
      closeCommandPalette();
    }
  });

  /* Paint the current filtered list */
  function paintResults(){
    _cmdkFiltered = filterCommands(input.value);

    /* Clamp active index */
    if(_cmdkActiveIdx >= _cmdkFiltered.length) _cmdkActiveIdx = 0;

    count.textContent = _cmdkFiltered.length
      ? _cmdkFiltered.length + ' result' + (_cmdkFiltered.length === 1 ? '' : 's')
      : '';

    if(!_cmdkFiltered.length){
      results.innerHTML = '<div class="cmdk-empty">No matches. Try a different search.</div>';
      return;
    }

    /* Group rows in the order they appear, preserving the priority */
    const order = ['Actions', 'Pages', 'Customers', 'Retailers', 'Products', 'Invoices', 'Companies', 'Vendors'];
    const groups = {};
    _cmdkFiltered.forEach((c, i) => {
      if(!groups[c.group]) groups[c.group] = [];
      groups[c.group].push({ cmd: c, idx: i });
    });

    let html = '';
    order.forEach(g => {
      if(!groups[g]) return;
      html += `<div class="cmdk-group-label">${esc(g)}</div>`;
      groups[g].forEach(({ cmd, idx }) => {
        const active = idx === _cmdkActiveIdx ? 'active' : '';
        html += `
          <div class="cmdk-item ${active}" data-idx="${idx}">
            <span class="ck-icon">${cmd.icon || '•'}</span>
            <span class="ck-label">${esc(cmd.label)}</span>
            ${cmd.sub ? `<span class="ck-sub">${esc(cmd.sub)}</span>` : ''}
          </div>
        `;
      });
    });

    results.innerHTML = html;

    /* Wire clicks */
    results.querySelectorAll('.cmdk-item').forEach(el => {
      el.onclick = () => {
        const picked = _cmdkFiltered[parseInt(el.dataset.idx, 10)];
        if(picked) runCommand(picked);
      };
      el.onmouseenter = () => {
        _cmdkActiveIdx = parseInt(el.dataset.idx, 10);
        results.querySelectorAll('.cmdk-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
      };
    });

    /* Auto-scroll active row into view */
    const activeEl = results.querySelector('.cmdk-item.active');
    if(activeEl && typeof activeEl.scrollIntoView === 'function'){
      activeEl.scrollIntoView({ block: 'nearest' });
    }
  }

  /* Initial paint */
  paintResults();

  /* Focus input after paint */
  setTimeout(() => { try { input.focus(); } catch(e){} }, 40);
}

/* ══════════════════════════════════════════════════════════════
   21d — RUN
   Executes the command's run() and closes the palette.
   ══════════════════════════════════════════════════════════════ */

function runCommand(cmd){
  closeCommandPalette();
  if(!cmd || typeof cmd.run !== 'function') return;
  /* Defer one tick so the palette's teardown finishes first */
  setTimeout(() => {
    try { cmd.run(); }
    catch(e){ console.error('[cmdk run]', e); toast('Action failed', 'error'); }
  }, 40);
}

/* ══════════════════════════════════════════════════════════════
   21e — OPEN / CLOSE / TOGGLE
   ══════════════════════════════════════════════════════════════ */

function openCommandPalette(){
  if(_cmdkOpen) return;
  _cmdkOpen = true;
  _cmdkActiveIdx = 0;

  /* Build the index fresh every open so new data shows up */
  _cmdkIndex = buildCommandIndex();

  renderCommandPalette();
}

function closeCommandPalette(){
  if(!_cmdkOpen) return;
  _cmdkOpen = false;

  const root = document.getElementById('cmdk-root');
  if(root) root.innerHTML = '';
}

function toggleCommandPalette(){
  if(_cmdkOpen) closeCommandPalette();
  else openCommandPalette();
}

/* ══════════════════════════════════════════════════════════════
   21f — GLOBAL KEY BINDING (Ctrl+K / Cmd+K)
   The palette itself also listens for Esc while open.
   ══════════════════════════════════════════════════════════════ */

document.addEventListener('keydown', (e) => {
    const isMac = (navigator.platform || '').toLowerCase().includes('mac');
  const mod   = isMac ? e.metaKey : e.ctrlKey;

  if(mod && (e.key === 'k' || e.key === 'K')){
    e.preventDefault();
    toggleCommandPalette();
    return;
  }

  /* '/' as an alternative opener, unless typing in an input */
  if(e.key === '/' && !_cmdkOpen){
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const isField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if(!isField){
      e.preventDefault();
      openCommandPalette();
    }
  }
});

/* ══════════════════════════════════════════════════════════════
   END BLOCK 21
   ══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   BLOCK 22 — KEYBOARD SHORTCUTS
   Global keyboard handler + a shortcut cheat sheet popover.

   Shortcuts:
     Ctrl+K / Cmd+K    Command palette
     /                 Command palette (alt)
     N                 New Invoice (Customer)
     R                 New Invoice (Retailer)
     P                 Add Product
     C                 Add Customer
     E                 Add Expense
     G then D          Go Dashboard
     G then I          Go Invoices
     G then C          Go Customers
     G then R          Go Retailers
     G then P          Go Products
     ?                 Show / hide shortcuts popover
     Esc               Close topmost overlay

   Guardrails:
   - No shortcut fires while the user is typing in a field.
   - While a modal is open, only Esc + Ctrl+K work.
   - `G then X` uses a 1-second timeout to look for the second key.
   ══════════════════════════════════════════════════════════════ */

/* ─── Module state ───────────────────────────────────────── */
let _shortcutPopOpen = false;
let _gKeyArmed       = false;
let _gKeyTimer       = null;

/* localStorage key for "we already showed the hint once" */
const LS_SHORTCUTS_SEEN = 'sd_shortcuts_seen_v1';

/* ══════════════════════════════════════════════════════════════
   22a — HELPERS : are we typing?
   Returns true if focus is in an input, textarea, select,
   or contenteditable — i.e. a shortcut should NOT fire.
   ══════════════════════════════════════════════════════════════ */

function isTypingContext(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
  if(el.isContentEditable) return true;
  return false;
}

/* Is any modal currently open? */
function isAnyModalOpen(){
  const root = document.getElementById('modal-root');
  return !!(root && root.children.length > 0);
}

/* Is the command palette open? */
function isCommandPaletteOpen(){
  return !!_cmdkOpen;
}

/* Is the sidebar drawer open on mobile? */
function isDrawerOpen(){
  const s = document.getElementById('sidebar');
  return !!(s && s.classList.contains('open'));
}

/* ══════════════════════════════════════════════════════════════
   22b — SAFE ACTION RUNNER
   Wraps every shortcut action so a missing function (because
   its block hasn't loaded yet) doesn't crash the handler.
   ══════════════════════════════════════════════════════════════ */

function safeRun(fn, label){
  try { fn(); }
  catch(e){
    console.warn('[shortcut ' + (label || '?') + ']', e);
    toast('Action unavailable', 'info');
  }
}

/* ══════════════════════════════════════════════════════════════
   22c — ESC HANDLER
   Closes the topmost overlay in priority order:
     1. Shortcut popover
     2. Command palette
     3. Modal
     4. Sidebar drawer
   Only the topmost reacts — everything else is preserved.
   ══════════════════════════════════════════════════════════════ */

function handleEscapeKey(){
  if(_shortcutPopOpen){
    closeShortcutsPopover();
    return true;
  }

  if(isCommandPaletteOpen()){
    closeCommandPalette();
    return true;
  }

  if(isAnyModalOpen()){
    closeModal();
    return true;
  }

  if(isDrawerOpen()){
    const sidebar  = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    if(sidebar)  sidebar.classList.remove('open');
    if(backdrop) backdrop.classList.remove('show');
    return true;
  }

  return false;
}

/* ══════════════════════════════════════════════════════════════
   22d — G-KEY SEQUENCE
   "G then D" → Dashboard
   "G then I" → Invoices
   etc. Arms G, waits 1s for the second key.
   ══════════════════════════════════════════════════════════════ */

function armGKey(){
  _gKeyArmed = true;
  if(_gKeyTimer) clearTimeout(_gKeyTimer);
  _gKeyTimer = setTimeout(() => {
    _gKeyArmed = false;
    _gKeyTimer = null;
  }, 1000);
}

function consumeGKey(secondKey){
  const k = String(secondKey || '').toLowerCase();
  const map = {
    d: '#/',
    i: '#/invoices',
    c: '#/customers',
    r: '#/retailers',
    p: '#/products',
    m: '#/myshop',
    b: '#/backup'
  };

  const target = map[k];

  _gKeyArmed = false;
  if(_gKeyTimer){ clearTimeout(_gKeyTimer); _gKeyTimer = null; }

  if(!target){
    toast('Unknown shortcut "G ' + secondKey.toUpperCase() + '"', 'info');
    return;
  }

  location.hash = target;
}

/* ══════════════════════════════════════════════════════════════
   22e — MASTER KEY HANDLER
   Single document-level listener that dispatches every shortcut.
   ══════════════════════════════════════════════════════════════ */

document.addEventListener('keydown', (e) => {
  const key    = e.key;
  const lower  = key ? key.toLowerCase() : '';
  const mod    = e.ctrlKey || e.metaKey;
  const shift  = e.shiftKey;
  const alt    = e.altKey;

  /* ─── Esc : always handled first ─────────────────────── */
  if(key === 'Escape'){
    const handled = handleEscapeKey();
    if(handled) e.preventDefault();
    return;
  }

  /* ─── Ctrl/Cmd + K : command palette ────────────────── */
  if(mod && lower === 'k'){
    e.preventDefault();
    safeRun(() => toggleCommandPalette(), 'cmdk');
    return;
  }

  /* ─── Ctrl/Cmd + S : prevent browser Save dialog ────── */
  if(mod && lower === 's'){
    e.preventDefault();
    toast('Use the Save button in the form', 'info');
    return;
  }

  /* ─── While typing, ignore every other shortcut ─────── */
  if(isTypingContext()) return;

  /* ─── While a modal is open, ignore every other shortcut ── */
  if(isAnyModalOpen()) return;

  /* ─── G-sequence : if G is armed, handle the next key ─ */
  if(_gKeyArmed && !mod && !alt){
    consumeGKey(lower);
    return;
  }

  /* ─── Ignore if any modifier (other than Shift) is held ── */
  if(mod || alt) return;

  /* ─── Only handle single-character keys from here ───── */
  if(!lower || lower.length !== 1) return;

  /* ─── '/' : command palette (alt opener) ─────────────── */
  if(lower === '/'){ /* handled in Block 21 */ return; }

  /* ─── '?' : shortcuts popover (Shift+/ is often '?') ── */
  if(lower === '?' || (shift && lower === '/')){
    e.preventDefault();
    toggleShortcutsPopover();
    return;
  }

  /* ─── 'G' : arm the go-to sequence ───────────────────── */
  if(lower === 'g'){
    e.preventDefault();
    armGKey();
    return;
  }

  /* ─── Single-letter shortcuts ───────────────────────── */
  if(lower === 'n'){
    e.preventDefault();
    safeRun(() => { location.hash = '#/new-invoice/customer'; }, 'new-invoice-customer');
    return;
  }

  if(lower === 'r'){
    e.preventDefault();
    safeRun(() => { location.hash = '#/new-invoice/retailer'; }, 'new-invoice-retailer');
    return;
  }

  if(lower === 'p'){
    e.preventDefault();
    safeRun(() => {
      location.hash = '#/products';
      setTimeout(() => {
        try { openProductForm(); } catch(err){}
      }, 220);
    }, 'add-product');
    return;
  }

  if(lower === 'c'){
    e.preventDefault();
    safeRun(() => {
      location.hash = '#/customers';
      setTimeout(() => {
        try { openPartyForm('customer'); } catch(err){}
      }, 220);
    }, 'add-customer');
    return;
  }

  if(lower === 'e'){
    e.preventDefault();
    safeRun(() => {
      location.hash = '#/expenses';
      setTimeout(() => {
        try { openExpenseForm(); } catch(err){}
      }, 220);
    }, 'add-expense');
    return;
  }
});

/* ══════════════════════════════════════════════════════════════
   22f — SHORTCUTS POPOVER (cheat sheet)
   Small floating card listing all shortcuts.
   Opens with '?', closes with Esc.
   ══════════════════════════════════════════════════════════════ */

function shortcutsPopoverHTML(){
  const rows = [
    { keys: ['Ctrl', 'K'], label: 'Command palette' },
    { keys: ['/'],         label: 'Command palette (alt)' },
    { keys: ['N'],         label: 'New Invoice — Customer' },
    { keys: ['R'],         label: 'New Invoice — Retailer' },
    { keys: ['P'],         label: 'Add Product' },
    { keys: ['C'],         label: 'Add Customer' },
    { keys: ['E'],         label: 'Add Expense' },
    { keys: ['G', 'D'],    label: 'Go to Dashboard' },
    { keys: ['G', 'I'],    label: 'Go to Invoices' },
    { keys: ['G', 'C'],    label: 'Go to Customers' },
    { keys: ['G', 'R'],    label: 'Go to Retailers' },
    { keys: ['G', 'P'],    label: 'Go to Products' },
    { keys: ['G', 'M'],    label: 'Go to My Shop' },
    { keys: ['Esc'],       label: 'Close overlay' },
    { keys: ['?'],         label: 'Toggle this panel' }
  ];

  const rowsHTML = rows.map(r => `
    <div class="kbd-row">
      <span>${esc(r.label)}</span>
      <span style="display:inline-flex;gap:4px">
        ${r.keys.map(k => `<kbd>${esc(k)}</kbd>`).join('')}
      </span>
    </div>
  `).join('');

  return `
    <div class="kbd-pop" id="kbd-pop">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b style="color:var(--ink);font-size:var(--fs-sm)">Keyboard Shortcuts</b>
        <button
          type="button"
          id="kbd-pop-close"
          style="background:transparent;border:0;cursor:pointer;color:var(--ink-3);font-size:14px;padding:0 4px;line-height:1"
          aria-label="Close"
        >×</button>
      </div>
      ${rowsHTML}
      <div style="margin-top:8px;font-size:var(--fs-2xs);color:var(--ink-4)">
        Mac users: use ⌘ instead of Ctrl
      </div>
    </div>
  `;
}

function openShortcutsPopover(){
  if(_shortcutPopOpen) return;

  /* Inject styles once */
  if(!document.getElementById('kbd-pop-styles')){
    const style = document.createElement('style');
    style.id = 'kbd-pop-styles';
    style.textContent = `
      .kbd-pop{
        background: var(--card);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-md);
        padding: var(--sp-5);
        box-shadow: var(--shadow-modal);
        font-size: var(--fs-xs);
        color: var(--ink-2);
        max-width: 320px;
        z-index: var(--z-modal);
      }
      .kbd-pop .kbd-row{
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 3px 0;
      }
    `;
    document.head.appendChild(style);
  }

  const root = document.getElementById('modal-root');
  if(!root) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.alignItems = 'flex-end';
  overlay.style.justifyContent = 'flex-start';
  overlay.style.padding = '24px';
  overlay.id = 'kbd-pop-overlay';
  overlay.innerHTML = shortcutsPopoverHTML();

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closeShortcutsPopover();
  });

  root.appendChild(overlay);

  const closeBtn = overlay.querySelector('#kbd-pop-close');
  if(closeBtn) closeBtn.onclick = () => closeShortcutsPopover();

  _shortcutPopOpen = true;
  lsSet(LS_SHORTCUTS_SEEN, '1');
}

function closeShortcutsPopover(){
  if(!_shortcutPopOpen) return;
  const el = document.getElementById('kbd-pop-overlay');
  if(el && el.parentNode) el.parentNode.removeChild(el);
  _shortcutPopOpen = false;
}

function toggleShortcutsPopover(){
  if(_shortcutPopOpen) closeShortcutsPopover();
  else openShortcutsPopover();
}

/* ══════════════════════════════════════════════════════════════
   22g — FIRST-VISIT HINT
   Shown once, three seconds after login, for owners who haven't
   discovered Ctrl+K. Skipped if reduced-effects is on (they've
   already told us the device is slow) or if they've seen it.
   ══════════════════════════════════════════════════════════════ */

function maybeShowShortcutHint(){
  if(SETTINGS.reduced_effects) return;
  if(lsGet(LS_SHORTCUTS_SEEN) === '1') return;

  setTimeout(() => {
    /* Don't interrupt if a modal or palette is already open */
    if(isAnyModalOpen() || isCommandPaletteOpen()) return;

/* ══════════════════════════════════════════════════════════════
   22h — EXPORT

/* ══════════════════════════════════════════════════════════════
   BLOCK 23 — CALCULATOR WIDGET
   Floating paper sticky-note calculator.

   Features:
     - Full arithmetic (+ − × ÷ %) with correct precedence
     - Safe expression evaluator (no eval of arbitrary JS)
     - Memory keys: M+ / M− / MR / MC
     - Keyboard support (digits, operators, Enter, Backspace, Esc)
     - "Send to field" button — drops the result into the last
       focused <input> or <textarea> before the calc opened
     - Click-outside to close (toggle via sidebar / mobile button)

   Public API:
     toggleCalc()
     openCalc()
     closeCalc()
   ══════════════════════════════════════════════════════════════ */

/* ─── Module-level state ─────────────────────────────────── */
let _calcOpen      = false;
let _calcExpr      = '0';
let _calcMemory    = 0;
let _calcLastField = null;

/* ══════════════════════════════════════════════════════════════
   23a — SAFE EXPRESSION EVALUATOR
   Supports:  digits  .  +  -  *  /  %  (  )
   Returns a number, or null if the expression is invalid.
   ══════════════════════════════════════════════════════════════ */

function safeEvaluate(rawExpr){
  if(typeof rawExpr !== 'string') return null;

  /* Normalize visible symbols to operators */
  const expr = rawExpr
    .replace(/×/g, '*')
    .replace(/÷/g, '/')
    .replace(/−/g, '-')
    .trim();

  /* Empty or starts with operator (except leading minus) */
  if(!expr) return null;

  /* Strict whitelist: digits, whitespace, dot, + - * / % ( ) */
  if(!/^[0-9+\-*/%().\s]+$/.test(expr)) return null;

  /* Balanced parentheses */
  let depth = 0;
  for(const ch of expr){
    if(ch === '(') depth++;
    else if(ch === ')') depth--;
    if(depth < 0) return null;
  }
  if(depth !== 0) return null;

  /* Reject sequence issues like ++, /*, .. */
  if(/[+\-*/%]{2,}/.test(expr.replace(/^\-/, ''))) return null;
  if(/\.\./.test(expr)) return null;

  /* Evaluate using Function constructor in an isolated scope
     after the whitelist + balance check above. */
  try {
    /* eslint-disable no-new-func */
    const fn = new Function('"use strict"; return (' + expr + ');');
    const result = fn();
    if(typeof result !== 'number' || !isFinite(result)) return null;
    return result;
  } catch(e){
    return null;
  }
}

/* ══════════════════════════════════════════════════════════════
   23b — STATE MANIPULATION
   ══════════════════════════════════════════════════════════════ */

function calcAppend(ch){
  /* Replace a lone leading zero when the user starts typing a digit */
  if(_calcExpr === '0' && /[0-9.]/.test(ch)){
    _calcExpr = String(ch);
    return;
  }
  /* Prevent two dots in the current number segment */
  if(ch === '.'){
    const tail = _calcExpr.split(/[+\-*/%()]/).pop();
    if(tail && tail.includes('.')) return;
  }
  _calcExpr = _calcExpr + String(ch);
}

function calcClear(){
  _calcExpr = '0';
}

function calcBackspace(){
  if(_calcExpr.length <= 1){
    _calcExpr = '0';
    return;
  }
  _calcExpr = _calcExpr.slice(0, -1);
}

function calcEvaluate(){
  /* If the last character is an operator, strip it (user pressed =) */
  const trimmed = _calcExpr.replace(/[+\-*/%]+$/, '');
  const result = safeEvaluate(trimmed);
  if(result === null){
    toast('Invalid expression', 'error');
    return false;
  }
  /* Round to 6 decimals to avoid float display noise */
  _calcExpr = String(Math.round(result * 1e6) / 1e6);
  return true;
}

function calcPercent(){
  /* Take the current expression, divide by 100 */
  const result = safeEvaluate(_calcExpr);
  if(result === null) return;
  _calcExpr = String(result / 100);
}

/* ══════════════════════════════════════════════════════════════
   23c — MEMORY KEYS
   ══════════════════════════════════════════════════════════════ */

function calcMemoryAdd(){
  const v = safeEvaluate(_calcExpr);
  if(v === null) return;
  _calcMemory += v;
  toast('Memory: ' + fmtNum(_calcMemory), 'info');
}

function calcMemorySub(){
  const v = safeEvaluate(_calcExpr);
  if(v === null) return;
  _calcMemory -= v;
  toast('Memory: ' + fmtNum(_calcMemory), 'info');
}

function calcMemoryRecall(){
  _calcExpr = String(_calcMemory);
}

function calcMemoryClear(){
  _calcMemory = 0;
  toast('Memory cleared', 'info');
}

/* ══════════════════════════════════════════════════════════════
   23d — SEND TO FIELD
   Drops the current result into the last non-calc input the user
   focused. Handy for entering prices/costs from a calculation.
   ══════════════════════════════════════════════════════════════ */

function calcSendToField(){
  const v = safeEvaluate(_calcExpr);
  if(v === null){
    toast('Invalid value', 'error');
    return;
  }

  const target = _calcLastField;

  /* Validate the target is still in the DOM */
  if(!target || !document.body.contains(target)){
    /* Fallback: copy to clipboard */
    copyText(String(v)).then(ok => {
      toast(ok ? 'Copied to clipboard' : 'Nothing to send to', ok ? 'success' : 'info');
    });
    return;
  }

  /* Write the value */
  const str = String(v);

  if(target.tagName === 'INPUT' || target.tagName === 'TEXTAREA'){
    target.value = str;
    /* Fire input + change so form listeners react */
    target.dispatchEvent(new Event('input', { bubbles: true }));
    target.dispatchEvent(new Event('change', { bubbles: true }));
    target.focus();
    toast('Sent to field', 'success');
    closeCalc();
    return;
  }

  /* Fallback: copy */
  copyText(str).then(ok => {
    toast(ok ? 'Copied to clipboard' : 'Could not send', ok ? 'success' : 'info');
  });
}

/* ══════════════════════════════════════════════════════════════
   23e — RENDER
   ══════════════════════════════════════════════════════════════ */

function renderCalc(){
  const root = document.getElementById('calc-root');
  if(!root) return;

  const memActive = _calcMemory !== 0;
  const valueDisplay = _calcExpr.length > 18
    ? _calcExpr.slice(-18)
    : _calcExpr;

  root.innerHTML = `
    <div class="calc" id="calc-box" role="dialog" aria-label="Calculator">
      <div class="calc-head">
        <span style="display:inline-flex;align-items:center;gap:6px">
          🧮 Calculator
          ${memActive ? `<span style="font-size:9px;font-weight:700;color:var(--primary-hover);letter-spacing:0.06em">M</span>` : ''}
        </span>
        <button
          type="button"
          id="calc-close"
          style="background:transparent;border:0;cursor:pointer;color:var(--ink-3);font-size:14px;padding:0 4px;line-height:1"
          aria-label="Close calculator"
        >✕</button>
      </div>

      <div class="calc-display" id="calc-display" title="${esc(_calcExpr)}">
        ${esc(valueDisplay)}
      </div>

      <div class="calc-keys" id="calc-keys">
        <button type="button" data-k="MC">MC</button>
        <button type="button" data-k="MR">MR</button>
        <button type="button" data-k="M+">M+</button>
        <button type="button" data-k="M-">M-</button>

        <button type="button" data-k="C">C</button>
        <button type="button" data-k="(">(</button>
        <button type="button" data-k=")">)</button>
        <button type="button" class="op" data-k="÷">÷</button>

        <button type="button" data-k="7">7</button>
        <button type="button" data-k="8">8</button>
        <button type="button" data-k="9">9</button>
        <button type="button" class="op" data-k="×">×</button>

        <button type="button" data-k="4">4</button>
        <button type="button" data-k="5">5</button>
        <button type="button" data-k="6">6</button>
        <button type="button" class="op" data-k="−">−</button>

        <button type="button" data-k="1">1</button>
        <button type="button" data-k="2">2</button>
        <button type="button" data-k="3">3</button>
        <button type="button" class="op" data-k="+">+</button>

        <button type="button" data-k="0">0</button>
        <button type="button" data-k=".">.</button>
        <button type="button" data-k="%" class="op">%</button>
        <button type="button" class="op" data-k="=">=</button>

        <button type="button" data-k="⌫" style="grid-column: span 2">⌫ Back</button>
        <button type="button" data-k="SEND" style="grid-column: span 2" title="Send result to the last focused field">↪ Send</button>
      </div>
    </div>
  `;

  const box = document.getElementById('calc-box');

  /* ─── Button click handler ─────────────────────────── */
  box.querySelectorAll('button[data-k]').forEach(btn => {
    btn.onclick = () => handleCalcKey(btn.dataset.k);
  });

  /* ─── Close button ─────────────────────────────────── */
  document.getElementById('calc-close').onclick = closeCalc;

  /* ─── Click outside closes the calculator ─────────── */
  setTimeout(() => {
    const outsideHandler = (ev) => {
      if(!_calcOpen) return;
      if(!box || !document.body.contains(box)){
        document.removeEventListener('click', outsideHandler);
        return;
      }
      if(!box.contains(ev.target)){
        /* Don't close if the click came from the toggle button */
        const path = (ev.composedPath && ev.composedPath()) || [];
        const isToggle = path.some(n => n && n.id && (
          n.id === 'btn-calc' || n.id === 'btn-calc-m'
        ));
        if(isToggle) return;
        closeCalc();
        document.removeEventListener('click', outsideHandler);
      }
    };
    document.addEventListener('click', outsideHandler);
  }, 50);
}

/* ══════════════════════════════════════════════════════════════
   23f — KEY HANDLER
   Applies a single calculator key to the expression state.
   ══════════════════════════════════════════════════════════════ */

function handleCalcKey(k){
  if(k === null || k === undefined) return;

  switch(k){
    case 'C':
      calcClear();
      break;
    case '⌫':
      calcBackspace();
      break;
    case '=':
      calcEvaluate();
      break;
    case '%':
      calcPercent();
      break;
    case 'MC':
      calcMemoryClear();
      break;
    case 'MR':
      calcMemoryRecall();
      break;
    case 'M+':
      calcMemoryAdd();
      break;
    case 'M-':
      calcMemorySub();
      break;
    case 'SEND':
      calcSendToField();
      return;
    default:
      /* Digits, dot, operators, parens */
      if(/^[0-9.]$/.test(k)){
        calcAppend(k);
      } else if(['+', '−', '×', '÷', '-', '*', '/', '(', ')'].includes(k)){
        /* Normalize display operators to internal ops */
        const map = { '−':'-', '×':'*', '÷':'/' };
        calcAppend(map[k] || k);
      }
  }

  /* Re-render display */
  const display = document.getElementById('calc-display');
  if(display){
    const v = _calcExpr.length > 18 ? _calcExpr.slice(-18) : _calcExpr;
    display.textContent = v;
    display.title = _calcExpr;
  }

  /* Update memory indicator */
  const head = document.getElementById('calc-box')?.querySelector('.calc-head');
  if(head){
    const memActive = _calcMemory !== 0;
    /* Rebuild the head markup lazily only if the badge needs to change */
    const hasBadge = !!head.querySelector('span[data-mem]');
    if(memActive && !hasBadge){
      const b = document.createElement('span');
      b.dataset.mem = '1';
      b.style.cssText = 'font-size:9px;font-weight:700;color:var(--primary-hover);letter-spacing:0.06em;margin-left:6px';
      b.textContent = 'M';
      head.querySelector('span').appendChild(b);
    } else if(!memActive && hasBadge){
      head.querySelector('span[data-mem]').remove();
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   23g — KEYBOARD INPUT WHILE CALC IS OPEN
   Only fires when:
     - calc is open
     - focus is NOT inside a regular input/textarea/select
   ══════════════════════════════════════════════════════════════ */

document.addEventListener('keydown', (e) => {
  if(!_calcOpen) return;

  /* If the user is typing in a normal form field, ignore */
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const isField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if(isField) return;

  const key = e.key;

  if(/^[0-9]$/.test(key)){ e.preventDefault(); handleCalcKey(key); return; }
  if(key === '.'){ e.preventDefault(); handleCalcKey('.'); return; }
  if(key === '+' || key === '-'){ e.preventDefault(); handleCalcKey(key); return; }
  if(key === '*' || key === 'x' || key === 'X'){ e.preventDefault(); handleCalcKey('*'); return; }
  if(key === '/'){ e.preventDefault(); handleCalcKey('/'); return; }
  if(key === '%'){ e.preventDefault(); handleCalcKey('%'); return; }
  if(key === '(' || key === ')'){ e.preventDefault(); handleCalcKey(key); return; }
  if(key === 'Enter' || key === '='){ e.preventDefault(); handleCalcKey('='); return; }
  if(key === 'Backspace'){ e.preventDefault(); handleCalcKey('⌫'); return; }
  if(key === 'Escape'){ e.preventDefault(); closeCalc(); return; }
  if(key === 'c' || key === 'C'){ e.preventDefault(); handleCalcKey('C'); return; }
});

/* ══════════════════════════════════════════════════════════════
   23h — OPEN / CLOSE / TOGGLE
   The sidebar and mobile header call toggleCalc() (defined here).
   ══════════════════════════════════════════════════════════════ */

function openCalc(){
  if(_calcOpen) return;
  _calcOpen = true;

  /* Snapshot the last non-calc field the user focused, so "Send"
     has a target. */
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')){
    _calcLastField = a;
  } else {
    /* Try the last input/textarea that had focus — approximate
       by looking for a visible input inside the current page. */
    const anyField = document.querySelector('#content input:not([type="hidden"]), #content textarea');
    _calcLastField = anyField || null;
  }

  renderCalc();
}

function closeCalc(){
  if(!_calcOpen) return;
  _calcOpen = false;
  const root = document.getElementById('calc-root');
  if(root) root.innerHTML = '';
}

function toggleCalc(){
  if(_calcOpen) closeCalc();
  else openCalc();
}

/* ══════════════════════════════════════════════════════════════
   23i — FOCUS-TRACKING
   Keeps `_calcLastField` fresh: whenever a real input is focused
   (and the calc is NOT already open), remember it so "Send"
   knows where to drop the result.
   ══════════════════════════════════════════════════════════════ */

document.addEventListener('focusin', (e) => {
  if(_calcOpen) return;
  const t = e.target;
  if(!t) return;
  if(t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'){
    /* Ignore the calculator's own fields if any ever appear */
    if(t.closest('#calc-root')) return;
    _calcLastField = t;
  }
});

/* ══════════════════════════════════════════════════════════════
   23j — EXPORT (in case other blocks want direct access)
   ══════════════════════════════════════════════════════════════ */

window.toggleCalc = toggleCalc;
window.openCalc   = openCalc;
window.closeCalc  = closeCalc;

      /* openRestockForm is defined in Block 27 (Products). Wrap

  }
  charts = [];

  /* Build daily sales map for last 30 days */
  const from = daysAgoStr(29);
  const map = {};

  /* Pre-seed every day in the range so the line is continuous */
  for(let i = 29; i >= 0; i--){
    const d = daysAgoStr(i);
    map[d] = 0;
  }

  invs.forEach(i => {
    const d = txDate(i, 'invoice_date');
    if(d < from) return;
    if(map[d] === undefined) return;
    map[d] += Number(i.total || 0);
  });

  const sortedDays = Object.keys(map).sort();
  const labels     = sortedDays.map(d => d.slice(5)); /* MM-DD */
  const values     = sortedDays.map(d => map[d]);

  const canvas = document.getElementById('dash-chart');
  if(canvas && typeof Chart !== 'undefined'){
    const reduce = !!SETTINGS.reduced_effects;

    const chart = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Sales',
          data: values,
          borderColor: '#C79A28',
          backgroundColor: 'rgba(199,154,40,0.10)',
          borderWidth: 2,
          tension: 0.35,
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#C79A28',
          pointHoverBorderColor: '#FFFFFF',
          pointHoverBorderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: reduce ? false : { duration: 400 },
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1F2937',
            titleColor: '#FFFFFF',
            bodyColor: '#FFFFFF',
            borderColor: '#C79A28',
            borderWidth: 1,
            padding: 10,
            displayColors: false,
            callbacks: {
              title: (items) => 'Date: ' + items[0].label,
              label: (ctx) => rs(ctx.parsed.y)
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              color: '#6B7280',
              font: { size: 11 },
              callback: (v) => '₹' + Number(v).toLocaleString('en-IN')
            },
            grid: { color: '#F1F5F9', drawBorder: false }
          },
          x: {
            ticks: { color: '#6B7280', font: { size: 10 }, maxRotation: 0, autoSkipPadding: 12 },
            grid: { display: false }
          }
        }
      }
    });

    charts.push(chart);
  }
}

/* ══════════════════════════════════════════════════════════════
   25a — SHARED HELPER : computeRating
   Returns 1.0 – 5.0 based on how promptly a party pays.
   (Used by both customer and retailer list views.)
   ══════════════════════════════════════════════════════════════ */

function computeRating(stats){
  const billed = Number(stats?.total_billed || 0);
  const paid   = Number(stats?.total_paid   || 0);
  const due    = Number(stats?.due          || 0);

  if(billed === 0) return 5.0;

  /* Base score: percentage paid × 5 */
  const ratio = paid / billed;
  let score = ratio * 5;

  /* Penalise lingering dues */
  if(due > 0){
    const dPct = due / billed;
    if(dPct > 0.5)      score -= 1.5;
    else if(dPct > 0.25) score -= 0.8;
  }

  return Math.max(1, Math.min(5, Math.round(score * 10) / 10));
}

   ══════════════════════════════════════════════════════════════ */

function renderCustomers(content){

  const list = DB.customers || [];

      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="grow-2">

              <th>Name</th>
              <th>Phone</th>
              <th>Joined</th>
              <th style="text-align:right">Rating</th>
              <th style="text-align:right">Billed</th>
              <th style="text-align:right">Due</th>

  /* ══════════════════════════════════════════════════════

  function filtered(){
    const q       = ($('#c-search').value || '').toLowerCase().trim();
    const sortBy  = $('#c-sort').value;
    const filter  = $('#c-filter').value;

    /* Attach stats once per render pass */
    let arr = list.map(c => ({
      ...c,
      _stats: partyStats(c.id, 'customer')
    }));

    /* Search */
    if(q){
      arr = arr.filter(c => {
        const hay = (c.name + ' ' + (c.phone || '') + ' ' + (c.address || '')).toLowerCase();
        return hay.includes(q);
      });
    }

    /* Filter */
    if(filter === 'due')   arr = arr.filter(c => c._stats.due > 0);
    if(filter === 'nodue') arr = arr.filter(c => c._stats.due === 0);
    if(filter === 'top')   arr = arr.filter(c => c._stats.total_billed >= 10000);

    /* Sort */
    switch(sortBy){
      case 'name':
        arr.sort((a, b) => a.name.localeCompare(b.name));
        break;
      case 'name-desc':
        arr.sort((a, b) => b.name.localeCompare(a.name));
        break;
      case 'due-desc':
        arr.sort((a, b) => b._stats.due - a._stats.due);
        break;
      case 'due':
        arr.sort((a, b) => a._stats.due - b._stats.due);
        break;
      case 'newest':
        arr.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
        break;
      case 'oldest':
        arr.sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
        break;
    }

    return arr;
  }

          <td style="color:var(--ink-3);font-size:var(--fs-sm)">${fmtDate(c.joined_date)}</td>
          <td style="text-align:right">
            <span class="chip ${ratingCls} chip-xs">${rating} ★</span>
          </td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${rs(st.total_billed)}</td>
          <td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:${st.due > 0 ? 'var(--red)' : 'var(--ink-3)'}">
            ${st.due > 0 ? rs(st.due) : '—'}

          <td class="td-actions">
            <button class="btn btn-ghost btn-sm" type="button" data-view="${c.id}">View</button>

          </td>
        </tr>
      `;
    }).join('');

    /* Wire row actions */
    $$('[data-view]', body).forEach(b => {
      b.onclick = () => { location.hash = '#/customer/' + b.dataset.view; };
    });

    $$('[data-edit]', body).forEach(b => {
      b.onclick = () => {
        const c = DB.customers.find(x => x.id === b.dataset.edit);

    $$('[data-del]', body).forEach(b => {

  /* ══════════════════════════════════════════════════════
     DELETE
     ══════════════════════════════════════════════════ */

  async function deleteCustomer(id){
    const c = DB.customers.find(x => x.id === id);
    if(!c) return;

    const invCount = DB.invoices.filter(i => i.party_id === id && i.party_type === 'customer').length;
    const payCount = DB.payments.filter(p => p.party_id === id && p.party_type === 'customer').length;
    const st = partyStats(id, 'customer');

    let warn = `Delete customer "${c.name}"?`;
    if(invCount || payCount || st.due > 0){
      warn += `\n\n⚠️ This customer has:`;
      if(invCount) warn += `\n   • ${invCount} invoice${invCount === 1 ? '' : 's'}`;
      if(payCount) warn += `\n   • ${payCount} payment${payCount === 1 ? '' : 's'}`;
      if(st.due > 0) warn += `\n   • Outstanding due of ${rs(st.due)}`;
      warn += `\n\nInvoices and payments will REMAIN in the system but won't be linked to any customer.`;
    }

    if(!confirmDlg(warn, 'Confirm Delete')) return;

    const { error } = await sb.from('customers').delete().eq('id', id);
    if(error){
      toast('Delete failed: ' + error.message, 'error');
      return;
    }

    dbRemoveLocal('customers', id);
    toast('Customer deleted', 'success');
    route();

  /* ══════════════════════════════════════════════════════

  renderTable();

/* ══════════════════════════════════════════════════════════════
   25c — SHARED PARTY FORM (Updated with Opening Balance)
   ══════════════════════════════════════════════════════════════ */
function openPartyForm(type, existing){
  const isRetailer = type === 'retailer';
  const table      = isRetailer ? 'retailers' : 'customers';
  const label      = isRetailer ? 'Retailer' : 'Customer';
  const dateLabel  = isRetailer ? 'Onboarded' : 'Joined';

  const p = existing || {
    name: '',
    phone: '',
    address: '',
    opening_balance: 0, // NEW: Default value
    joined_date: todayStr(),
    tx_time: ''
  };

  openModal(`
    <h2>${existing ? 'Edit' : 'New'} ${label}</h2>
    <p class="modal-sub">${isRetailer ? 'Wholesale buyers' : 'Walk-in and regular customers'}</p>

    <form id="pf" class="modal-body" novalidate>
      <div class="field">
        <label class="label">${label} name <span class="req">*</span></label>
        <input class="input" type="text" name="name" maxlength="80" required
          value="${esc(p.name || '')}"
          placeholder="${isRetailer ? 'e.g. Sharma Stationery' : 'e.g. Ramesh Kumar'}" autofocus>
      </div>

      <div class="form-row-2">
        <div class="field">
          <label class="label">Phone</label>
          <input class="input" type="tel" name="phone" maxlength="20"
            value="${esc(p.phone || '')}" placeholder="10-digit number">
        </div>
        <div class="field">
          <label class="label">Address</label>
          <input class="input" type="text" name="address" maxlength="140"
            value="${esc(p.address || '')}" placeholder="Area, city (optional)">
        </div>
      </div>

      <!-- NEW: Opening Balance Field -->
      <div class="field">
        <label class="label">Opening Balance (Old Due) ₹</label>
        <input class="input" type="number" step="any" name="opening_balance"
          value="${p.opening_balance || 0}" placeholder="0.00">
        <div class="field-hint">Amount already owed by this ${label.toLowerCase()} before using this app.</div>
      </div>

      ${dateTimeFieldHTML(p.joined_date || todayStr(), p.tx_time || '', dateLabel)}

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="pf-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="pf-save">
          ${existing ? 'Update' : 'Save'} ${label}
        </button>
      </div>
    </form>
  `, (root) => {
    const form = root.querySelector('#pf');
    const btn  = root.querySelector('#pf-save');

    root.querySelector('#pf-cancel').onclick = () => closeModal(root);

    form.onsubmit = async (e) => {
      e.preventDefault();
      const nameEl = form.querySelector('input[name="name"]');
      const name   = (nameEl.value || '').trim();
      if(!name){ toast('Please enter a name', 'error'); nameEl.focus(); return; }

      const dt = readDateTime(form);
      if(!dt) return;

      const fd = new FormData(form);
      const data = {
        name,
        phone:       (fd.get('phone')   || '').trim(),
        address:     (fd.get('address') || '').trim(),
        opening_balance: Number(fd.get('opening_balance')) || 0, // NEW
        joined_date: dt.date,
        tx_time:     dt.time
      };

      btn.disabled = true;
      btn.textContent = 'Saving…';

      let res;
      if(existing){
        res = await sb.from(table).update(data).eq('id', existing.id).select().single();
      } else {
        res = await sb.from(table).insert(data).select().single();
      }

      if(res.error){
        toast(res.error.message, 'error');
        btn.disabled = false;
        btn.textContent = (existing ? 'Update' : 'Save') + ' ' + label;
        return;
      }

      if(existing) dbUpsertLocal(table, res.data);
      else DB[table] = [res.data, ...(DB[table] || [])];

      toast(label + (existing ? ' updated' : ' added'), 'success');
      closeModal(root);
      if(location.hash === '#/customers' || location.hash === '#/retailers'){ route(); }
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   25d — EXPORT CUSTOMERS TO CSV
   Called from the list page. Uses the same columns the table shows.
   ══════════════════════════════════════════════════════════════ */

function exportCustomersCSV(rows){
  const list = (rows || []).map(c => {
    const st = c._stats || partyStats(c.id, 'customer');
    return [
      c.name,
      c.phone || '',
      c.address || '',
      fmtDate(c.joined_date),
      computeRating(st),
      Number(st.total_billed || 0).toFixed(2),
      Number(st.total_paid   || 0).toFixed(2),
      Number(st.due          || 0).toFixed(2)
    ];
  });

  /* Prepend header */
  const header = ['Name', 'Phone', 'Address', 'Joined', 'Rating', 'Total Billed', 'Total Paid', 'Due'];
  const all = [header, ...list];

  const csv = all
    .map(row => row.map(cell => {
      const s = String(cell ?? '');
      /* Quote cells that contain comma / quote / newline */
      if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(','))
    .join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'Customers-' + todayStr() + '.csv');
  toast('CSV downloaded', 'success');
}

  /* ══════════════════════════════════════════════════════

  function filtered(){
    const q      = ($('#r-search').value || '').toLowerCase().trim();
    const sortBy = $('#r-sort').value;
    const filter = $('#r-filter').value;

    let arr = list.map(r => ({
      ...r,
      _stats: partyStats(r.id, 'retailer')
    }));

    if(q){
      arr = arr.filter(r => {
        const hay = (r.name + ' ' + (r.phone || '') + ' ' + (r.address || '')).toLowerCase();
        return hay.includes(q);
      });
    }

    if(filter === 'due')   arr = arr.filter(r => r._stats.due > 0);
    if(filter === 'nodue') arr = arr.filter(r => r._stats.due === 0);
    if(filter === 'top')   arr = arr.filter(r => r._stats.total_billed >= 50000);

    switch(sortBy){
      case 'name':
        arr.sort((a, b) => a.name.localeCompare(b.name));
        break;
      case 'name-desc':
        arr.sort((a, b) => b.name.localeCompare(a.name));
        break;
      case 'due-desc':
        arr.sort((a, b) => b._stats.due - a._stats.due);
        break;
      case 'due':
        arr.sort((a, b) => a._stats.due - b._stats.due);
        break;
      case 'billed-desc':
        arr.sort((a, b) => b._stats.total_billed - a._stats.total_billed);
        break;
      case 'newest':
        arr.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
        break;
      case 'oldest':
        arr.sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
        break;
    }

    return arr;
  }

  /* ══════════════════════════════════════════════════════
     26c — RENDER TABLE
     ══════════════════════════════════════════════════════ */

  function renderTable(){
    const arr = filtered();
    $('#r-count').textContent = arr.length;

    const body = $('#r-body');
    if(!arr.length){
      body.innerHTML = `
        <tr>

    body.innerHTML = arr.map(r => {

      b.onclick = () => { location.hash = '#/retailer/' + b.dataset.view; };
    });

    $$('[data-edit]', body).forEach(b => {
      b.onclick = () => {
        const r = DB.retailers.find(x => x.id === b.dataset.edit);
        if(r) openPartyForm('retailer', r);
      };

    $$('[data-del]', body).forEach(b => {
      b.onclick = () => deleteRetailer(b.dataset.del);
    });
  }

  /* ══════════════════════════════════════════════════════
     26d — DELETE
     ══════════════════════════════════════════════════════ */

  async function deleteRetailer(id){
    const r = DB.retailers.find(x => x.id === id);
    if(!r) return;

    const invCount = DB.invoices.filter(i => i.party_id === id && i.party_type === 'retailer').length;
    const payCount = DB.payments.filter(p => p.party_id === id && p.party_type === 'retailer').length;
    const st = partyStats(id, 'retailer');

    let warn = `Delete retailer "${r.name}"?`;
    if(invCount || payCount || st.due > 0){
      warn += `\n\n⚠️ This retailer has:`;
      if(invCount) warn += `\n   • ${invCount} invoice${invCount === 1 ? '' : 's'}`;
      if(payCount) warn += `\n   • ${payCount} payment${payCount === 1 ? '' : 's'}`;
      if(st.due > 0) warn += `\n   • Outstanding due of ${rs(st.due)}`;
      warn += `\n\nInvoices and payments will REMAIN in the system but won't be linked to any retailer.`;
    }

    if(!confirmDlg(warn, 'Confirm Delete')) return;

    const { error } = await sb.from('retailers').delete().eq('id', id);
    if(error){
      toast('Delete failed: ' + error.message, 'error');
      return;
    }

    dbRemoveLocal('retailers', id);
    toast('Retailer deleted', 'success');
    route();
  }

  /* ══════════════════════════════════════════════════════
     26e — EVENTS
     ══════════════════════════════════════════════════════ */

  const search = $('#r-search');
  search.oninput = debounce(renderTable, 220);

  $('#r-sort').onchange   = renderTable;
  $('#r-filter').onchange = renderTable;

  $('#r-add').onclick = () => openPartyForm('retailer');

  $('#r-export').onclick = () => exportRetailersCSV(filtered());

  /* Initial render */
  renderTable();
}

/* ══════════════════════════════════════════════════════════════
   26f — EXPORT RETAILERS TO CSV
   Includes a Wholesale flag for clarity in spreadsheets.
   ══════════════════════════════════════════════════════════════ */

function exportRetailersCSV(rows){
  const list = (rows || []).map(r => {
    const st = r._stats || partyStats(r.id, 'retailer');
    return [
      r.name,
      r.phone || '',
      r.address || '',
      fmtDate(r.joined_date),
      computeRating(st),
      Number(st.total_billed || 0).toFixed(2),
      Number(st.total_paid   || 0).toFixed(2),
      Number(st.due          || 0).toFixed(2),
      'Wholesale'
    ];
  });

  const header = ['Shop Name', 'Phone', 'Address', 'Onboarded', 'Rating', 'Total Billed', 'Total Paid', 'Due', 'Pricing Tier'];
  const all = [header, ...list];

  const csv = all
    .map(row => row.map(cell => {
      const s = String(cell ?? '');
      if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(','))
    .join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'Retailers-' + todayStr() + '.csv');
  toast('CSV downloaded', 'success');
}

    /* Check usage in invoices + purchase bills */
    const usedInInvoices = (DB.invoice_items || []).filter(i => i.product_id === id).length;

        <label class="label">Product name <span class="req">*</span></label>
        <input class="input" type="text" name="name" maxlength="120" required
          value="${esc(p.name)}" placeholder="e.g. Reynolds Pen Blue" autofocus>
      </div>

      <div class="form-row-2">
        <div class="field">
          <label class="label">Category</label>
          <div id="cat-mount"></div>
        </div>
        <div class="field">
          <label class="label">Company / Vendor</label>
          <select class="input" name="supplier_id">
            <option value="">— Unassigned —</option>
            ${companies.length ? `<optgroup label="Companies">${companies.map(s => `
              <option value="${s.id}" ${p.supplier_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>
            `).join('')}</optgroup>` : ''}
            ${vendors.length ? `<optgroup label="Vendors">${vendors.map(s => `
              <option value="${s.id}" ${p.supplier_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>
            `).join('')}</optgroup>` : ''}
          </select>
        </div>
      </div>

      <div class="field">
        <label class="label">Unit type</label>
        <div class="btn-group" id="dual-toggle" style="display:inline-flex">
          <button type="button" class="${!p.dual ? 'btn btn-primary active' : 'btn'}" data-dual="no">Single unit</button>
          <button type="button" class="${p.dual ? 'btn btn-primary active' : 'btn'}" data-dual="yes">Piece + Box</button>
        </div>
        <div class="field-hint">
          <b>Single unit</b>: one count (e.g. per piece). <b>Piece + Box</b>: sell by box or by piece with automatic conversion.
        </div>
      </div>

      <!-- ════════ SINGLE UNIT BLOCK ════════ -->
      <div id="single-block" style="display:${p.dual ? 'none' : 'block'}">
        <div class="form-row-2">
          <div class="field">
            <label class="label">Unit</label>
            <input class="input" type="text" name="unit" value="${esc(p.unit || 'piece')}" maxlength="20">
          </div>
        </div>
      </div>

      <!-- ════════ DUAL UNIT BLOCK ════════ -->
      <div id="dual-block" style="display:${p.dual ? 'block' : 'none'}">
        <div class="form-row-2">
          <div class="field">
            <label class="label">Base unit</label>
            <input class="input" type="text" name="base_unit" value="${esc(p.base_unit || 'piece')}" maxlength="20">
          </div>
          <div class="field">
            <label class="label">Pack unit</label>
            <input class="input" type="text" name="pack_unit" value="${esc(p.pack_unit || 'box')}" maxlength="20">
          </div>
        </div>

        <div class="field" style="margin-top:12px">
          <label class="label">
            1 <span class="pk-lbl">${esc(p.pack_unit || 'box')}</span> =
            <input class="input" type="number" step="any" min="0.01" name="pack_size"
              value="${p.pack_size || 50}" style="display:inline-block;width:100px;margin:0 6px;padding:6px 8px">
            <span class="bs-lbl">${esc(p.base_unit || 'piece')}</span>
          </label>
        </div>

        <div class="form-row-2" style="margin-top:12px">
          <div class="field">
            <label class="label">Primary display</label>
            <select class="input" name="primary_unit">
              <option value="base_unit" ${p.primary_unit === 'base_unit' ? 'selected' : ''}>Base unit first</option>
              <option value="pack_unit" ${p.primary_unit === 'pack_unit' ? 'selected' : ''}>Pack unit first</option>
            </select>
          </div>
        </div>
      </div>

      <!-- ════════ PRICES ════════ -->
      <div class="card" style="padding:14px;background:var(--primary-soft);border-color:var(--primary-tint);margin-top:4px">
        <div style="font-size:var(--fs-xs);font-weight:700;color:var(--primary-hover);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">
          Prices <span style="font-weight:400;color:var(--ink-3);text-transform:none;letter-spacing:0">— per base unit</span>
        </div>

        <div class="form-row-3">
          <div class="field">
            <label class="label">Cost price</label>
            <input class="input" type="number" step="any" min="0" name="cost"
              value="${p.cost || 0}" placeholder="0.00">
            <div class="field-hint">What you paid</div>
          </div>
          <div class="field">
            <label class="label" style="color:var(--blue)">Customer price</label>
            <input class="input" type="number" step="any" min="0" name="customer_price"
              value="${p.customer_price || 0}" placeholder="0.00">
            <div class="field-hint">For customers</div>
          </div>
          <div class="field">
            <label class="label" style="color:var(--purple)">Wholesale price</label>
            <input class="input" type="number" step="any" min="0" name="wholesale_price"
              value="${p.wholesale_price || 0}" placeholder="0.00">
            <div class="field-hint">For retailers</div>
          </div>
        </div>

        <div id="margin-hint" style="font-size:var(--fs-xs);color:var(--ink-3);margin-top:10px;line-height:1.6"></div>
      </div>

      <!-- ════════ STOCK ════════ -->
      <div class="form-row-2" style="margin-top:4px">
        <div class="field">
          <label class="label">Current stock <span id="stock-unit-label" style="font-weight:400;color:var(--ink-3);text-transform:none"></span></label>
          <input class="input" type="number" step="any" min="0" name="stock" value="${p.stock || 0}">
          <div class="field-hint">On-hand quantity in ${p.dual ? 'base units' : 'units'}</div>
        </div>
        <div class="field">
          <label class="label">Low stock alert at</label>
          <input class="input" type="number" step="any" min="0" name="low_stock_alert" value="${p.low_stock_alert || 5}">
          <div class="field-hint">Warn when stock falls to this level</div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="prf-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="prf-save">
          ${existing ? 'Update' : 'Save'} Product
        </button>
      </div>
    </form>
  `, (root) => {
    const form = root.querySelector('#prf');

    /* ─── Category picker ─────────────────────────────── */
    const catMount = root.querySelector('#cat-mount');
    catMount.innerHTML = categoryPickerHTML('prf-cat', p.category || '');
    let categoryValue = p.category || '';
    mountCategoryPicker(root.querySelector('#prf-cat'), p.category || '', (v) => {
      categoryValue = v || '';
    });

    /* ─── Dual toggle ─────────────────────────────────── */
    const dualToggle = root.querySelector('#dual-toggle');
    const singleBlock = root.querySelector('#single-block');
    const dualBlock   = root.querySelector('#dual-block');
    let isDual = !!p.dual;

    function setDual(val){
      isDual = val;
      dualToggle.querySelectorAll('button').forEach(b => {
        const isActive = (b.dataset.dual === 'yes') === val;
        b.classList.toggle('btn-primary', isActive);
        b.classList.toggle('active', isActive);
      });
      singleBlock.style.display = val ? 'none' : 'block';
      dualBlock.style.display   = val ? 'block' : 'none';
      updateStockLabel();
      updateMarginHint();
    }

    dualToggle.querySelectorAll('button').forEach(b => {
      b.onclick = () => setDual(b.dataset.dual === 'yes');
    });

    /* ─── Live label updates for base/pack unit names ─── */
    function updateUnitLabels(){
      const bu = root.querySelector('input[name="base_unit"]');
      const pu = root.querySelector('input[name="pack_unit"]');
      if(!bu || !pu) return;
      root.querySelectorAll('.bs-lbl').forEach(el => { el.textContent = bu.value || 'piece'; });
      root.querySelectorAll('.pk-lbl').forEach(el => { el.textContent = pu.value || 'box'; });
    }

    ['base_unit', 'pack_unit'].forEach(n => {
      const inp = root.querySelector(`input[name="${n}"]`);
      if(inp) inp.oninput = updateUnitLabels;
    });

    /* ─── Stock unit label ────────────────────────────── */
    function updateStockLabel(){
      const lbl = root.querySelector('#stock-unit-label');
      if(!lbl) return;
      if(isDual){
        const bu = root.querySelector('input[name="base_unit"]')?.value || 'piece';
        lbl.textContent = '(in ' + bu + ')';
      } else {
        const u = root.querySelector('input[name="unit"]')?.value || 'piece';
        lbl.textContent = '(in ' + u + ')';
      }
    }

    /* ─── Live margin hint ────────────────────────────── */
    function updateMarginHint(){
      const costEl = root.querySelector('input[name="cost"]');
      const cpEl   = root.querySelector('input[name="customer_price"]');
      const wpEl   = root.querySelector('input[name="wholesale_price"]');
      const hint   = root.querySelector('#margin-hint');
      if(!costEl || !hint) return;

      const cost = Number(costEl.value) || 0;
      const cp   = Number(cpEl?.value) || 0;
      const wp   = Number(wpEl?.value) || 0;

      const parts = [];
      if(cost > 0 && cp > 0){
        const m = ((cp - cost) / cp) * 100;
        parts.push(`Customer margin: <b style="color:${m >= 20 ? 'var(--green)' : m >= 0 ? 'var(--amber)' : 'var(--red)'}">${m.toFixed(1)}%</b>`);
      }
      if(cost > 0 && wp > 0){
        const m = ((wp - cost) / wp) * 100;
        parts.push(`Wholesale margin: <b style="color:${m >= 15 ? 'var(--green)' : m >= 0 ? 'var(--amber)' : 'var(--red)'}">${m.toFixed(1)}%</b>`);
      }

      hint.innerHTML = parts.length ? parts.join(' · ') : '';
    }

    ['cost', 'customer_price', 'wholesale_price'].forEach(n => {
      const inp = root.querySelector(`input[name="${n}"]`);
      if(inp) inp.oninput = updateMarginHint;
    });

    /* ─── Initialize labels ───────────────────────────── */
    updateUnitLabels();
    updateStockLabel();
    updateMarginHint();

    /* ─── Cancel ──────────────────────────────────────── */
    root.querySelector('#prf-cancel').onclick = () => closeModal(root);

    /* ─── Save ────────────────────────────────────────── */
    form.onsubmit = async (e) => {
      e.preventDefault();

      const nameEl = form.querySelector('input[name="name"]');
      const name = (nameEl.value || '').trim();
      if(!name){
        toast('Enter a product name', 'error');
        nameEl.focus();
        return;
      }

      const cost = Number(form.querySelector('input[name="cost"]').value) || 0;
      const cp   = Number(form.querySelector('input[name="customer_price"]').value) || 0;
      const wp   = Number(form.querySelector('input[name="wholesale_price"]').value) || 0;
      const stock = Number(form.querySelector('input[name="stock"]').value) || 0;
      const low   = Number(form.querySelector('input[name="low_stock_alert"]').value) || 0;

      if(cp === 0 && wp === 0){
        toast('Enter at least one selling price (customer or wholesale)', 'error');
        return;
      }

      const supplierId = form.querySelector('select[name="supplier_id"]').value || null;

      let data;
      if(isDual){
        const bu = (form.querySelector('input[name="base_unit"]').value || 'piece').trim();
        const pu = (form.querySelector('input[name="pack_unit"]').value || 'box').trim();
        const ps = Number(form.querySelector('input[name="pack_size"]').value) || 1;

        if(ps <= 0){
          toast('Pack size must be greater than 0', 'error');
          return;
        }
        if(bu.toLowerCase() === pu.toLowerCase()){
          toast('Base unit and pack unit must be different', 'error');
          return;
        }

        data = {
          name,
          category:         categoryValue || '',
          dual:             true,
          base_unit:        bu,
          pack_unit:        pu,
          pack_size:        ps,
          unit:             null,
          cost,
          customer_price:   cp,
          wholesale_price:  wp,
          stock,
          low_stock_alert:  low,
          primary_unit:     form.querySelector('select[name="primary_unit"]').value || 'base_unit',
          supplier_id:      supplierId
        };
      } else {
        const unit = (form.querySelector('input[name="unit"]').value || 'piece').trim();
        data = {
          name,
          category:         categoryValue || '',
          dual:             false,
          unit,
          base_unit:        null,
          pack_unit:        null,
          pack_size:        null,
          cost,
          customer_price:   cp,
          wholesale_price:  wp,
          stock,
          low_stock_alert:  low,
          primary_unit:     'base_unit',
          supplier_id:      supplierId
        };
      }

      const btn = root.querySelector('#prf-save');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      let res;
      if(existing){
        res = await sb.from('products').update(data).eq('id', existing.id).select().single();
      } else {
        res = await sb.from('products').insert(data).select().single();
      }

      if(res.error){
        toast(res.error.message, 'error');
        btn.disabled = false;
        btn.textContent = (existing ? 'Update' : 'Save') + ' Product';
        return;
      }

      /* Update local state */
      if(existing) dbUpsertLocal('products', res.data);
      else DB.products = [res.data, ...(DB.products || [])];

      toast('Product ' + (existing ? 'updated' : 'added'), 'success');
      closeModal(root);

      /* Notify caller or re-render */
      if(typeof onCreated === 'function'){
        try { onCreated(res.data); } catch(err){ console.warn('[product created]', err); }
      } else if(location.hash === '#/products'){
        route();
      }
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   27d — RESTOCK FORM
   Add stock by base unit or by pack unit (dual products).
   ══════════════════════════════════════════════════════════════ */

function openRestockForm(productId){
  const p = DB.products.find(x => x.id === productId);
  if(!p) return;

  const isDual   = !!p.dual;
  const baseUnit = isDual ? (p.base_unit || 'piece') : (p.unit || 'piece');
  const packUnit = isDual ? (p.pack_unit || 'box') : '';
  const packSize = isDual ? (Number(p.pack_size) || 1) : 1;
  const display  = productDisplay(p);

  openModal(`
    <h2>Restock — ${esc(p.name)}</h2>
    <p class="modal-sub">
      Current stock:
      <b>${esc(display.fullText)}</b>
    </p>

    <form id="rsf" class="modal-body" novalidate>
      ${isDual ? `
        <div class="field">
          <label class="label">Add stock by</label>
          <div class="btn-group" id="rs-unit" style="display:inline-flex">
            <button type="button" class="btn btn-primary active" data-u="pack">${esc(packUnit)}</button>
            <button type="button" class="btn" data-u="base">${esc(baseUnit)}</button>
          </div>
          <div class="field-hint">1 ${esc(packUnit)} = ${fmtNum(packSize)} ${esc(baseUnit)}</div>
        </div>
      ` : ''}

      <div class="field">
        <label class="label">Quantity to add <span class="req">*</span></label>
        <input class="input" type="number" step="any" min="0.01" name="qty" required
          value="1" autofocus>
        <div class="field-hint" id="rs-hint"></div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="rsf-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="rsf-save">Add Stock</button>
      </div>
    </form>
  `, (root) => {
    const form = root.querySelector('#rsf');
    const qtyEl = form.querySelector('input[name="qty"]');
    const hintEl = root.querySelector('#rs-hint');

    let addType = isDual ? 'pack' : 'base';

    function updateHint(){
      const q = Number(qtyEl.value) || 0;
      if(!isDual){
        hintEl.textContent = 'Adds ' + fmtNum(q) + ' ' + baseUnit;
      } else {
        if(addType === 'pack'){
          hintEl.textContent = 'Adds ' + fmtNum(q * packSize) + ' ' + baseUnit + ' total';
        } else {
          hintEl.textContent = 'Adds ' + fmtNum(q) + ' ' + baseUnit;
        }
      }
    }

    if(isDual){
      const unitToggle = root.querySelector('#rs-unit');
      unitToggle.querySelectorAll('button').forEach(b => {
        b.onclick = () => {
          addType = b.dataset.u;
          unitToggle.querySelectorAll('button').forEach(x => {
            x.classList.toggle('btn-primary', x.dataset.u === addType);
            x.classList.toggle('active', x.dataset.u === addType);
          });
          updateHint();
        };
      });
    }

    qtyEl.oninput = updateHint;
    updateHint();

    root.querySelector('#rsf-cancel').onclick = () => closeModal(root);

    form.onsubmit = async (e) => {
      e.preventDefault();
      const qty = Number(qtyEl.value) || 0;
      if(qty <= 0){
        toast('Quantity must be greater than 0', 'error');
        return;
      }

      /* Convert to base units */
      let addedBase = qty;
      if(isDual && addType === 'pack') addedBase = qty * packSize;

      const btn = root.querySelector('#rsf-save');
      btn.disabled = true;
      btn.textContent = 'Updating…';

      const ok = await adjustStock(p.id, addedBase);
      if(!ok){
        toast('Failed to add stock', 'error');
        btn.disabled = false;
        btn.textContent = 'Add Stock';
        return;
      }

      /* Local update */
      const localP = DB.products.find(x => x.id === p.id);
      if(localP) localP.stock = Number(localP.stock || 0) + addedBase;

      toast('Stock added', 'success');
      closeModal(root);

      /* Refresh the current page */
      if(location.hash === '#/products' || location.hash === '#/'){
        route();
      }
    };
  });
}

/* ══════════════════════════════════════════════════════════════
   27e — EXPORT PRODUCTS TO CSV
   ══════════════════════════════════════════════════════════════ */

function exportProductsCSV(rows){
  const list = (rows || []).map(p => {
    const supplier = p.supplier_id
      ? (DB.suppliers || []).find(s => s.id === p.supplier_id)
      : null;
    return [
      p.name,
      p.category || '',
      p.dual ? 'Dual (' + (p.base_unit || 'piece') + ' / ' + (p.pack_unit || 'box') + ')' : 'Single',
      p.dual ? (p.pack_size || '') : '',
      p.dual ? (p.base_unit || '') : (p.unit || ''),
      p.dual ? (p.pack_unit || '') : '',
      Number(p.cost || 0).toFixed(2),
      Number(p.customer_price || 0).toFixed(2),
      Number(p.wholesale_price || 0).toFixed(2),
      Number(p.stock || 0).toFixed(2),
      Number(p.low_stock_alert || 0).toFixed(2),
      Number((Number(p.stock) || 0) * (Number(p.cost) || 0)).toFixed(2),
      supplier ? supplier.name : '',
      isOutOfStock(p) ? 'OUT' : (isLowStock(p) ? 'LOW' : 'OK')
    ];
  });

  const header = [
    'Name', 'Category', 'Type',
    'Pack Size', 'Base Unit', 'Pack Unit',
    'Cost', 'Customer Price', 'Wholesale Price',
    'Stock', 'Low Alert', 'Stock Value',
    'Supplier', 'Status'
  ];

  const all = [header, ...list];
  const csv = all.map(row => row.map(cell => {
    const s = String(cell ?? '');
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'Products-' + todayStr() + '.csv');
  toast('CSV downloaded', 'success');
}
