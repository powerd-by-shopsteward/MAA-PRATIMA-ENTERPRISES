  /* Kill all animations (spinner gets its own override below) */
  animation: none !important;

  /* Kill paper-grain and any gradient noise */
  background-blend-mode: normal !important;
  mix-blend-mode: normal !important;
}

/* ══════════════════════════════════════════════════════════════
   10b — SHADOWS : flat border-only mode
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] .card,
html[data-reduce-effects="true"] .kpi,
html[data-reduce-effects="true"] .mini-stat,
html[data-reduce-effects="true"] .modal,
html[data-reduce-effects="true"] .toast,
html[data-reduce-effects="true"] .calc,
html[data-reduce-effects="true"] .cmdk,
html[data-reduce-effects="true"] .confirm-box,
html[data-reduce-effects="true"] .filter-bar,
html[data-reduce-effects="true"] .sidebar,
html[data-reduce-effects="true"] .topbar,
html[data-reduce-effects="true"] .mobile-header,
html[data-reduce-effects="true"] .ss-dropdown,
html[data-reduce-effects="true"] .kbd-pop{
  box-shadow: none !important;
  border: 1px solid var(--border) !important;
}

html[data-reduce-effects="true"] .btn,
html[data-reduce-effects="true"] .btn-primary,
html[data-reduce-effects="true"] .btn-ghost,
html[data-reduce-effects="true"] .btn-danger,
html[data-reduce-effects="true"] .btn-success,
html[data-reduce-effects="true"] .chip,
html[data-reduce-effects="true"] .topbar-chip,
html[data-reduce-effects="true"] .topbar-bell,
html[data-reduce-effects="true"] .topbar-avatar,
html[data-reduce-effects="true"] .hamburger,
html[data-reduce-effects="true"] .badge,
html[data-reduce-effects="true"] .dot{
  box-shadow: none !important;
}

html[data-reduce-effects="true"] .input,
html[data-reduce-effects="true"] .input-inline,
html[data-reduce-effects="true"] .calc-display,
html[data-reduce-effects="true"] .btn-group{
  box-shadow: none !important;
}

/* ══════════════════════════════════════════════════════════════
   10c — GLASS → SOLID
   Any element that had a translucent + blurred bg becomes solid.
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] .sidebar,
html[data-reduce-effects="true"] .topbar,
html[data-reduce-effects="true"] .mobile-header,
html[data-reduce-effects="true"] #mobile-nav{
  background: #FFFFFF !important;
  border-right-color: var(--border) !important;
  border-bottom-color: var(--border) !important;
  border-top-color: var(--border) !important;
}

html[data-reduce-effects="true"] .modal-overlay,
html[data-reduce-effects="true"] .cmdk-overlay{
  background: rgba(31, 41, 55, 0.55) !important;
}

html[data-reduce-effects="true"] .sidebar-backdrop{
  background: rgba(31, 41, 55, 0.55) !important;
}

/* ══════════════════════════════════════════════════════════════
   10d — TRANSFORMS : kill all lifts
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] .btn:hover,
html[data-reduce-effects="true"] .btn:active,
html[data-reduce-effects="true"] .chip:hover,
html[data-reduce-effects="true"] .kpi:hover,
html[data-reduce-effects="true"] .card:hover,
html[data-reduce-effects="true"] .nav a:hover,
html[data-reduce-effects="true"] .topbar-bell:hover,
html[data-reduce-effects="true"] .topbar-avatar:hover,
html[data-reduce-effects="true"] .hamburger:hover,
html[data-reduce-effects="true"] .calc-keys button:hover,
html[data-reduce-effects="true"] .calc-keys button:active{
  transform: none !important;
}

/* ══════════════════════════════════════════════════════════════
   10e — ANIMATIONS : kill decorative ones, keep spinner
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] .modal,
html[data-reduce-effects="true"] .toast,
html[data-reduce-effects="true"] .cmdk,
html[data-reduce-effects="true"] .calc,
html[data-reduce-effects="true"] .modal-overlay,
html[data-reduce-effects="true"] .cmdk-overlay{
  animation: none !important;
}

html[data-reduce-effects="true"] .skel{
  animation: none !important;
  background: var(--card-alt) !important;
}

html[data-reduce-effects="true"] .dot-pulse{
  animation: none !important;
}

/* Spinner: keep it visible, but no fancy animation curve */
html[data-reduce-effects="true"] .spinner{
  animation: spin 1.6s linear infinite !important;
}

/* Loadbar: keep it, but no glow and no transition */
html[data-reduce-effects="true"] .loadbar{
  box-shadow: none !important;
  transition: none !important;
}

/* ══════════════════════════════════════════════════════════════
   10f — NOTEBOOK BACKGROUND → FLAT CREAM
   (Block 3 already handles ::before opacity, this is a safety net
   in case any component re-enables ruled lines.)
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] body::before{
  display: none !important;
}

html[data-reduce-effects="true"] body{
  background-color: var(--bg) !important;
}

/* ══════════════════════════════════════════════════════════════
   10g — PAPER-TEXTURE OVERLAYS OFF
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] .card.paper-texture::after{
  display: none !important;
}

/* ══════════════════════════════════════════════════════════════
   10h — MODAL GLOW STRIP OFF
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] .modal{
  background-image: none !important;
}

/* ══════════════════════════════════════════════════════════════
   10i — NAV ACCENTS : still visible, just not animated
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] .nav a::before{
  transition: none !important;
}

html[data-reduce-effects="true"] .nav a:hover::before,
html[data-reduce-effects="true"] .nav a.active::before{
  width: 3px;
}

/* ══════════════════════════════════════════════════════════════
   10j — HOVER STILL CHANGES COLOR (kept for usability)
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] .btn:hover{
  background-color: var(--primary-hover);
}

html[data-reduce-effects="true"] .btn-ghost:hover{
  background-color: var(--primary-soft);
}

html[data-reduce-effects="true"] .btn-danger:hover{
  background-color: var(--red-bg);
}

html[data-reduce-effects="true"] tbody tr:hover td{
  background-color: var(--primary-soft);
}

html[data-reduce-effects="true"] .nav a:hover{
  background-color: var(--primary-soft);
}

/* ══════════════════════════════════════════════════════════════
   10k — SCROLLBAR : simpler (no border hack)
   ══════════════════════════════════════════════════════════════ */

html[data-reduce-effects="true"] ::-webkit-scrollbar{
  width: 8px;
  height: 8px;
}

html[data-reduce-effects="true"] ::-webkit-scrollbar-thumb{
  background: var(--border-ink);
  border: 0;
  border-radius: 0;
}

html[data-reduce-effects="true"] ::-webkit-scrollbar-track{
  background: transparent;
}

/* ══════════════════════════════════════════════════════════════
   10l — AUTO-DETECT FALLBACK
   Browsers without backdrop-filter support get reduced mode
   automatically (no JS needed).
   ══════════════════════════════════════════════════════════════ */

@supports not (backdrop-filter: blur(1px)){
  .sidebar,
  .topbar,
  .mobile-header,
  #mobile-nav{
    background: #FFFFFF;
  }

  .modal-overlay,
  .cmdk-overlay{
    background: rgba(31, 41, 55, 0.55);
  }
}

/* ══════════════════════════════════════════════════════════════
   10m — SAFETY NET : respect reduced-motion even when
   reduce-effects is off
   ══════════════════════════════════════════════════════════════ */

@media (prefers-reduced-motion: reduce){
  .btn,
  .chip,
  .kpi,
  .card,
  .modal,
  .toast,
  .cmdk,
  .calc,
  .nav a,
  .topbar-bell,
  .hamburger,
  .topbar-avatar,
  .calc-keys button,
  .skel,
  .dot-pulse,
  .spinner{
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ══════════════════════════════════════════════════════════════
   END BLOCK 10
   ══════════════════════════════════════════════════════════════ */
 /* ══════════════════════════════════════════════════════════════
   BLOCK 11 — PRINT STYLES (A4 INVOICE, STATEMENT, REPORT)
   Dedicated print target for physical output.
   Activated by JS adding body class:
     .print-invoice    → only the invoice card prints
     .print-statement  → only the statement card prints

/* ══════════════════════════════════════════════════════════════
   14b — DATE / TIME
   ══════════════════════════════════════════════════════════════ */

const todayStr = () => {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};

const nowTimeStr = () => {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

const isFuture = (d) => !!d && d > todayStr();

const fmtDate = (d) => {
  if(!d) return '—';
  const s = String(d).slice(0, 10);
  const dt = new Date(s);
  if(isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
};

const fmtDateShort = (d) => {
  if(!d) return '—';
  const s = String(d).slice(0, 10);
  const dt = new Date(s);
  if(isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
};

/* Extract a date string from a record using a preferred field,
   falling back to created_at. Used everywhere for sorting. */
const txDate = (r, field) => {
  if(!r) return '';
  if(r[field]) return String(r[field]).slice(0, 10);
  if(r.created_at) return String(r.created_at).slice(0, 10);
  return '';
};

/* Date + optional time as display string */
const txDT = (r, field) => {
  if(!r) return '—';
  const d = txDate(r, field);
  if(!d) return '—';
  const base = fmtDate(d);
  return r.tx_time ? `${base} · ${r.tx_time}` : base;
};

/* "Entered: 12 Oct 2025 14:32" — audit trail line */
const enteredOn = (r) => {
  if(!r || !r.created_at) return '';
  const d = new Date(r.created_at);
  const datePart = d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  const timePart = d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  return `Entered: ${datePart} · ${timePart}`;
};

/* Range presets used by P&L, Reports, Margin, Shop Health */
const firstOfMonthStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
};

const firstOfYearStr = () => `${new Date().getFullYear()}-01-01`;

const daysAgoStr = (n) => {
  const d = new Date();
  d.setDate(d.getDate() - n);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');

};

/* ══════════════════════════════════════════════════════════════
   14c — NUMBER / CURRENCY
   ══════════════════════════════════════════════════════════════ */

/* Indian grouping: 1,23,456.78 */
function inr(n){
  const num = Number(n || 0);
  const neg = num < 0;
  const s = Math.abs(num).toFixed(2);
  const [intPart, decPart] = s.split('.');
  let out = intPart;
  if(intPart.length > 3){
    const last3 = intPart.slice(-3);
    const rest  = intPart.slice(0, -3);
    out = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  return (neg ? '-' : '') + out + '.' + decPart;
}

const rs = (n) => CURRENCY_SYMBOL + inr(n);

/* Compact number: 1.2k / 1.2L */
function fmtNum(n){
  const v = Number(n || 0);
  if(v % 1 === 0) return String(v);
  return v.toFixed(2).replace(/\.?0+$/, '');
}

const fmtPct = (n) => (Number(n || 0)).toFixed(1) + '%';

/* ══════════════════════════════════════════════════════════════
   14d — SAFETY
   ══════════════════════════════════════════════════════════════ */

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

/* Slugify for category-chip class + safe IDs */
function slug(s){
  return String(s || '')
    .toLowerCase()
    .trim()
    .replace(/&/g, 'and')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function openModal(html, onMount){
  const root = $('#modal-root');
  const wrapper = document.createElement('div');
  wrapper.className = 'modal-overlay';
  wrapper.innerHTML = `<div class="modal t-resize">${html}</div>`;

  /* Click on overlay (outside the card) closes */
  wrapper.addEventListener('click', (e) => {
    if(e.target === wrapper) closeModal(wrapper);
  });

  /* ESC closes the topmost modal */
  wrapper.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal(wrapper);
  });

  root.appendChild(wrapper);

  /* Focus first input/textarea/select if present */
  const firstField = wrapper.querySelector('input:not([type="hidden"]), textarea, select');
  if(firstField){
    setTimeout(() => { try { firstField.focus(); } catch(e){} }, 60);
  }

  if(onMount) onMount(wrapper);
  return wrapper;
}

function closeModal(el){
  const root = $('#modal-root');
  if(!root) return;
  if(el && el.parentNode === root){
    root.removeChild(el);
    return;
  }
  const last = root.lastElementChild;
  if(last) root.removeChild(last);
}

  const root = $('#modal-root');

}

/* ══════════════════════════════════════════════════════════════
   14i — INVOICE NUMBER GENERATOR  [FINAL PATCH]
   Picks the next number for the given party type.

   Rules:
     • Only consider invoices with the exact prefix.
     • Skip credit notes (negative totals).
     • Only accept tails that are pure digits (1–8 chars).
       This prevents timestamp-based credit note numbers
       (e.g. RET-1759929420) from ever polluting the series.
     • Pad to INVOICE_PAD (currently 4).
   ══════════════════════════════════════════════════════════════ */

function nextInvoiceNo(partyType){
  const prefix = INVOICE_PREFIX[partyType] || 'INV-';
  let max = 0;

  DB.invoices.forEach(inv => {
    if(inv.party_type !== partyType) return;

    const no = String(inv.invoice_no || '');
    if(!no.startsWith(prefix)) return;

    /* Skip credit notes (returns) — they have negative totals */
    if(Number(inv.total) < 0) return;

    /* Extract the tail after the prefix */
    const tail = no.slice(prefix.length);

    /* Only accept canonical numbers: 1 to 8 pure digits.
       This excludes timestamps like 1759929420 (10 digits) and
       any malformed invoice numbers. */
    if(!/^\d{1,8}$/.test(tail)) return;

    const n = parseInt(tail, 10);
    if(n > max) max = n;
  });

  return prefix + String(max + 1).padStart(INVOICE_PAD, '0');
}


/* ══════════════════════════════════════════════════════════════
   14j — PRODUCT DISPLAY
   Handles dual (piece + box) and single-unit products.
   Returns { primary, secondary, stockLabel, fullText, subline }
   ══════════════════════════════════════════════════════════════ */

function productDisplay(p){
  if(!p) return { primary:'—', secondary:'', stockLabel:'—', fullText:'—', subline:'' };

  if(p.dual){
    const size    = Number(p.pack_size) || 1;
    const packs   = size > 0 ? Number(p.stock) / size : 0;
    const packStr = fmtNum(packs) + ' ' + (p.pack_unit || 'box') + (packs === 1 ? '' : 's');
    const baseStr = fmtNum(p.stock) + ' ' + (p.base_unit || 'piece') + (Number(p.stock) === 1 ? '' : 's');
    const primaryIsPack = p.primary_unit === 'pack_unit';
    const primary   = primaryIsPack ? packStr : baseStr;
    const secondary = primaryIsPack ? baseStr : packStr;
    return {
      primary,
      secondary,
      stockLabel: primary,
      fullText:   primary + ' (' + secondary + ')',
      subline:    fmtNum(size) + ' ' + (p.base_unit || 'piece') + ' / ' + (p.pack_unit || 'box')
    };
  }

  const str = fmtNum(p.stock) + ' ' + (p.unit || 'piece') + (Number(p.stock) === 1 ? '' : 's');
  return {
    primary:    str,
    secondary:  '',
    stockLabel: str,
    fullText:   str,
    subline:    'Cost ' + rs(p.cost || 0) + ' / ' + (p.unit || 'piece')
  };
}

function isLowStock(p){ return Number(p?.stock || 0) <= Number(p?.low_stock_alert || 0); }
function isOutOfStock(p){ return Number(p?.stock || 0) <= 0; }

function stockBadge(p){
  if(isOutOfStock(p)) return '<span class="chip chip-gray chip-xs">OUT</span>';
  if(isLowStock(p))   return '<span class="chip chip-red chip-xs">LOW</span>';
  return '<span class="chip chip-green chip-xs">OK</span>';
}

/* Human-readable product label used on invoice lines */
function productLineLabel(line){
  if(!line) return '—';
  if(line.dual){
    if(line.unit === line.pack_unit){
      return `${line.product_name} — ${fmtNum(line.pack_size)} ${line.base_unit} / ${line.pack_unit}`;
    }
    return `${line.product_name} — ${line.unit}`;
  }
  return line.product_name + (line.unit ? ' — ' + line.unit : '');
}

/* How many BASE units does this line deduct from stock? */
function lineDeductBaseQty(line){
  if(!line) return 0;
  if(line.dual && line.unit === line.pack_unit){
    return Number(line.qty || 0) * Number(line.pack_size || 1);
  }
  return Number(line.qty || 0);
}

/* Base-unit qty for a purchase bill line item.
   supplier_invoice_items doesn't store dual / pack_size, so we look
   up the product to convert pack → base. */
function purchaseLineBaseQty(it){
  if(!it) return 0;
  const qty = Number(it.qty || 0);
  const p   = (DB.products || []).find(x => x.id === it.product_id);
  if(!p) return qty;
  if(p.dual && p.pack_unit && it.unit === p.pack_unit){
    return qty * (Number(p.pack_size) || 1);
  }
  return qty;
}

/* ══════════════════════════════════════════════════════════════
   14k — PARTY STATS (Fixed for Prefix Clash)
   ══════════════════════════════════════════════════════════════ */
function partyStats(partyId, partyType){
  const invs = DB.invoices.filter(i => i.party_id === partyId && i.party_type === partyType);
  const pays = DB.payments.filter(p => p.party_id === partyId && p.party_type === partyType);

  let total_invoiced = 0;
  let total_returned = 0;

  invs.forEach(i => {
    const isCredit = Number(i.total) < 0;
    if (isCredit) {
      total_returned += Math.abs(Number(i.total || 0));
    } else {
      total_invoiced += Number(i.total || 0);
    }
  });

  const invoice_paid = invs.reduce((s, i) => {
    const isCredit = Number(i.total) < 0;
    if (isCredit) return s;
    return s + Number(i.paid || 0);
  }, 0);

  const extra_paid = pays.reduce((s, p) => s + Number(p.amount || 0), 0);
  const total_paid = invoice_paid + extra_paid;

  /* ✅ FIX: include opening balance from the party record */
  const table  = partyType === 'retailer' ? 'retailers' : 'customers';
  const party  = (DB[table] || []).find(x => x.id === partyId);
  const opening = Number(party?.opening_balance || 0);

  const due = opening + total_invoiced - total_returned - total_paid;

  return {
    opening,
    total_billed:   total_invoiced,
    total_returned,
    total_paid,
    due,
    invoice_count:  invs.filter(i => Number(i.total) >= 0).length,
    payment_count:  pays.length
  };
}
/* ══════════════════════════════════════════════════════════════
   14l — SUPPLIER TOTALS
   Works for both companies and vendors.
   ══════════════════════════════════════════════════════════════ */

function supplierTotals(supplierId){
  const sup   = DB.suppliers.find(s => s.id === supplierId);
  const bills = DB.supplier_invoices.filter(b => b.supplier_id === supplierId);
  const pays  = DB.supplier_payments.filter(p => p.supplier_id === supplierId);

  const opening        = Number(sup?.opening_balance || 0);
  const total_purchase = bills.reduce((s, b) => s + Number(b.total || 0), 0);
  const bill_paid      = bills.reduce((s, b) => s + Number(b.paid  || 0), 0);
  const extra_paid     = pays.reduce((s, p) => s + Number(p.amount || 0), 0);
  const total_paid     = bill_paid + extra_paid;
  const total_due      = Math.max(0, opening + total_purchase - total_paid);

  return {
    opening,
    total_purchase,
    total_paid,
    bill_paid,
    extra_paid,
    total_due
  };
}

/* Auto-detect low-end devices on first load.
   Returns true if the device looks weak. */
function shouldSuggestReduceEffects(){
  try {
    const cores  = navigator.hardwareConcurrency || 8;
    const memory = navigator.deviceMemory || 8;
    const mobile = window.matchMedia('(max-width: 900px)').matches;
    if(cores  <= 4) return true;
    if(memory <= 4) return true;

    return false;

}

/* ══════════════════════════════════════════════════════════════
   14o — STOCK HELPERS
   adjustStock() fetches the current stock before writing to avoid
   race conditions from parallel line updates.
   ══════════════════════════════════════════════════════════════ */

async function adjustStock(productId, delta){
  if(!productId) return false;
  const { data: fresh, error: fe } = await sb
    .from('products')
    .select('stock')
    .eq('id', productId)
    .single();
  if(fe || !fresh) return false;

  const newStock = Number(fresh.stock || 0) + Number(delta || 0);
  const { error } = await sb
    .from('products')
    .update({ stock: newStock })
    .eq('id', productId);

  return !error;
}

/* Validates that every line can be fulfilled from stock.
   Returns { ok:true } or { ok:false, productName, need, available, unit }. */
function checkStock(lines){
  if(!lines || !lines.length) return { ok: true };
  for(const l of lines){
    const p = DB.products.find(x => x.id === l.product_id);
    if(!p) continue; // product deleted — nothing to check
    const need = lineDeductBaseQty(l);
    if(Number(p.stock || 0) < need){
      const unit = p.dual ? p.base_unit : p.unit;
      return {
        ok: false,
        productName: p.name,
        need,
        available: Number(p.stock || 0),
        unit
      };
    }
  }
  return { ok: true };
}

/* ══════════════════════════════════════════════════════════════
   14p — LOAD BAR
   Thin honey bar at the top of the viewport during page loads.
   ══════════════════════════════════════════════════════════════ */

let _loadbarTimer = null;

function loadbarStart(){
  const bar = document.getElementById('loadbar');
  if(!bar) return;
  bar.classList.add('active');
  bar.style.width = '0%';
  /* Animate to 70% quickly, then trickle to 90% until ended */
  requestAnimationFrame(() => { bar.style.width = '70%'; });
  if(_loadbarTimer) clearInterval(_loadbarTimer);
  _loadbarTimer = setInterval(() => {
    const cur = parseFloat(bar.style.width || '0');
    if(cur < 90) bar.style.width = (cur + 2) + '%';
  }, 300);
}

function loadbarEnd(){
  const bar = document.getElementById('loadbar');
  if(!bar) return;
  if(_loadbarTimer){ clearInterval(_loadbarTimer); _loadbarTimer = null; }
  bar.style.width = '100%';
  setTimeout(() => {
    bar.classList.remove('active');
    setTimeout(() => { bar.style.width = '0%'; }, 220);
  }, 180);
}

/* ══════════════════════════════════════════════════════════════
   14r — URL / HASH HELPERS
   ══════════════════════════════════════════════════════════════ */

/* Parse query string after a hash route:  #/new-invoice/customer?party=xyz */
function hashQuery(hash){
  const idx = hash.indexOf('?');
  if(idx === -1) return {};
  const params = new URLSearchParams(hash.slice(idx + 1));
  const out = {};
  params.forEach((v, k) => { out[k] = v; });
  return out;
}

function hashPath(hash){
  const idx = hash.indexOf('?');
  return idx === -1 ? hash : hash.slice(0, idx);
}

/* ══════════════════════════════════════════════════════════════
   14s — DOWNLOAD FILE
   ══════════════════════════════════════════════════════════════ */

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  downloadBlob(blob, filename);
}

/* ══════════════════════════════════════════════════════════════
   14t — COPY TO CLIPBOARD
   ══════════════════════════════════════════════════════════════ */

async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch(e){
    /* Fallback */
    try {
      const el = document.createElement('textarea');
      el.value = text;
      el.style.position = 'fixed';
      el.style.opacity = '0';
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      return true;
    } catch(e2){
      return false;
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   14u — DEBOUNCE / THROTTLE
   Used for search inputs, resize handlers, etc.
   ══════════════════════════════════════════════════════════════ */

function debounce(fn, wait = 250){
  let t = null;
  return function(...args){
    if(t) clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

function throttle(fn, wait = 100){
  let last = 0;
  return function(...args){
    const now = Date.now();
    if(now - last >= wait){
      last = now;
      fn.apply(this, args);
    }
  };
}

/* ══════════════════════════════════════════════════════════════
   14v — INITIALS (for avatar)
   ══════════════════════════════════════════════════════════════ */

function initials(name){
  const s = String(name || '').trim();
  if(!s) return '?';
  const parts = s.split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

/* ══════════════════════════════════════════════════════════════
   14w — SUM / MONEY ROUNDING
   ══════════════════════════════════════════════════════════════ */

function round2(n){
  return Math.round((Number(n) || 0) * 100) / 100;
}

function sumBy(arr, key){
  return (arr || []).reduce((s, x) => s + Number(x?.[key] || 0), 0);
}

/* ══════════════════════════════════════════════════════════════
   14y — DATE RANGE PRESET
   Used by P&L, Reports, Margin, Shop Health, Expenses.
   Returns { from, to }
   ══════════════════════════════════════════════════════════════ */

function rangeForPreset(preset, customFrom, customTo){
  const today = todayStr();
  if(preset === 'today')  return { from: today, to: today };
  if(preset === 'week')   return { from: daysAgoStr(6), to: today };
  if(preset === 'month')  return { from: firstOfMonthStr(), to: today };
  if(preset === 'year')   return { from: firstOfYearStr(), to: today };
  if(preset === 'custom') return { from: customFrom || '0000-01-01', to: customTo || '9999-12-31' };
  return { from: '0000-01-01', to: '9999-12-31' };
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 15 — DATA SYNC & AUTH
   syncDB()   → fetches every table, populates DB, applies SETTINGS
   saveSettings() → writes the settings row back to Supabase
   initAuth() → restores the session on boot
   login()    → email/password sign-in
   logout()   → sign-out + reset

   Robustness: parallel fetch → 1 retry for failures → per-table
   error aggregation. A failed table never wipes its DB array.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   15a — syncDB : FETCH ALL TABLES
   ══════════════════════════════════════════════════════════════ */

async function syncDB(){
  /* ─── Table query map ───────────────────────────────────── */
  const build = {
    customers:               () => sb.from('customers').select('*').order('created_at', { ascending: false }),
    retailers:               () => sb.from('retailers').select('*').order('created_at', { ascending: false }),

    suppliers:               () => sb.from('suppliers').select('*').order('name'),

    products:                () => sb.from('products').select('*').order('name'),

    invoices:                () => sb.from('invoices').select('*').order('invoice_date', { ascending: false }),
    invoice_items:           () => sb.from('invoice_items').select('*'),

    payments:                () => sb.from('payments').select('*').order('payment_date', { ascending: false }),

    supplier_invoices:       () => sb.from('supplier_invoices').select('*').order('bill_date', { ascending: false }),
    supplier_invoice_items:  () => sb.from('supplier_invoice_items').select('*'),
    supplier_payments:       () => sb.from('supplier_payments').select('*').order('payment_date', { ascending: false }),

    returns:                 () => sb.from('returns').select('*').order('return_date', { ascending: false }),

    expenses:                () => sb.from('expenses').select('*').order('expense_date', { ascending: false })
  };

  async function fetchOne(name){
    const res = await build[name]();
    if(res.error) throw new Error(name + ' — ' + res.error.message);
    return res.data || [];
  }

  const names  = Object.keys(build);
  const errors = [];

  /* ─── Pass 1 : all tables in parallel ───────────────────── */
  loadbarStart();

  let results = await Promise.allSettled(names.map(fetchOne));

  /* ─── Pass 2 : retry failures once ──────────────────────── */
  let failedNames = names.filter((_, i) => results[i].status === 'rejected');

  if(failedNames.length){
    console.warn('[syncDB] retrying failed tables:', failedNames);
    await new Promise(r => setTimeout(r, 600));
    const retries = await Promise.allSettled(failedNames.map(fetchOne));

    retries.forEach((r, i) => {
      const idx = names.indexOf(failedNames[i]);
      if(idx !== -1) results[idx] = r;
    });

    failedNames = names.filter((_, i) => results[i].status === 'rejected');
  }

  /* ─── Apply : only overwrite DB[name] on success ────────── */
  results.forEach((r, i) => {
    const name = names[i];
    if(r.status === 'fulfilled'){
      DB[name] = r.value;
    } else {
      errors.push(r.reason.message);
      console.warn('[syncDB] failed:', name, r.reason.message);
    }
  });

  /* ─── Settings : single row, id = 1 ─────────────────────── */
  try {
    const sett = await sb.from('settings').select('*').eq('id', 1).maybeSingle();

    if(sett.error) throw sett.error;

    if(sett.data){
      SETTINGS = {
        shop_name:        sett.data.shop_name        || 'Stationery Hub',
        owner_name:       sett.data.owner_name       || 'Owner',
        address:          sett.data.address          || '',
        license:          sett.data.license          || '',
        upi:              sett.data.upi              || '',
        phone:            sett.data.phone            || '',
        email:            sett.data.email            || '',
        logo:             sett.data.logo             || '',
        gst_enabled:      !!sett.data.gst_enabled,
        gst_number:       sett.data.gst_number       || '',
        gst_rate:         Number(sett.data.gst_rate) || 18,
        reduced_effects:  !!sett.data.reduced_effects,
        custom_categories: Array.isArray(sett.data.custom_categories)
                            ? sett.data.custom_categories
                            : []
      };

      /* Apply reduced-effects toggle from settings */
      applyReduceEffects(SETTINGS.reduced_effects);

      /* Refresh favicon in case logo changed */
      applyFavicon();
    }
  } catch(e){
    errors.push('settings — ' + e.message);
    console.warn('[syncDB] settings fetch failed:', e.message);
  }

  /* ─── Sync flags ────────────────────────────────────────── */
  window.DB_SYNCED       = errors.length === 0;
  window.DB_SYNC_ERRORS  = errors;

  loadbarEnd();

  if(errors.length){
    console.error('[syncDB] FAILED tables:', errors);
    toast('Could not load: ' + errors.join(' | '), 'error');
  }

  return { ok: errors.length === 0, errors };
}

/* ══════════════════════════════════════════════════════════════
   15b — saveSettings : WRITE SETTINGS BACK
   ══════════════════════════════════════════════════════════════ */

async function saveSettings(){
  const payload = {
    id:               1,
    shop_name:        SETTINGS.shop_name,
    owner_name:       SETTINGS.owner_name,
    address:          SETTINGS.address,
    license:          SETTINGS.license,
    upi:              SETTINGS.upi,
    phone:            SETTINGS.phone,
    email:            SETTINGS.email,
    logo:             SETTINGS.logo,
    gst_enabled:      SETTINGS.gst_enabled,
    gst_number:       SETTINGS.gst_number,
    gst_rate:         SETTINGS.gst_rate,
    reduced_effects:  SETTINGS.reduced_effects,
    custom_categories: Array.isArray(SETTINGS.custom_categories)
                        ? SETTINGS.custom_categories
                        : [],
    updated_at:       new Date().toISOString()
  };

  const { error } = await sb.from('settings').upsert(payload);

  if(error){
    toast('Save failed: ' + error.message, 'error');
    return false;
  }
  return true;
}

/* ══════════════════════════════════════════════════════════════
   15c — AUTH : RESTORE SESSION, LOGIN, LOGOUT
   ══════════════════════════════════════════════════════════════ */

async function initAuth(){
  try {
    const { data: { session } } = await sb.auth.getSession();
    SESSION = session;

    /* Keep SESSION in sync with Supabase's state */
    sb.auth.onAuthStateChange((_event, s) => {
      SESSION = s;
    });
  } catch(e){
    console.error('[initAuth] failed:', e);
    SESSION = null;
  }
}

async function login(email, password){
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) throw error;

  const { data: { session } } = await sb.auth.getSession();
  SESSION = session;
  return SESSION;
}

async function logout(){
  try {
    await sb.auth.signOut();
  } catch(e){
    console.warn('[logout] signOut threw:', e);
  }
  SESSION = null;

  /* Close any open overlays */
  closeAllModals();
  const toastRoot = $('#toast-root');
  if(toastRoot) toastRoot.innerHTML = '';
  const calcRoot = $('#calc-root');
  if(calcRoot) calcRoot.innerHTML = '';
  const cmdkRoot = $('#cmdk-root');
  if(cmdkRoot) cmdkRoot.innerHTML = '';

  /* Reset hash and route back to login */
  location.hash = '#/';
  if(typeof route === 'function') route();
}

/* Full refetch — use after operations that change many tables */
async function refreshAll(){
  const res = await syncDB();
  return res.ok;
}

/* Update a single row in a local DB array (fast UI updates)
   without a full refetch. */
function dbUpsertLocal(table, row){
  if(!DB[table] || !Array.isArray(DB[table])) return;
  const idx = DB[table].findIndex(x => x.id === row.id);
  if(idx === -1) DB[table].unshift(row);
  else           DB[table][idx] = row;
}

function dbRemoveLocal(table, id){
  if(!DB[table] || !Array.isArray(DB[table])) return;
  DB[table] = DB[table].filter(x => x.id !== id);
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 16 — SEARCH SELECT COMPONENT
   Reusable type-ahead picker used for:
     - Parties (customers, retailers)
     - Products (dual-unit aware)
     - Invoices (for returns)
     - Suppliers (companies + vendors)
   Also exposes "+ Add new" hook for inline creation flows.
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   16a — HTML BUILDER
   Insert this string wherever a picker is needed, then call
   mountSearchSelect(el, opts) on the resulting element.
   ══════════════════════════════════════════════════════════════ */

function searchSelectHTML(id, placeholder){
  return `
    <div class="searchselect" id="${esc(id)}">
      <input
        type="text"
        class="input ss-input"
        placeholder="${esc(placeholder || 'Search...')}"
        autocomplete="off"
        spellcheck="false"
        style="padding-right:34px"
      >
      <button type="button" class="ss-clear" tabindex="-1" aria-label="Clear">×</button>
      <div class="ss-dropdown" role="listbox"></div>
      <input type="hidden" class="ss-value" value="">
    </div>
  `;
}

/* ══════════════════════════════════════════════════════════════
   16b — MOUNT
   rootEl   → the .searchselect element
   opts     → {
     items:    [ { id, label, sublabel, searchText, dueText, metaText } ],
     allowAdd: boolean,
     onSelect: (opt|null) => void,
     onAdd:    () => void
   }
   Returns the same rootEl with helper methods attached:
     getValue()       → hidden input value
     setValue(id)     → programmatically pick by id
     reset()          → clear selection + input
     setItems(list)   → replace the option list at runtime
   ══════════════════════════════════════════════════════════════ */

function mountSearchSelect(rootEl, opts){
  opts = opts || {};

  const input    = rootEl.querySelector('.ss-input');
  const dropdown = rootEl.querySelector('.ss-dropdown');
  const clearBtn = rootEl.querySelector('.ss-clear');
  const hidden   = rootEl.querySelector('.ss-value');

  let items     = Array.isArray(opts.items) ? opts.items : [];
  let filtered  = [];
  let activeIdx = -1;

  /* ─── Render dropdown ──────────────────────────────────── */
  function render(query){
    const q = String(query || '').toLowerCase().trim();
    filtered = items.filter(it => {
      if(!q) return true;
      const hay = (it.searchText || it.label || '').toLowerCase();
      return hay.includes(q);
    });

    let html = '';

    if(!filtered.length){
      html = '<div class="ss-empty">No matches found</div>';
    } else {
      html = filtered.map((it, i) => `
        <div class="ss-item ${i === activeIdx ? 'active' : ''}" data-idx="${i}" role="option">
          <div style="flex:1;min-width:0;overflow:hidden">
            <div class="sname">${esc(it.label)}</div>
            ${it.sublabel ? `<div class="ssub">${esc(it.sublabel)}</div>` : ''}
          </div>
          <div class="smeta">
            ${it.dueText  ? `<div class="due">${esc(it.dueText)}</div>` : ''}
            ${it.metaText ? `<div>${esc(it.metaText)}</div>`       : ''}
          </div>
        </div>
      `).join('');
    }

    if(opts.allowAdd){
      html += `<div class="ss-add">+ Add new</div>`;
    }

    dropdown.innerHTML = html;
    dropdown.classList.add('open');

    /* Wire clicks */
    dropdown.querySelectorAll('.ss-item').forEach(el => {
      el.onclick = () => pick(parseInt(el.dataset.idx, 10));
    });

    const addEl = dropdown.querySelector('.ss-add');
    if(addEl){
      addEl.onclick = () => {
        dropdown.classList.remove('open');
        if(opts.onAdd) opts.onAdd();
      };
    }

    /* Ensure the active item is scrolled into view */
    const activeEl = dropdown.querySelector('.ss-item.active');
    if(activeEl && typeof activeEl.scrollIntoView === 'function'){
      activeEl.scrollIntoView({ block: 'nearest' });
    }
  }

  /* ─── Pick an item by its index in the filtered list ──── */
  function pick(i){
    const it = filtered[i];
    if(!it) return;

    hidden.value = it.id;
    input.value  = it.label + (it.sublabel ? ' — ' + it.sublabel : '');
    input.classList.add('has-value');
    clearBtn.style.display = 'inline-flex';
    dropdown.classList.remove('open');

    if(opts.onSelect) opts.onSelect(it);
  }

  /* ─── Clear selection ──────────────────────────────────── */
  function clear(){
    hidden.value = '';
    input.value  = '';
    input.classList.remove('has-value');
    clearBtn.style.display = 'none';
    activeIdx = -1;
    if(opts.onSelect) opts.onSelect(null);
  }

  /* ══════════════════════════════════════════════════════
     EVENT WIRING
     ══════════════════════════════════════════════════════ */

  /* Focus → open dropdown with the current query stripped of the sublabel */
  input.addEventListener('focus', () => {
    const stripped = input.value.replace(/ — .*$/, '').trim();
    render(stripped);
  });

  /* Input → refilter, un-select current value */
  input.addEventListener('input', () => {
    activeIdx = -1;
    hidden.value = '';
    input.classList.remove('has-value');
    clearBtn.style.display = input.value ? 'inline-flex' : 'none';
    render(input.value);
  });

  /* Keyboard */
  input.addEventListener('keydown', (e) => {
    if(!dropdown.classList.contains('open')) return;

    if(e.key === 'ArrowDown'){
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, filtered.length - 1);
      render(input.value);
    }
    else if(e.key === 'ArrowUp'){
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      render(input.value);
    }
    else if(e.key === 'Enter'){
      e.preventDefault();
      if(activeIdx >= 0) pick(activeIdx);
    }
    else if(e.key === 'Escape'){
      dropdown.classList.remove('open');
    }
  });

  /* Clear button */
  clearBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clear();
    input.focus();
  });

  /* Click outside → close */
  const outsideHandler = (e) => {
    if(!rootEl.contains(e.target)){
      dropdown.classList.remove('open');
    }
  };
  document.addEventListener('click', outsideHandler);

  /* ══════════════════════════════════════════════════════
     ATTACH PUBLIC API TO ROOT ELEMENT
     ══════════════════════════════════════════════════════ */

  rootEl.getValue = () => hidden.value;

  rootEl.setItems = (list) => {
    items = Array.isArray(list) ? list : [];
  };

  rootEl.setValue = (id) => {
    const it = items.find(x => x.id === id);
    if(!it) return false;
    hidden.value = it.id;
    input.value  = it.label + (it.sublabel ? ' — ' + it.sublabel : '');
    input.classList.add('has-value');
    clearBtn.style.display = 'inline-flex';
    return true;
  };

  rootEl.reset = clear;

  rootEl.destroy = () => {
    document.removeEventListener('click', outsideHandler);
    rootEl.innerHTML = '';
  };

  return rootEl;
}

/* ══════════════════════════════════════════════════════════════
   16c — OPTION BUILDERS
   Turn raw DB rows into { id, label, sublabel, searchText,
   dueText, metaText } objects the picker expects.

/* ─── Party (customer or retailer) ─────────────────────── */
function partyToOption(p, partyType){
  if(!p) return null;
  const st = partyStats(p.id, partyType);
  return {
    id:         p.id,
    label:      p.name,
    sublabel:   p.phone || '',
    searchText: ((p.name || '') + ' ' + (p.phone || '') + ' ' + (p.address || '')).toLowerCase(),
    dueText:    st.due > 0 ? 'Due ' + rs(st.due) : '',
    metaText:   ''
  };
}

/* ─── Product (dual-unit aware) ─────────────────────────── */
function productToOption(p){
  if(!p) return null;
  const d = productDisplay(p);
  return {
    id:         p.id,
    label:      p.name,
    sublabel:   d.subline + '  ·  Stock ' + d.stockLabel,
    searchText: (
      (p.name || '') + ' ' +
      (p.category || '') + ' ' +
      (p.unit || '') + ' ' +
      (p.base_unit || '') + ' ' +
      (p.pack_unit || '') + ' ' +
      (p.pack_size || '')
    ).toLowerCase(),
    dueText:    isLowStock(p) ? 'LOW' : '',
    metaText:   d.stockLabel
  };
}

/* ─── Invoice (for returns from party) ──────────────────── */
function invoiceToOption(i){
  if(!i) return null;
  const party = i.party_type === 'retailer'
    ? DB.retailers.find(x => x.id === i.party_id)
    : DB.customers.find(x => x.id === i.party_id);

  const partyName = party ? party.name : '—';
  return {
    id:         i.id,
    label:      (i.invoice_no || 'INV') + ' — ' + partyName,
    sublabel:   txDT(i, 'invoice_date') + '   ' + rs(i.total) + (Number(i.due) > 0 ? '   Due ' + rs(i.due) : ''),
    searchText: ((i.invoice_no || '') + ' ' + partyName + ' ' + (party?.phone || '')).toLowerCase(),
    dueText:    Number(i.due) > 0 ? 'Due ' + rs(i.due) : '',
    metaText:   i.party_type === 'retailer' ? 'Retailer' : 'Customer'
  };
}

/* ─── Supplier (company or vendor) ──────────────────────── */
function supplierToOption(s){
  if(!s) return null;
  const tt = supplierTotals(s.id);
  const typeLabel = SUPPLIER_TYPE_LABELS[s.type] || 'Company';
  return {
    id:         s.id,
    label:      s.name,
    sublabel:   s.shop_name || s.phone || '',
    searchText: ((s.name || '') + ' ' + (s.shop_name || '') + ' ' + (s.phone || '') + ' ' + (s.category || '')).toLowerCase(),
    dueText:    tt.total_due > 0 ? 'Payable ' + rs(tt.total_due) : '',
    metaText:   typeLabel
  };
}

/* ══════════════════════════════════════════════════════════════
   16d — CONVENIENCE : MOUNT BY ID
   Some callers want to skip the element lookup. This helper
   builds + mounts in one shot and returns the root element.
   ══════════════════════════════════════════════════════════════ */

function mountSearchSelectById(containerSelector, id, placeholder, opts){
  const container = $(containerSelector);
  if(!container) return null;
  container.innerHTML = searchSelectHTML(id, placeholder);
  const rootEl = $('#' + id, container);
  if(!rootEl) return null;
  return mountSearchSelect(rootEl, opts);
}

/* ══════════════════════════════════════════════════════════════
   17a — CATEGORY CHIP (inline display)
   Usage: categoryChip("Pens & Writing")  →  <span class="chip chip-cat-writing">Pens & Writing</span>
   ══════════════════════════════════════════════════════════════ */

function categoryChip(category){
  const cat = String(category || '').trim();
  if(!cat) return '<span class="chip chip-cat-other chip-xs">Uncategorised</span>';
  const cls = categoryChipClass(cat);
  return `<span class="chip ${cls} chip-xs">${esc(cat)}</span>`;
}

/* ══════════════════════════════════════════════════════════════
   17b — ADD CUSTOM CATEGORY (persist)
   Returns { ok, name, reason }
   ══════════════════════════════════════════════════════════════ */

async function addCustomCategory(rawName){
  const name = String(rawName || '').trim();

  if(!name){
    return { ok: false, reason: 'Category name is required' };
  }
  if(name.length > 40){
    return { ok: false, reason: 'Category name too long (max 40 characters)' };
  }

  /* Ensure custom_categories is an array */
  if(!Array.isArray(SETTINGS.custom_categories)){
    SETTINGS.custom_categories = [];
  }

  /* Reject if it already exists (case-insensitive) among defaults OR customs */
  const lower = name.toLowerCase();
  const defaults = DEFAULT_CATEGORIES.map(c => c.toLowerCase());
  const customs  = SETTINGS.custom_categories.map(c => String(c).toLowerCase());

  if(defaults.includes(lower) || customs.includes(lower)){
    return { ok: false, reason: 'This category already exists' };
  }

  SETTINGS.custom_categories.push(name);

  const ok = await saveSettings();
  if(!ok){
    /* Roll back on failure */
    SETTINGS.custom_categories = SETTINGS.custom_categories.filter(c => c !== name);
    return { ok: false, reason: 'Could not save to server' };
  }

  return { ok: true, name };
}

/* ══════════════════════════════════════════════════════════════
   17c — REMOVE CUSTOM CATEGORY (default categories are protected)
   Returns { ok, reason }
   ══════════════════════════════════════════════════════════════ */

async function removeCustomCategory(rawName){
  const name = String(rawName || '').trim();
  if(!name) return { ok: false, reason: 'Invalid name' };

  if(!Array.isArray(SETTINGS.custom_categories)){
    return { ok: false, reason: 'Nothing to remove' };
  }

  const before = SETTINGS.custom_categories.length;
  SETTINGS.custom_categories = SETTINGS.custom_categories.filter(
    c => String(c).toLowerCase() !== name.toLowerCase()
  );

  if(SETTINGS.custom_categories.length === before){
    return { ok: false, reason: 'Category not found in custom list' };
  }

  const ok = await saveSettings();
  if(!ok){
    SETTINGS.custom_categories.push(name); /* roll back */
    return { ok: false, reason: 'Could not save to server' };
  }

  return { ok: true };
}

/* ══════════════════════════════════════════════════════════════
   17d — ADD CATEGORY MODAL
   Called by the picker when the user clicks "+ Add new".
   After a successful save, calls onAdded(newName).
   ══════════════════════════════════════════════════════════════ */

function openAddCategoryModal(onAdded){
  openModal(`
    <h2>Add Category</h2>
    <p class="modal-sub">Create a new category. It will be available in every product form.</p>

    <form id="ac-form" class="modal-body">
      <div class="field">
        <label class="label">Category name <span class="req">*</span></label>
        <input
          type="text"
          class="input"

          maxlength="40"
          required

      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <button type="button" class="btn btn-ghost" id="ac-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="ac-save">Save Category</button>
      </div>

  `, (root) => {
    const form = root.querySelector('#ac-form');

    root.querySelector('#ac-cancel').onclick = () => closeModal(root);

    form.onsubmit = async (e) => {
      e.preventDefault();
      const input = form.querySelector('input[name="name"]');
      const name  = input.value.trim();

      if(!name){
        toast('Enter a category name', 'error');
        input.focus();
        return;

      closeModal(root);

      }

/* ══════════════════════════════════════════════════════════════
   17e — CATEGORY PICKER (search-select, filtered, with + Add new)
   Use:

     mountCategoryPicker($('#prod-cat', container), currentValue, onPick);
   ══════════════════════════════════════════════════════════════ */

function categoryPickerHTML(id, currentValue){

        type="text"

      >

      <div class="ss-dropdown" role="listbox"></div>
      <input type="hidden" class="ss-value" value="${esc(currentValue || '')}">
    </div>
  `;

/* Mounts behavior on the category picker.
   onPick(newValueOrNull) is called on every change (pick, clear). */
function mountCategoryPicker(rootEl, currentValue, onPick){
  if(!rootEl) return null;

  const input    = rootEl.querySelector('.ss-input');
  const dropdown = rootEl.querySelector('.ss-dropdown');
  const clearBtn = rootEl.querySelector('.ss-clear');
  const hidden   = rootEl.querySelector('.ss-value');

  let activeIdx = -1;
  let filtered  = [];

  /* Build option list from defaults + customs */
  function buildItems(){
    return allCategories().map(cat => ({
      id:         cat,
      label:      cat,
      searchText: cat.toLowerCase()
    }));
  }

  function render(query){
    const q = String(query || '').toLowerCase().trim();
    const items = buildItems();
    filtered = items.filter(it => !q || it.searchText.includes(q));

    let html = '';
    if(!filtered.length){
      html = '<div class="ss-empty">No matching category</div>';
    } else {
      html = filtered.map((it, i) => {
        const isCustom = (SETTINGS.custom_categories || []).some(
          c => String(c).toLowerCase() === it.label.toLowerCase()
        );
        return `
          <div class="ss-item ${i === activeIdx ? 'active' : ''}" data-idx="${i}" role="option">
            <div style="flex:1;min-width:0">
              <div class="sname">${esc(it.label)}</div>
              ${isCustom ? '<div class="ssub">Custom</div>' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    /* Always allow adding a new one */
    html += `<div class="ss-add">+ Add new category</div>`;

    dropdown.innerHTML = html;
    dropdown.classList.add('open');

    dropdown.querySelectorAll('.ss-item').forEach(el => {
      el.onclick = () => pick(parseInt(el.dataset.idx, 10));
    });

    const addEl = dropdown.querySelector('.ss-add');
    if(addEl){
      addEl.onclick = () => {
        dropdown.classList.remove('open');
        openAddCategoryModal((newName) => {
          /* Select the newly-added category */
          applyPick(newName);
        });
      };
    }

    const activeEl = dropdown.querySelector('.ss-item.active');
    if(activeEl && typeof activeEl.scrollIntoView === 'function'){
      activeEl.scrollIntoView({ block: 'nearest' });
    }
  }

  function pick(i){
    const it = filtered[i];
    if(!it) return;
    applyPick(it.label);
  }

  function applyPick(value){
    hidden.value = value || '';
    input.value  = value || '';
    input.classList.add('has-value');
    clearBtn.style.display = value ? 'inline-flex' : 'none';
    dropdown.classList.remove('open');
    if(typeof onPick === 'function') onPick(value || null);
  }

  function clear(){
    hidden.value = '';
    input.value  = '';
    input.classList.remove('has-value');
    clearBtn.style.display = 'none';
    activeIdx = -1;
    if(typeof onPick === 'function') onPick(null);
  }

  /* Event wiring */
  input.addEventListener('focus', () => render(input.value));
  input.addEventListener('input', () => {
    activeIdx = -1;
    hidden.value = input.value.trim();
    clearBtn.style.display = input.value ? 'inline-flex' : 'none';
    render(input.value);
    if(typeof onPick === 'function') onPick(input.value.trim() || null);
  });

  input.addEventListener('keydown', (e) => {
    if(!dropdown.classList.contains('open')){
      if(e.key === 'ArrowDown'){ render(input.value); }
      return;
    }
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, filtered.length - 1);
      render(input.value);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      render(input.value);
    } else if(e.key === 'Enter'){
      e.preventDefault();
      if(activeIdx >= 0) pick(activeIdx);
      else {
        /* Free-text: use what the user typed */
        applyPick(input.value.trim());
      }
    } else if(e.key === 'Escape'){
      dropdown.classList.remove('open');
    }
  });

  clearBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    clear();
    input.focus();
  });

  const outsideHandler = (e) => {
    if(!rootEl.contains(e.target)) dropdown.classList.remove('open');
  };
  document.addEventListener('click', outsideHandler);

  /* Public API */
  rootEl.getValue = () => hidden.value;
  rootEl.setValue = (v) => applyPick(v);
  rootEl.reset    = clear;
  rootEl.destroy  = () => {
    document.removeEventListener('click', outsideHandler);
    rootEl.innerHTML = '';
  };

  return rootEl;
}

/* ══════════════════════════════════════════════════════════════
   BLOCK 18 — LOW-END MODE DETECTOR & TOGGLE
   Provides:
     - initReduceEffects()           → called on boot to apply
                                        saved setting + maybe suggest
     - toggleReduceEffects()         → flip it + persist
     - mountReduceEffectsToggle(el)  → wire up a switch in My Shop
     - renderReduceEffectsCard()     → returns the My Shop card HTML
     - injectTopbarReduceEffectsBtn()→ adds ⚡ quick-toggle to topbar
   ══════════════════════════════════════════════════════════════ */

/* ─── Local storage key for "we already suggested" flag ─── */
const LS_SUGGESTED_KEY = 'sd_reduce_suggested_v1';
const LS_MANUAL_KEY    = 'sd_reduce_manual_v1';

/* ══════════════════════════════════════════════════════════════
   18a — SAFE LOCAL STORAGE HELPERS
   Private mode / disabled storage → never throws.
   ══════════════════════════════════════════════════════════════ */

function lsGet(key){
  try { return localStorage.getItem(key); } catch(e){ return null; }
}
function lsSet(key, val){
  try { localStorage.setItem(key, String(val)); } catch(e){ /* noop */ }
}
function lsRemove(key){
  try { localStorage.removeItem(key); } catch(e){ /* noop */ }
}

/* ══════════════════════════════════════════════════════════════
   18b — BOOT : APPLY SAVED PREFERENCE + POSSIBLE SUGGEST
   Called once during boot (Block 50) after SETTINGS has loaded.
   ══════════════════════════════════════════════════════════════ */

function initReduceEffects(){
  /* 1) Apply the saved server-side preference immediately */
  applyReduceEffects(!!SETTINGS.reduced_effects);

  /* 2) If the owner hasn't made a manual choice yet, and we've
        never suggested, and the device looks weak → suggest once. */
  const alreadySuggested = lsGet(LS_SUGGESTED_KEY) === '1';
  const manualChoice     = lsGet(LS_MANUAL_KEY)    === '1';

  if(alreadySuggested || manualChoice) return;

  /* Also respect OS-level reduced-motion as a strong hint */
  const osReduced = (() => {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch(e){ return false; }
  })();

  const deviceWeak = shouldSuggestReduceEffects();

  if(!deviceWeak && !osReduced) return;

  /* Mark suggested so it never happens again */
  lsSet(LS_SUGGESTED_KEY, '1');

  /* Show a toast — user can flip it manually in My Shop */
  setTimeout(() => {
    toast(
      'Tip: turn on Reduced Effects in My Shop for a snappier feel on this device.',
      'info'
    );
  }, 1400);
}

/* ══════════════════════════════════════════════════════════════
   18c — TOGGLE (flip + persist + live-apply)
   ══════════════════════════════════════════════════════════════ */

async function toggleReduceEffects(){
  const next = !SETTINGS.reduced_effects;
  SETTINGS.reduced_effects = next;

  /* Apply instantly so the UI responds without waiting on the network */
  applyReduceEffects(next);

  /* Mark this as a manual choice — never suggest again */
  lsSet(LS_MANUAL_KEY, '1');

  /* Persist to Supabase */
  const ok = await saveSettings();

  toast(
    ok
      ? (next ? 'Reduced Effects ON — faster on slow devices' : 'Reduced Effects OFF — full visuals')
      : 'Saved locally — will sync when online',
    ok ? 'success' : 'info'
  );

  /* Sync the topbar button + My Shop toggle (if present) */
  syncReduceEffectsUI();

  return next;
}

/* ══════════════════════════════════════════════════════════════
   18d — SYNC UI STATE
   Called after toggle to update every visible toggle element.
   ══════════════════════════════════════════════════════════════ */

function syncReduceEffectsUI(){
  const on = !!SETTINGS.reduced_effects;

  /* Topbar quick-toggle button */
  const tb = document.getElementById('btn-reduce-topbar');
  if(tb){
    tb.title = on ? 'Reduced Effects ON — click to turn off' : 'Reduced Effects OFF — click to turn on';
    tb.setAttribute('aria-pressed', on ? 'true' : 'false');
    tb.classList.toggle('active', on);
  }

  /* My Shop switch */
  const sw = document.getElementById('reduce-toggle');
  if(sw) sw.checked = on;

  /* My Shop status text */
  const st = document.getElementById('reduce-status');
  if(st) st.textContent = on ? 'Reduced Effects: ON' : 'Reduced Effects: OFF';

  /* My Shop card border accent */
  const card = document.getElementById('reduce-card');
  if(card) card.style.borderColor = on ? 'var(--primary)' : 'var(--border)';
}

/* ══════════════════════════════════════════════════════════════
   18f — MOUNT MY SHOP TOGGLE
   Wires up the switch + the "Detect my device" button.
   Call this after injecting the card into the DOM.
   ══════════════════════════════════════════════════════════════ */

function mountReduceEffectsToggle(rootEl){
  if(!rootEl) return;

  const sw = rootEl.querySelector('#reduce-toggle');
  if(sw){
    sw.onchange = () => { toggleReduceEffects(); };
  }

  const autoBtn = rootEl.querySelector('#reduce-auto');
  if(autoBtn){
    autoBtn.onclick = () => {
      const weak = shouldSuggestReduceEffects();

      /* Show what we detected */
      const cores  = (navigator.hardwareConcurrency || '?');
      const memory = (navigator.deviceMemory || '?');
      const mobile = window.matchMedia('(max-width: 900px)').matches;

      const summary =
        `CPU cores: ${cores}\n` +
        `RAM (approx): ${memory} GB\n` +
        `Mobile viewport: ${mobile ? 'yes' : 'no'}\n\n` +
        (weak
          ? 'Recommendation: turn ON Reduced Effects for a snappier experience.'
          : 'Your device looks capable. Full effects should run smoothly.');

      const applyNow = confirm(summary + '\n\nApply recommendation?');

      if(applyNow && weak && !SETTINGS.reduced_effects){
        toggleReduceEffects();
      } else if(applyNow && !weak && SETTINGS.reduced_effects){
        toggleReduceEffects();
      } else if(!applyNow){
        toast('No changes made', 'info');
      } else {
        toast('Already optimal', 'info');
      }
    };
  }

  syncReduceEffectsUI();
}

/* ══════════════════════════════════════════════════════════════
   18g — TOPBAR QUICK-TOGGLE (⚡)
   Injects a small icon button into the topbar. Persistent across
   page changes because it's re-inserted by the layout renderer.
   ══════════════════════════════════════════════════════════════ */

function injectTopbarReduceEffectsBtn(){
  const topbar = document.querySelector('.topbar');
  if(!topbar) return;

  /* Remove any prior instance to avoid duplication */
  const existing = topbar.querySelector('#btn-reduce-topbar');
  if(existing) existing.remove();

  const btn = document.createElement('button');
  btn.id = 'btn-reduce-topbar';
  btn.className = 'topbar-bell';
  btn.innerHTML = '⚡';
  btn.title = SETTINGS.reduced_effects
    ? 'Reduced Effects ON — click to turn off'
    : 'Reduced Effects OFF — click to turn on';
  btn.setAttribute('aria-pressed', SETTINGS.reduced_effects ? 'true' : 'false');
  if(SETTINGS.reduced_effects) btn.classList.add('active');

  btn.onclick = () => toggleReduceEffects();

  /* Insert just before the notification bell if present,
     otherwise append at the end. */
  const bell = topbar.querySelector('.topbar-bell');
  if(bell && bell !== btn){
    bell.parentNode.insertBefore(btn, bell);
  } else {
    topbar.appendChild(btn);
  }
}

/* ══════════════════════════════════════════════════════════════
   19b — LOGIN JS
   Renders the login screen into #app and wires the form.
   ══════════════════════════════════════════════════════════════ */

function renderLogin(){
  const app = $('#app');
  if(!app) return;

  /* Brand mark : uploaded logo if any, else pencil chip */
  const logoInner = SETTINGS.logo
    ? `<img src="${esc(SETTINGS.logo)}" alt="logo">`
    : '✏️';

  app.innerHTML = `
    <div class="login-page">
      <form id="login-form" class="login-box" autocomplete="on" novalidate>
        <div class="login-logo">${logoInner}</div>

        <h1>${esc(SETTINGS.shop_name || 'Stationery Hub')}</h1>
        <p class="login-sub">Distributor Manager — Owner Login</p>

        <div class="login-fields">
          <div class="field">
            <label class="label" for="l-email">Email</label>
            <input
              class="input"
              type="email"
              id="l-email"
              name="email"
              autocomplete="username"
              inputmode="email"
              autocapitalize="off"
              spellcheck="false"
              required
              placeholder="owner@example.com"
            >
          </div>

          <div class="field">
            <label class="label" for="l-pwd">Password</label>
            <input
              class="input"
              type="password"
              id="l-pwd"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
            >
          </div>

          <div id="l-err" class="login-error" role="alert"></div>
        </div>

        <button class="btn btn-primary" type="submit" id="l-btn">Sign In</button>

        <p class="login-footer">Only the shop owner can sign in</p>
      </form>
    </div>
  `;

  const form  = $('#login-form');
  const email = $('#l-email');
  const pwd   = $('#l-pwd');
  const errEl = $('#l-err');
  const btn   = $('#l-btn');

  /* Focus email on load */
  setTimeout(() => { try { email.focus(); } catch(e){} }, 100);

  function showError(msg){
    errEl.textContent = msg || 'Sign-in failed';
    errEl.classList.add('show');
  }

  function clearError(){
    errEl.textContent = '';
    errEl.classList.remove('show');
  }

  /* Clear error as soon as the user types again */
  email.addEventListener('input', clearError);
  pwd.addEventListener('input', clearError);

  form.onsubmit = async (e) => {
    e.preventDefault();
    clearError();

    const emailVal = (email.value || '').trim();
    const pwdVal   = (pwd.value || '');

    if(!emailVal){
      showError('Please enter your email');
      email.focus();
      return;
    }
    if(!pwdVal){
      showError('Please enter your password');
      pwd.focus();
      return;
    }

    /* Disable button + show progress */
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      await login(emailVal, pwdVal);

      /* First data fetch right after login */
      loadbarStart();
      await syncDB();
      loadbarEnd();

      /* Apply the reduce-effects preference that just came down */
      try { initReduceEffects(); } catch(e){ /* optional */ }

      /* Boot the app */
      await route();
    } catch(err){
      loadbarEnd();
      const msg = (err && err.message) ? err.message : 'Sign-in failed';
      /* Humanise common Supabase auth errors */
      if(/invalid login credentials/i.test(msg)){
        showError('Wrong email or password.');
      } else if(/email not confirmed/i.test(msg)){
        showError('Email not confirmed. Contact the owner.');
      } else if(/network/i.test(msg)){
        showError('Network error. Check your connection and try again.');
      } else {
        showError(msg);
      }
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  };
}

/* ══════════════════════════════════════════════════════════════
   20b — ACTIVE LINK DETECTION
   Returns true if the given nav href matches the current hash.
   Handles sub-routes like #/customer/:id → highlights #/customers
   ══════════════════════════════════════════════════════════════ */

function isNavActive(href, hash){
  hash = hash || (location.hash || '#/');

  /* Exact match */
  if(hash === href) return true;

  /* Root route: don't light up for every hash */
  if(href === '#/') return false;

  /* Sub-route detection: customer profile under customers list, etc. */
  const subRouteMap = {
    '#/customers':  ['#/customer/'],
    '#/retailers':  ['#/retailer/'],
    '#/products':   ['#/product/'],
    '#/companies':  ['#/company/'],
    '#/vendors':    ['#/vendor/'],
    '#/invoices':   ['#/invoice/', '#/new-invoice/'],
    '#/purchases':  ['#/purchase/']
  };

  const subs = subRouteMap[href];
  if(subs && subs.some(prefix => hash.startsWith(prefix))) return true;

  /* Prefix match — e.g. #/analytics highlights for #/analytics?range=... */
  return hash.startsWith(href + '/') || hash.startsWith(href + '?');
}

/* ══════════════════════════════════════════════════════════════
   20c — PAGE TITLE
   Shown in the topbar. Derived from NAV_LINKS + dynamic routes.
   ══════════════════════════════════════════════════════════════ */

function currentPageTitle(){
  const hash = hashPath(location.hash || '#/');

  /* Static nav entries */
  for(const g of NAV_LINKS){
    for(const it of g.items){
      if(it.href === hash) return it.label;
    }
  }

  /* Dynamic routes */
  if(hash.startsWith('#/customer/'))       return 'Customer Profile';
  if(hash.startsWith('#/retailer/'))       return 'Retailer Profile';
  if(hash.startsWith('#/company/'))        return 'Company Profile';
  if(hash.startsWith('#/vendor/'))         return 'Vendor Profile';
  if(hash.startsWith('#/invoice/'))        return 'Invoice';
  if(hash.startsWith('#/new-invoice/'))    return 'New Invoice';
  if(hash.startsWith('#/purchase/'))       return 'Purchase Bill';

  return 'Dashboard';
}

/* ══════════════════════════════════════════════════════════════
   20h — EVENT WIRING
   Sidebar drawer, logout, calculator, topbar search focus.
   ══════════════════════════════════════════════════════════════ */

function wireLayoutEvents(){
  const sidebar  = $('#sidebar');
  const backdrop = $('#sidebar-backdrop');

  /* Hamburger → open drawer */
  const ham = $('#btn-hamburger');
  if(ham){
    ham.onclick = () => {
      sidebar.classList.add('open');
      backdrop.classList.add('show');
    };
  }

  /* Backdrop click → close drawer */
  if(backdrop){
    backdrop.onclick = () => {
      sidebar.classList.remove('open');
      backdrop.classList.remove('show');
    };
  }

  /* Any nav link click → close drawer (mobile) */
  if(sidebar){
    sidebar.querySelectorAll('.nav a').forEach(a => {
      a.addEventListener('click', () => {
        sidebar.classList.remove('open');
        backdrop.classList.remove('show');
      });
    });
  }

  /* Sign out */
  const logoutBtn = $('#btn-logout');
  if(logoutBtn){
    logoutBtn.onclick = async () => {
      if(!confirmDlg('Sign out of the app?', 'Confirm Sign Out')) return;
      await logout();
    };
  }

  /* Calculator (sidebar + mobile header) */
  const calcBtn    = $('#btn-calc');
  const calcBtnMob = $('#btn-calc-m');
  if(calcBtn)    calcBtn.onclick    = () => { if(typeof toggleCalc === 'function') toggleCalc(); };
  if(calcBtnMob) calcBtnMob.onclick = () => { if(typeof toggleCalc === 'function') toggleCalc(); };

  /* Global search box → opens command palette */
  const search = $('#global-search');
  if(search){
    search.addEventListener('focus', () => {
      search.blur();
      if(typeof openCommandPalette === 'function') openCommandPalette();
    });
    search.addEventListener('click', () => {
      if(typeof openCommandPalette === 'function') openCommandPalette();
    });
  }

  /* Date chip → dashboard analytics shortcut */
  const dateChip = $('#topbar-date');
  if(dateChip){
    dateChip.onclick = () => { location.hash = '#/reports'; };
  }

  /* Notification bell → placeholder until notifications block */
  const bell = $('#topbar-bell');
  if(bell){
    bell.onclick = () => {
      toast('No new notifications', 'info');
    };
  }

  /* Avatar → My Shop */
  const avatar = $('#topbar-avatar');
  if(avatar){
    avatar.onclick = () => { location.hash = '#/myshop'; };
  }

  /* Close drawer on Escape */
  document.addEventListener('keydown', function onEsc(e){
    if(e.key === 'Escape' && sidebar && sidebar.classList.contains('open')){
      sidebar.classList.remove('open');
      backdrop.classList.remove('show');
    }
  });
}

/* ══════════════════════════════════════════════════════════════

   Called by the router after hashchange to highlight the new link
   without rebuilding the whole layout.
   ══════════════════════════════════════════════════════════════ */

function refreshNavActive(){
  const hash = location.hash || '#/';

  /* Sidebar links */
  document.querySelectorAll('.sidebar .nav a').forEach(a => {
    const href = a.getAttribute('href');
    a.classList.toggle('active', isNavActive(href, hash));
  });

  /* Mobile bottom nav */
  document.querySelectorAll('#mobile-nav a').forEach(a => {
    const href = a.getAttribute('href');
    a.classList.toggle('active', isNavActive(href, hash));
  });

  /* Topbar title */
  const t = document.getElementById('topbar-title');
  if(t) t.textContent = currentPageTitle();
}
